title: HTML Smuggling Execution (T1027.006)
id: 150e8989-49e9-4568-8baf-277b71f886cb
status: stable
description: >
  Detects execution of suspicious files typically delivered via HTML Smuggling.
  Focuses on browser processes spawning script interpreters or mounting disk images
  from temporary or local app data directories. Optimized to reduce false positives
  from legitimate installers and updates.

author: hota05
date: 2026-02-23
tags:
  - attack.initial_access
  - attack.defense_evasion
  - attack.t1027.006

logsource:
  product: windows
  category: process_creation

detection:
  selection_browser_source:
    ParentImage|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\brave.exe'
      - '\firefox.exe'
      - '\iexplore.exe'

  selection_interpreters:
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\powershell.exe'
      - '\cmd.exe'
      - '\scrcons.exe'

  selection_payload_types:
    CommandLine|contains:
      - '.vbs'
      - '.jse'
      - '.hta'
      - '.wsf'
      - '.iso'
      - '.vhd'
      - '.vba'
      - '.lnk'

  selection_paths:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\Downloads\'
      - '\Users\Public\'
      - '\INetCache\'

  filter_trusted_updates:
    CommandLine|contains:
      - 'update'
      - 'setup.exe'
      - 'installer.exe'
    Image|startswith:
      - 'C:\Program Files\'
      - 'C:\Windows\System32\'

  condition: >
    selection_browser_source
    and selection_interpreters
    and selection_payload_types
    and selection_paths
    and not filter_trusted_updates

falsepositives:
  - Legitimate installer or updater execution from browser downloads
  - Automated software deployment scripts
  - Security research or malware testing labs

level: critical
