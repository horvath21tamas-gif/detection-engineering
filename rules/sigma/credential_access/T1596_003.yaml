title: High-Fidelity Passive DNS Reconnaissance - T1597.003
id: a85bc488-ed95-429a-bf08-10c3c3ee7cbe
status: stable
description: >
  Detects automated reconnaissance using Passive DNS (pDNS) databases. 
  Focuses on non-standard process chains and CLI-based API interactions 
  targeting technical OSINT repositories while filtering out routine 
  network troubleshooting and browser-based research.
author: hota05
date: 2026/01/27
references:
  - https://attack.mitre.org/techniques/T1596/003/
tags:
  - attack.reconnaissance
  - attack.t1596.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_recon_binaries:
    - Image|endswith:
        - '\amass.exe'
        - '\subfinder.exe'
        - '\findomain.exe'
        - '\assetfinder.exe'
        - '\massdns.exe'
    - CommandLine|contains:
        - ' -d '      
        - ' -passive' 
        - ' -config'

  selection_api_patterns:
    - Image|endswith:
        - '\curl.exe'
        - '\wget.exe'
        - '\python.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
    - CommandLine|contains:
        - 'api.securitytrails.com'
        - 'api.passivetotal.org'
        - 'api.riskiq.net'
        - 'api.binaryedge.io'
        - 'otx.alienvault.com/api'
        - 'pdns'
        - 'history' 

  filter_browsers:
    - Image|endswith:
        - '\chrome.exe'
        - '\msedge.exe'
        - '\firefox.exe'
    - ParentImage|endswith:
        - '\explorer.exe'

  filter_legit_net_tools:
    - CommandLine:
        - 'nslookup '
        - 'ping '
        - 'tracert '
    - Image|contains:
        - '\Cisco\AnyConnect\'
        - '\GlobalProtect\'
        - '\Fortinet\'

  filter_admin_context:
    User|contains:
      - 'svc_soc'
      - 'adm_net'
    Image|contains:
      - '\Nmap\'

  condition: (selection_recon_binaries or selection_api_patterns) and not filter_browsers and not filter_legit_net_tools and not filter_admin_context
falsepositives:
  - Security analysts performing authorized incident investigations.
  - IT automation scripts verifying public DNS records for service health.
  - Authorized red-team exercises.
level: high
