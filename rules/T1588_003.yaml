title: Anomalous Code Signing Certificate Export or Acquisition
id: 3765416f-467c-496b-8825-541c77a1dc3d
status: stable
description: |
    Detects suspicious certificate operations (exporting private keys or forced store additions) 
    initiated from unusual parent processes or using plaintext passwords in the command line.
author: hota05
date: 2026-01-28
references:
    - https://attack.mitre.org/techniques/T1588/003/
tags:
    - attack.resource_development
    - attack.t1588.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil_export:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-exportPFX'        
            - '-p '              
            - '-p='              

    selection_certutil_acquisition:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-urlcache'        
            - '-addstore'       

    selection_powershell:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Export-PfxCertificate'
            - 'Import-PfxCertificate'
            - 'Set-AuthenticodeSignature' 

    filter_standard_parents:
        ParentImage|endswith:
            - '\mmc.exe'               
            - '\ServerManager.exe'
            - '\svchost.exe'            

    filter_dev_build:
        Image|contains: 
            - '\Jenkins\'
            - '\AzureDevOps\'
            - '\MSBuild\'
        User|contains: 'SVC_Build'

    condition: (selection_certutil_export or selection_certutil_acquisition or selection_powershell) and not (filter_standard_parents or filter_dev_build)
falsepositives:
    - Automated CI/CD pipelines signing binaries (should be added to filters).
    - Backup scripts for PKI infrastructure.
level: high
