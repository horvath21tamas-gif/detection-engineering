title: Encrypted C2 Channel (T1573)
id: c6e4c1f3-88f8-4da2-8a32-1d9a2fb4596a
status: stable
description: |
  Detects creation of custom encrypted C2 channels by correlating low-level
  symmetric cryptography (AES/Rijndael, CryptoStream, ICryptoTransform)
  with manual network socket usage from scripting interpreters.
  Filters out legitimate automation, cloud services, and system processes
  to reduce false positives.
author: hota05 
date: 2026-02-11
tags:
  - attack.command_and_control
  - attack.t1573
  - attack.t1573.001
  - attack.t1573.002
logsource:
  category: process_creation
  product: windows

detection:
  selection_crypto_logic:
    CommandLine|contains:
      - 'AesManaged'
      - 'RijndaelManaged'
      - 'CryptoStream'
      - 'CreateEncryptor'
      - 'ICryptoTransform'
      - 'CreateDecryptor'

  selection_network_socket:
    CommandLine|contains:
      - 'Net.Sockets.TcpClient'
      - 'Net.Sockets.Socket'
      - 'IO.MemoryStream'
      - 'NetworkStream'

  selection_procs:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'

  filter_legit_infra:
    - CommandLine|contains:
        - 'C:\Program Files\'
        - 'Microsoft\Azure'
        - 'HealthCheck'
        - 'SoftwareDistribution'
    - username: 'NT AUTHORITY\SYSTEM'
    - ParentImage|endswith:
        - '\services.exe'
        - '\explorer.exe'

  condition: selection_crypto_logic and selection_network_socket and selection_procs and not filter_legit_infra

fields:
  - Time
  - SourceImage
  - SourceUsername
  - ParentImage
  - CommandLine
  - ProcessId
  - ThreadId

falsepositives:
  - Cloud automation scripts creating encrypted streams
  - DevOps health checks or monitoring scripts
  - Legitimate system updates that use encryption and network sockets

level: critical
