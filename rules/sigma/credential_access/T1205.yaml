title: Ultra-Pro Traffic Signaling & Port Knocking (T1205)
id: b62c91ed-1865-4084-bca3-67a15b778596
status: stable
description: |
    Detects attempts to implement or trigger Port Knocking/Traffic Signaling. 
    Focuses on the registration of raw packet capturing drivers (Npcap/WinPcap) 
    and suspicious firewall rule modifications initiated from untrusted shells.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1205
logsource:
    product: windows
    category: process_creation
detection:
    selection_netsh:
        - Image|endswith: '\netsh.exe'
        - OriginalFileName: 'netsh.exe'
    
    selection_firewall_args:
        CommandLine|contains:
            - 'advfirewall firewall add rule'
            - 'action=allow'
            - 'protocol=UDP'  
            - 'protocol=ICMP' 
            - 'localport=any' 

    selection_sniffers:
        - Image|endswith:
            - '\tcpdump.exe'
            - '\windump.exe'
            - '\scapy.exe' 
            - '\nmap.exe'
        - CommandLine|contains:
            - ' -i '      
            - 'sniffer'   

    selection_unauthorized_actor:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'

    filter_trusted_apps:
        - Image|contains: 'C:\Windows\System32\svchost.exe'
        - User: 'NT AUTHORITY\SYSTEM'
        - CommandLine|contains: 'description=' 

    condition: (selection_netsh and selection_firewall_args or selection_sniffers) and selection_unauthorized_actor and not filter_trusted_apps
level: high
