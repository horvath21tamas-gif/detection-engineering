title: Ultra-Pro High-Fidelity Unused Service Manipulation (T1535)
id: 40460a2c-6975-4b34-b550-b1c6b9c32bf8
status: stable
description: |
    Detects the modification of existing Windows service paths (ImagePath) to untrusted 
    locations or binaries. Filters out legitimate OS servicing and common third-party 
    updaters to ensure high-fidelity alerts.
author: hota05
date: 2026-02-03
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1535
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains: 'System\CurrentControlSet\Services\'
        TargetObject|endswith: '\ImagePath'

    selection_paths:
        Details|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
            - '\Downloads\'
            - 'C:\PerfLogs\'

    selection_shells:
        Details|contains:
            - 'cmd.exe'
            - 'powershell.exe'
            - 'pwsh.exe'
            - 'cscript.exe'
            - 'wscript.exe'
            - 'mshta.exe'
            - 'rundll32.exe'

    filter_trusted_systems:
        Image|startswith:
            - 'C:\Windows\servicing\'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\sysnative\svchost.exe'
        User: 'NT AUTHORITY\SYSTEM'

    filter_common_updaters:
        Image|contains:
            - '\Google\Update\'
            - '\Microsoft\EdgeUpdate\'
            - '\Adobe\ARM\'
        Details|contains:
            - '\Program Files\'
            - '\Program Files (x86)\'

    condition: selection_registry and (selection_paths or selection_shells) and not (filter_trusted_systems or filter_common_updaters)
level: critical
