name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CSAK a stabil alapokat tesszük fel pip-el
          python -m pip install sigma-cli pysigma-backend-splunk pytest pyyaml
          
          # A QRadar-t és a többi kiegészítőt a Sigma saját környezetébe telepítjük
          # Ez izolálja a függőségeket a fő Python környezettől
          sigma plugin install splunk
          sigma plugin install qradar
          sigma plugin install sysmon
          sigma plugin install windows

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek vagy hiba történt."

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar
          rm -f rules/splunk/*.spl
          rm -f rules/qradar/*.aql
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk konverzió
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba: $file"
            
            # QRadar konverzió (AQL formátum)
            # Ha a pipeline hiba lenne, megpróbáljuk anélkül
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || \
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          git add README.md COVERAGE.md attack_navigator_layer.json mitre_matrix.svg \
                  rules/splunk/*.spl \
                  rules/qradar/*.aql \
                  rules/sigma/*.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard, Splunk & QRadar rules, and Sigma auto-fixes"
            git pull --rebase origin test
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált."
            exit 1
          fi
