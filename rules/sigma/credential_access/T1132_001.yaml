title: Standard Encoding & Payload Injection (T1132.001)
id: 1fdf31a3-292d-4216-8450-10cf841d73e0
status: stable
description: |
    Detects suspicious standard encoding usage by monitoring:
      - Embedded executable headers (MZ/PE) within Base64 strings
      - Programmatic decoding via FromBase64String, DeflateStream, MemoryStream, or .NET conversions
      - High-entropy command lines indicating payload injection
      - Non-administrative processes executing encoded payloads
    Filters trusted infrastructure to reduce false positives.

author: hota05
date: 2026-02-09
tags:
    - attack.command_and_control
    - attack.t1132.001

logsource:
    category: process_creation
    product: windows

detection:
    selection_encoded_headers:
        processcommandline: '(TVqQA|TVpQA|f0VMR|UEsDB)'

    selection_decoding_logic:
        processcommandline: '(FromBase64String\(|-decode\s|\\[System\.Convert\]::|IO\.MemoryStream|DeflateStream)'

    selection_high_entropy:
        processcommandline: '(?i).*[a-z0-9+/=]{1500,}.*'

    selection_context:
        processname: '(winword\.exe|excel\.exe|w3wp\.exe|sqlservr\.exe|spoolsv\.exe)$'
        Parentprocessname: '(outlook\.exe|chrome\.exe)$'

    filter_legit_infra:
        processname: '(\\Program Files\\|\\ccm\\|\\AzureConnectedMachineAgent\\)'
        processcommandline: '(Chocolatey|NuGet|Microsoft\.Cloud\.Data)'
        UserName: 'NT AUTHORITY\\SYSTEM'

    condition: (selection_encoded_headers or (selection_decoding_logic and selection_high_entropy)) and (selection_context or not filter_legit_infra)

level: critical
