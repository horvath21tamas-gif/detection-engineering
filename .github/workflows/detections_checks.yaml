name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # A Microsoft Sentinel backend pontos neve: pysigma-backend-microsoft-sentinel
          python -m pip install sigma-cli pysigma-backend-splunk pysigma-backend-microsoft-sentinel pytest "pyyaml>=6.0"
          
          # Pluginok telepítése
          sigma plugin install splunk sysmon windows netwitness
          
          # QRadar kényszerített telepítése (bypass hiba esetén)
          sigma plugin install --force-install qradar || echo "QRadar forced"
          
          # Verziók fixálása a stabilitásért
          python -m pip install --upgrade "pysigma>=1.1.0" "pyparsing>=3.0.0" sigma-cli

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek vagy hiba történt."

      - name: Convert Sigma rules to SIEM queries
        run: |
          # Mappák létrehozása és ürítése
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/sentinel
          rm -f rules/splunk/*.spl
          rm -f rules/qradar/*.aql
          rm -f rules/netwitness/*.txt
          rm -f rules/sentinel/*.kql
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk konverzió
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba: $file"
            
            # QRadar konverzió (Windows profillal vagy anélkül)
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || \
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba: $file"
            
            # RSA NetWitness konverzió (ha szükséges, ide is tehető egyedi parancs)
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ NetWitness hiba: $file"

            # Microsoft Sentinel (KQL) konverzió
            # A microsoft-sentinel backend a 'microsoft_sentinel' azonosítót használja
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "⚠️ Sentinel hiba: $file"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. Minden változás hozzáadása
          git add .
          
          # 2. Csak akkor commitolunk, ha van változás
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: SIEM rules (Splunk, QRadar, Sentinel) & Dashboard"
            
            # 3. Pull --rebase a konfliktusok elkerülésére (piszkos állapot kezelése)
            # Mivel commitoltunk, a munkakönyvtár tiszta a pull-hoz
            git pull --rebase origin test
            
            # 4. Push
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

          # Ha a validáció korábban hibázott, most állítsuk le a pipeline-t pirossal
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált."
            exit 1
          fi
