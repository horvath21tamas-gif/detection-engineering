title: Ultra-Pro High-Fidelity macOS Gatekeeper and Quarantine Bypass (T1553.001)
id: 1a73693c-9af6-444b-b4e8-64de72719c11
status: stable
description: |
    Detects attempts to disable macOS Gatekeeper or programmatically remove the 
    quarantine attribute from files. Focuses on non-interactive shells and 
    suspicious paths to reduce false positives from developers.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1553.001
    - attack.t1553
logsource:
    product: macos
    category: process_creation
detection:
    selection_gatekeeper:
        Image|endswith: '/spctl'
        CommandLine|contains:
            - '--master-disable' 
            - 'label-disable'

    selection_xattr:
        Image|endswith: '/xattr'
        CommandLine|contains:
            - '-d com.apple.quarantine' 
            - '-rc com.apple.quarantine' 

    selection_context:
        ParentImage|endswith:
            - '/sh'
            - '/bash'
            - '/zsh'
            - '/python'
            - '/php'

    selection_paths:
        CommandLine|contains:
            - '/tmp/'
            - '/Users/Shared/'
            - '/private/var/tmp/'
            - '/Downloads/'

    filter_trusted_processes:
        ParentImage|startswith:
            - '/System/Library/'
            - '/usr/sbin/softwareupdate'
            - '/Applications/Xcode.app/' 

    condition: (selection_gatekeeper or (selection_xattr and selection_context and selection_paths)) and not filter_trusted_processes
level: critical
