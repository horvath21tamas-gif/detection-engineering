title: Ultra-Pro High-Fidelity Masquerading and Process Path Abuse (T1036)
id: 8d80649e-c2bf-443f-8769-dbb2ecddd833
status: stable
description: |
    Detects advanced masquerading techniques including system binary path anomalies, 
    double extensions, and critical system processes spawned by untrusted parents. 
    Optimized to filter out legitimate Windows Update and side-loading behaviors.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1036
logsource:
    product: windows
    category: process_creation
detection:
    selection_path_anomaly:
        Image|endswith:
            - '\svchost.exe'
            - '\lsass.exe'
            - '\services.exe'
            - '\wininit.exe'
            - '\smss.exe'
            - '\csrss.exe'
            - '\winlogon.exe'
            - '\taskhost.exe'
            - '\spoolsv.exe'
            - '\taskhostw.exe'
    filter_legit_paths:
        Image|contains:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Windows\WinSxS\'

    selection_double_extension:
        Image|contains:
            - '.pdf.exe'
            - '.docx.exe'
            - '.xlsx.exe'
            - '.txt.exe'
            - '.rtf.exe'
            - '.jpg.exe'
            - '.zip.exe'

    selection_impossible_parent:
        Image|endswith:
            - '\lsass.exe'
            - '\svchost.exe'
            - '\services.exe'
            - '\smss.exe'
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\w3wp.exe'
            - '\sqlservr.exe'
            - '\powershell.exe'

    selection_special_chars:
        Image|contains: 
            - '.exe ' 
            - ' .exe'  

    filter_trusted_maintenance:
        - User: 'NT AUTHORITY\SYSTEM'
          ParentImage|endswith: '\services.exe'
        - ParentImage|endswith: '\msiexec.exe'
        - Image|contains: '\Windows\SoftwareDistribution\'

    condition: (selection_path_anomaly and not filter_legit_paths) or selection_double_extension or selection_special_chars or (selection_impossible_parent and not filter_trusted_maintenance)
level: critical
