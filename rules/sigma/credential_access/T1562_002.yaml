title: Windows Event Log Service Impairment
id: 54ba6fb9-c66e-448c-83d4-4a15bbec2b87
status: stable
description: |
    Detects high-confidence attempts to disable, stop, or impair Windows Event Logging.

    Coverage includes:
      - wevtutil channel disabling or log clearing
      - EventLog service stop/disable attempts (sc, net, PowerShell)
      - Registry-based service or channel modification
      - Service dependency tampering (DependOnService)

    Aligned with MITRE ATT&CK T1562.002.

author: hota05
date: 2026-02-12
tags:
    - attack.defense_evasion
    - attack.t1562.002
    - attack.t1112
    - attack.t1543

logsource:
    product: windows
    category: process_creation

detection:
    selection_wevtutil_disable:
        Image|endswith: '\wevtutil.exe'
        CommandLine|contains|all:
            - ' sl '
            - '/e:false'

    selection_wevtutil_clear:
        Image|endswith: '\wevtutil.exe'
        CommandLine|contains:
            - ' cl '
            - ' clear-log '

    selection_sc_disable:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - ' config '
            - ' eventlog '
            - ' start='
            - ' disabled'

    selection_sc_stop:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - ' stop '
            - ' eventlog '

    selection_net_stop:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains|all:
            - ' stop '
            - ' eventlog '

    selection_ps_stop:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Stop-Service'
            - 'eventlog'

    selection_ps_disable:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Set-Service'
            - 'eventlog'
            - 'Disabled'

    selection_registry_service_disable:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - ' add '
            - 'HKLM\SYSTEM\CurrentControlSet\Services\EventLog'
            - ' Start'
        CommandLine|contains:
            - ' 4'
            - '0x4'

    selection_registry_channel_disable:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - ' add '
            - '\Services\EventLog\'
            - ' Enabled'
        CommandLine|contains:
            - ' 0'
            - '0x0'

    selection_dependency_tamper:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - 'DependOnService'
            - 'EventLog'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\w3wp.exe'
            - '\mshta.exe'
            - '\rundll32.exe'

    filter_system_context:
        User|startswith: 'NT AUTHORITY'
        ParentImage|endswith:
            - '\services.exe'
            - '\svchost.exe'
            - '\msiexec.exe'

    filter_management_tools:
        ParentImage|contains:
            - '\ConfigurationManager\'
            - '\IntuneManagementExtension\'
            - '\PDQDeploy\'
            - '\ManageEngine\'
            - '\BigFix\'

    filter_trustedinstaller:
        User|contains: 'TrustedInstaller'

    condition: (
                    selection_wevtutil_disable
                    or selection_wevtutil_clear
                    or selection_sc_disable
                    or selection_sc_stop
                    or selection_net_stop
                    or selection_ps_stop
                    or selection_ps_disable
                    or selection_registry_service_disable
                    or selection_registry_channel_disable
                    or selection_dependency_tamper
               )
               and selection_suspicious_parent
               and not filter_system_context
               and not filter_management_tools
               and not filter_trustedinstaller

level: critical
