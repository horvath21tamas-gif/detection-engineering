name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches: 
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Telepítés és verzió fixálás
          python -m pip install "sigma-cli>=2.0.1" "pysigma-backend-splunk" "pysigma-backend-qradar" \
            "pysigma-backend-insightidr" "pysigma-backend-microsoft-sentinel" \
            pytest "pyyaml>=6.0"
          
          # Pyparsing fix a végén
          python -m pip install "pyparsing==3.1.4" "pysigma<1.1.0" --force-reinstall

      - name: Verify and List Backends
        run: |
          echo "--- Telepített backendek listája ---"
          sigma list targets

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek."

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/sentinel
          rm -f rules/splunk/*.spl rules/qradar/*.aql rules/netwitness/*.txt rules/sentinel/*.kql
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            echo "Konvertálás: $filename"
            
            # Splunk (Célpont neve: splunk)
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba"
            
            # QRadar (Célpont neve: qradar)
            # Megjegyzés: Ha a QRadar hiba marad, az a Sigma szabály mezőinek inkompatibilitása miatt van
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba"
            
            # NetWitness / InsightIDR (Célpont neve pontosan: insight_idr)
            sigma convert -t insight_idr "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ NetWitness hiba"

            # Microsoft Sentinel (Célpont neve pontosan: microsoft_sentinel)
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "⚠️ Sentinel hiba"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: SIEM rules and dashboard"
            git pull --rebase origin test
            git push origin test
          fi

          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált."
            exit 1
          fi
