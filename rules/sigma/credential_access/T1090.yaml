title: Ultra-Pro High-Fidelity Proxy & Pivot Point Detection (T1090)
id: 72de5c33-577e-4c24-92fa-bee4c9244948
status: stable
description: |
    Detects the creation of network proxies and port forwarding rules by correlating 
    high-risk native binaries (Netsh) with pivot-specific arguments that map 
    external listening ports to internal network assets.
author: hota05
date: 2026-02-09
tags:
    - attack.command_and_control
    - attack.t1090
logsource:
    category: process_creation
    product: windows
detection:
    selection_netsh_pivot:
        CommandLine|contains|all:
            - 'interface'
            - 'portproxy'
            - 'add'
            - 'v4tov4'
        CommandLine|contains:
            - 'listenport='
            - 'connectaddress='

    selection_proxy_args:
        CommandLine|contains:
            - ' -socks5 '                      
            - ' -reverse '                   
            - ' -L:'                      
            - ' -R:'                           
            - ' --proxy-server='               

    selection_procs:
        Image|endswith:
            - '\netsh.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'

    filter_legit_infra:
        - CommandLine|contains:
            - 'C:\Program Files\Docker'       
            - 'C:\Program Files\WSL'           
            - '127.0.0.1'                      
            - '::1'                            
        - User: 'NT AUTHORITY\SYSTEM'         
        - ParentImage|endswith:
            - '\services.exe'

    condition: (selection_netsh_pivot or selection_proxy_args) and selection_procs and not filter_legit_infra
level: critical
