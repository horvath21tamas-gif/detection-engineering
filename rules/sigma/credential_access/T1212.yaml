title: Ultra-Pro High-Fidelity Credential Service Exploitation (T1212)
id: 7ddf4c76-5aad-47df-a5d1-409869953b5e
status: stable
description: |
    Detects potential exploitation of authentication services (LSASS, LogonUI, Spooler) 
    by identifying illegal child processes, unbacked memory execution, and known 
    exploitation patterns while filtering legitimate security tool interference.
author: hota05
date: 2026-02-04
tags:
    - attack.credential_access
    - attack.t1212
logsource:
    category: process_creation
    product: windows
detection:
    selection_illegal_spawn:
        ParentImage|endswith:
            - '\lsass.exe'       
            - '\logonui.exe'      
            - '\lsm.exe'         
            - '\spoolsv.exe'  
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\net.exe'
            - '\whoami.exe'
            - '\nltest.exe'

    selection_exploit_cmd:
        CommandLine|contains:
            - ' -inject '
            - ' -leak '
            - ' --pipe '
            - 'reflectiveloader' 

    selection_suspicious_source:
        ParentImage|contains:
            - '\Users\'
            - '\AppData\Local\Temp\'
            - '\Downloads\'

    filter_legit_wer:
        Image|endswith: '\WerFault.exe'
        ParentImage|endswith: '\lsass.exe'

    filter_security_agents:
        Image|contains:
            - '\CrowdStrike\'
            - '\SentinelOne\'
            - '\Windows Defender\'
        User: 'NT AUTHORITY\SYSTEM'

    condition: (selection_illegal_spawn or selection_exploit_cmd) and not (filter_legit_wer or filter_security_agents)
level: critical
