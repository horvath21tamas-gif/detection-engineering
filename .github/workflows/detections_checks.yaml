name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml sigma

  run_tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - name: Run unit tests
        run: |
          python -m pytest tests/ --maxfail=5 --disable-warnings -q

  lint_and_validate:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - name: Lint and validate Sigma rules
        run: |
          # Lint a Sigma szabályok
          python tools/lint_rules.py
          # Validálás a saját scripttel
          python tools/validate_metadata.py

  update_readme:
    runs-on: ubuntu-latest
    needs: lint_and_validate
    steps:
      - uses: actions/checkout@v3
      - name: Update README.md
        run: |
          python tools/update_readme.py
