title: Verclsid Proxy Execution via COM Object Abuse
id: 9c537c5e-b377-48dc-b8b5-2ff5e25eda94
status: stable
description: >
  Detects high-confidence abuse of verclsid.exe for proxy execution
  (MITRE ATT&CK T1218.012) via malicious COM object loading.

  The rule focuses on anomalous parent processes, suspicious CLSID
  invocation patterns, execution outside standard system paths,
  user-writable directory involvement, and uncommon integrity contexts.

  Designed to reduce noise from legitimate shell COM validation activity.

author: hota05
date: 2026/02/20
references:
  - https://attack.mitre.org/techniques/T1218/012/
  - https://lolbas-project.github.io/lolbas/Binaries/Verclsid/

logsource:
  product: windows
  category: process_creation

detection:

  selection_verclsid_image:
    Image|endswith: '\verclsid.exe'
    OriginalFileName: 'verclsid.exe'

  selection_relocated_binary:
    Image|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\chrome.exe'
      - '\msedge.exe'

  selection_suspicious_clsid_usage:
    CommandLine|contains:
      - ' /S '
      - ' /C '
      - '{'
      - '}'

  selection_user_writable_context:
    CommandLine|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\Public\'

  selection_low_integrity:
    IntegrityLevel:
      - 'Low'
      - 'Medium'

  filter_legitimate_shell_validation:
    Image|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
    ParentImage|endswith:
      - '\explorer.exe'
      - '\svchost.exe'
      - '\SearchIndexer.exe'
    IntegrityLevel: 'High'

  filter_system_context:
    User|startswith: 'NT AUTHORITY\'

  condition: >
    selection_verclsid_image
    and selection_low_integrity
    and (selection_relocated_binary
        or selection_suspicious_parent
        or (selection_suspicious_clsid_usage
            and selection_user_writable_context))
    and not (filter_legitimate_shell_validation
        or filter_system_context)

falsepositives:
  - Rare third-party COM validation tools
  - Custom enterprise shell extensions under development
  - Internal security testing activities

level: critical

tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1218.012
  - attack.lolbas
  - attack.windows
