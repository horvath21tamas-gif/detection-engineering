title: Ultra-Pro Power Settings Manipulation (T1137.001)
id: 28f1acdc-6fb8-45f6-9f0e-66fc0763a69d
status: stable
description: |
    Detects unauthorized power setting modifications aimed at preventing sleep or 
    hibernation. Focuses on command-line automation (powercfg) via suspicious 
    parent processes like PowerShell or CMD, while filtering legitimate UI-based changes.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1653
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\powercfg.exe'
        - OriginalFileName: 'PowerCfg.exe'

    selection_args:
        CommandLine|contains:
            - ' -hibernate off'     
            - ' -x '                
            - ' -setacvalueindex '  
            - ' -requestsoverride '
            - ' SCHEME_MIN '       

    selection_zero_timeout:
        CommandLine|contains:
            - ' 0' 
            - ' 000'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\psexec.exe'

    filter_legit_admin:
        - ParentImage|contains: 'C:\Windows\System32\SystemSettingsAdminFlows.exe'
        - CommandLine|contains: 'monitor-timeout-ac'

    condition: selection_img and (selection_args or selection_zero_timeout) and selection_suspicious_parent and not filter_legit_admin
level: medium
