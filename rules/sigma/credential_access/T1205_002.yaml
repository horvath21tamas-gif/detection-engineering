title: WFP Callout Registration or Kernel Driver Staging (T1205.002)
id: 9465896f-5613-4f21-b297-53ebc482618a
status: stable
description: |
    Detects suspicious Windows Filtering Platform (WFP) callout or filter 
    manipulation and kernel driver staging from untrusted process lineage.
    Attackers may register malicious WFP callouts or socket filters to enable
    stealthy port knocking, covert C2, or traffic interception.

    This rule correlates:
      - WFP / callout / filter modification via netsh or PowerShell
      - Kernel driver service creation from suspicious paths
      - Execution from interactive or scripting engines
      - Excludes known EDR/security tooling paths

author: hota05
date: 2026-02-02
modified: 2026-02-20
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1205.002
    - attack.t1562.001
    - attack.t1547.006
logsource:
    product: windows
    category: process_creation

detection:
    selection_wfp_modification:
        Image|endswith:
            - '\netsh.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'wfp'
            - 'callout'
            - 'add-filter'
            - 'add callout'
            - 'fwpm'
            - 'netsh wfp'
            - 'netsh advfirewall'

    selection_kernel_driver_creation:
        Image|endswith:
            - '\sc.exe'
            - '\reg.exe'
        CommandLine|contains|all:
            - 'create'
            - 'type='
            - 'kernel'
        CommandLine|contains:
            - '\Temp\'
            - '\AppData\'
            - '\Users\Public\'
            - '\ProgramData\'

    selection_scripting_parent:
        ParentImage|endswith:
            - '\services.exe'
            - '\svchost.exe'
            - '\TrustedInstaller.exe'
            - '\msiexec.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\python.exe'
            - '\wscript.exe'
            - '\cscript.exe'

    filter_legitimate_security:
        Image|contains:
            - '\Program Files\Windows Defender\'
            - '\Program Files\CrowdStrike\'
            - '\Program Files\SentinelOne\'
            - '\Program Files\Microsoft Security\'
        User|startswith: 'NT AUTHORITY\'

    condition: 
        (selection_wfp_modification
            or
            selection_kernel_driver_creation)
        and selection_scripting_parent
        and not filter_legitimate_security

falsepositives:
    - Security product updates
    - Legitimate firewall reconfiguration by administrators
    - Enterprise deployment scripts installing signed drivers

level: critical
