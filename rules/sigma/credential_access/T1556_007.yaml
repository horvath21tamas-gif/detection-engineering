title: Hybrid Identity Sync Manipulation Detection (T1556.007)
id: 314b62c8-4047-4834-a8c3-0ca50657e901
status: stable
description: >
    Detects potential unauthorized manipulation of Entra ID / Azure AD Connect 
    synchronization processes (MITRE ATT&CK T1556.007). Monitors MSOL account abuse 
    from non-sync servers, unauthorized ADSync PowerShell usage, and suspicious 
    database access for credential or password manipulation.
author: hota05
date: 2026-02-12
references:
    - https://attack.mitre.org/techniques/T1556/007/
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1556.007
logsource:
    product: windows
    category: process_creation

detection:
    selection_adsync_powershell:
        CommandLine|contains:
            - 'Get-ADSyncAccountPassword'
            - 'Set-ADSyncServerConfiguration'
            - 'Set-ADSyncAADPasswordReset'
            - 'adsync.msc'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_msol_abuse:
        User|startswith: 'MSOL_'
        ParentImage|endswith:
            - '\explorer.exe'
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\svchost.exe'

    selection_db_access:
        Image|endswith: '\sqlcmd.exe'
        CommandLine|contains: 'ADSync'
        Image|contains:
            - 'miiserver.exe'
            - 'Microsoft.Identity.AadConnect.Health.AadSync.Host.exe'

    filter_trusted_sync_server:
        ComputerName|contains:
            - 'SRV-ADSYNC-01'
            - 'SRV-ADSYNC-BCK'
        SubjectUserSid: 'S-1-5-18'

    condition:
        (
            selection_adsync_powershell
            or selection_msol_abuse
            or selection_db_access
        )
        and not filter_trusted_sync_server

falsepositives:
    - Legitimate ADSync administrative tasks performed on trusted sync servers
    - Service accounts performing automated password sync or health checks
    - Backup or dev/test servers mimicking ADSync behavior
    - Red team / penetration testing activity in hybrid identity labs

level: critical
