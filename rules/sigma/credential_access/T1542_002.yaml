title: Component Firmware Tampering (T1542.002)
id: d70d46b7-706b-421f-bc2d-4019b6cc7d9f
status: stable
description: |
    Detects unauthorized peripheral firmware (NIC, SSD, GPU) modification by 
    monitoring stand-alone flashing tools initiated from untrusted process 
    chains or non-standard file locations. Filters out trusted management 
    tools to reduce false positives.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1542.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_firmware_tools:
        Image|endswith:
            - '\hdparm.exe'
            - '\nvflash.exe'
            - '\mlxfwmanager.exe'
            - '\wd-fw-update.exe'
        OriginalFileName:
            - 'hdparm.exe'
            - 'nvflash.exe'
            - 'FPTW64.exe'

    selection_firmware_commands:
        CommandLine|contains:
            - ' -f '
            - ' --write'
            - ' -update'
            - ' -s '

    selection_untrusted_origins:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Public\'

    filters_trusted_management:
        - Image|contains:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
        - ParentImage|endswith: '\svchost.exe'
        - User: 'NT AUTHORITY\SYSTEM'

    condition: selection_firmware_tools and selection_firmware_commands and selection_untrusted_origins and not filters_trusted_management
level: critical
