title: Firmware Corruption (T1495)
id: 4e2f0a59-29b4-42ed-bf65-f984b163fe64
status: stable
description: |
  Detects potential firmware corruption or unauthorized flashing by monitoring 
  low-level hardware access tools and firmware update utilities originating 
  from untrusted process lineages (e.g., browsers, office apps, or temp folders).
author: hota05
date: 2026-02-09
tags:
  - attack.impact
  - attack.t1495
logsource:
  category: process_creation
  product: windows
detection:
  firmware_tools:
    Image|endswith:
      - '\flashrom.exe'
      - '\fwupdmgr.exe'
      - '\AfuEfix64.exe'
      - '\H2OFFT-W.exe'
      - '\WinFlash.exe'
      - '\wbemtest.exe'

  dangerous_flags:
    CommandLine|contains:
      - '--flash'
      - '-w '
      - '/forceit'
      - '\\.\PhysicalDrive'
      - '\\.\Scsi'
      - 'WmiInternal'

  suspicious_context:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\httpd.exe'
      - '\chrome.exe'
      - '\rundll32.exe'
    Image|contains:
      - '\Temp\'
      - '\Users\Public\'
      - '\AppData\Local\Temp\'

  legit_oem_updates_filter:
    - User: 'NT AUTHORITY\SYSTEM'
    - ParentImage|contains:
        - '\System32\svchost.exe'
        - '\CcmExec.exe'
    - Image|contains:
        - '\Dell\CommandUpdate\'
        - '\Lenovo\SystemUpdate\'
        - '\HP\SoftPaq\'
        - '\WindowsUpdateBox.exe'

  condition: (firmware_tools or dangerous_flags) and suspicious_context 
             and not legit_oem_updates_filter
level: critical
