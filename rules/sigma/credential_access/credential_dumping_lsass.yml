title: Suspicious Access to LSASS Process Memory (Credential Dumping Attempt)
id: 8d5667e7-24d2-4e93-9785-59ba45845ea6
status: experimental
description: >
  Detects suspicious access to the LSASS process memory which may indicate
  credential dumping activity (e.g. Mimikatz, ProcDump, Task Manager dump,
  comsvcs.dll MiniDump, or other memory dumping techniques).

author: hota05 
date: 2026/01/07
modified: 2026/02/11
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
tags:
  - attack.credential_access
  - attack.t1003
  - attack.t1003.001
  - attack.privilege_escalation
logsource:
  product: windows
  category: process_access

detection:

  selection_target_lsass:
    TargetImage|endswith: '\lsass.exe'

  selection_suspicious_access:
    GrantedAccess:
      - '0x10'       
      - '0x20'       
      - '0x30'
      - '0x40'
      - '0x50'
      - '0x1000'
      - '0x1010'
      - '0x1410'
      - '0x143a'
      - '0x1f0fff'
      - '0x1fffff'   

  selection_suspicious_tools:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
      - '\mimikatz.exe'
      - '\rundll32.exe'
      - '\taskmgr.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wmic.exe'
      - '\comsvcs.dll'

  selection_unsigned_or_temp_path:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
      - '\Windows\Temp\'

  filter_legitimate_system:
    Image|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
    Image|endswith:
      - '\taskmgr.exe'

  condition: 
    selection_target_lsass
    and selection_suspicious_access
    and (
          selection_suspicious_tools
          or selection_unsigned_or_temp_path
        )
    and not filter_legitimate_system

falsepositives:
  - Legitimate administrative troubleshooting using ProcDump
  - Security software performing memory inspection
  - Authorized incident response activity

level: high
