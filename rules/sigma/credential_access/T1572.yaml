title: Protocol Tunneling Detection (T1572)
id: 384bacd6-a7f6-46ec-b6a4-689879013f04
status: stable
description: |
  Detects adversary protocol tunneling by identifying non-standard encapsulation, 
  low-level socket proxying (SOCKS5/Reverse), and CLI signatures of known tunneling 
  tools. Filters out legitimate administrative VPN/SSH traffic and automation tools 
  to reduce false positives.
author: hota05 
date: 2026-02-11
tags:
  - attack.command_and_control
  - attack.t1572
logsource:
  category: process_creation
  product: windows

detection:
  selection_tools_cli:
    CommandLine|contains:
      - ' client '       
      - ' -socks5 '     
      - ' -reverse '     
      - ' -R:socks '     
      - ' -tun '         
      - ' -forward '     

  selection_encapsulation:
    CommandLine|contains:
      - 'IcmpSendEcho'  
      - ' -target '      
      - ' -dns '         
      - ' -port 53 '     

  selection_procs:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\rundll32.exe'
      - '\svchost.exe'
      - '\regsvr32.exe'

  filter_legit_admin_tools:
    - Image|contains:
        - '\Windows\System32\OpenSSH\'    
        - '\Program Files\OpenVPN\'     
        - '\FortiClient\'                
    - CommandLine|contains:
        - 'git-remote-https'              
        - 'Azure'
    - User: 'NT AUTHORITY\SYSTEM'

  condition: (selection_tools_cli or selection_encapsulation) and selection_procs and not filter_legit_admin_tools

fields:
  - Time
  - SourceImage
  - SourceUsername
  - CommandLine
  - ProcessId
  - ParentImage

falsepositives:
  - Administrative VPN/SSH connections using OpenSSH or OpenVPN clients
  - Legitimate Azure CLI or Git automation scripts
  - System health monitoring using svchost or PowerShell

level: critical
