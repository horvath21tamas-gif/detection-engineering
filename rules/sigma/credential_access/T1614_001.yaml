title: Ultra-Pro High-Fidelity System Language Discovery (T1614.001)
id: 4ccadb50-cead-4296-b3c3-b737fd57b3b8
status: stable
description: |
    Detects targeted system language and keyboard layout discovery, focusing on 
    malware "kill-switch" checks and environment keying. Minimizes false positives 
    by gating against integrity levels, parent process lineage, and specific hex-code filtering.
author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1614.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\reg.exe'
            - '\wmic.exe'
        - CommandLine|contains:
            - 'Get-Culture'
            - 'Get-WinSystemLocale'
            - 'Get-KeyboardLayout'
            - 'os get MUILanguages'

    selection_registry_logic:
        CommandLine|contains:
            - 'Keyboard Layout\Preload'      
            - 'Control Panel\International'  
            - '00000419'                    
            - '00000422'                    
            - '00000423'                     

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\wsmprovhost.exe'             
            - '\httpd.exe'                  
            - '\powershell.exe'              
        IntegrityLevel: 'Medium'           

    selection_extraction:
        CommandLine|contains:
            - 'findstr'
            - 'select-string'
            - ' > '                          
            - 'ConvertTo-Json'

    filter_legit_noise:
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\msiexec.exe'                 
            - '\CcmExec.exe'                
            - '\svchost.exe'
        - CommandLine|contains:
            - 'Program Files'                

    condition: (selection_tools or selection_registry_logic) and (selection_suspicious_lineage or selection_extraction) and not filter_legit_noise
level: high
