title: Ultra-Pro AppInit_DLLs Persistence Detection (T1546.009)
id: 82d48bfe-8db3-4bce-ac4d-95383911fee6
status: stable
description: |
    Detects unauthorized persistence via AppInit_DLLs by monitoring Registry writes 
    to the 'AppInit_DLLs' and 'LoadAppInit_DLLs' values. 
    Filters out signed Microsoft binaries and trusted system installers.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1546/009/
tags:
    - attack.persistence
    - attack.t1546.009
logsource:
    category: registry_event
    product: windows
detection:
    selection_registry_path:
        TargetObject|contains: 'Microsoft\Windows NT\CurrentVersion\Windows\'
        TargetObject|contains:
            - '\AppInit_DLLs'
            - '\LoadAppInit_DLLs'

    selection_enable:
        TargetObject|endswith: '\LoadAppInit_DLLs'
        Details: '0x00000001' 

    selection_suspicious_path:
        TargetObject|endswith: '\AppInit_DLLs'
        Details|contains:
            - '\Users\'
            - '\ProgramData\'
            - '\Temp\'
            - '\Public\'
            - '\AppData\'

    selection_suspicious_actor:
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\reg.exe'
            - '\w3wp.exe'
            - '\cscript.exe'

    filter_trusted_installers:
        Image|endswith:
            - '\msiexec.exe'
            - '\trustedinstaller.exe'
            - '\TiWorker.exe'
        username: 'NT AUTHORITY\SYSTEM'

    filter_standard_locations:
        Details|startsWith: 'C:\Windows\System32\'
        Details|endswith: '.dll'

    condition: selection_registry_path and (selection_enable or selection_suspicious_path or selection_suspicious_actor) and not (filter_trusted_installers or filter_standard_locations)
level: critical
