title: Windows System Binary Proxy Execution
id: 9f7c36b4-5cba-43cb-b471-9b9052248952
status: stable
description: >
  Detects high-confidence abuse of trusted Windows binaries to proxy
  malicious execution (MITRE ATT&CK T1218). Adversaries leverage
  binaries such as rundll32.exe, regsvr32.exe, msiexec.exe,
  installutil.exe, mshta.exe, control.exe, cmstp.exe, odbcconf.exe,
  or hh.exe to execute code from non-standard paths, remote sources,
  or via cross-process boundary calls.

  Focuses on anomalous parent processes, suspicious command-line
  arguments, user-writable paths, and relocated binaries. Filters
  legitimate system-managed execution contexts to reduce false
  positives.

author: hota05
date: 2026/02/20
references:
  - https://attack.mitre.org/techniques/T1218/
  - https://lolbas-project.github.io/lolbas/

logsource:
  product: windows
  category: process_creation

detection:

  selection_system_proxies:
    Image|endswith:
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\msiexec.exe'
      - '\installutil.exe'
      - '\mshta.exe'
      - '\control.exe'
      - '\cmstp.exe'
      - '\odbcconf.exe'
      - '\hh.exe'
    OriginalFileName:
      - 'rundll32.exe'
      - 'regsvr32.exe'
      - 'msiexec.exe'
      - 'installutil.exe'
      - 'mshta.exe'
      - 'control.exe'
      - 'cmstp.exe'
      - 'odbcconf.exe'
      - 'hh.exe'

  selection_suspicious_parents:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\brave.exe'
      - '\sqlservr.exe'
      - '\w3wp.exe'
      - '\pwsh.exe'
      - '\powershell.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'

  selection_remote_or_suspicious_args:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
      - 'javascript:'
      - 'vbscript:'
      - 'scrobj.dll'
      - 'ms-its:'
      - 'its:'
      - 'mk:@MSITStore'
      - '.txt'
      - '.dat'
      - '.inf'
      - '.dll'
      - '.png'
      - '.jpg'
      - '.tmp'

  selection_user_writable_paths:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Downloads\'
      - '\Temp\'
      - '\PerfLogs\'

  selection_relocated_binary:
    Image|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'

  selection_low_integrity:
    IntegrityLevel:
      - 'Low'
      - 'Medium'

  filter_trusted_management:
    username: 'NT AUTHORITY\SYSTEM'
    ParentImage|startswith:
      - 'C:\Windows\System32\svchost.exe'
      - 'C:\Windows\CCM\CcmExec.exe'
      - 'C:\Program Files\Microsoft.Management\Services.IntuneWindowsAgent.exe'
    CommandLine|contains: 
      - 'C:\Windows\Installer\'

  filter_system_baseline:
    ParentImage|endswith:
      - '\explorer.exe'
    Image|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
    IntegrityLevel: 'High'

  condition: >
    selection_system_proxies
    and selection_low_integrity
    and (selection_suspicious_parents
        or selection_remote_or_suspicious_args
        or selection_user_writable_paths
        or selection_relocated_binary)
    and not (filter_trusted_management
        or filter_system_baseline)

falsepositives:
  - Enterprise software deployment & patch management
  - Legitimate admin activity invoking trusted binaries
  - Security/penetration testing
  - Build/test environments

level: critical

tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1218
  - attack.lolbas
  - attack.windows
