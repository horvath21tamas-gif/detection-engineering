title: Ultra-Pro Setuid/Setgid Bit Manipulation (T1548.001)
id: 20a87e2c-f43b-4588-a724-f6c3db1c0c39
status: stable
description: |
    Detects unauthorized SUID/SGID bit escalation by monitoring chmod/chown 
    execution in world-writable directories and suspicious reconnaissance 
    patterns, while filtering out legitimate package managers.
author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.t1548.001
logsource:
    product: linux
    category: process_creation
detection:
    selection_chmod_bits:
        Image|endswith: '/chmod'
        CommandLine|contains:
            - 'u+s'
            - 'g+s'
            - '4755'
            - '4777'
            - '2755'
            - '4000'
            - '2000'

    selection_suspicious_paths:
        CommandLine|contains:
            - '/tmp/'
            - '/dev/shm/'
            - '/var/tmp/'
            - '/home/'
            - '/run/'

    selection_recon:
        Image|endswith: '/find'
        CommandLine|contains:
            - '-perm -4000'
            - '-perm -2000'

    filter_trusted_processes:
        ParentImage|endswith:
            - '/apt'
            - '/dpkg'
            - '/yum'
            - '/dnf'
            - '/rpm'
            - '/ansible' 
            - '/puppet'
        username: 'root'

    selection_shell_origin:
        ParentImage|endswith:
            - '/bash'
            - '/zsh'
            - '/sh'

    condition: ((selection_chmod_bits and (selection_suspicious_paths or selection_shell_origin)) or selection_recon) and not filter_trusted_processes
level: high
