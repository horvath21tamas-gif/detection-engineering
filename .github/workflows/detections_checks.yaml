name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

# Ez a rész adja meg a szükséges írási jogot a GitHub Action-nek
permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml sigma-cli

      - name: Run unit test
        run: |
          # Használjuk a PYTHONPATH-ot, hogy biztosan lássa a tools mappát a teszt
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q

      - name: Lint and validate Sigma rules
        run: |
          python tools/lint_rules.py
          python tools/validate_metadata.py

      - name: Update README.md
        if: github.event_name == 'push'
        run: |
          python tools/update_readme.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          # Csak akkor commitolunk, ha tényleg változott valami, így elkerüljük a hibaüzeneteket
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update README with rule statistics" && git push)
