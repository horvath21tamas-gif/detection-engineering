title: Port Knocking or Raw Socket Listener Deployment (T1205.001)
id: 9b03a998-5197-4123-a9f4-7946db16b139
status: stable
description: |
    Detects unauthorized implementation of Port Knocking or raw packet 
    listeners by monitoring:
      - registration of raw packet capturing drivers/tools
      - suspicious firewall modifications allowing UDP/ICMP/Any port
      - execution from untrusted scripting or shell environments

    Attackers may leverage this technique to stealthily signal C2, 
    bypass firewalls, or trigger hidden services.

author: hota05
date: 2026-02-02
modified: 2026-02-20
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1205.001
    - attack.t1562.001
    - attack.t1049
logsource:
    product: windows
    category: process_creation

detection:
    selection_network_tools:
        Image|endswith:
            - '\tcpdump.exe'
            - '\windump.exe'
            - '\scapy.exe'
            - '\nmap.exe'
            - '\hping.exe'
        OriginalFileName:
            - 'tcpdump.exe'
            - 'windump.exe'
            - 'scapy.exe'
            - 'nmap.exe'
            - 'hping.exe'

    selection_firewall_mod:
        CommandLine|contains|all:
            - 'advfirewall firewall add rule'
            - 'action=allow'
            - 'protocol=UDP'
        CommandLine|contains:
            - 'protocol=ICMP'
            - 'localport=any'
            - 'remoteport=any'

    selection_untrusted_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'
            - '\AppData\'
            - '\ProgramData\'

    filter_trusted:
        User|startswith: 'NT AUTHORITY\'
        Image|contains:
            - '\Windows\System32\svchost.exe'
            - '\Program Files\Windows Defender\'
            - '\Program Files\CrowdStrike\'
            - '\Program Files\SentinelOne\'
        CommandLine|contains: 'description='

    condition: 
        (selection_network_tools or selection_firewall_mod)
        and selection_untrusted_parent
        and not filter_trusted

falsepositives:
    - Security or network monitoring tool deployments
    - Enterprise firewall or routing configuration scripts
    - Legitimate pentesting tools in authorized labs

level: high
