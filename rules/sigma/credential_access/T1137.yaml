title: Office Application Startup Persistence (T1137)
id: 2d3b6c2d-23ba-4a5e-bfb8-9489f22801a0
status: stable
description: |
    Detects unauthorized Office persistence by monitoring registry modifications:
      - Tracks Add-ins LoadBehavior, OPEN options, WebView URLs, and TrustRecords
      - Flags modifications originating from non-standard processes or suspicious paths
      - Filters out trusted installers and system paths to reduce false positives

author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1137

logsource:
    product: windows
    category: registry_event

detection:
    selection_registry:
        TargetObject|re: '\\Software\\Microsoft\\Office\\.*\\(Addins\\LoadBehavior|Options\\OPEN|Outlook\\WebView\\URL|Security\\Trusted Documents\\TrustRecords)$'

    selection_suspicious_paths:
        Details|re: '(\\AppData\\Local\\Temp\\|C:\\Users\\Public\\|\\Downloads\\|http)'

    selection_suspicious_proc:
        Image|re: '(powershell\.exe|cmd\.exe|wscript\.exe|cscript\.exe|reg\.exe|bitsadmin\.exe)$'

    filter_trusted_installers:
        Image|re: '(msiexec\.exe|setup\.exe|OfficeClickToRun\.exe)$'
        Details|re: '(C:\\Program Files\\|C:\\Program Files \(x86\)\\)'

    condition: selection_registry and (selection_suspicious_paths or selection_suspicious_proc) and not filter_trusted_installers

level: high
