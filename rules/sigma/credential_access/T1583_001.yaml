title: High-Fidelity VPS Infrastructure Provisioning - T1583.001
id: e24ad039-6b6b-4eb7-ba5e-82129fec2a7d
status: stable
description: >
  Detects the automated acquisition of VPS infrastructure (DigitalOcean, AWS, Azure, GCP). 
  Focuses on the provisioning phase (VM creation) while isolating authorized DevOps 
  pipelines and interactive developer workflows.
author: hota05
date: 2026/01/27
references:
  - https://attack.mitre.org/techniques/T1583/001/
tags:
  - attack.resource_development
  - attack.t1583.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_provisioning_ops:
    - Image|endswith:
        - '\terraform.exe'
        - '\pulumi.exe'
        - '\aws.exe'
        - '\az.exe'
        - '\doctl.exe'
        - '\gcloud.exe'
    - CommandLine|contains:
        - ' apply'            
        - ' run-instances'    
        - ' vm create'        
        - ' droplets create'  
        - ' compute instances create' 

  selection_api_provisioning:
    - Image|endswith:
        - '\python.exe'
        - '\curl.exe'
    - CommandLine|contains|all:
        - 'http'
        - 'api.'
    - CommandLine|contains:
        - '/v2/droplets'      
        - 'ec2.amazonaws.com'
        - 'management.azure.com'

  filter_authorized_automation:
    User|contains:
      - 'svc_jenkins'
      - 'svc_terraform'
      - 'gitlab_runner'
      - 'adm_infra_deploy'
    Image|contains:
      - '\Program Files\Terraform\'
      - '\actions-runner\'

  filter_dev_context:
    ParentImage|endswith:
      - '\code.exe'          
      - '\devenv.exe'       
      - '\idea64.exe'        

  filter_interactive:
    ParentImage|endswith: '\explorer.exe'
    condition: not selection_provisioning_ops

  condition: (selection_provisioning_ops or selection_api_provisioning) and not filter_authorized_automation and not filter_dev_context and not filter_interactive
falsepositives:
  - Authorized cloud engineers performing manual infrastructure updates.
  - Development teams testing IaC scripts in non-standard local environments.
  - Automated cloud-monitoring tools that trigger resource updates.
level: high
