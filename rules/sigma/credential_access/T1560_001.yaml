title: Data Archiving for Exfiltration
id: 6174cd26-d2a2-4499-9d7d-efe74520f85a
status: stable
description: |
    Detects high-confidence data staging for exfiltration using third-party
    archiving utilities or PowerShell compression.

    Coverage includes:

      - 7-Zip / WinRAR / tar / zip archive creation
      - Password-protected archives
      - Volume splitting
      - Delete-after-archive behavior
      - Sensitive data targeting
      - Suspicious interactive or web execution context

    Focused on ATT&CK T1560.001 (Archive via Utility).

author: hota05 
date: 2026-02-12
tags:
    - attack.collection
    - attack.exfiltration
    - attack.t1560.001

logsource:
    product: windows
    category: process_creation

detection:
    selection_archive_tool_image:
        Image|endswith:
            - '\7z.exe'
            - '\7za.exe'
            - '\winrar.exe'
            - '\rar.exe'
            - '\tar.exe'
            - '\zip.exe'

    selection_archive_tool_originalname:
        OriginalFileName|in:
            - '7z.exe'
            - '7za.exe'
            - 'WinRAR.exe'
            - 'rar.exe'
            - 'tar.exe'
            - 'zip.exe'

    selection_archive_creation:
        CommandLine|contains:
            - ' a '
            - ' -cf '
            - ' -czf '
            - '.zip'
            - '.rar'
            - '.7z'
            - '.tar'

    selection_password_protected:
        CommandLine|contains:
            - ' -p'
            - ' -hp'

    selection_volume_split:
        CommandLine|contains:
            - ' -v'

    selection_delete_after:
        CommandLine|contains:
            - ' -sdel'

    selection_ps_compress:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Compress-Archive'
            - '-DestinationPath'

    selection_sensitive_source:
        CommandLine|contains:
            - '\Desktop\'
            - '\Documents\'
            - '\Downloads\'
            - '\AppData\Local\Microsoft\Outlook\'
            - 'C:\inetpub\'
            - 'C:\Users\Public\'
            - '\ProgramData\'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\mshta.exe'
            - '\w3wp.exe'
            - '\httpd.exe'
            - '\rundll32.exe'

    selection_temp_execution:
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Windows\Temp\'

    filter_system_context:
        User|startswith: 'NT AUTHORITY'
        ParentImage|endswith:
            - '\services.exe'
            - '\svchost.exe'

    filter_backup_software:
        ParentImage|contains:
            - '\Veeam\'
            - '\Veritas\'
            - '\Commvault\'
            - '\Backup\'

    filter_monitoring_agents:
        Image|startswith:
            - 'C:\Program Files\Microsoft Monitoring Agent\'
            - 'C:\Program Files\Splunk\'
            - 'C:\Program Files\Elastic\'

    condition: (
                    (
                        (selection_archive_tool_image or selection_archive_tool_originalname)
                        and selection_archive_creation
                        and (
                                selection_password_protected
                                or selection_volume_split
                                or selection_delete_after
                            )
                        and selection_sensitive_source
                    )
                    or
                    (
                        selection_ps_compress
                        and selection_sensitive_source
                    )
               )
               and (selection_suspicious_parent or selection_temp_execution)
               and not filter_system_context
               and not filter_backup_software
               and not filter_monitoring_agents

level: critical
