title: Lateral Tool Transfer (T1570)
id: 92b271cf-a9c2-46e2-bf06-1ba499fd754e
status: stable
description: |
  Detects unauthorized lateral tool transfer across administrative shares (C$, ADMIN$, IPC$).
  Focuses on high-risk process activity originating from non-standard lineages 
  (Office apps, browsers, non-elevated shells) and known transfer utilities 
  like robocopy, bitsadmin, xcopy, or certutil. Excludes legitimate system 
  automation and software distribution activity.
author: hota05 
date: 2026-02-11
tags:
  - attack.lateral_movement
  - attack.t1570
logsource:
  category: process_creation
  product: windows

detection:
  selection_tools:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\robocopy.exe'
      - '\xcopy.exe'
      - '\bitsadmin.exe'
      - '\certutil.exe'
      - '\curl.exe'

  selection_shares:
    CommandLine|contains:
      - '\\C$\'      
      - '\\ADMIN$\'  
      - '\\IPC$\'    
      - 'c$'        
      - 'admin$'

  selection_extensions:
    CommandLine|contains:
      - '.exe'
      - '.dll'
      - '.ps1'
      - '.vbs'
      - '.bat'
      - '.zip'
      - '.7z'
      - '.vhd'
      - '.iso'

  selection_suspicious_lineage:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\httpd.exe'
      - '\w3wp.exe'
      - '\sqlservr.exe'
    IntegrityLevel: 'Medium'

  filter_legit_automation:
    - Image|endswith:
        - '\CcmExec.exe'
        - '\msiexec.exe'
    - CommandLine|contains:
        - '\SoftwareDistribution\'
        - '\HealthCheck\'
        - 'AppData\Local\Google\Chrome'
    - username: 'NT AUTHORITY\SYSTEM'

  condition: selection_tools and selection_shares and selection_extensions and selection_suspicious_lineage and not filter_legit_automation

fields:
  - Time
  - SourceImage
  - ParentImage
  - CommandLine
  - ProcessId
  - SourceUsername
  - IntegrityLevel

falsepositives:
  - Software distribution or patching tasks
  - System health or monitoring scripts using standard Windows tools
  - Legitimate admin file copies across shares via managed processes

level: high
