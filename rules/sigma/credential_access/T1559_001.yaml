title: Gyanús elnevezett csővezeték-létrehozás, amely utólagos kihasználási eszközökhöz kapcsolódik (High Fidelity)
id: 519fab54-5841-48d3-b600-bb082c0251e6
status: stable
description: >
  A gyanús nevesített csővezetékek létrehozásának nagy pontosságú észlelése, amelyek gyakran kapcsolódnak az oldalirányú mozgáshoz és a kihasználás utáni keretrendszerekhez.
  A szabály az ismert rosszindulatú csővezeték-neveket, a véletlenszerű csővezeték-mintákat, a LOLBin végrehajtási kontextust és a szigorú engedélyezési listákat ötvözi a téves riasztások minimalizálása érdekében.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1559/001/

logsource:
  product: windows
  category: pipe_created

detection:

  known_malicious_pipes:
    PipeName|contains:
      - '\msagent_'
      - '\postex_'
      - '\status_'
      - '\psexec'
      - '\paexec'
      - '\remcom'
      - '\lsadump'
      - '\cachedump'
      - '\win_svc'
      - '\mypipe'

  randomized_pipe_pattern:
    PipeName|re: '^\\+[a-f0-9]{8,12}$'

  suspicious_execution_image:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\powershell_ise.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
      - '\mshta.exe'

  suspicious_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
      - '\cscript.exe'

  filter_legit_microsoft:
    Image|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
    PipeName|contains:
      - '\lsass'
      - '\ntsvcs'
      - '\scerpc'
      - '\epmapper'
      - '\atsvc'
      - '\spoolss'
      - '\srvsvc'


  filter_legit_apps:
    Image|endswith:
      - '\vmtoolsd.exe'
      - '\vboxservice.exe'
      - '\docker.exe'

  # === 7. Browser noise reduction ===
  filter_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
    PipeName|re: '^\\+(chrome|edge|mojo)'

  condition: >
    known_malicious_pipes
    or (
        randomized_pipe_pattern
        and suspicious_execution_image
        and suspicious_parent
      )
    and not (
        filter_legit_microsoft
        or filter_legit_apps
        or filter_browsers
      )

falsepositives:
  - Custom in-house IPC mechanisms
  - Rare administrative tooling using randomized pipe names

level: high

tags:
  - attack.lateral_movement
  - attack.t1559.001
