title: Ultra-Pro Unauthorized Windows Service Installation (T1543.003)
id: aa0892b3-4b62-4ef0-abcd-bdd199530707
status: stable
description: |
    Detects unauthorized Windows service creation by monitoring Event ID 7045 and process creation. 
    Focuses on suspicious binary paths, shell-spawned services, and non-standard service executables.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1543/003/
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    product: windows
    service: process_creation
detection:
    selection_event_7045:
        EventID: 7045

    selection_suspicious_path:
        ServiceFileName|contains:
            - '\Users\'
            - '\ProgramData\'
            - '\Windows\Temp\'
            - '\AppData\'
            - '\PerfLogs\'
            - 'powershell'
            - 'cmd.exe'
            - 'regsvr32'
            - 'mshta'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\w3wp.exe'       
            - '\powershell.exe'  
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'

    filter_trusted_installers:
        ServiceFileName|contains:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
        ParentImage|endswith:
            - '\services.exe'
            - '\msiexec.exe'
            - '\trustedinstaller.exe'
            - '\TiWorker.exe'
        User: 'NT AUTHORITY\SYSTEM'

    condition: selection_event_7045 and (selection_suspicious_path or selection_suspicious_parent) and not filter_trusted_installers
level: critical
