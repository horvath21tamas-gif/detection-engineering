title: Disk Structure Wipe
id: e52848f9-bc27-4329-8e76-b6076d1af7a5
status: stable
description: |
    Detects high-confidence destructive disk structure operations including:

      - Partition table wiping (diskpart clean / delete partition)
      - MBR overwrite (first 512 bytes overwrite patterns)
      - Raw physical drive writes
      - Destructive PowerShell disk clearing
      - Suspicious execution context (macro/webshell/LOLBIN)

    Focused on ransomware and destructive wiper behavior (T1561.002).

author: hota05
date: 2026-02-12
tags:
    - attack.impact
    - attack.t1561
    - attack.t1561.002

logsource:
    product: windows
    category: process_creation

detection:

    selection_diskpart_clean:
        Image|endswith: '\diskpart.exe'
        CommandLine|contains:
            - ' clean'
            - ' clean all'

    selection_diskpart_delete_partition:
        Image|endswith: '\diskpart.exe'
        CommandLine|contains:
            - ' delete partition'
            - ' delete volume'

    selection_dd_mbr_overwrite:
        Image|endswith: '\dd.exe'
        CommandLine|contains|all:
            - 'of=\\.\PhysicalDrive'
            - 'bs=512'
        CommandLine|contains:
            - 'count=1'
            - 'if=/dev/zero'
            - 'if=/dev/urandom'

    selection_raw_device_write:
        CommandLine|contains:
            - '\\.\PhysicalDrive0'
            - '\\.\Harddisk0'

    selection_ps_clear_disk:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Clear-Disk'
            - '-RemoveData'
            - '-Confirm:$false'

    selection_ps_remove_partition:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Remove-Partition'
            - '-Confirm:$false'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\w3wp.exe'
            - '\httpd.exe'
            - '\mshta.exe'
            - '\rundll32.exe'

    selection_suspicious_path:
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Windows\Temp\'

    filter_system_context:
        User|startswith: 'NT AUTHORITY'
        ParentImage|endswith:
            - '\services.exe'
            - '\svchost.exe'
            - '\vds.exe'

    filter_deployment_tools:
        ParentImage|endswith:
            - '\CcmExec.exe'
            - '\msiexec.exe'
            - '\setup.exe'
        ParentImage|contains:
            - '\ConfigurationManager\'
            - '\IntuneManagementExtension\'

    filter_scripted_diskpart:
        CommandLine|contains:
            - 'diskpart /s'
            - '\deployment\scripts\'
            - '\imaging\'

    condition: (
                    (
                        selection_diskpart_clean
                        or selection_diskpart_delete_partition
                        or selection_dd_mbr_overwrite
                        or selection_ps_clear_disk
                        or selection_ps_remove_partition
                    )
               )
               and (selection_suspicious_parent or selection_suspicious_path)
               and not filter_system_context
               and not filter_deployment_tools
               and not filter_scripted_diskpart

level: critical
