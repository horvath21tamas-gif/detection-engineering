title: Mail Protocol Anomaly (T1071.003)
id: 6dc498c5-15eb-4254-8d4a-eb9ecb2174b1
status: stable
description: |
  Detects unauthorized email-based C2 or exfiltration by monitoring direct mail 
  protocol connections (SMTP, IMAP, POP3) from non-mail processes. Focuses on 
  automation and scripting abuse via PowerShell, .NET, and legacy script hosts, 
  and anomalous process lineages.
author: hota05
date: 2026-02-09
tags:
  - attack.command_and_control
  - attack.exfiltration
  - attack.t1071.003
logsource:
  category: network_connection
  product: windows
detection:
  selection_non_mail_procs:
    Image|endswith:
      - '\notepad.exe'
      - '\calc.exe'
      - '\mspaint.exe'
      - '\winver.exe'
      - '\spoolsv.exe'
      - '\colorcpl.exe'
      - '\scrcons.exe'

  selection_automation:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cscript.exe'
      - '\wscript.exe'
      - '\rundll32.exe'
    CommandLine|contains:
      - 'Send-MailMessage'
      - 'Net.Mail.SmtpClient'
      - 'System.Net.Mail'
      - '.Credentials'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\w3wp.exe'

  selection_mail_ports:
    DestinationPort:
      - 25     # SMTP
      - 465    # SMTP SSL
      - 587    # SMTP TLS
      - 993    # IMAP SSL
      - 995    # POP3 SSL

  filter_legit_mail:
    Image|endswith:
      - '\outlook.exe'
      - '\thunderbird.exe'
      - '\msedgewebview2.exe'
    DestinationIP:
      - '10.0.0.0/8'
      - '192.168.0.0/16'
    User: 'NT AUTHORITY\SYSTEM'

  condition: (selection_non_mail_procs or selection_automation or selection_suspicious_parent) 
             and selection_mail_ports 
             and not filter_legit_mail
level: critical
