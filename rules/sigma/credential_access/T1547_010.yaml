title: High-Fidelity AppCert DLL Persistence (T1547.010)
id: 3d6b9ddb-7d62-4483-b6b8-8433c0b1196d
status: stable
description: |
    Detects unauthorized registration of AppCert DLLs. These DLLs are loaded into 
    every process that calls CreateProcess, making it a powerful persistence and injection vector.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1547/010/
tags:
    - attack.persistence
    - attack.t1547.010
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains: 'System\CurrentControlSet\Control\Session Manager\AppCertDlls'

    selection_suspicious_path:
        Details|contains:
            - ':\Users\'
            - ':\ProgramData\'
            - ':\Temp\'
            - ':\Windows\Temp\'
            - 'C:\PerfLogs\'

    selection_suspicious_writer:
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\reg.exe'
            - '\cscript.exe'
            - '\wscript.exe'

    filter_trusted_installer:
        Image|endswith:
            - '\trustedinstaller.exe'
            - '\System32\msiexec.exe'
        Image|contains:
            - 'C:\$WINDOWS.~BT\'
            - 'C:\Windows\System32\oobe\'

    condition: selection_registry and (selection_suspicious_path or selection_suspicious_writer) and not filter_trusted_installer
level: critical
