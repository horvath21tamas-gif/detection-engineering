title: Ultra-Pro High-Fidelity File and Directory Discovery (T1083)
id: 2a62e707-7364-4cdc-a62c-ea9b325c80fd
status: stable
description: |
    Detects targeted file and directory discovery focusing on sensitive data harvesting.
    Filters out legitimate system indexing, AV scans, and developer activities by analyzing 
    process integrity, parent-child relationships, and specific keyword patterns.
author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1083
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\where.exe'
            - '\findstr.exe'
            - '\find.exe'
            - '\tree.com'
        - CommandLine|contains:
            - 'dir '
            - 'ls '
            - 'Get-ChildItem'

    selection_keywords:
        CommandLine|contains:
            - '.kdbx'          
            - '.vnc'         
            - '.rdp'           
            - 'id_rsa'       
            - 'unattend.xml'
            - 'web.config'     
            - 'backup'
            - 'password'

    selection_depth:
        CommandLine|contains:
            - ' /s'            
            - ' -r'          
            - ' /r'            
            - ' -Recurse'

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\wsmprovhost.exe'     
            - '\httpd.exe'         
            - '\winword.exe'         
            - '\powershell.exe'      
        IntegrityLevel: 'Medium' 

    filter_legit_noise:
        - Image|contains:
            - '\Program Files\'     
            - '\Windows\System32\'   
        - User: 'NT AUTHORITY\SYSTEM' 
        - ParentImage|endswith:
            - '\msmpeng.exe'         
            - '\searchindexer.exe'   

    condition: selection_tools and (selection_keywords or (selection_depth and selection_suspicious_lineage)) and not filter_legit_noise
level: high
