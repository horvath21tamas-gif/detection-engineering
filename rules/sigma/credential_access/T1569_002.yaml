title: High-Fidelity System Service Execution Detection (T1569.002)
id: 1e1a2a17-bc0c-402c-863a-a31bce099ac6
status: stable
description: |
    Detects suspicious service execution or modification by monitoring anomalous 
    parent processes, world-writable binary paths, and shell command wrappers. 
    Optimized for low false positive rates in enterprise environments.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1569/002/
tags:
    - attack.execution
    - attack.lateral_movement
    - attack.t1569.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith: 
            - '\sc.exe'
        - OriginalFileName: 'sc.exe'
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_action:
        CommandLine|contains:
            - ' create '
            - ' config '
            - ' binPath'
            - 'New-Service'
            - 'Set-Service'

    selection_suspicious_context:
        - CommandLine|contains:
            - ':\Windows\Temp\'
            - ':\Users\Public\'
            - ':\ProgramData\'
            - '\AppData\Local\Temp\'
            - 'admin$'
            - 'c$'
        - CommandLine|contains:
            - 'cmd.exe /c'
            - 'powershell.exe -enc'
            - ' -ExecutionPolicy Bypass '

    selection_untrusted_parents:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\wsmprovhost.exe' 
            - '\psexesvc.exe'    
            - '\httpd.exe'       
            - '\nginx.exe'
            - '\php-cgi.exe'

    filter_legit_automation:
        - ParentImage|endswith:
            - '\msiexec.exe'
            - '\TrustedInstaller.exe'
            - '\CcmExec.exe'      
            - '\GMSCAgent.exe'
        - username: 'NT AUTHORITY\SYSTEM'
          CommandLine|contains: 'C:\Windows\System32\'

    condition: selection_tools and selection_action and (selection_suspicious_context or selection_untrusted_parents) and not filter_legit_automation
level: high
