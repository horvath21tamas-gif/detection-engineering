title: Ultra-Pro High-Fidelity MotW Bypass & Zone Subversion (T1553.005)
id: ddb6308f-9481-4cad-9130-a7d5824482b2
status: stable
description: |
    Detects programmatic removal or subversion of the Mark of the Web (MotW). 
    Focuses on non-interactive ADS manipulation and suspicious registry 
    modifications that lower security zone settings.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1553.005
logsource:
    product: windows
    category: process_creation
detection:
    selection_ads:
        CommandLine|contains:
            - ':Zone.Identifier'
        CommandLine|contains:
            - 'Remove-Item'      
            - 'Set-Content'       
            - 'Clear-Content'
            - 'streams.exe'      
            - 'xattr'             
            - 'delete'

    selection_context:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\winword.exe'
            - '\excel.exe'

    selection_registry:
        CommandLine|contains:
            - 'SaveZoneInformation'  
            - 'LowRiskFileTypes'    
            - 'ZoneMap\Domains'      
        CommandLine|contains:
            - 'reg add'
            - 'Set-ItemProperty'

    selection_paths:
        CommandLine|contains:
            - '\Downloads\'
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Desktop\'

    filter_trusted_installers:
        Image|startswith:
            - 'C:\Windows\System32\msiexec.exe'
            - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
            - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        User: 'NT AUTHORITY\SYSTEM'

    condition: ((selection_ads and selection_context) or selection_registry) and selection_paths and not filter_trusted_installers
level: critical
