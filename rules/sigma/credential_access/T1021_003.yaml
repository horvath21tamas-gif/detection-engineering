title: DCOM Remote Execution (T1021.003)
id: 7d7567d6-d75b-414d-838e-67abcdb583c6
status: stable
description: |
  Detects lateral movement via DCOM by monitoring suspicious child processes 
  from known vulnerable COM objects. Specifically filters for headless 
  execution and anomalous network-to-process lineage.
author: hota05
date: 2026-02-05
tags:
  - attack.lateral_movement
  - attack.t1021.003

logsource:
  category: process_creation
  product: windows

detection:
  selection_parent:
    ParentImage|endswith:
      - '\mmc.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\visio.exe'
      - '\explorer.exe'
      - '\dcomcnfg.exe'
      - '\word.exe'

  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\cscript.exe'
      - '\wscript.exe'
      - '\scrcons.exe'

  selection_args:
    CommandLine|contains:
      - ' -enc '
      - ' -w hidden'
      - ' -nop'
      - ' /c '
      - 'DownloadString'
      - 'bypass'

  selection_headless:
    ParentCommandLine|contains:
      - ' /automation'
      - ' -embedding'

  filter_legit_msc:
    - CommandLine|contains:
        - 'C:\Windows\System32\'
        - '.msc'
    - ParentCommandLine|contains:
        - 'servermanager.msc'
    - username: 'NT AUTHORITY\SYSTEM'

  condition: >
    selection_parent and
    selection_child and
    (selection_args or selection_headless) and
    not filter_legit_msc

level: critical
