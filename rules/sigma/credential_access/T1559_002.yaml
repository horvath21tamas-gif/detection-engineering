title: High-Fidelity Office DDE Contextual Anomaly
id: b602e70f-4938-4e1b-b23c-cb01493775fe
status: stable
description: |
    Detects suspicious process spawning via Microsoft Office Dynamic Data Exchange (DDE). 
    Filters legitimate financial data links (Excel) and focuses on Office apps launching 
    interpreters or LOLBins with DDE-specific command-line markers.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1559/002/
tags:
    - attack.execution
    - attack.t1559.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_office_parents:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'

    selection_suspicious_children:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'

    selection_dde_logic:
        CommandLine|contains:
            - 'DDEAUTO'      
            - 'DDE '         
            - '/c start'     
            - 'http'        
            - 'powershell -e' 

    filter_legit_financial_links:
        - CommandLine|contains: 
            - 'workbook'
            - 'dde_link'
            - 'RTD'          
        - ParentImage|contains: 'Program Files' 

    condition: selection_office_parents and selection_suspicious_children and selection_dde_logic and not filter_legit_financial_links
level: critical
