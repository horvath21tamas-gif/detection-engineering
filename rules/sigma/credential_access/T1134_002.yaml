title: Create Process with Token (T1134.002)
id: 272229c7-d623-48de-8b39-d0617d1d9446
status: stable
description: |
    Detects unauthorized process creation using duplicated tokens by monitoring:
      - Offensive tools and token manipulation commands
      - Suspicious integrity level transitions from Medium to SYSTEM
      - Filters out legitimate system processes, UAC elevation, and security agents

author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.t1134.002

logsource:
    product: windows
    category: process_creation

detection:
    selection_tools:
        processcommandline: '(runas /token|make_token|steal_token|Invoke-TokenManipulation|CPAU\.exe|load_privilege)'

    selection_integrity_anomaly:
        Parentprocessname: '(powershell\.exe|pwsh\.exe|cmd\.exe|cscript\.exe|wscript\.exe)$'
        username: 'SYSTEM'
        logonid: '0x3e7'

    filter_trusted_system_procs:
        - Parentprocessname: '(services\.exe|wininit\.exe|lsass\.exe|winlogon\.exe)$'
        - processname: '(conhost\.exe|WerFault\.exe|WmiPrvSE\.exe)$'
        - ParentCommandLine|re: 'svchost\.exe -k'

    filter_security_agents:
        processname: '(\\Program Files\\Windows Defender\\|\\Program Files\\CrowdStrike\\|\\SentinelOne\\)'

    condition: (selection_tools or selection_integrity_anomaly) and not (filter_trusted_system_procs or filter_security_agents)

level: critical
