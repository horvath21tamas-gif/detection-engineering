title: Ultra-Pro High-Fidelity SMB Admin Share Mapping (T1021.002)
id: 2612854c-0900-4374-b448-cd490873384a
status: stable
description: |
    Detects targeted access to administrative shares (C$, ADMIN$, IPC$) using 
    native tools (net.exe, PowerShell) while filtering out standard IT 
    orchestration and service-level noise.
author: hota05
date: 2026-02-05
tags:
    - attack.lateral_movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\net.exe'
            - '\net1.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
        - OriginalFileName:
            - 'net.exe'
            - 'net1.exe'
            - 'PowerShell.EXE'

    selection_shares:
        CommandLine|contains:
            - '\\C$\'
            - '\\ADMIN$\'
            - '\\IPC$\'
            - 'admin$'
            - 'c$'
            - 'ipc$'

    selection_patterns:
        CommandLine|contains:
            - 'use '                  
            - 'New-PSDrive'           
            - ' /user:'            
            - ' /p:'                
            - ' /u:'

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\httpd.exe'          
            - '\w3wp.exe'           
            - '\sqlservr.exe'        
        IntegrityLevel: 'Medium'     

    filter_legit_automation:
        - username: 'NT AUTHORITY\SYSTEM' 
        - ParentImage|endswith:
            - '\services.exe'
            - '\CcmExec.exe'         
            - '\msiexec.exe'
            - '\Veeam\'              
        - CommandLine|contains:
            - '\SoftwareDistribution' 
            - 'C:\Program Files\'
            - 'HealthCheck'

    condition: (selection_tools and selection_shares and selection_patterns) or (selection_shares and selection_suspicious_lineage) and not filter_legit_automation
level: high
