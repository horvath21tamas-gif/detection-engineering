title: DLL Injection Detection (ATT&CK T1055.001)
id: e3429027-8461-43ef-8e8d-3705c0c576d7
status: stable
description: >
  Detects DLL injection by identifying remote thread creation 
  targeting critical Windows processes, where the start address corresponds 
  to library-loading functions or the source memory region is unbacked (shellcode). 
  Trusted system processes and AV components are excluded.
author: hota05 
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1055/001/
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055.001
  - attack.host

logsource:
  product: windows
  service: sysmon

detection:
  selection_load_library:
    StartFunction|contains:
      - 'LoadLibraryA'
      - 'LoadLibraryW'

  selection_unbacked_start:
    StartModule: null

  selection_critical_targets:
    TargetImage|endswith:
      - '\lsass.exe'
      - '\svchost.exe'
      - '\explorer.exe'
      - '\winlogon.exe'
      - '\spoolsv.exe'

  filter_trusted:
    - Sourceprocessname: 'C:\Windows\System32\csrss.exe'
    - SourceImage|endswith:
        - '\MsMpEng.exe'
        - '\CcmExec.exe'
    - Sourceusername: 'NT AUTHORITY\SYSTEM'
      Targetprocessname: 'C:\Windows\System32\svchost.exe'

  condition: (selection_load_library or selection_unbacked_start)
             and selection_critical_targets
             and not filter_trusted

falsepositives:
  - Legitimate system DLL loading by OS or AV components
  - Admin tools performing live memory injection for debugging

level: critical
