title: Physical Medium Exfiltration (ATT&CK T1052)
id: 5a995a72-06d1-444b-bc1b-205c571f34bc
status: stable
description: >
  Detects targeted data exfiltration to physical media (USB/removable disks) 
  by monitoring non-interactive copy, move, or archive commands. Focuses on 
  stealthy command-line flags, suspicious parent processes, and excludes 
  legitimate Windows Explorer and admin operations.
author: hota05
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1052/
tags:
  - attack.exfiltration
  - attack.t1052
  - attack.collection
  - attack.host

logsource:
  product: windows
  category: process_creation

detection:
  selection_tools:
    Image|endswith:
      - '\robocopy.exe'
      - '\xcopy.exe'
      - '\powershell.exe'
      - '\7z.exe'
      - '\rar.exe'
      - '\bitsadmin.exe'

  selection_target:
    CommandLine|contains:
      - ' D:\'
      - ' E:\'
      - ' F:\'
      - ' G:\'
      - ' H:\'
      - '\Device\HarddiskVolume'
      - '\\*\root\'

  selection_flags:
    CommandLine|contains:
      - ' /S /E /H /K /R:0 /W:0'
      - ' -Recurse'
      - ' -Hidden'
      - ' -ExecutionPolicy Bypass'
      - ' a -p'

  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\sqlservr.exe'
      - '\wscript.exe'

  filter_legit:
    - ParentImage|endswith: '\explorer.exe'
    - Image|contains: '\Program Files\'
    - username: 'NT AUTHORITY\SYSTEM'
    - CommandLine|contains: 'Windows\Logs'

  condition: selection_tools and selection_target and (selection_flags or selection_parent) and not filter_legit

falsepositives:
  - Legitimate backup, deployment, or IT automation targeting removable drives
  - Admin copy tasks via PowerShell or Robocopy
  - Trusted scripts moving logs or temp data to removable media

level: critical
