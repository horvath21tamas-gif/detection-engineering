title: Professional Content Impersonation and Infrastructure Mirroring
id: 6b221866-e8bf-45c9-90fb-a4a4c0f3b8ca
status: stable
description: |
    Detects tools and CLI patterns used to clone or impersonate legitimate web content. 
    Focuses on recursive mirroring of internal portals and the use of phishing 
    frameworks, filtering out legitimate development and browser-based activity.
author: hota05
date: 2026-01-29
references:
    - https://attack.mitre.org/techniques/T1659/
tags:
    - attack.resource_development
    - attack.t1659
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith:
            - '\wget.exe'
            - '\curl.exe'
            - '\httrack.exe'
            - '\python.exe'
            - '\node.exe'

    selection_mirror_patterns:
        CommandLine|contains:
            - ' --mirror '        
            - ' --recursive '       
            - ' --page-requisites ' 
            - ' --clobber '
            - 'setoolkit'           
            - 'clonesite'           
            - 'evilginx'            

    selection_sensitive_targets:
        CommandLine|contains:
            - 'login'
            - 'auth'
            - 'sso'
            - 'portal'
            - 'owa'                 
            - 'adfs'

    filter_legit_dev:
        UserName|contains:
            - 'svc_webdev'
            - 'admin_backup'
        Image|contains:
            - '\AppData\Local\Programs\Microsoft VS Code\'
            - '\Git\'
            - '\npm\'

    filter_browsers:
        ParentImage|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'

    condition: selection_tools and selection_mirror_patterns and selection_sensitive_targets and not (filter_legit_dev or filter_browsers)
falsepositives:
    - Web developers migrating internal sites using CLI tools.
    - Security teams conducting authorized phishing simulations.
    - Automated documentation generators (e.g., Doxygen, Sphinx) if misconfigured.
level: high
