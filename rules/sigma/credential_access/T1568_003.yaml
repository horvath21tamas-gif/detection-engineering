title: DNS Calculation & Extraction (T1568.003)
id: 7d1417a3-bfbb-461b-ac5f-570207c19f47
status: stable
description: |
  Detects C2 infrastructure address calculation via DNS by monitoring programmatic 
  retrieval of TXT/SRV records followed by byte-level manipulation or type conversion 
  in script interpreters. Filters out legitimate DNS-based automation, license checks, 
  and domain verification processes.
author: hota05 
date: 2026-02-11
tags:
  - attack.command_and_control
  - attack.t1568.003
logsource:
  category: process_creation
  product: windows

detection:
  selection_dns_query:
    CommandLine|contains:
      - ' -querytype TXT'
      - ' -q TXT'
      - 'Resolve-DnsName'
      - ' -Type TXT'
      - ' -Type SRV'
      - ' -querytype SRV'

  selection_calculation_logic:
    CommandLine|contains:
      - '[Convert]::'
      - ' -bxor'
      - '.Substring('
      - '.Split('
      - ' [int]'
      - ' [byte]'
      - '.ToCharArray('

  selection_procs:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
      - '\mshta.exe'

  filter_legit_infra:
    - CommandLine|contains:
        - '_vlmcs._tcp'                  
        - 'chocolatey'                   
        - 'domain-verification'           
        - 'letsencrypt'                  
        - 'acme-challenge'               
    - username: 'NT AUTHORITY\SYSTEM'    
    - ParentImage|endswith:
        - '\services.exe'
        - '\explorer.exe'

  condition: selection_dns_query and selection_calculation_logic and selection_procs and not filter_legit_infra

fields:
  - Time
  - SourceImage
  - ParentImage
  - CommandLine
  - ProcessId
  - SourceUsername
  - IntegrityLevel

falsepositives:
  - DNS queries for software licensing (KMS, VLANS)
  - Chocolatey or other package manager DNS lookups
  - Domain verification or ACME/Let's Encrypt automation
  - Standard system services performing legitimate DNS queries

level: critical
