title: Webshell Upload or Interaction Detection (T1505.003)
id: 0829dfb0-a84b-484f-a797-a85eaaa513d7
status: stable
description: |
    Detects potential webshell activity by identifying suspicious script uploads
    to web-accessible directories and subsequent attacker-style interactions
    using command-execution style parameters. Focuses on anomalous paths, HTTP
    methods, query parameters, and user agents, while minimizing false positives
    from legitimate CMS or API functionality.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1505/003/
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.execution
    - attack.t1059
    - attack.webshell

logsource:
    product: generic
    category: webserver

detection:

  suspicious_upload_path:
    cs-uri-stem|contains:
      - '/uploads/'
      - '/upload/'
      - '/files/'
      - '/images/'
      - '/tmp/'
      - '/data/'
      - '/public/'

  script_file_extension:
    cs-uri-stem|endswith:
      - '.php'
      - '.phtml'
      - '.php5'
      - '.asp'
      - '.aspx'
      - '.jsp'
      - '.ashx'
      - '.cgi'
      - '.pl'

  upload_method:
    cs-method:
      - POST
      - PUT
      - PATCH

  webshell_parameters:
    cs-uri-query|contains:
      - 'cmd='
      - 'exec='
      - 'system='
      - 'powershell='
      - 'whoami'
      - 'net user'
      - 'id'
      - 'uname'
      - 'curl '
      - 'wget '
      - 'base64'
      - 'eval('
      - 'shell='

  successful_response:
    sc-status:
      - 200
      - 201
      - 202

  suspicious_user_agent:
    cs-user-agent|contains:
      - 'curl'
      - 'wget'
      - 'python'
      - 'powershell'
      - 'httpclient'
      - 'libwww'
      - 'java'
      - 'perl'

  filter_legit_cms:
    cs-uri-stem|contains:
      - '/wp-admin/'
      - '/wp-json/'
      - '/administrator/'
      - '/api/'
      - '/rest/'
      - '/media/'
      - '/uploads/plugins/'
      - '/uploads/themes/'

  condition: >
    (upload_method
      and suspicious_upload_path
      and script_file_extension)
    or (script_file_extension
      and webshell_parameters
      and successful_response
      and suspicious_user_agent)
    and not filter_legit_cms

falsepositives:
  - Legitimate file uploads in public directories
  - Developer debugging or testing on non-production servers
  - Approved penetration tests or red-team exercises
  - Automated CMS or plugin update scripts

level: high
