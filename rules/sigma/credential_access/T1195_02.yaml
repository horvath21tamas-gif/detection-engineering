title: High-Fidelity Compromised Binary Activity (Post-Update)
id: title: High-Fidelity Compromised Binary Activity (Post-Update)
id: 1b453e13-f8a4-442d-bdd6-350cbd3c0fab
status: stable
description: |
    Detects suspicious child processes spawned by trusted business applications that 
    have been compromised at the binary level. It focuses on the transition from 
    legitimate app execution to unauthorized discovery or script execution.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1195/002/
tags:
    - attack.initial_access
    - attack.t1195.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_trusted_parents:
        ParentImage|endswith:
            - '\3CXDesktopApp.exe'
            - '\SolarWinds.BusinessLayerHost.exe'
            - '\sqlservr.exe'
            - '\vboxmsi.exe'
            - '\anydesk.exe'
            - '\teamviewer.exe'
            - '\slack.exe'
            - '\zoom.exe'

    selection_suspicious_children:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\whoami.exe'
            - '\net.exe'
            - '\ipconfig.exe'
            - '\nltest.exe'
            - '\nslookup.exe'

    selection_behavior_patterns:
        CommandLine|contains:
            - ' -enc '
            - ' -w hidden '
            - 'Invoke-WebRequest'
            - 'DownloadString'
            - 'http'
            - '/domain'

    filter_legit_installation:
        - Image|contains: '\Program Files\'
        - CommandLine|contains: 'setup'
        - CommandLine|contains: 'install'

    condition: selection_trusted_parents and (selection_suspicious_children or selection_behavior_patterns) and not filter_legit_installation
level: critical
