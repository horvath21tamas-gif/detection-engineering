title: Kerberos Attack Detection
id: 2c059c8c-87e0-4419-b93d-d98092a051c7
status: stable
description: |
    Detects advanced Kerberos credential attacks including ticket 
    forgery, AS-REP roasting, Kerberoasting, and ticket injection.
    
    Features:
      - Encryption downgrade (RC4/0x17) detection
      - Offensive tool flags (Rubeus, Mimikatz, Impacket, PowerView)
      - Ticket type-specific parameters (Golden, Silver, AS-REP)
      - Parent process and temp execution context gating
      - Enterprise FP filtering (LSASS, SYSTEM, monitoring tools)

author: hota05 
date: 2026-02-12
tags:
    - attack.credential_access
    - attack.t1558
    - attack.t1558.001
    - attack.t1558.002
    - attack.t1558.003
    - attack.t1558.004

logsource:
    category: process_creation
    product: windows

detection:
    selection_offensive_tools:
        CommandLine|contains:
            - 'kerberoast'
            - 'asreproast'
            - 'asreq'
            - 'golden'
            - 'silver'
            - 'ptt'
            - 'tgtdelegate'
            - 'ms-mcs-admpwd'
        Image|endswith:
            - '\rubeus.exe'
            - '\mimikatz.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\klist.exe'

    selection_encryption_params:
        CommandLine|contains:
            - ' /rc4'
            - ' 0x17'
            - ' /aes128:'
            - ' /aes256:'
            - ' /ticket:'
            - ' /service:'
            - ' /outfile:'
            - ' /format:hashcat'
            - ' /format:john'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wsmprovhost.exe'
            - '\httpd.exe'
            - '\php-cgi.exe'
            - '\psexesvc.exe'
        IntegrityLevel: 'Medium'

    selection_temp_execution:
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Windows\Temp\'

    filter_legit_system:
        username: 'NT AUTHORITY\SYSTEM'
        Image|endswith:
            - '\Windows\System32\lsass.exe'
            - '\Windows\System32\svchost.exe'
        ParentImage|endswith: '\services.exe'

    filter_monitoring_tools:
        Image|contains:
            - 'C:\Program Files\Microsoft Monitoring Agent\'
            - 'C:\Program Files\Azure\'
            - 'C:\Program Files\RSAT\'

    condition: 
        (selection_offensive_tools or selection_encryption_params)
        and (selection_suspicious_parent or selection_temp_execution)
        and not (filter_legit_system or filter_monitoring_tools)

level: critical
