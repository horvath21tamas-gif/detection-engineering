title: Ultra-Pro Stealthy Process Ghosting (T1055.014)
id: 33a16418-df72-4ef3-b0e6-de4a24176c42
status: stable
description: |
    Detects Process Ghosting by identifying process creation events where the 
    underlying file is in a 'delete-pending' state, evidenced by missing hashes 
    at execution time and originating from non-standard directories.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1055.014
logsource:
    product: windows
    category: process_creation
detection:
    selection_ghost_state:
        hash: '' 

    selection_suspicious_paths:
        Image|contains:
            - '\Users\'
            - '\ProgramData\'
            - '\Windows\Temp\'
            - '\AppData\Local\Temp\'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\rundll32.exe'
            - '\mshta.exe'

    filter_trusted_installers:
        - ParentImage|contains:
            - '\Google\Update\'
            - '\Microsoft\EdgeUpdate\'
            - '\Windows\servicing\TrustedInstaller.exe'
        - Image|contains:
            - '\Program Files\'
            - '\Windows\System32\'
        - Company: 'Microsoft Corporation' 

    condition: selection_ghost_state and selection_suspicious_paths and selection_suspicious_parent and not filter_trusted_installers
level: critical
