title: Enterprise Knowledge Base Mass Scraping / Mirroring Detection (T1213.003)
id: cec11b65-ca04-4340-92d6-43e4534024f5
status: stable
description: |
    Detects high-volume internal knowledge base scraping and mirroring activity 
    (Confluence, Wiki, Stack Overflow for Teams, Git-based documentation) 
    using recursive download flags, REST API content expansion, headless scripting engines,
    and mass archival patterns. 
    
    Focuses on non-browser engines performing systematic collection indicative 
    of staged intellectual property exfiltration.

author: hota05
date: 2026-02-20
references:
    - https://attack.mitre.org/techniques/T1213/003/
tags:
    - attack.collection
    - attack.exfiltration
    - attack.t1213.003
    - attack.t1567
logsource:
    category: process_creation
    product: windows

detection:
    selection_kb_targets:
        CommandLine|contains:
            - '/wiki/display/'
            - '/wiki/spaces/'
            - '/wiki/pages/viewpage'
            - '/rest/api/content'
            - '/rest/api/content?expand=body'
            - '/exportword'
            - '/exportpdf'
            - 'stackoverflow.com/c/'
            - '.wiki.git'
            - '/_git/'
            - '/docs/'
            - '/knowledgebase/'
            - '/kb/'

    selection_mirroring_args:
        CommandLine|contains:
            - ' --mirror'
            - ' --recursive'
            - ' -r '
            - ' --level '
            - ' --convert-links'
            - ' --page-requisites'
            - ' --no-parent'
            - ' --accept pdf'
            - ' --accept doc'
            - ' --accept zip'
            - ' clone '
            - ' archive '
            - ' --depth '
            - ' --bare'

    selection_engines:
        Image|endswith:
            - '\wget.exe'
            - '\curl.exe'
            - '\httrack.exe'
            - '\python.exe'
            - '\git.exe'
            - '\powershell.exe'
            - '\node.exe'
            - '\pwsh.exe'

    selection_scripted_context:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\services.exe'
            - '\w3wp.exe'
        IntegrityLevel:
            - 'Medium'
            - 'High'

    selection_bulk_output:
        CommandLine|contains:
            - '.zip'
            - '.7z'
            - '.tar'
            - '.gz'
            - ' -o '
            - ' --output '
            - ' --output-document='

    filter_trusted_paths:
        Image|contains:
            - 'C:\Program Files\Elastic\'
            - 'C:\Program Files\Splunk\'
            - 'C:\Program Files\Backup'
            - 'C:\Program Files\Atlassian\'

    filter_system_accounts:
        User|startswith:
            - 'NT AUTHORITY\'
            - 'DOMAIN\svc_'
            - 'DOMAIN\backup_'

    filter_benign_flags:
        CommandLine|contains:
            - ' --version'
            - ' healthcheck'
            - ' status'
            - ' --help'

    condition: 
        selection_kb_targets
        and selection_engines
        and (selection_mirroring_args or selection_scripted_context or selection_bulk_output)
        and not (filter_trusted_paths or filter_system_accounts or filter_benign_flags)

fields:
    - User
    - Image
    - ParentImage
    - CommandLine
    - IntegrityLevel
    - CurrentDirectory
    - Hashes

falsepositives:
    - Approved documentation backup jobs
    - DevOps Git documentation mirroring
    - Migration or export tasks
    - Security scanning tools indexing internal wiki
    - Disaster recovery validation scripts

level: critical
