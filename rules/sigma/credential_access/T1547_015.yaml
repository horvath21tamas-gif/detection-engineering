title: High-Fidelity COM Hijacking Persistence (T1547.015)
id: 901145fa-8f41-4592-a4be-39b777f8a46e
status: stable
description: |
    Detects the creation of COM object handlers in HKCU that point to suspicious, 
    user-writable locations. Attackers hijack CLSIDs to achieve stealthy persistence 
    within legitimate system processes like explorer.exe.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1547/015/
tags:
    - attack.persistence
    - attack.t1547.015
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains: 'Classes\CLSID\'
        TargetObject|endswith: '\InprocServer32\(Default)'

    selection_suspicious_paths:
        Details|contains:
            - ':\Users\'
            - ':\ProgramData\'
            - ':\Windows\Temp\'
            - ':\Temp\'
            - 'AppData\Local\Temp\'
            - 'C:\PerfLogs\'

    selection_suspicious_content:
        Details|endswith:
            - '.tmp'
            - '.dat'
            - '.js'
            - '.vbs'
        Details|contains:
            - 'scrobj.dll' 
            - 'script:'    

    filter_trusted_apps:
        Image|endswith:
            - '\Microsoft\OneDrive\OneDrive.exe'
            - '\Microsoft\Teams\current\Teams.exe'
            - '\System32\msiexec.exe'
            - '\trustedinstaller.exe'
            - '\AppData\Local\Microsoft\Edge\Application\msedge.exe'

    filter_trusted_locations:
        Details|contains:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
            - 'C:\Windows\System32\'

    condition: selection_registry and (selection_suspicious_paths or selection_suspicious_content) and not (filter_trusted_apps or filter_trusted_locations)
level: high
