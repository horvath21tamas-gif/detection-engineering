title: High-Fidelity Cloud Account Acquisition and Bootstrap - T1583.008
id: 6f13382a-0d11-45cf-aab7-4de338c4c4ec
status: stable
description: >
  Detects the acquisition and initial configuration of cloud accounts. 
  Targets account-level bootstrapping (credential setup, IAM user creation) 
  and automated identity harvesting from non-standard processes, 
  while filtering out authorized DevOps pipelines.
author: hota05
date: 2026/01/27
references:
  - https://attack.mitre.org/techniques/T1583/008/
tags:
  - attack.resource_development
  - attack.t1583.008
logsource:
  category: process_creation
  product: windows
detection:
  selection_cloud_bootstrap:
    - Image|endswith:
        - '\aws.exe'
        - '\az.exe'
        - '\gcloud.exe'
    - CommandLine|contains:
        - ' configure '             
        - ' iam create-user'        
        - ' login --service-principal' 
        - ' account set '           
        - ' organizations create'   

  selection_sdk_auth:
    - Image|endswith:
        - '\python.exe'
        - '\pwsh.exe'
    - CommandLine|contains|all:
        - 'boto3'                   
        - '.aws/credentials'        
    - CommandLine|contains:
        - 'DefaultAzureCredential'
        - 'GoogleCredentials'

  filter_authorized_automation:
    User|contains:
      - 'svc_jenkins'
      - 'svc_terraform'
      - 'gitlab_runner'
      - 'adm_cloud_deploy'
    Image|contains:
      - '\Program Files\Terraform\'
      - '\actions-runner\'

  filter_dev_context:
    ParentImage|endswith:
      - '\code.exe'
      - '\devenv.exe'
      - '\idea64.exe'

  filter_interactive:
    ParentImage|endswith: '\explorer.exe'
    condition: not selection_cloud_bootstrap

  condition: (selection_cloud_bootstrap or selection_sdk_auth) and not filter_authorized_automation and not filter_dev_context and not filter_interactive
falsepositives:
  - Cloud engineers configuring their local environment for the first time.
  - Development teams debugging cloud integration locally in authorized IDEs.
  - Legitimate automated billing or auditing scripts run outside of CI/CD.
level: high
