title: Suspicious Encoded PowerShell Command Execution
id: 70c58b24-653f-487d-a8ee-c4237439dce2
status: stable
description: >
  Detects suspicious execution of PowerShell using encoded commands
  combined with execution bypass or obfuscation flags. This technique
  is commonly used by attackers to evade detection and execute
  malicious payloads in memory.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/

logsource:
  product: windows
  category: process_creation

detection:

  powershell_execution:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  encoded_command:
    CommandLine|contains:
      - '-enc'
      - '-encodedcommand'

  suspicious_flags:
    CommandLine|contains:
      - '-nop'
      - '-w hidden'
      - '-windowstyle hidden'
      - '-executionpolicy bypass'
      - 'FromBase64String'
      - 'IEX'
      - 'Invoke-Expression'

  suspicious_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'

  filter_service_accounts:
    User|contains:
      - 'NT AUTHORITY\SYSTEM'
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'

  filter_legit_tooling:
    ParentImage|contains:
      - '\Windows\CCM\'
      - '\Microsoft Configuration Manager\'
      - '\SCCM\'
      - '\Tanium\'
      - '\PDQ\'
      - '\Ivanti\'
      - '\ManageEngine\'
      - '\Intune\'
      - '\Elastic\'
      - '\Splunk\'

  condition: >
    powershell_execution
    and encoded_command
    and suspicious_flags
    and suspicious_parent
    and not (
      filter_service_accounts
      or filter_legit_tooling
    )

falsepositives:
  - Rare advanced administrative automation
  - Approved red team activity

level: high

tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059.001
  - attack.t1027
