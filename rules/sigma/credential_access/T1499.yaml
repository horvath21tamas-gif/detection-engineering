title: Ultra-Pro High-Fidelity Endpoint DoS (T1499)
id: 616f38e3-baf2-42b1-8473-6722859deb27
status: stable
description: |
    Detects targeted endpoint denial of service by monitoring for forced termination 
    of critical system processes (LSASS, CSRSS) and resource exhaustion loops 
    originating from untrusted process lineages.
author: hota05
date: 2026-02-09
tags:
    - attack.impact
    - attack.t1499
    - attack.t1499.003
    - attack.t1499.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_critical_targets:
        CommandLine|contains:
            - ' /f /im lsass.exe'     
            - ' /f /im csrss.exe'     
            - ' /f /im wininit.exe'   
            - ' /f /im smss.exe'      
            - ' /f /im services.exe'  

    selection_resource_burn:
        CommandLine|contains:
            - 'while($true)'          
            - '::MemoryStream'        
            - 'foreach($i in 1..1000000)'
            - ' -Recursive'           

    selection_context:
        - ParentImage|endswith:
            - '\winword.exe'         
            - '\excel.exe'
            - '\httpd.exe'            
            - '\rundll32.exe'         
            - '\outlook.exe'
        - Image|contains:
            - '\Temp\'
            - '\Users\Public\'
            - '\AppData\Local\Temp\'

    filter_legit_service_ops:
        - User: 'NT AUTHORITY\SYSTEM' 
        - ParentImage|endswith:
            - '\CcmExec.exe'          
            - '\msiexec.exe'          
            - '\TiWorker.exe'         
        - CommandLine|contains:
            - 'HealthCheck'            
            - 'Diagnostic'

    condition: (selection_critical_targets or selection_resource_burn) and selection_context and not filter_legit_service_ops
level: critical
