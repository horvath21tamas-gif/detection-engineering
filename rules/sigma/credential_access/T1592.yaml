title: High-Fidelity Host Information Reconnaissance Activity
id: 88de8572-8fd9-417b-ae56-7ae35429232f
status: stable
description: >
  Detects high-confidence host information reconnaissance activity
  by identifying multiple system discovery commands executed in a
  short timeframe from a user context. Tuned to minimize false
  positives by excluding SYSTEM activity, enterprise tooling,
  and single benign command executions.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1592/

logsource:
  product: windows
  category: process_creation

detection:

  selection_shells:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wmic.exe'

  selection_host_info:
    CommandLine|contains:
      - 'systeminfo'
      - 'hostname'
      - 'whoami'
      - 'wmic os'
      - 'wmic computersystem'
      - 'wmic bios'
      - 'Get-ComputerInfo'
      - 'Get-CimInstance'
      - 'Get-WmiObject'
      - 'ver'
      - 'echo %PROCESSOR_ARCHITECTURE%'

  selection_chaining:
    CommandLine|contains:
      - '&'
      - '&&'
      - ';'
      - '|'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\wscript.exe'
      - '\cscript.exe'

  filter_system_accounts:
    User|contains:
      - 'SYSTEM'
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'

  filter_enterprise_tools:
    Image|contains:
      - '\Windows\CCM\'
      - '\SCCM\'
      - '\PDQ\'
      - '\Ivanti\'
      - '\ManageEngine\'
      - '\TanService\'
      - '\CarbonBlack\'
      - '\CrowdStrike\'
      - '\Defender\'


  condition: >
    selection_shells
    and selection_host_info
    and selection_chaining
    and selection_suspicious_parent
    and not (
      filter_system_accounts
      or filter_enterprise_tools
    )

fields:
  - User
  - Image
  - ParentImage
  - CommandLine
  - Hostname

falsepositives:
  - Rare advanced troubleshooting directly from user shell
  - Approved red team or DFIR activity

level: high

tags:
  - attack.reconnaissance
  - attack.t1592
