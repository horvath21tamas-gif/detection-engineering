title: Ultra-Pro High-Fidelity Hidden File Attribute Manipulation (T1564.001)
id: d5202884-3885-4b9e-b4d0-a9808c85d7e7
status: stable
description: |
    Detects targeted file and directory hiding by identifying the combined use of 
    System (+s) and Hidden (+h) attributes initiated by untrusted parent processes 
    or targeting sensitive user-writable directories.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1564.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_tool:
        Image|endswith: '\attrib.exe'

    selection_flags:
        CommandLine|contains|all:
            - ' +h'
            - ' +s'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\mshta.exe'
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'

    selection_suspicious_path:
        CommandLine|contains:
            - '\Users\Public\'
            - '\Windows\Temp\'
            - '\AppData\Roaming\'
            - '\AppData\Local\Temp\'

    filter_trusted_system_activity:
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|contains:
            - '\Windows\servicing\TrustedInstaller.exe'
            - '\CcmExec.exe'
        - CommandLine|contains:
            - 'desktop.ini' 

    condition: selection_tool and selection_flags and (selection_suspicious_parent or selection_suspicious_path) and not filter_trusted_system_activity
level: high
