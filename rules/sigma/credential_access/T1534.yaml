title: Internal Spearphishing Detection (T1534)
id: 81a5272e-ca85-4fbd-887b-6f0deb646e02
status: stable
description: |
    Detects advanced internal spearphishing attempts by monitoring anomalous 
    programmatic access to the Outlook MAPI interface, suspicious child processes, 
    dangerous command-line flags, and abnormal file attachments. 
    Focuses on PowerShell, cmd, scripting engines, and non-browser parent anomalies.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1534/
tags:
    - attack.lateral_movement
    - attack.t1534
    - attack.execution
    - attack.internal_phishing

logsource:
    category: process_creation
    product: windows

detection:

    selection_outlook_children:
        ParentImage|endswith:
            - '\outlook.exe'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\rundll32.exe'
            - '\mshta.exe'

    selection_suspicious_outlook_args:
        CommandLine|contains:
            - ' /a '               
            - ' /c ipm.note'       
            - ' /m '              
            - 'outlook.application' 

    selection_dangerous_attachments:
        CommandLine|contains:
            - '.iso'
            - '.vhd'
            - '.img'
            - '.htm'
            - '.html'
            - '.lnk'
            - '.zip'
            - '\\'                

    selection_non_outlook_sources:
        ParentImage|endswith:
            - '\browser.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\httpd.exe'
            - '\php-cgi.exe'
            - '\explorer.exe /embedding'

    filter_legit_corporate_usage:
        CommandLine|contains:
            - 'C:\Program Files\Microsoft Office'
            - 'Adobe\Acrobat'
            - 'Salesforce'
            - 'Zoom'
            - 'Teams'
        User|startswith: 'NT AUTHORITY\'
        Image|endswith:
            - '\conhost.exe'
            - '\explorer.exe'

    condition: 
        (selection_outlook_children 
            and (selection_suspicious_outlook_args or selection_dangerous_attachments))
        or selection_non_outlook_sources
        and not filter_legit_corporate_usage

falsepositives:
    - IT admins using Outlook automation scripts
    - Document management or archiving tools triggering automation
    - Power users sending large batches of attachments via scripted tools

level: critical
