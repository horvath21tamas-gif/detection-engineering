title: Ultra-Pro Make and Impersonate Token (T1134.003)
id: 9d43cd8b-226e-4d46-b244-67b57d9d44aa
status: stable
description: |
    Detects unauthorized creation of security tokens using explicit credentials. 
    Monitors for suspicious command line arguments from offensive tools and 
    correlates with Logon Type 9 (NewCredentials) anomalies from untrusted parents.
author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.lateral_movement
    - attack.t1134.003
logsource:
    product: windows
    category: process_creation
detection:
    selection_offensive_tools:
        CommandLine|contains:
            - 'make_token'          
            - 'sekurlsa::pth'      
            - 'kerberos::pth'
            - 'Invoke-Mimikatz'
            - 'New-PassThroughToken'
            - '/netonly'           

    selection_suspicious_origin:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'

    filter_trusted_management:
        - ParentImage|contains:
            - '\Windows\System32\services.exe'
            - '\Windows\System32\msiexec.exe'
            - '\AzureAD\'
        - CommandLine|contains:
            - 'Visual Studio'
            - 'IntelliJ'
            - 'git-remote-https'
        - username: 'NT AUTHORITY\SYSTEM'

    selection_logon_type_9:
        LogonType: 9
        AuthenticationPackage: 'Negotiate'

    condition: (selection_offensive_tools or selection_suspicious_origin) and not filter_trusted_management
level: critical
