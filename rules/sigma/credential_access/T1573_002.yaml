title: Asymmetric Encryption C2 (T1573.002)
id: b55dc284-ebd0-4215-a97f-713dd479c2be
status: stable
description: |
  Detects suspicious asymmetric encryption usage (RSA/ECC) that may indicate 
  C2 or data exfiltration activity. Focuses on programmatic trust chain overrides 
  (ServerCertificateValidationCallback) and raw public key imports (FromXmlString, 
  ImportSubjectPublicKeyInfo) from untrusted or non-standard processes.
author: hota05 
date: 2026-02-11
tags:
  - attack.command_and_control
  - attack.t1573.002
logsource:
  category: process_creation
  product: windows

detection:
  selection_trust_override:
    CommandLine|contains:
      - 'ServerCertificateValidationCallback'
      - 'return $true'
      - '[Net.ServicePointManager]::Expect100Continue'
      - '[Net.ServicePointManager]::SecurityProtocol'
      - 'SecurityProtocolType]::Tls12'

  selection_asym_import:
    CommandLine|contains:
      - 'RSACryptoServiceProvider'
      - 'FromXmlString'
      - 'ImportSubjectPublicKeyInfo'
      - 'X509Certificate2'

  selection_procs:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'

  filter_legit_infra:
    - CommandLine|contains:
        - 'C:\Program Files\'
        - 'Microsoft\Azure'
        - 'HealthCheck'
    - User: 'NT AUTHORITY\SYSTEM'
    - ParentImage|endswith:
        - '\services.exe'
        - '\explorer.exe'

  condition: (selection_trust_override or selection_asym_import) and selection_procs and not filter_legit_infra

fields:
  - Time
  - SourceImage
  - SourceUsername
  - ParentImage
  - CommandLine
  - ProcessId
  - ThreadId

falsepositives:
  - Automation scripts performing Azure/AWS certificate management
  - Legitimate key provisioning pipelines
  - IT or DevOps health check scripts using custom TLS or certificates

level: critical
