title: Ultra-Pro High-Fidelity System Network Connections Discovery (T1049)
id: fe347f5b-3329-427f-8ff3-49bcfb3cc89d
status: stable
description: |
    Detects targeted discovery of active network connections and established sessions. 
    Focuses on non-standard process lineages (Office, Browsers, Web Servers) and 
    detects specific command-line switch combinations used by attackers to map 
    the network landscape.
author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1049
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\netstat.exe'
            - '\net.exe'
            - '\net1.exe'
            - '\nbtstat.exe'
            - '\arp.exe'
        - CommandLine|contains:
            - 'Get-NetTCPConnection'
            - 'Get-NetUDPEndpoint'
            - 'net session'         
            - 'net use'              
            - 'net view'           

    selection_patterns:
        CommandLine|contains:
            - ' -ano'                
            - ' -na '
            - ' -p tcp'
            - ' -s '                 

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\httpd.exe'           
            - '\wsmprovhost.exe'    
        IntegrityLevel: 'Medium'    

    selection_automation:
        CommandLine|contains:
            - 'findstr'
            - 'select-string'
            - ' > '                  
            - 'ConvertTo-Json'

    filter_legit_noise:
        - username: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\svchost.exe'
            - '\CcmExec.exe'         
            - '\msiexec.exe'
        - CommandLine|contains:
            - 'Program Files'        
            - 'Splunk'               
            - 'healthcheck'

    condition: selection_tools and (selection_patterns or selection_suspicious_lineage or selection_automation) and not filter_legit_noise
level: high
