title:  Cloud Snapshot Exfiltration (T1578.002)
id: 852bd5e8-3b36-4baa-b4f3-d0cf2c50ff1a
status: stable
description: |
    Detects unauthorized sharing, cross-account access, or public exposure of cloud compute snapshots.
    Focuses on high-risk permission changes rather than simple snapshot creation, and filters out 
    trusted backup and replication processes.
author: hota05 
date: 2026-02-11
tags:
    - attack.exfiltration
    - attack.t1578.002
    - attack.t1578
logsource:
    product: cloud
    service: Azure Activity

detection:
  selection_exfil_ops:
    operation_name|contains:
      - 'ModifySnapshotAttribute'
      - 'SharedSnapshot'
      - 'SetSnapshotPermissions'
      - 'CopySnapshot'
      - 'ShareSnapshot'
      - 'UpdateSnapshotAccess'

  selection_risky_params:
    request_parameters|contains:
      - 'all'
      - 'Add.UserId'
      - 'grantee'
      - 'public'
      - 'external-account'
      - 'everyone'

  selection_context:
    mfa_authenticated: 'false'
    user_agent|contains:
      - 'kali'
      - 'python-requests'
      - 'boto3'
      - 'curl'
      - 'postman'
      - 'Terraform'
      - 'Pulumi'

  filter_backup_apps:
    user_name|startswith:
      - 'svc-veeam'
      - 'svc-commvault'
      - 'backup-agent'
      - 'svc-packer'
      - 'svc-azure-backup'
    source_ip: '10.0.0.0/8'

  condition: selection_exfil_ops and (selection_risky_params or selection_context) and not filter_backup_apps

fields:
  - Time
  - user_name
  - operation_name
  - request_parameters
  - user_agent
  - mfa_authenticated
  - resource_id
  - subscription_id
  - tenant_id
  - source_ip

falsepositives:
  - Authorized backup/replication pipelines
  - Snapshot sharing within internal account structures
  - IaC provisioning of snapshots by trusted CI/CD pipelines

level: critical
