title: Ultra-Pro High-Fidelity Cloud Account Exfil (T1537)
id: 70603ca8-ab77-4d2f-b938-cf5083336141
status: stable
description: |
    Detects data exfiltration via native cloud CLI tools by monitoring for 
    cross-account synchronization, manual credential injection in CLI, 
    and transfers initiated from non-administrative process lineages.
author: hota05
date: 2026-02-09
tags:
    - attack.exfiltration
    - attack.t1537
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\aws.exe'            
            - '\az.exe'             
            - '\gsutil.exe'          
            - '\gcloud.exe'
            - '\snowball.exe'       

    selection_logic:
        CommandLine|contains:
            - ' s3 sync '            
            - ' storage copy '       
            - ' --access-key '       
            - ' --profile '          
            - ' --request-payer '    
            - ' --no-sign-request '  
            - ' make-public '        

    selection_context:
        - Image|contains:
            - '\Users\'              
            - '\Temp\'
        - ParentImage|endswith:
            - '\winword.exe'         
            - '\excel.exe'
            - '\httpd.exe'          
            - '\php-cgi.exe'
            - '\rundll32.exe'        

    filter_legit:
        - ParentImage|endswith:
            - '\msiexec.exe'         
            - '\services.exe'
        - CommandLine|contains:
            - ' terraform '          
            - ' ansible '
            - ' Jenkins '           
        - User: 'NT AUTHORITY\SYSTEM'

    condition: selection_tools and (selection_logic or selection_context) and not filter_legit
level: critical
