title: System Image Patching (T1600.001)
id: 56b6f260-f945-4d97-b529-60b6957241a0
status: stable
description: |
    Detects attempts to compromise system image integrity by bypassing Driver Signature Enforcement (DSE), 
    modifying Boot Configuration Data (BCD), or patching critical system binaries (CI.dll, NTOSKRNL.exe, LSASRV.dll, Winload.efi). 
    Focuses on untrusted processes and excludes standard system management tools.
author: hota05 
date: 2026-02-11
tags:
    - attack.defense_evasion
    - attack.t1600.001
logsource:
    category: process_creation
    product: windows

detection:
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains:
      - 'nointegritychecks'
      - 'testsigning'
      - 'disable-elam-drivers'
      - 'nx AlwaysOff'
      - 'bootstatuspolicy ignoreallfailures'

  selection_binary_tamper:
    CommandLine|contains:
      - 'ci.dll'
      - 'ntoskrnl.exe'
      - 'lsasrv.dll'
      - 'winload.efi'
      - 'winresume.efi'
    Image|contains:
      - '\Users\'
      - '\AppData\Local\Temp\'
      - '\Downloads\'
      - '\Desktop\'

  selection_tools:
    CommandLine|contains:
      - 'KDU.exe'
      - 'EfiGuard'
      - 'TDL.exe'
      - 'DSEFix'
      - 'BcdPatcher'

  filter_trusted_system:
    ParentImage|endswith:
      - '\msiexec.exe'
      - '\TrustedInstaller.exe'
      - '\TiWorker.exe'
      - '\explorer.exe'
    username: 'NT AUTHORITY\SYSTEM'

  filter_known_vendors:
    Image|contains:
      - '\Program Files\Dell\'
      - '\Program Files\HP\'
      - '\Program Files\Lenovo\'
      - '\Program Files (x86)\Lenovo\'

  condition: (selection_bcdedit or selection_binary_tamper or selection_tools) and not (filter_trusted_system or filter_known_vendors)

fields:
  - Time
  - User
  - Image
  - ParentImage
  - CommandLine

falsepositives:
  - IT administrators enabling test-signing or driver testing in controlled labs
  - OEM utilities for BIOS/UEFI updates (Dell, HP, Lenovo)
  - Enterprise imaging or deployment tools using standard system paths

level: critical
