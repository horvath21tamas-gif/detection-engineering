title: Ultra-Pro High-Fidelity Hidden User Account Creation (T1564.002)
id: 87077e22-8987-4a8b-b0e9-5c5f0eb38689
status: stable
description: |
    Detects the hiding of user accounts from the Windows logon screen by targeting 
    the 'SpecialAccounts\UserList' registry key. Filters out legitimate system 
    installers and focuses on suspicious parent processes and non-system users.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.persistence
    - attack.t1564.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_registry:
        CommandLine|contains:
            - 'Winlogon\SpecialAccounts\UserList'
            - 'Winlogon\UserList'

    selection_value:
        CommandLine|contains:
            - ' /d 0'
            - 'REG_DWORD'

    selection_suspicious_context:
        - ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powershell.exe'
            - '\cmd.exe'
            - '\mshta.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\bash.exe'
        - Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\AppData\'

    filter_trusted_system:
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|contains:
            - '\Windows\System32\svchost.exe'
            - '\Windows\servicing\TrustedInstaller.exe'
            - '\CcmExec.exe'
            - '\Program Files\Microsoft SQL Server\'

    condition: selection_registry and selection_value and (selection_suspicious_context and not filter_trusted_system)
level: critical
