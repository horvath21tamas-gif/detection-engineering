name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Frissítve v4-re

      - name: Set up Python
        uses: actions/setup-python@v5 # Frissítve v5-re
        with:
          python-version: '3.10'
          cache: 'pip' # Automatikusan gyorsítja a köv. futást

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml sigma-cli # A sigma helyett gyakran a sigma-cli kell

      - name: Run unit tests
        run: |
          python -m pytest tests/ --maxfail=5 --disable-warnings -q

      - name: Lint and validate Sigma rules
        run: |
          python tools/lint_rules.py
          python tools/validate_metadata.py

      - name: Update README.md
        if: github.event_name == 'push' # Csak push esetén frissítsen, PR-nál ne feltétlen
        run: |
          python tools/update_readme.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Auto-update README with rule statistics" || echo "No changes to commit"
          git push
