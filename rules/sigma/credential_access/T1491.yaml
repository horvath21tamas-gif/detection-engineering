title: Defacement (T1491)
id: 8dd28239-9532-472c-8bd2-8916ceb08cb7
status: stable
description: |
  Detects unauthorized website defacement by monitoring suspicious file 
  manipulations (move, copy, echo, Set-Content, replace) within web-root 
  directories originating from non-standard or potentially compromised 
  web service processes (e.g., w3wp.exe, httpd.exe).
author: hota05
date: 2026-02-09
tags:
  - attack.impact
  - attack.t1491
  - attack.t1491.001
  - attack.t1491.002
logsource:
  category: process_creation
  product: windows
detection:
  shell_tools:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\move.exe'
      - '\copy.exe'
      - '\xcopy.exe'
      - '\robocopy.exe'

  file_mod_commands:
    CommandLine|contains:
      - 'index.html'
      - 'index.php'
      - 'default.aspx'
      - 'main.js'
      - 'logo.'
      - 'move '
      - 'copy '
      - 'echo '
      - 'Set-Content'
      - 'replace'

  sensitive_web_paths:
    CommandLine|contains:
      - '\inetpub\wwwroot\'
      - '\var\www\'
      - '\htdocs\'
      - '\WordPress\'

  suspicious_context:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\httpd.exe'
      - '\php-cgi.exe'
      - '\nginx.exe'
      - '\rundll32.exe'
    Image|contains:
      - '\Temp\'

  legit_filters:
    - CommandLine|contains:
        - 'deploy'
        - 'Jenkins'
        - 'AzureDevOps'
        - 'site_update'
    - ParentImage|endswith:
        - '\msiexec.exe'
    - User: 'NT AUTHORITY\SYSTEM'

  condition: shell_tools and file_mod_commands and sensitive_web_paths 
             and suspicious_context and not legit_filters
level: critical
