title: Ultra-Pro High-Fidelity Virtual Instance Execution Abuse (T1564.006)
id: 17fc9311-30a0-4e23-8273-6a0a8247fa45
status: stable
description: |
    Detects suspicious execution of virtual instances (Docker, VirtualBox, VMware) 
    by identifying anti-forensic flags (--rm), privileged escalation attempts, 
    and untrusted parent processes like web servers or office apps.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1564.006
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        - Image|endswith:
            - '\docker.exe'
            - '\dockerd.exe'
            - '\VBoxManage.exe'
            - '\VBoxHeadless.exe'
            - '\vmrun.exe'
            - '\vmware-kvm.exe'

    selection_dangerous_params:
        CommandLine|contains:
            - '--rm'
            - '--privileged'
            - '--net=host'
            - '--entrypoint'
            - 'nogui'           
            - 'startvm'
            - ' -it '           

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\w3wp.exe'        
            - '\php-cgi.exe'
            - '\httpd.exe'     
            - '\nginx.exe'
            - '\mshta.exe'

    filter_trusted_dev_env:
        - ParentImage|contains:
            - '\Common7\IDE\devenv.exe' 
            - '\bin\code.exe'           
            - '\Program Files\Docker\'
        - CommandLine|contains:
            - 'docker-desktop'
            - 'docker-compose'
            - 'Minikube'

    condition: selection_tools and (selection_suspicious_parent or (selection_dangerous_params and not filter_trusted_dev_env))
level: high
