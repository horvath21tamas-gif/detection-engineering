title: Ultra-Pro High-Fidelity System Time Discovery (T1124)
id: f62aaee9-91e5-4315-9eaf-dda7a14dbeb8
status: stable
description: |
    Detects targeted system time or time zone discovery. Focuses on anomalous process 
    lineages (e.g., Office apps, Web servers) and specific automation patterns 
    used for sandbox evasion or geofencing checks.
author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1124
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\w32tm.exe'
            - '\tzutil.exe'
            - '\net.exe'
            - '\net1.exe'
        - CommandLine|contains:
            - 'Get-Date'
            - 'Get-TimeZone'
            - '[System.DateTime]::Now'

    selection_patterns:
        CommandLine|contains:
            - ' /query'              
            - ' /g'                  
            - 'time \\'              

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\winword.exe'        
            - '\excel.exe'
            - '\outlook.exe'
            - '\httpd.exe'           
            - '\wsmprovhost.exe'     
        IntegrityLevel: 'Medium'     

    selection_automation:
        CommandLine|contains:
            - 'findstr'
            - 'select-string'
            - ' > '                  
            - '$time ='             

    filter_legit_noise:
        - username: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\svchost.exe'
            - '\CcmExec.exe'         
            - '\msiexec.exe'
            - '\explorer.exe'        
        - CommandLine|contains:
            - 'Program Files'      
            - '\AppData\Local\Google\Chrome'

    condition: selection_tools and (selection_patterns or selection_suspicious_lineage or selection_automation) and not filter_legit_noise
level: high
