title: Local Session Hijacking (T1563.001)
id: 9f7216ee-053b-485f-9ede-e3b6c6fd194e
status: stable
description: |
  Detects advanced local session hijacking attempts where tscon.exe is used 
  to attach to existing user sessions. High-fidelity detection combines:
  - Suspicious command-line arguments targeting console or RDP sessions
  - SYSTEM-level execution context
  - Untrusted parent processes (shells, lateral movement tools, Office apps)
  Legitimate RDS/VDI management tools are explicitly filtered out.
author: hota05 
date: 2026-02-11
tags:
  - attack.lateral_movement
  - attack.t1563.001
logsource:
  product: windows
  category: process_creation

detection:
  selection_img:
    Image|endswith: '\tscon.exe'
    OriginalFileName: 'tscon.exe'

  selection_args:
    CommandLine|contains:
      - ' /dest:console'
      - 'dest:rdp-tcp#'
      - ' /password'

  selection_suspicious_context:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\psexesvc.exe'
      - '\wsmprovhost.exe'
      - '\winword.exe'
    IntegrityLevel: 'System'

  filter_legit_orchestration:
    ParentImage|endswith:
      - '\svchost.exe'
      - '\winlogon.exe'
    CommandLine|contains:
      - 'vmsvga'
      - 'Citrix'
      - 'C:\Program Files\'
    username: 'NT AUTHORITY\NETWORK SERVICE'

  condition: 
    selection_img and 
    (selection_args or selection_suspicious_context) and 
    not filter_legit_orchestration

fields:
  - Time
  - SourceImage
  - ParentImage
  - CommandLine
  - SourceUsername
  - IntegrityLevel

falsepositives:
  - Standard tscon.exe usage by RDS/VDI management scripts
  - Console switching executed by trusted SYSTEM services

level: critical
