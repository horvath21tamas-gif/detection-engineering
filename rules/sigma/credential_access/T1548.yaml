title: Privilege Escalation via Registry Hijacking (T1548)
id: e3d14373-a7af-4539-9f57-7b3cf7787b82
status: stable
description: |
    Detects UAC bypass and privilege escalation attempts by monitoring unauthorized 
    Registry modifications to shell open commands. Filters out trusted installers 
    and system-initiated changes to reduce false positives.
author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.t1548
logsource:
    product: windows
    category: registry_event
detection:
    selection_uac_registry_keys:
        TargetObject|contains:
            - 'Software\Classes\ms-settings\shell\open\command'
            - 'Software\Classes\mscfile\shell\open\command'
            - 'Software\Classes\exefile\shell\open\command'
            - 'Software\Classes\launcher.ext.isv\shell\open\command'

    selection_suspicious_payloads:
        Details|contains:
            - 'powershell'
            - 'cmd.exe'
            - 'pwsh'
            - 'rundll32.exe'
            - 'regsvr32.exe'

    selection_suspicious_parents:
        ParentImage|endswith:
            - '\fodhelper.exe'
            - '\computerdefaults.exe'
            - '\sdclt.exe'
            - '\eventvwr.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'

    filters_trusted_system:
        - Image|endswith:
            - '\Windows\servicing\TrustedInstaller.exe'
            - '\Windows\System32\svchost.exe'
            - '\Windows\System32\msiexec.exe'
        - username: 'NT AUTHORITY\SYSTEM'

    condition: (selection_uac_registry_keys and selection_suspicious_payloads and not filters_trusted_system) or selection_suspicious_parents
level: critical
