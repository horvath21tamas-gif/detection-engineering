title: Ultra-Pro High-Fidelity Allure Document and RTLO Masquerading (T1036.009)
id: cb293582-a39b-478c-b718-ae8041315843
status: stable
description: |
    Detects sophisticated masquerading using allure documents and RTLO characters. 
    Focuses on execution from untrusted user directories and suspicious parent 
    processes (browsers, mail clients) while filtering common developer noise.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1036.009
logsource:
    product: windows
    category: process_creation
detection:
    selection_double_extension:
        Image|contains:
            - '.pdf.exe'
            - '.docx.exe'
            - '.xlsx.exe'
            - '.txt.exe'
            - '.jpg.exe'
            - '.png.exe'
            - '.zip.exe'

    selection_rtlo:
        CommandLine|contains:
            - '‮' # Maga az Unicode karakter (U+202E)
            - '\u202e'
            - '%E2%80%AE' 

    selection_untrusted_path:
        Image|contains:
            - '\Downloads\'
            - '\Desktop\'
            - '\AppData\Local\Temp\'
            - '\Users\Public\'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\outlook.exe'
            - '\winrar.exe'
            - '\7zFM.exe'

    filter_dev_and_system:
        - Image|contains: 
            - '\node_modules\'
            - '\bin\Debug\'
            - '\bin\Release\'
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith: '\msiexec.exe'

    condition: (selection_double_extension or selection_rtlo) and (selection_untrusted_path or selection_suspicious_parent) and not filter_dev_and_system
level: critical
