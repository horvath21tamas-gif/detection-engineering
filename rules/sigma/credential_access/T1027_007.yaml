title: Binary Symbol Stripping (T1027.007)
id: 6d401796-b411-4224-a008-2481aa5a7402
status: stable
description: >
  Detects active stripping of debug symbols and section headers from binaries
  on non-build systems, focusing on the execution of stripping tools outside of
  development or CI/CD environments. Optimized to reduce false positives from
  authorized build pipelines and developer systems.

author: hota05
date: 2026-02-23
tags:
  - attack.defense_evasion
  - attack.t1027.007
  - attack.execution

logsource:
  product: windows
  category: process_creation

detection:
  selection_strip_execution:
    CommandLine|contains:
      - 'strip '
      - 'sstrip '
      - 'objcopy '
      - 'eu-strip '

  selection_compiler_stripping:
    CommandLine|contains:
      - '-Wl,-s'
      - '-strip-all'
      - '/NODEBUG'

  selection_targets:
    CommandLine|contains:
      - '.exe'
      - '.dll'
      - '.sys'
      - '.elf'
      - '.so'

  filter_authorized_environments:
    Image|contains:
      - '\Jenkins\'
      - '\GitLab-Runner\'
      - '\Azure Pipelines\'
      - '\Visual Studio\'
      - '\bin\mingw'
    ParentImage|contains:
      - '\devenv.exe'
      - '\msbuild.exe'

  filter_standard_users:
    User|contains:
      - 'svc-build'
      - 'cicd-agent'

  condition: >
    (selection_strip_execution or selection_compiler_stripping)
    and selection_targets
    and not (filter_authorized_environments or filter_standard_users)

falsepositives:
  - Legitimate builds on CI/CD pipelines or developer machines
  - Automated packaging scripts in trusted environments
  - Security research or reverse engineering labs

level: high
