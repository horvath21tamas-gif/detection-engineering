title: Ultra-Pro High-Fidelity System Binary Proxy Execution (T1218)
id: 9f7c36b4-5cba-43cb-b471-9b9052248952
status: stable
description: |
    Detects anomalous execution of trusted Windows binaries used to proxy malicious code. 
    Focuses on cross-process boundary calls (e.g., Office to Rundll32) and suspicious 
    command-line arguments like URLs or non-DLL extensions.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1218
logsource:
    product: windows
    category: process_creation
detection:
    selection_proxies:
        Image|endswith:
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\msiexec.exe'
            - '\installutil.exe'
            - '\mshta.exe'
            - '\control.exe'
            - '\cmstp.exe'
            - '\odbcconf.exe'

    selection_suspicious_parents:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\sqlservr.exe'
            - '\w3wp.exe' 

    selection_args:
        CommandLine|contains:
            - 'http'
            - 'ftp'
            - 'javascript:'
            - 'vbscript:'
            - 'scrobj.dll' 
            - '.txt'
            - '.png'
            - '.jpg'
            - '.dat'
            - '.inf'

    selection_paths:
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Downloads\'
            - '\PerfLogs\'

    filter_trusted_system:
        User: 'NT AUTHORITY\SYSTEM'
        ParentImage|startswith: 'C:\Windows\System32\svchost.exe'
        CommandLine|contains: 'C:\Windows\Installer\'

    condition: selection_proxies and (selection_suspicious_parents or (selection_args and selection_paths)) and not filter_trusted_system
level: high
