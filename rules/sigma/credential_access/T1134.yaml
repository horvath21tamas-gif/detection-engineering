title: Ultra-Pro Access Token Manipulation & Impersonation (T1134)
id: 769e8f4e-cdb1-4cf5-b522-d2a5da53e524
status: stable
description: |
    Detects high-risk access token manipulation by monitoring for suspicious 
    Integrity Level transitions and the use of specialized tools that interact 
    with LSASS to duplicate or steal security tokens.
author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1134
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        - CommandLine|contains:
            - 'steal_token'      
            - 'impersonate'    
            - 'incognito'       
            - 'make_token'
            - 'token::elevate'  
            - 'token::revert'
        - Image|endswith:
            - '\incognito.exe'
            - '\mimikatz.exe'

    selection_token_hop:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'
        User|contains: 'SYSTEM'
        logonid: '0x3e7'

    selection_lsass_access:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess: '0x1438'

    filter_trusted_system:
        - ParentImage|endswith:
            - '\services.exe'
            - '\wininit.exe'
            - '\winlogon.exe'
            - '\lsass.exe'
        - Image|contains:
            - '\Windows\System32\wbem\WmiPrvSE.exe' 
        - username: 'NT AUTHORITY\SYSTEM'

    condition: (selection_tools or selection_token_hop or selection_lsass_access) and not filter_trusted_system
level: critical
