title: Control.exe CPL/DLL Proxy Execution
id: 79c13d1f-ef30-42cd-9d83-af1ef51d9aae
status: stable
description: >
  Detects high-confidence abuse of control.exe for proxy execution
  (MITRE ATT&CK T1218.002). Adversaries may leverage control.exe to
  load malicious .cpl or DLL payloads from user-writable or remote
  locations.

  The rule focuses on anomalous parent processes, execution of
  control.exe outside standard system directories, suspicious
  command-line extensions, user-writable paths, and uncommon
  integrity contexts. OriginalFileName is used to detect renamed binaries.

  Designed to reduce noise from legitimate Control Panel activity.

author: hota05
date: 2026/02/20
references:
  - https://attack.mitre.org/techniques/T1218/002/
  - https://lolbas-project.github.io/lolbas/Binaries/Control/

logsource:
  product: windows
  category: process_creation

detection:

  selection_control_image:
    Image|endswith: '\control.exe'
    OriginalFileName: 'control.exe'

  selection_relocated_binary:
    Image|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\chrome.exe'
      - '\msedge.exe'

  selection_user_writable_path:
    CommandLine|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\Public\'
      - '\Downloads\'
      - '\PerfLogs\'

  selection_remote_path:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '\\\\'

  selection_non_cpl_extension:
    CommandLine|contains:
      - '.dll'
      - '.tmp'
      - '.dat'
      - '.png'
      - '.jpg'
      - '.txt'

  selection_low_integrity:
    IntegrityLevel:
      - 'Low'
      - 'Medium'

  filter_legitimate_system_usage:
    Image|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'

  filter_explorer_baseline:
    ParentImage|endswith: '\explorer.exe'
    IntegrityLevel: 'High'
    CommandLine|contains:
      - '.cpl'
      - 'C:\Windows\System32\'

  filter_system_context:
    User|startswith: 'NT AUTHORITY\'

  condition: >
    selection_control_image
    and selection_low_integrity
    and (selection_relocated_binary
        or selection_suspicious_parent
        or selection_remote_path
        or (selection_user_writable_path
            and selection_non_cpl_extension))
    and not (filter_legitimate_system_usage
        and filter_explorer_baseline)
    and not filter_system_context

falsepositives:
  - Rare enterprise tools invoking custom Control Panel applets
  - Development environments testing CPL modules
  - Security testing activity

level: critical

tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1218.002
  - attack.lolbas
  - attack.windows
