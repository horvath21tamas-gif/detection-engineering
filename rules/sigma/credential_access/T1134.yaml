title: Access Token Manipulation & Impersonation (T1134)
id: 769e8f4e-cdb1-4cf5-b522-d2a5da53e524
status: stable
description: |
    Detects high-risk access token manipulation and impersonation by monitoring:
      - Specialized tools interacting with LSASS to steal or duplicate tokens
      - Suspicious integrity level transitions indicative of token elevation
      - Unauthorized LSASS handle access
    Filters known trusted system processes to minimize false positives

author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1134

logsource:
    product: windows
    category: process_creation

detection:
    selection_tools:
        processcommandline: '(steal_token|impersonate|incognito|make_token|token::elevate|token::revert)'
        processname: '(\\incognito\.exe|\\mimikatz\.exe)$'

    selection_token_hop:
        Parentprocessname: '(powershell\.exe|pwsh\.exe|cmd\.exe|cscript\.exe|wscript\.exe)$'
        username: 'SYSTEM'
        logonid: '0x3e7'

    selection_lsass_access:
        Targetprocessname: 'lsass\.exe$'
        GrantedAccess: '0x1438'

    filter_trusted_system:
        - Parentprocessname: '(services\.exe|wininit\.exe|winlogon\.exe|lsass\.exe)$'
        - processname: '\\Windows\\System32\\wbem\\WmiPrvSE\.exe'
        - UserName: 'NT AUTHORITY\\SYSTEM'

    condition: (selection_tools or selection_token_hop or selection_lsass_access) and not filter_trusted_system

level: critical
