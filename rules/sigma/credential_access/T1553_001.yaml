title: macOS Gatekeeper and Quarantine Bypass (T1553.001)
id: 1a73693c-9af6-444b-b4e8-64de72719c11
status: stable
description: |
    Detects attempts to globally disable Gatekeeper or programmatically
    remove the com.apple.quarantine attribute from files. Focuses on
    non-interactive execution, suspicious file locations, and abnormal
    parent-child relationships to reduce developer and administrative
    false positives.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1553/001/
tags:
    - attack.defense_evasion
    - attack.t1553.001
    - attack.persistence
    - attack.execution

logsource:
    product: macos
    category: process_creation

detection:
    selection_gatekeeper_disable:
        Image|endswith: '/spctl'
        CommandLine|contains:
            - '--master-disable'
            - '--global-disable'
            - 'disable'
            - '--status'
    selection_gatekeeper_disable_and2:
        CommandLine|contains:
            - 'assess'

    selection_quarantine_removal:
        Image|endswith: '/xattr'
        CommandLine|contains:
            - '-d com.apple.quarantine'
            - '-rc com.apple.quarantine'
            - '--delete com.apple.quarantine'

    selection_suspicious_paths:
        CommandLine|contains:
            - '/tmp/'
            - '/private/var/tmp/'
            - '/Users/Shared/'
            - '/Downloads/'
            - '/Volumes/'
            - '/Library/Application Support/'

    selection_non_interactive_parent:
        ParentImage|endswith:
            - '/sh'
            - '/bash'
            - '/zsh'
            - '/python'
            - '/python3'
            - '/perl'
            - '/php'
            - '/osascript'
            - '/launchctl'
            - '/cron'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '/Microsoft Word'
            - '/Microsoft Excel'
            - '/Preview'
            - '/Google Chrome'
            - '/Safari'

    filter_legitimate_system_activity:
        ParentImage|startswith:
            - '/System/Library/'
            - '/usr/libexec/'
            - '/usr/sbin/softwareupdate'
            - '/Applications/Xcode.app/'
            - '/Applications/Install '
        Image|startswith:
            - '/usr/bin/codesign'
            - '/usr/bin/productbuild'

    filter_interactive_terminal:
        ParentImage|endswith:
            - '/Terminal'
            - '/iTerm2'

    condition:
        ((selection_gatekeeper_disable and selection_gatekeeper_disable_and2)
            or (selection_quarantine_removal
                and selection_suspicious_paths
                and (selection_non_interactive_parent or selection_suspicious_parent)))
        and not filter_legitimate_system_activity
        and not filter_interactive_terminal

falsepositives:
    - Developers removing quarantine during local testing
    - Application notarization workflows
    - Software updates and package installations
    - MDM-based macOS configuration changes

level: critical
