title: Windows Permissions Modification (T1222)
id: b8f7ff6c-7a68-4fed-9579-73c46403b29f
status: stable
description: >
    Detects suspicious file permission modifications by identifying the use of native 
    tools (icacls, takeown, cacls, attrib) with broad access flags (Full Control, Everyone) 
    initiated by non-standard parent processes or from suspicious paths. Filters out 
    trusted system installers and management operations to reduce false positives.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1222.001
    - attack.t1222
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        Image|endswith:
            - '\icacls.exe'
            - '\takeown.exe'
            - '\cacls.exe'
            - '\attrib.exe'

    selection_dangerous_flags:
        CommandLine|contains:
            - ':f'
            - ' /grant'
            - 'Everyone:'
            - 'Authenticated Users:'
            - '/setowner'
            - '/inheritance:r'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\httpd.exe'
            - '\nginx.exe'
            - '\php-cgi.exe'
            - '\sqlservr.exe'

    selection_suspicious_path:
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\AppData\'

    filter_trusted_installers:
        ParentImage|contains:
            - '\Windows\servicing\TrustedInstaller.exe'
            - '\CcmExec.exe'
            - '\Program Files\Microsoft Visual Studio\'
        CommandLine|contains:
            - 'Microsoft\Windows\SoftwareDistribution'
            - 'AppData\Local\Packages'

    condition: selection_tools 
               and selection_dangerous_flags 
               and (selection_suspicious_parent or selection_suspicious_path) 
               and not filter_trusted_installers
level: high
