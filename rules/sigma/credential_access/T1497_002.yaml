title: User Interaction Evasion (T1497.002)
id: 53c2e2a1-01ba-4da3-979e-40359cb07448
status: stable
description: |
  Detects sophisticated user interaction evasion by identifying un-signed or 
  suspiciously located processes that query human-centric APIs (mouse, keyboard, recent files) 
  without a legitimate UI context.
author: hota05
date: 2026-02-03
tags:
  - attack.defense_evasion
  - attack.t1497.002
logsource:
  category: process_creation
  product: windows
detection:
  suspicious_process:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Downloads\'
      - '\Desktop\'
      - '\PerfLogs\'
    Image|endswith:
      - '.scr'
      - '.pif'
      - '.exe'

  api_discovery:
    CommandLine|contains:
      - 'GetCursorPos'
      - 'GetLastInputInfo'
      - 'GetForegroundWindow'
      - 'GetKeyState'
      - 'shell:recent'

  fake_ui_attempts:
    CommandLine|contains:
      - 'MessageBox'
      - 'powershell -Command "[Reflection.Assembly]::LoadWithPartialName(''System.Windows.Forms''); [System.Windows.Forms.MessageBox]::Show'
      - 'wscript.shell'
    CommandLine|contains:
      - 'Error'
      - 'Required'
      - 'Missing'
      - 'Update'

  trusted_system_filter:
    ParentImage|endswith:
      - '\services.exe'
      - '\explorer.exe'
    username: 'NT AUTHORITY\SYSTEM'

  known_browsers_filter:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'

  condition: suspicious_process and (api_discovery or fake_ui_attempts) 
             and not (trusted_system_filter or known_browsers_filter)
level: high
