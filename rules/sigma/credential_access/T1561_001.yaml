title: Disk Content Wipe
id: c2592f79-8f9e-478d-83c9-3c5d9ac0a786
status: stable
description: |
    Detects destructive low-level disk content wiping via direct device access 
    and destructive overwrite parameters.

    Focuses on:
      - Raw physical disk access (PhysicalDrive, Harddisk)
      - Overwrite with zeroes or random data
      - PowerShell/Cmd destructive disk commands
      - Excludes known-good administrative, imaging, and security tools

author: hota05 
date: 2026-02-11
tags:
    - attack.impact
    - attack.t1561.001
    - attack.t1561

logsource:
    product: windows
    category: process_creation

detection:

    selection_tools:
        Image|endswith:
            - '\dd.exe'
            - '\sdelete.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
        CommandLine|contains|any:
            - '\\.\PhysicalDrive'
            - '\\.\Harddisk'
            - 'if=/dev/zero'
            - 'if=/dev/urandom'
            - 'of=\\.\'
            - 'Clear-Disk'
            - 'Initialize-Disk'
            - '-z'
            - '-p'
            - 'Format-Volume'

    selection_suspicious_context:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\httpd.exe'
            - '\w3wp.exe'
            - '\rundll32.exe'
            - '\explorer.exe'
        Image|contains:
            - '\Temp\'
            - '\Users\Public\'
            - '\AppData\Local\Temp\'

    filter_legit:
        - username: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\msiexec.exe'
            - '\CcmExec.exe'
            - '\setup.exe'
            - '\vds.exe'
        - CommandLine|contains:
            - 'Program Files'
            - 'Deployment\Scripts'
            - 'imaging'
            - 'diskpart /s'

    condition: selection_tools and selection_suspicious_context and not filter_legit

level: critical
