title: Ultra-Pro High-Fidelity Code Integrity & DSE Subversion (T1553.006)
id: 93144994-c4ec-4023-9186-d61a120c3250
status: stable
description: |
    Detects attempts to subvert Windows Code Integrity and Driver Signature Enforcement (DSE). 
    Focuses on BCDEDIT flags and registry modifications that allow unsigned kernel drivers 
    to load, while filtering out legitimate OS maintenance and installers.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1553.006
logsource:
    product: windows
    category: process_creation
detection:
    selection_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'set '
        CommandLine|contains:
            - 'nointegritychecks' 
            - 'testsigning'       
            - 'disable-elam'      

    selection_registry:
        CommandLine|contains:
            - 'Microsoft\CodeIntegrity\Options'
            - 'Microsoft\Windows\CurrentVersion\Policies\System\Audit' 
        CommandLine|contains:
            - 'reg add'
            - 'Set-ItemProperty'

    selection_context:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\temp\'

    filter_trusted_processes:
        Image|startswith:
            - 'C:\Windows\servicing\TrustedInstaller.exe'
            - 'C:\Windows\System32\sysprep\'
            - 'C:\Windows\System32\oobe\'
        username: 'NT AUTHORITY\SYSTEM'

    condition: ((selection_bcdedit) or selection_registry) and selection_context and not filter_trusted_processes
level: critical
