title: Network Boundary Bridging (T1599)
id: 8730e925-91d6-47e9-9ab2-a4a642f6cf79
status: stable
description: |
    Detects unauthorized network boundary bridging, including manual creation of
    "Any-to-Internal" NAT rules, port forwarding of sensitive services, and
    hardware-level bridging of isolated interfaces. Focuses on untrusted sources
    and manual session activity while filtering out legitimate management and VPN operations.
author: hota05 
date: 2026-02-11
tags:
    - attack.defense_evasion
    - attack.t1599
logsource:
    product: network
    service: FortiGate

detection:
  selection_boundary_ops:
    Message|contains:
      - 'nat (inside,outside)'
      - 'static-nat'
      - 'set system bridge'
      - 'add bridge-group'
      - 'port-forwarding'
      - 'virtual-server'
      - 'set nat source'
      - 'set vip'
      - 'set policy route'

  selection_risky_ports:
    Message|contains:
      - 'port 22'
      - 'port 3389'
      - 'port 445'
      - 'port 5985'
      - 'port 3306'
      - 'port 5432'
      - 'port 5900'

  selection_manual_context:
    Message|contains:
      - 'web-console'
      - 'http-admin'
      - 'ssh-session'
      - 'local-user'
      - 'console'
      - 'telnet-session'

  filter_trusted_management:
    SourceIP:
      - '10.50.0.10'
      - '10.50.0.11'
      - '10.50.0.12'

  filter_legit_vpn_traffic:
    Message|contains:
      - 'vpn-pool'
      - 'dynamic-pat'
      - 'ipsec-nat-t'
      - 'ssl-vpn'

  condition: selection_boundary_ops and selection_risky_ports and selection_manual_context and not (filter_trusted_management or filter_legit_vpn_traffic)

fields:
  - Time
  - SourceIP
  - User
  - Interface
  - PolicyID
  - Message
  - Port
  - VIP

falsepositives:
  - Legitimate VPN or remote-access configuration by authorized admins
  - Standard NAT/policy updates by network automation tools
  - Maintenance or migration operations within trusted management window

level: critical
