title: Ultra-Pro Port Knocking & Raw Socket Listener (T1205.001)
id: 9b03a998-5197-4123-a9f4-7946db16b139
status: stable
description: |
    Detects unauthorized implementation of Port Knocking by monitoring the 
    registration of raw packet capturing drivers and suspicious firewall 
    modifications (UDP/ICMP/LocalPort Any) initiated from untrusted shells.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1205.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        - Image|endswith:
            - '\tcpdump.exe'
            - '\windump.exe'
            - '\scapy.exe'     
            - '\nmap.exe'     
        - OriginalFileName:
            - 'tcpdump.exe'
            - 'windump.exe'
            - 'scapy.exe'

    selection_firewall_cmds:
        CommandLine|contains:
            - 'advfirewall firewall add rule'
            - 'action=allow'
            - 'protocol=UDP'
            - 'protocol=ICMP'
            - 'localport=any'  

    selection_unauthorized_actor:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'
            - '\AppData\'

    filter_trusted_mgmt:
        - username: 'NT AUTHORITY\SYSTEM'
        - Image|contains: 'C:\Windows\System32\svchost.exe'
        - CommandLine|contains: 'description=' 

    condition: (selection_tools or selection_firewall_cmds) and selection_unauthorized_actor and not filter_trusted_mgmt
level: high
