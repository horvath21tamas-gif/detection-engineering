title: HH.exe CHM/ITS Proxy Execution
id: 59ed38d7-5895-4a50-98ce-f7bee1e21c3b
status: stable
description: >
  Detects high-confidence abuse of hh.exe for proxy execution
  (MITRE ATT&CK T1218.001). Adversaries may leverage HTML Help (hh.exe)
  to execute malicious CHM content, decompile CHM files, or fetch
  remote payloads via ITS/MSITStore protocols.

  The rule focuses on anomalous parent processes, remote or user-
  writable CHM execution, suspicious protocol handlers, decompile
  misuse, relocated binaries, and uncommon integrity contexts.

  Designed to reduce noise from legitimate application help file usage.

author: hota05
date: 2026/02/20
references:
  - https://attack.mitre.org/techniques/T1218/001/
  - https://lolbas-project.github.io/lolbas/Binaries/Hh/

logsource:
  product: windows
  category: process_creation

detection:

  selection_hh_image:
    Image|endswith: '\hh.exe'
    OriginalFileName: 'hh.exe'

  selection_relocated_binary:
    Image|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'

  selection_remote_execution:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'

  selection_protocol_abuse:
    CommandLine|contains:
      - 'its:'
      - 'mk:@MSITStore'
      - 'ms-its:'

  selection_decompile_misuse:
    CommandLine|contains:
      - '-decompile'

  selection_user_writable_chm:
    CommandLine|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\Public\'
      - '\Downloads\'

  selection_non_chm_extension:
    CommandLine|contains:
      - '.txt'
      - '.jpg'
      - '.png'
      - '.dat'
      - '.tmp'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\chrome.exe'
      - '\msedge.exe'

  selection_low_integrity:
    IntegrityLevel:
      - 'Low'
      - 'Medium'

  filter_legitimate_system_path:
    Image|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'

  filter_legitimate_app_help:
    ParentImage|startswith:
      - 'C:\Program Files\'
      - 'C:\Program Files (x86)\'
    IntegrityLevel: 'High'

  filter_system_context:
    User|startswith: 'NT AUTHORITY\'

  condition: >
    selection_hh_image
    and selection_low_integrity
    and (selection_relocated_binary
        or selection_remote_execution
        or selection_protocol_abuse
        or selection_decompile_misuse
        or (selection_user_writable_chm
            and selection_suspicious_parent)
        or selection_non_chm_extension)
    and not (filter_legitimate_system_path
        and filter_legitimate_app_help)
    and not filter_system_context

falsepositives:
  - Legitimate application help files opened from Program Files
  - Software documentation viewers
  - Internal IT testing of CHM content

level: critical

tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1218.001
  - attack.lolbas
  - attack.windows
