title: High-Fidelity Winlogon Helper DLL Persistence (T1547.004)
id: 3d6d4acb-653c-47f2-ab1a-ab33ee37fe26
status: stable
description: |
    Detects unauthorized modifications to Winlogon helper keys (Userinit, Shell). 
    Focuses on 'appending' multiple executables or using non-standard system paths.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1547/004/
tags:
    - attack.persistence
    - attack.t1547.004
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
        TargetObject|endswith: 
            - '\Userinit'
            - '\Shell'

    selection_userinit_append:
        TargetObject|endswith: '\Userinit'
        Details|contains: 
            - '.exe,'
            - '.dll,'
            - '.ps1'
            - '.bat'

    selection_shell_anomaly:
        TargetObject|endswith: '\Shell'
        Details|not_contains: 'explorer.exe'

    selection_path_anomaly:
        Details|contains:
            - ':\Users\'
            - ':\ProgramData\'
            - ':\Temp\'
            - 'C:\PerfLogs\'
            - '\\' 

    filter_trusted_installer:
        Image|endswith: 
            - '\trustedinstaller.exe'
            - '\msiexec.exe'
            - '\C:\Windows\System32\oobe\msoobe.exe'

    condition: selection_registry and (selection_userinit_append or selection_shell_anomaly or selection_path_anomaly) and not filter_trusted_installer
level: critical
