title: Non-Standard Encoding & XOR Obfuscation (T1132.002)
id: faa8cde5-b28c-4c44-bfab-439f654f02af
status: stable
description: |
    Detects custom encoding and obfuscation by monitoring:
      - Byte-level XOR manipulations
      - Backtick-based string fragmentation
      - Character-code reconstruction (e.g., ::FromCharacterCode)
      - Suspicious non-interactive process contexts (rundll32, regsvr32, colorcpl)
    Filters out legitimate administrative and infrastructure processes to reduce false positives.

author: hota05
date: 2026-02-09
tags:
    - attack.command_and_control
    - attack.t1132.002

logsource:
    category: process_creation
    product: windows

detection:
    selection_logic:
        processcommandline: '(-bxor|bit\.bxor|\[char\[\]\]|::FromCharacterCode|\.replace\()'

    selection_fragmentation:
        processcommandline: '(?i)([`]{2,}.*){2,}'

    selection_context:
        Parentprocessname: '(winword\.exe|excel\.exe|outlook\.exe|w3wp\.exe)$'
        processname: '(rundll32\.exe|regsvr32\.exe|colorcpl\.exe)$'

    filter_legit_infra:
        processcommandline: '(C:\\Program Files\\|Microsoft\\Exchange|Chocolatey|NuGet)'
        UserName: 'NT AUTHORITY\\SYSTEM'

    condition: ((selection_logic and selection_fragmentation) or (selection_context and selection_logic)) and not filter_legit_infra

level: critical
