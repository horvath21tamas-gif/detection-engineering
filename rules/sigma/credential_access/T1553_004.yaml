title: Ultra-Pro High-Fidelity Root Certificate Injection (T1553.004)
id: 5a5a0c41-4fad-4a7a-9a99-bc7f2ebf98e3
status: stable
description: |
    Detects the programmatic installation of a Root Certificate into the 
    Trusted Root store. Focuses on high-risk command-line arguments and 
    suspicious process lineages to eliminate common false positives.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1553.004
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        Image|endswith:
            - '\certutil.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\certmgr.exe'

    selection_store:
        CommandLine|contains:
            - ' -addstore '
            - ' -importcert '
            - ' Import-Certificate '
        CommandLine|contains:
            - ' Root'           
            - ' AuthRoot'        
            - ' -s '          

    selection_flags:
        CommandLine|contains:
            - ' -f '             
            - ' -user '         
            - ' -enterprise '   

    selection_paths:
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Downloads\'
            - '\Desktop\'
            - '\PerfLogs\'

    filter_trusted_automation:
        ParentImage|startswith:
            - 'C:\Windows\System32\gpscript.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\servicing\TrustedInstaller.exe'
        User: 'NT AUTHORITY\SYSTEM'

    condition: selection_tools and selection_store and (selection_flags or selection_paths) and not filter_trusted_automation
level: critical
