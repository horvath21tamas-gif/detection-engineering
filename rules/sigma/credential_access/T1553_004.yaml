title: Root Certificate Injection (T1553.004)
id: 5a5a0c41-4fad-4a7a-9a99-bc7f2ebf98e3
status: stable
description: |
    Detects high-risk programmatic installation of a Root Certificate into
    the Windows Trusted Root or AuthRoot stores. Focuses on suspicious
    command-line flags, non-standard certificate file locations, and
    uncommon parent-child process relationships to significantly reduce
    enterprise deployment false positives.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1553/004/
tags:
    - attack.defense_evasion
    - attack.t1553.004
    - attack.persistence
    - attack.privilege_escalation

logsource:
    product: windows
    category: process_creation

detection:
    selection_tools:
        Image|endswith:
            - '\certutil.exe'
            - '\certmgr.exe'
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_root_store:
        CommandLine|contains:
            - ' -addstore '
            - ' -importcert '
            - ' Import-Certificate '
        CommandLine|contains:
            - ' Root'
            - ' AuthRoot'
            - ' Cert:\LocalMachine\Root'
            - ' Cert:\CurrentUser\Root'

    selection_high_risk_flags:
        CommandLine|contains:
            - ' -f'
            - ' -user'
            - ' -enterprise'
            - ' -silent'

    selection_suspicious_paths:
        CommandLine|contains:
            - '\AppData\'
            - '\Users\Public\'
            - '\Downloads\'
            - '\Desktop\'
            - '\PerfLogs\'
            - '\ProgramData\'
            - '\Temp\'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\acrord32.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'

    filter_legitimate_enterprise:
        ParentImage|startswith:
            - 'C:\Windows\System32\gpscript.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\servicing\TrustedInstaller.exe'
            - 'C:\Program Files\Microsoft Configuration Manager\'
        User|startswith:
            - 'NT AUTHORITY\SYSTEM'
            - 'NT AUTHORITY\NETWORK SERVICE'

    filter_gpo_deployment:
        ParentImage|endswith:
            - '\gpupdate.exe'
            - '\mmc.exe'

    condition:
        selection_tools
        and selection_root_store
        and (selection_high_risk_flags or selection_suspicious_paths or selection_suspicious_parent)
        and not filter_legitimate_enterprise
        and not filter_gpo_deployment

falsepositives:
    - Enterprise PKI deployments
    - Group Policy certificate distribution
    - Configuration management platforms (SCCM, Intune)
    - Security software installing inspection certificates

level: critical
