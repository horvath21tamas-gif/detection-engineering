name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Csak a szükséges backendek telepítése PIP-en keresztül
          python -m pip install sigma-cli \
            pysigma-backend-splunk \
            pysigma-backend-qradar \
            pysigma-backend-insightidr \
            pytest "pyyaml>=6.0"
          
          # Pyparsing fix a stabilitásért
          python -m pip uninstall -y pyparsing
          python -m pip install "pyparsing==3.1.4"

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek."

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar rules/netwitness
          rm -f rules/splunk/*.spl rules/qradar/*.aql rules/netwitness/*.txt
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba"
            
            # QRadar (ha a profil hibaüzenetet ad, megpróbáljuk alapértelmezetten is)
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || \
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba"
            
            # NetWitness (A backend neve a CLI-ben: insight_idr)
            sigma convert -t insight_idr "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ NetWitness hiba"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Hozzáadjuk a generált SIEM szabályokat és a dashboardot
          git add rules/splunk/*.spl rules/qradar/*.aql rules/netwitness/*.txt
          git add README.md COVERAGE.md attack_navigator_layer.json mitre_matrix.svg
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Splunk, QRadar & NetWitness rules"
            
            # Megoldás a Git 128-as hibára: elmentjük a maradék változást a pull előtt
            git stash || echo "Nincs mit eltenni"
            git pull --rebase origin test
            git stash pop || echo "Nincs mit visszatenni"
            
            git push origin test
          else
            echo "Nincs commitolnivaló változás."
          fi

          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ Validációs hiba történt korábban."
            exit 1
          fi
