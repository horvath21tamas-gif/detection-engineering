title: Ultra-Pro High-Fidelity Silver Ticket Forgery & Injection (T1558.002)
id: 18d5cfa9-616e-4f68-9dec-ddb40dc04e2e
status: stable
description: |
    Detects the creation and injection of forged Kerberos Service Tickets (Silver Tickets). 
    Focuses on the mandatory presence of service-specific SPNs (cifs, mssql, http) 
    and the provision of service account hashes in the command line.
author: hota05
date: 2026-02-04
tags:
    - attack.credential_access
    - attack.t1558.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_silver_args:
        CommandLine|contains:
            - ' /service:'      
            - ' /target:'       
        CommandLine|contains:
            - ' /rc4:'         
            - ' /aes256:'        
            - ' /aes128:'
            - ' /sid:'         

    selection_tools:
        CommandLine|contains:
            - 'kerberos::golden' 
            - 'silver '          
            - ' /ptt'            
            - ' /spn:'           

    selection_untrusted_parent:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\wsmprovhost.exe' 
            - '\psexesvc.exe'
            - '\httpd.exe'       

    filter_legit_lsass:
        username: 'NT AUTHORITY\SYSTEM'
        Image|endswith: '\Windows\System32\lsass.exe'

    condition: (selection_silver_args or selection_tools) and selection_untrusted_parent and not filter_legit_lsass
level: critical
