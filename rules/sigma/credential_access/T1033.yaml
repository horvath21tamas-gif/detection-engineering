title: Ultra-Pro High-Fidelity System Owner/User Discovery (T1033)
id: 10a60959-1c3a-40e8-820b-43de06c423d5
status: stable
description: |
    Detects systematic discovery of the current user, logged-on users, and token privileges. 
    Focuses on anomalous process lineages (Office, Browsers) and specific switch 
    combinations (/priv, /groups) used before privilege escalation attempts.
author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1033
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\whoami.exe'
            - '\quser.exe'
            - '\qwinsta.exe'
        - CommandLine|contains:
            - 'net user '
            - 'net localgroup '
            - '$env:username'

    selection_patterns:
        CommandLine|contains:
            - ' /priv'             
            - ' /groups'
            - ' /all'
            - ' /fo csv'            

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\httpd.exe'           
            - '\wsmprovhost.exe'     
        IntegrityLevel: 'Medium'     

    selection_automation:
        CommandLine|contains:
            - ' > '
            - 'findstr'
            - 'select-string'

    filter_legit_noise:
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\svchost.exe'
            - '\msiexec.exe'        
            - '\CcmExec.exe'         
        - CommandLine|contains:
            - 'Program Files'        
            - 'AppData\Local\Temp' 

    condition: selection_tools and (selection_patterns or selection_suspicious_lineage or selection_automation) and not filter_legit_noise
level: high
