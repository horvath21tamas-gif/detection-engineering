title: Network Binary Patching (T1601.001)
id: 1a99382f-ae99-4606-a5ec-c03445bb4a81
status: stable
description: |
    Detects unauthorized low-level patching of network OS binaries by monitoring 
    for filesystem remounting (read-write), direct binary manipulation (dd, xxd), 
    and kernel module loading (insmod) outside of authorized maintenance windows. 
    Focuses on critical paths and filters out legitimate maintenance and read-only operations.
author: hota05 
date: 2026-02-11
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1601.001
logsource:
    product: network
    service: FortiOS

detection:

  selection_remount:
    Message|contains:
      - 'mount -o remount,rw'
      - 'mount -uw'
      - 'config-transaction start'
      - 'config-transaction commit'

  selection_patch_tools:
    Message|contains:
      - 'xxd '
      - 'dd if='
      - 'insmod'
      - 'gdb '
      - 'setenforce 0'
      - 'objcopy '
      - 'strip '
      - 'modprobe '

  selection_critical_paths:
    Message|contains:
      - '/bin/'
      - '/sbin/'
      - '/lib/modules/'
      - '/boot/'
      - '/usr/local/bin/'
      - '/usr/local/sbin/'

  filter_authorized_updates:
    user_name|startswith:
      - 'svc-system-update'
      - 'installer'
      - 'root-maintenance'

  filter_read_only_debug:
    Message|contains:
      - 'show '
      - 'cat '
      - 'grep '
      - 'ls '
      - 'find '

  condition: (selection_remount or selection_patch_tools) and selection_critical_paths and not (filter_authorized_updates or filter_read_only_debug)

fields:
  - Time
  - user_name
  - Message
  - SourceIP

falsepositives:
  - Authorized system updates by maintenance accounts
  - Read-only inspections or debug commands in logs
  - Lab/test appliance experiments

level: critical
