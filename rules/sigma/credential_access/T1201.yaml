title: Password Policy Discovery Detection (T1201)
id: a853e34f-510f-4b94-aa51-7e5be3a1cecb
status: stable
description: |
    Detects targeted enumeration of domain or local password policies. 
    Focuses on reconnaissance patterns used by attackers to calibrate 
    brute-force attacks while filtering out legitimate system or admin activity.

    Monitors:
      - Native Windows tools: net.exe, net1.exe
      - PowerShell ActiveDirectory cmdlets for password policies
      - Suspicious output redirection or export patterns
      - Execution from untrusted or medium integrity parent processes

author: hota05
date: 2026-02-04
modified: 2026-02-20
tags:
    - attack.discovery
    - attack.t1201
    - attack.reconnaissance
logsource:
    product: windows
    category: process_creation

detection:
    selection_tools:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - 'accounts'
            - 'Get-DomainPolicy'
            - 'Get-ADDefaultDomainPasswordPolicy'
            - 'Get-ADFineGrainedPasswordPolicy'
            - 'Get-ADAccountResultantPasswordPolicy'

    selection_keywords:
        CommandLine|contains:
            - 'lockoutthreshold'
            - 'minpwdlength'
            - 'lockoutduration'
            - 'pwdcomplexity'
            - 'maxpwdage'
            - 'minpwdage'
            - 'historycount'

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\wsmprovhost.exe'
            - '\httpd.exe'
            - '\winword.exe'
            - '\excel.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        IntegrityLevel: 'Medium'

    selection_extraction:
        CommandLine|contains:
            - ' > '
            - 'ConvertTo-Json'
            - 'Export-Csv'
            - 'Out-File'

    filter_legit_ops:
        User|startswith: 'NT AUTHORITY\'
        ComputerName|contains: 'DC-'
        CommandLine|contains:
            - 'logon.bat'
            - 'Program Files'
            - 'GroupPolicy'
        Image|contains:
            - '\Windows\System32\'

    condition: 
        selection_tools 
        and (selection_keywords or selection_extraction or selection_suspicious_lineage) 
        and not filter_legit_ops

falsepositives:
    - Legitimate AD administration via PowerShell or net.exe
    - Password policy auditing in enterprise environment
    - Export scripts executed by admins
    - DC maintenance tasks

level: high
