title: High-Confidence Firmware Enumeration Against Network Devices
id: dfe210b9-e2d0-49f6-8ed5-e2c2cca3a55a
status: stable
description: >
  Detects high-confidence reconnaissance activity targeting firmware
  and version information of network or embedded devices. The rule
  focuses on automated, non-browser access to device-specific
  management endpoints and is optimized to minimize false positives.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1592/003/

logsource:
  product: generic
  category: webserver

detection:

  selection_external:
    SrcIp|startswith:
      - '1.'
      - '2.'
      - '3.'
      - '4.'
      - '5.'
      - '6.'
      - '7.'
      - '8.'
      - '9.'

  selection_firmware_endpoints:
    UriStem|contains:
      - '/cgi-bin'
      - '/status'
      - '/system'
      - '/device'
      - '/version'
      - '/firmware'
      - '/diagnostic'
      - '/setup'
      - '/admin'
      - '/mgmt'
      - '/management'

  selection_firmware_keywords:
    UriQuery|contains:
      - 'firmware'
      - 'version'
      - 'build'
      - 'model'
      - 'hardware'
      - 'platform'

  selection_automation_ua:
    UserAgent|contains:
      - 'curl'
      - 'wget'
      - 'python'
      - 'httpclient'
      - 'go-http-client'
      - 'libwww'
      - 'probe'

  filter_browsers:
    UserAgent|contains:
      - 'Mozilla'
      - 'Chrome'
      - 'Safari'
      - 'Firefox'
      - 'Edge'

  filter_scanners:
    UserAgent|contains:
      - 'nessus'
      - 'qualys'
      - 'openvas'
      - 'acunetix'
      - 'nikto'
      - 'nuclei'
      - 'zap'
      - 'zabbix'
      - 'uptime'
      - 'pingdom'

  filter_noise:
    UriStem|endswith:
      - '.css'
      - '.js'
      - '.png'
      - '.jpg'
      - '.svg'
      - '.ico'
      - '.woff'
      - '.woff2'
      - '.json'
    UriStem|contains:
      - '/api'


  condition: >
    selection_external
    and selection_firmware_endpoints
    and selection_firmware_keywords
    and selection_automation_ua
    and not (
      filter_browsers
      or filter_scanners
      or filter_noise
    )

fields:
  - SrcIp
  - UriStem
  - UriQuery
  - UserAgent
  - Status

falsepositives:
  - Vendor support accessing device management interfaces from external networks
  - Approved red team activity not allowlisted

level: high

tags:
  - attack.reconnaissance
  - attack.t1592
  - attack.t1592.003
