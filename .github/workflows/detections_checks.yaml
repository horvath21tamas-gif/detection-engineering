name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

# Szükséges az írási jog a dokumentáció és a JSON fájlok feltöltéséhez
permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml sigma-cli
          # Sigma komponensek telepítése
          sigma plugin install splunk
          sigma plugin install sysmon
          sigma plugin install windows

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q

      - name: Lint and validate Sigma rules
        run: |
          python tools/lint_rules.py
          python tools/validate_metadata.py

      - name: Convert Sigma rules to Splunk (.spl files)
        run: |
          mkdir -p rules/splunk
          rm -f rules/splunk/*.spl
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            echo "Converting $file to Splunk..."
            sigma convert -t splunk -p sysmon "$file" -o "rules/splunk/${filename}.spl"
          done

      - name: Update Dashboard and Documentation
        if: github.event_name == 'push'
        run: |
          # Ez az egy script frissíti a README-t, a COVERAGE-t és a Navigator JSON-t is
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Minden generált fájlt hozzáadunk (README, COVERAGE, JSON, SPL-ek)
          git add README.md COVERAGE.md attack_navigator_layer.json rules/splunk/*.spl
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Dashboard, Coverage and Navigator" && git push)
