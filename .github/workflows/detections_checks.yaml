name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches: 
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Először a kritikus alapcsomagokat telepítjük
          python -m pip install "pyparsing>=3.0.0" "pysigma>=1.1.0"
          
          # Utána az összes CLI és backend csomagot egyben
          # A --no-cache-dir segít elkerülni a korábbi hibás letöltéseket
          python -m pip install --no-cache-dir \
            sigma-cli \
            pysigma-backend-splunk \
            pysigma-backend-qradar \
            pysigma-backend-microsoft-sentinel \
            pysigma-backend-insightidr \
            pytest "pyyaml>=6.0"

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          # Ellenőrzés, hogy a környezet ép-e
          sigma --version
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek."

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/sentinel
          rm -f rules/splunk/*.spl rules/qradar/*.aql rules/netwitness/*.txt rules/sentinel/*.kql
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba"
            
            # QRadar
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba"
            
            # NetWitness
            sigma convert -t insightidr "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ NetWitness hiba"

            # Microsoft Sentinel
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "⚠️ Sentinel hiba"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard and SIEM rules"
            git pull --rebase origin test
            git push origin test
          fi

          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált."
            exit 1
          fi
