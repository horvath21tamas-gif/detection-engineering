title: Data Encoding & Obfuscation (T1132)
id: 69a086dc-f089-4d22-a153-d7d9c2a309bf
status: stable
description: |
    Detects suspicious data encoding/decoding sequences used for C2 stealth:
      - Programmatic Base64/Hex conversion (FromBase64String, ToBase64String, System.Text.Encoding)
      - Embedded payload headers (TVqQA, BXAAR)
      - High-entropy command lines indicative of obfuscated payloads
      - Non-standard process lineages abusing tools like rundll32, regsvr32, colorcpl
    Filters legitimate administrative and system processes to reduce false positives.

author: hota05
date: 2026-02-09
tags:
    - attack.command_and_control
    - attack.t1132.001
    - attack.t1132

logsource:
    category: process_creation
    product: windows

detection:
    selection_encoding_logic:
        CommandLine|re|i: '(FromBase64String|ToBase64String|-decode\s|-encode\s|\[System\.Text\.Encoding\]::|BXAAR|TVqQA)'

    selection_entropy:
        CommandLine|re|i: '(?i).*[a-z0-9+/]{500,}.*'

    selection_context:
        ParentImage|re|i: '(winword\.exe|excel\.exe|w3wp\.exe|sqlservr\.exe)$'
        Image|re|i: '(rundll32\.exe|regsvr32\.exe|colorcpl\.exe)$'

    filter_legit_infra:
        CommandLine|re|i: '(C:\\Windows\\System32\\wbem\\WmiPrvSE\.exe|CCM\\Cache|Microsoft\.Cloud\.Data)'
        Image|re|i: 'powershell_ise\.exe$'
        UserName: 'NT AUTHORITY\\SYSTEM'

    condition: ((selection_encoding_logic and selection_entropy) or (selection_context and selection_encoding_logic)) and not filter_legit_infra

level: critical
