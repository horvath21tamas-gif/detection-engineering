title: High-Fidelity Active Setup Persistence (T1547.014)
id: beaff1a2-330a-4924-858f-4071da16ce30
status: stable
description: |
    Detects the creation or modification of Active Setup 'StubPath' registry keys by non-system processes.
    Attackers use this to achieve persistence that executes once per user upon logon.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1547/014/
tags:
    - attack.persistence
    - attack.t1547.014
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains: 'SOFTWARE\Microsoft\Active Setup\Installed Components\'
        TargetObject|endswith: '\StubPath'

    selection_suspicious_path:
        Details|contains:
            - ':\Users\'
            - ':\ProgramData\'
            - ':\Temp\'
            - ':\Windows\Temp\'
            - 'AppData\'
            - 'C:\PerfLogs\'

    selection_suspicious_binaries:
        Details|contains:
            - 'powershell'
            - 'pwsh'
            - 'cmd.exe'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - 'bitsadmin'
            - 'certutil'

    filter_trusted_writers:
        Image|endswith:
            - '\trustedinstaller.exe'
            - '\System32\msiexec.exe'
            - '\System32\mscorsvw.exe' 
            - '\System32\oobe\setupsrv.exe'

    filter_legit_paths:
        Details|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'

    condition: selection_registry and (selection_suspicious_path or selection_suspicious_binaries) and not (filter_trusted_writers or filter_legit_paths)
level: critical
