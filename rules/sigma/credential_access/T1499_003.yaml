title: OS Self-Destruction Detection (T1499.003)
id: f8bf31c1-cad8-409a-b7dc-29c1e66bcf12
status: stable
description: |
    Detects targeted OS self-destruction attempts by monitoring forced termination
    of critical Windows kernel processes (csrss.exe, wininit.exe, smss.exe, services.exe)
    and malicious usage of system debuggers (ntsd.exe, cdb.exe) to trigger BSOD.
    High-fidelity filters exclude trusted management, patching, and diagnostic processes
    to minimize false positives.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1499/003/
tags:
    - attack.impact
    - attack.t1499.003
    - attack.os_destroy

logsource:
    category: process_creation
    product: windows

detection:

  selection_critical_termination:
    Image|endswith:
      - '\taskkill.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
    CommandLine|contains:
      - ' /f /im csrss.exe'
      - ' /f /im wininit.exe'
      - ' /f /im smss.exe'
      - ' /f /im services.exe'

  selection_debugger_abuse:
    Image|endswith:
      - '\ntsd.exe'
      - '\cdb.exe'
    CommandLine|contains:
      - '-pn csrss.exe'
      - '-pn wininit.exe'
      - '-pn smss.exe'
      - '-pn services.exe'
      - '-c q'

  selection_suspicious_context:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\powerpnt.exe'
      - '\httpd.exe'
      - '\nginx.exe'
      - '\rundll32.exe'
      - '\explorer.exe'
    Image|contains:
      - '\Temp\'
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
      - '\Downloads\'

  filter_legit_management:
    username: 'NT AUTHORITY\SYSTEM'
    ParentImage|endswith:
      - '\CcmExec.exe'
      - '\msiexec.exe'
      - '\TiWorker.exe'
      - '\TrustedInstaller.exe'
    CommandLine|contains:
      - 'HealthCheck'
      - 'Diagnostic'
      - 'Patch'
      - 'Update'

  condition: (selection_critical_termination or selection_debugger_abuse) 
             and selection_suspicious_context 
             and not filter_legit_management

falsepositives:
  - System update or patching processes forcefully restarting critical services
  - Legitimate administrative scripts running automated diagnostics
  - Security software performing internal remediation of OS processes

level: critical
