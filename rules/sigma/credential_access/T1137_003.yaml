title: Outlook Custom Forms Persistence (T1137.003)
id: 44a7f906-f19f-4401-adaf-37fe944342a6
status: stable
description: |
    Detects unauthorized Outlook Custom Forms persistence by monitoring:
      - Non-standard registry modifications
      - Suspicious process spawning related to form scripts
      - Payloads indicating DLLs, VBS scripts, or remote content

author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1137.003

logsource:
    product: windows
    category: registry_event

detection:
    selection_registry:
        TargetObject|re: '(\\Software\\Microsoft\\Office\\|\\Software\\WOW6432Node\\Microsoft\\Office\\).*\\Outlook\\Forms\\(Registry|Cache)$'

    selection_suspicious_editor:
        Image|re: '(outlook\.exe|msiexec\.exe|powershell\.exe|cmd\.exe|reg\.exe|cscript\.exe|wscript\.exe)$'

    selection_suspicious_payload:
        Details|re: '(CLSID|\.dll|\.vbs|http)'

    filter_trusted_locations:
        Details|re: '(C:\\Program Files\\|C:\\Program Files \(x86\)\\)'

    condition: selection_registry and (selection_suspicious_editor or selection_suspicious_payload) and not filter_trusted_locations

level: high
