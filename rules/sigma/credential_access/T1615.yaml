title: High-Fidelity Group Policy Discovery Detection
id: 454e918e-783d-4e83-a143-0e899b7a4d4f
status: stable
description: >
  Detects systematic Group Policy reconnaissance, including GPO report harvesting 
  and policy enumeration from unusual execution contexts. Filters out legitimate 
  administrative and Helpdesk activity using command-line, parent process, and 
  integrity level checks.

author: hota05 
date: 2026-02-04
modified: 2026-02-11
tags:
  - attack.discovery
  - attack.t1615
  - attack.lateral_movement

logsource:
  category: process_creation
  product: windows

detection:
  selection_gpo_tools:
    Image|endswith:
      - '\gpresult.exe'
      - '\Get-GPO.exe'
      - '\powershell.exe'
    CommandLine|contains:
      - 'Get-DomainGPO'
      - 'Get-NetGPO'
      - 'SharpGPOAbuse'
      - 'Find-GPO'
      - 'Get-GPOReport'
      - 'Import-Module GroupPolicy'

  selection_reporting_flags:
    CommandLine|contains:
      - ' /h '
      - ' /x '
      - ' /z '
      - 'ConvertTo-Json'
      - 'Export-Csv'
      - 'Export-Clixml'
      - ' > '
      - '| Out-File'

  selection_suspicious_parents:
    ParentImage|endswith:
      - '\wsmprovhost.exe'
      - '\httpd.exe'
      - '\winword.exe'
      - '\excel.exe'
    IntegrityLevel: 'Medium'

  selection_suspicious_paths:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Temp\'

  filter_legit_ops:
    CommandLine|contains:
      - ' /r'
      - '/Scope'
      - '/SCCM'
    User: 'NT AUTHORITY\SYSTEM'
    ParentImage|contains:
      - '\CcmExec.exe'
      - '\IntuneManagementExtension\'

  condition:
    selection_gpo_tools
    and (selection_reporting_flags or selection_suspicious_parents or selection_suspicious_paths)
    and not filter_legit_ops

falsepositives:
  - Standard Helpdesk GPO queries with /r or SCCM flags
  - Intune / ConfigMgr reporting jobs
  - Administrative PowerShell scripts running under SYSTEM or trusted accounts

level: high
