title: wmic.exe segitsegevel perzisztens esemenyt hoznak letre a tamadok
id: '25a456ec-86d2-4639-a068-06d30e04ac84'
status: experimental
description: wmic.exe segitsegevel perzisztens esemenyt hoznak letre
author: hota05
date: 2026/01/13
logsource:
  product: windows
  category: process_creation
detection:
  selection_wmic:
    Image|endswith: 
      - '\wmic.exe'
    CommandLine|contains:
      - "__EventFilter"
      - "CommandLineEventConsumer"
      - "FilterToConsumerBinding"
  selection_powershell:
    Image|endswith:
      - '\powershell.exe'
    CommandLine|contains:
      - "Register-WmiEvent"
      - 'root\\subscription'
  filter_system:
    User: "SYSTEM"
  condition: (selection_wmic or selection_powershell) and not filter_system
level: high
tags:
  - attack.t1546.003
  - attack.t1546
falsepositives:
  - enterprise monitoring agent
