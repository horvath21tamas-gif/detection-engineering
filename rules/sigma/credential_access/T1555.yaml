title: Detektalni, amikor nem a bongeszo folyamata fer hozza a bongeszo credential storejahoz
id: 1
status: experimental
description:
author: hota05
date: 2026/01/13
logsource:
  product: windows
  category: file_event
detection:
  selection_browser:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\brave.exe'
      - '\firefox.exe'
  selection_access:
    TargetFileName|contains:
      - '\User Data\'
      - "Login Data"
  condition: selection_access and not selection_browser
level: medium
tags:
  -attack.t1555
falsepositves:
  - jelszotarolo general riasztast
  - bongeszo update
  - backup agent
