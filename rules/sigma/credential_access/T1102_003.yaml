title: Ultra-Pro High-Fidelity One-Way Web Service C2 (T1102.003)
id: 28c21701-5a23-4265-9c52-382e7b96dfd9
status: stable
description: |
    Detects one-way C2 or data exfiltration via cloud services by correlating 
    specific API upload/download methods with non-standard process locations 
    and suspicious parent process lineages.
author: hota05
date: 2026-02-09
tags:
    - attack.command_and_control
    - attack.t1102.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_api_patterns:
        CommandLine|contains:
            - '/webhooks/'                    
            - 'api.telegram.org/bot'          
            - 'raw.githubusercontent.com'      
            - 'transfer.sh'                   
            - 'file.io'                       
            - 'pastebin.com/raw/'             
            - 'webhook.site'                  

    selection_context:
        Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
            - '\PerfLogs\'
            - '\Windows\Tasks\'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\curl.exe'
            - '\certutil.exe'
            - '\bitsadmin.exe'

    selection_logic:
        CommandLine|contains:
            - ' -F '                          
            - ' --data '                    
            - ' -d '
            - 'downloadstring'                
            - 'invoke-webrequest'
            - 'uploadfile'

    filter_legit_automation:
        - Image|contains:
            - '\Program Files\'                
            - '\Program Files (x86)\'
        - CommandLine|contains:
            - 'chocolatey'                     
            - 'microsoft.com'                 
            - 'pnp.microsoft.com'
        - User: 'NT AUTHORITY\SYSTEM'         
        - ParentImage|endswith:
            - '\services.exe'

    condition: selection_api_patterns and selection_context and selection_logic and not filter_legit_automation
level: critical
