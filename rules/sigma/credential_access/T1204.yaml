title: Suspicious Child Process Spawned by Microsoft Office Application (High Fidelity)
id: f10bd85f-3d32-44dd-8dfb-627c6d957421
status: stable
description: >
  Detects suspicious child processes spawned by Microsoft Office
  applications that are indicative of macro abuse, DDE exploitation,
  or document-based malware execution. The rule focuses on attacker-
  typical child processes, command-line patterns, and user-writable
  execution context to minimize false positives.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1204/

logsource:
  product: windows
  category: process_creation

detection:

  office_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
      - '\MSACCESS.EXE'

  suspicious_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\bitsadmin.exe'
      - '\certutil.exe'
      - '\wscript.exe'
      - '\cscript.exe'

  suspicious_commandline:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '-enc'
      - 'Invoke-Expression'
      - 'IEX'
      - 'DownloadString'
      - 'FromBase64String'
      - '/c'
      - '/r'

  suspicious_execution_path:
    CommandLine|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\Microsoft\Office\'
      - '\INetCache\'

  filter_legit_addins:
    ParentCommandLine|contains:
      - '\Addins\'
      - '\VSTO\'
      - '\Program Files\Microsoft Office\'

  filter_service_accounts:
    User|contains:
      - 'SYSTEM'
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'

  condition: >
    office_parent
    and suspicious_child
    and (
      suspicious_commandline
      or suspicious_execution_path
    )
    and not (
      filter_legit_addins
      or filter_service_accounts
    )

falsepositives:
  - Rare developer automation using Office COM
  - Approved red team / phishing simulation exercises

level: high

tags:
  - attack.execution
  - attack.t1204
  - attack.t1059
