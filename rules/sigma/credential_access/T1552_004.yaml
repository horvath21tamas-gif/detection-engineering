title: Ultra-Pro High-Fidelity Private Key Discovery (T1552.004)
id: 9c73f483-f6ac-4c8a-bbce-b8d6d9304332
status: stable
description: |
    Detects targeted discovery of private cryptographic keys (SSH, PGP, Certificates). 
    Focuses on command-line content searches for private key headers and recursive 
    directory traversal by untrusted processes.
author: hota05
date: 2026-02-04
tags:
    - attack.credential_access
    - attack.t1552.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_content_headers:
        CommandLine|contains:
            - 'BEGIN RSA PRIVATE'
            - 'BEGIN DSA PRIVATE'
            - 'BEGIN EC PRIVATE'
            - 'BEGIN OPENSSH PRIVATE'
            - 'BEGIN PGP PRIVATE'
            - 'BEGIN PRIVATE KEY' 

    selection_extensions:
        CommandLine|contains:
            - '.ppk'   
            - '.pem'   
            - '.key'
            - '.pfx'   
            - 'id_rsa' 

    selection_recursive:
        - CommandLine|contains:
            - 'findstr'
            - '/s'    
        - CommandLine|contains:
            - 'grep'
            - '-r'     
        - CommandLine|contains|all:
            - 'Get-ChildItem'
            - '-Recurse'

    selection_untrusted_context:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\wsmprovhost.exe'
            - '\psexesvc.exe'    
            - '\httpd.exe'       
        Image|endswith:
            - '\findstr.exe'
            - '\grep.exe'
            - '\powershell.exe'

    filter_legit_tools:
        username: 'NT AUTHORITY\SYSTEM'
        Image|contains:
            - '\OpenSSH\ssh-agent.exe'
            - '\Git\usr\bin\ssh.exe'
            - '\Microsoft Visual Studio\'
            - '\Windows\System32\certutil.exe'

    condition: (selection_content_headers or selection_extensions) and selection_recursive and selection_untrusted_context and not filter_legit_tools
level: high
