name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Ez kell a Sentinelnek, de a QRadar is futni fog rajta

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. Alapcsomagok és a sigma-cli telepítése
          python -m pip install "pysigma>=1.1.0" "pyparsing>=3.0.0" "packaging>=25.0" sigma-cli
          
          # 2. A stabil backendek telepítése (ezek nem okoznak verzióütközést)
          sigma plugin install splunk sysmon windows netwitness elasticsearch
          
          # 3. QRadar és Azure (Sentinel) telepítése manuálisan PIP-en keresztül.
          # Így elkerüljük a sigma-cli interaktív kérdéseit és a verzióvisszalépést.
          python -m pip install pysigma-backend-qradar pysigma-backend-azure
          
          # 4. KRITIKUS LÉPÉS: Kényszerítjük a friss pysigma-t, ha a qradar butított volna rajta
          python -m pip install --upgrade "pysigma>=1.1.0" "pyparsing>=3.0.0"
      - name: Update Dynamic Inventory from SIEM
        run: |
          mkdir -p inventory
          python tools/update_inventory.py

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Log Source Validation
        run: |
          python tools/check_log_sources.py

      - name: Run Simulation Tests (Logic Verification)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/test_detection_logic.py -v || echo "⚠️ Szimulációs tesztek sikertelenek."

      - name: Run Unit Tests (General)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --ignore=test/test_detection_logic.py --maxfail=5 --disable-warnings -q || echo "Nincsenek általános tesztek."

      - name: Preprocess Sigma rules
        run: python tools/preprocess_sigma.py

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/elastic rules/sentinel
          
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            
            # SPLUNK
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "Splunk error"
            
            # QRADAR (Nyersen, pipeline nélkül)
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "QRadar error"
            
            # RSA NETWITNESS (Nyersen)
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "RSA error"
            
            # ELASTIC
            sigma convert -t lucene -p ecs_windows "$file" -o "rules/elastic/${filename}.kql" || echo "Elastic error"

            # SENTINEL (ÚJ)
            sigma convert -t sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "Sentinel error"
          done

      - name: Final SIEM Query Fixer (QRadar & NetWitness)
        run: python tools/final_siem_fixer.py

      - name: Run Integrity Check
        run: |
          python tools/check_integrity.py

      - name: Calculate Rule Scores
        if: github.event_name == 'push'
        run: python tools/score_rules.py

      - name: Generate MITRE Layer, Wiki, Playbooks and Gap Analysis
        if: github.event_name == 'push'
        run: |
          python tools/generate_nav_layer.py
          python tools/generate_docs.py
          python tools/gap_analysis.py

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          git add rules/ inventory/ test/
          git add DETECTION_WIKI.md GAP_ANALYSIS.md rule_scores.json
          git add attack_navigator_layer.json COVERAGE.md README.md *.svg
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Elastic (ELK) & Sentinel support, Dynamic Inventory & Docs"
            git pull --rebase -X ours origin test
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

      - name: Check Validation Status
        if: always()
        run: |
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált korábban. A folyamat leáll."
            exit 1
          fi
