title: High-Fidelity Cloud Account Compromise (Entra ID)
id: aca8a6d8-5b13-48c7-9b94-3f5cfb79a295
status: stable
description: |
    Detects successful cloud logons that exhibit high-risk indicators: 
    MFA bypass on privileged accounts, impossible travel patterns, 
    or the use of non-standard automation User-Agents by human accounts.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1078/004/
tags:
    - attack.initial_access
    - attack.t1078.004
logsource:
    product: azure
    service: signinlogs
detection:
    selection_success:
        properties.status.errorCode: 0

    selection_privileged_risk:
        properties.userPrincipalName|contains:
            - 'admin'
            - 'sync_'
            - 'global'
        properties.authenticationRequirement: 'singleFactorAuthentication'

    selection_ua_anomaly:
        properties.userAgent|contains:
            - 'python-requests'
            - 'curl'
            - 'Postman'
            - 'PowerShell'

    filter_trusted_locations:
        properties.ipAddress:
            - '1.2.3.4' # HQ IP
        properties.location.city:
            - 'Budapest'

    filter_known_service_principals:
        properties.authenticationProtocol: 'servicePrincipal'

    condition: selection_success and (selection_privileged_risk or selection_ua_anomaly) and not (filter_trusted_locations or filter_known_service_principals)
level: critical
