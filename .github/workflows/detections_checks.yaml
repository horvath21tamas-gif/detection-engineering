name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test  # Ez az ág, amelyre a push esemény történik
    paths:
      - 'rules/sigma/**'  # Figyeljük a rules/sigma mappát és annak minden fájlját
  pull_request:
    branches:
      - test  # Pull request események is triggerelhetik
    paths:
      - 'rules/sigma/**'  # Figyeljük a pull request-eket is, ha a rules/sigma mappában történik változtatás

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml sigma splunk-rule-validator

  run_tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run unit tests
        run: |
          pytest tests/ --maxfail=5 --disable-warnings -q

  lint_rules:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run rule linting
        run: |
          python tools/lint_rules.py

  validate_rules:
    runs-on: ubuntu-latest
    needs: lint_rules
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Validate Sigma rules
        run: |
          for rule in rules/sigma/*/*.yaml; do
            sigma validate "$rule"
          done

      - name: Validate Splunk rules
        run: |
          for rule in rules/splunk/*.spl; do
            splunk_rule_validator "$rule"
          done

  update_readme:
    runs-on: ubuntu-latest
    needs: validate_rules
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update README.md with new Sigma rules
        run: |
          python tools/update_readme.py

  deploy:
    runs-on: ubuntu-latest
    needs: update_readme
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy detection rules (optional)
        run: |
          echo "Deploying detection rules..."
