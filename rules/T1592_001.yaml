title: High-Confidence Hardware Enumeration via Management Interfaces
id: 1bf4176a-cc8a-47d0-9cc0-c2dd7572ab0c
status: stable
description: >
  Detects high-confidence reconnaissance activity where an external
  source attempts to enumerate hardware characteristics such as CPU,
  architecture, memory, or device model via management or embedded
  system interfaces. The rule is optimized to minimize false positives
  by focusing on automated probing behavior.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1592/001/

logsource:
  product: generic
  category: webserver

detection:

  selection_external:
    SrcIp|startswith:
      - '1.'
      - '2.'
      - '3.'
      - '4.'
      - '5.'
      - '6.'
      - '7.'
      - '8.'
      - '9.'

  selection_hw_endpoints:
    UriStem|contains:
      - '/system'
      - '/hardware'
      - '/device'
      - '/diagnostics'
      - '/status'
      - '/mgmt'
      - '/management'
      - '/admin'
      - '/cgi-bin'

  selection_hw_keywords:
    UriQuery|contains:
      - 'cpu'
      - 'cores'
      - 'architecture'
      - 'arch'
      - 'model'
      - 'vendor'
      - 'manufacturer'
      - 'serial'
      - 'board'
      - 'chip'
      - 'memory'
      - 'ram'

  selection_automation_ua:
    UserAgent|contains:
      - 'curl'
      - 'wget'
      - 'python'
      - 'httpclient'
      - 'go-http-client'
      - 'libwww'
      - 'probe'

  filter_browsers:
    UserAgent|contains:
      - 'Mozilla'
      - 'Chrome'
      - 'Safari'
      - 'Firefox'
      - 'Edge'

  filter_known_tools:
    UserAgent|contains:
      - 'nessus'
      - 'qualys'
      - 'openvas'
      - 'acunetix'
      - 'nikto'
      - 'nuclei'
      - 'zap'
      - 'zabbix'
      - 'uptime'
      - 'pingdom'

  filter_noise:
    UriStem|endswith:
      - '.css'
      - '.js'
      - '.png'
      - '.jpg'
      - '.svg'
      - '.ico'
      - '.woff'
      - '.woff2'
      - '.json'
    UriStem|contains:
      - '/api'


  condition: >
    selection_external
    and selection_hw_endpoints
    and selection_hw_keywords
    and selection_automation_ua
    and not (
      filter_browsers
      or filter_known_tools
      or filter_noise
    )

fields:
  - SrcIp
  - UriStem
  - UriQuery
  - UserAgent
  - Status

falsepositives:
  - Vendor support accessing hardware management interfaces from external networks
  - Approved red team activity not allowlisted

level: high

tags:
  - attack.reconnaissance
  - attack.t1592
  - attack.t1592.001
