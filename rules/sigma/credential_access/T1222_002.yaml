title: Linux File Permissions Modification (T1222.002)
id: 2b31af57-fd08-40fa-b4af-cedb8e3b7472
status: stable
description: >
    Detects targeted Linux permission tampering by identifying high-risk 
    attribute changes such as SUID, immutable, or append-only flags, as well as 
    mass permission modifications in sensitive system paths. Focuses on actions 
    initiated by unprivileged or web-facing service accounts while filtering out 
    trusted system operations.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1222.002
logsource:
    product: linux
    category: process_creation
detection:
    selection_tools:
        Image|endswith:
            - '/chmod'
            - '/chown'
            - '/chattr'

    selection_dangerous_flags:
        CommandLine|contains:
            - '+s'
            - 'u+s'
            - '+i'
            - '+a'
            - '777'
            - '666'
            - ' +x '

    selection_critical_paths:
        CommandLine|contains:
            - '/etc/shadow'
            - '/etc/sudoers'
            - '/etc/passwd'
            - '/root/.ssh'
            - '/var/spool/cron'
            - '/etc/crontab'
            - '/bin/sh'
            - '/bin/bash'

    selection_untrusted_users:
        username:
            - 'www-data'
            - 'apache'
            - 'nginx'
            - 'nobody'
            - 'mysql'
            - 'postgres'

    selection_suspicious_source:
        CommandLine|contains:
            - '/tmp/'
            - '/dev/shm/'
            - '/var/tmp/'

    filter_trusted_system:
        ParentImage|endswith:
            - '/bin/apt'
            - '/bin/dpkg'
            - '/bin/yum'
            - '/bin/dnf'
            - '/bin/rpm'
            - '/sbin/cloud-init'
        CommandLine|contains:
            - ' --help'
            - ' --version'

    condition: selection_tools 
               and ((selection_dangerous_flags and selection_suspicious_source) 
                    or selection_critical_paths 
                    or selection_untrusted_users) 
               and not filter_trusted_system
level: high
