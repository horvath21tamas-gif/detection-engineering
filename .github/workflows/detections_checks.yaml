name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches: 
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. Alap CLI és backendek telepítése
          python -m pip install sigma-cli \
            pysigma-backend-splunk \
            pysigma-backend-qradar \
            pysigma-backend-insightidr \
            pytest "pyyaml>=6.0"
          
          # 2. Pyparsing fix (ez már bizonyítottan működik)
          python -m pip uninstall -y pyparsing
          python -m pip install "pyparsing==3.1.4"
          
          # 3. Microsoft Sentinel backend telepítése (PIP-es verzió kényszerítése)
          python -m pip install pySigma-backend-microsoft-sentinel || sigma plugin install microsoft-sentinel

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          # A hibás --version sort töröltük, csak a validáció fut
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek."

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/sentinel
          rm -f rules/splunk/*.spl rules/qradar/*.aql rules/netwitness/*.txt rules/sentinel/*.kql
          
          # Ellenőrizzük, hogy látja-e a backendeket (diagnosztika)
          sigma list targets
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk konverzió
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba"
            
            # QRadar konverzió
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba"
            
            # NetWitness konverzió
            sigma convert -t insightidr "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ NetWitness hiba"

            # Microsoft Sentinel konverzió
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || \
            sigma convert -t sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "⚠️ Sentinel hiba"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: SIEM rules and dashboard"
            git pull --rebase origin test
            git push origin test
          fi

          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált."
            exit 1
          fi
