title: Credential Service Exploitation Detection (T1212)
id: e8c2f9b4-6a3d-4c88-9f4d-2b1a5e7f9c88
status: stable
description: |
    Detects potential exploitation of Windows authentication services 
    (LSASS, LogonUI, Spooler, LSM) by monitoring:
    - Illegal child processes spawned by credential services
    - Memory injection / reflective loading / pipe abuse attempts
    - Suspicious execution from user temp or download directories
    Excludes legitimate security agent activity and Windows Error Reporting.

author: hota05
date: 2026-02-20
references:
    - https://attack.mitre.org/techniques/T1212/
tags:
    - attack.credential_access
    - attack.t1212
logsource:
    category: process_creation
    product: windows

detection:
    selection_illegal_spawn:
        ParentImage|endswith:
            - '\lsass.exe'
            - '\logonui.exe'
            - '\lsm.exe'
            - '\spoolsv.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\net.exe'
            - '\whoami.exe'
            - '\nltest.exe'
            - '\rundll32.exe'
            - '\mimikatz.exe'

    selection_exploit_cmd:
        CommandLine|contains:
            - ' -inject '
            - ' -leak '
            - ' --pipe '
            - 'reflectiveloader'
            - 'sekurlsa'
            - 'lsass::memory'
            - 'procdump'
            - 'SharpDump'
            - 'Invoke-Mimikatz'

    selection_suspicious_source:
        ParentImage|contains:
            - '\Users\'
            - '\AppData\Local\Temp\'
            - '\Downloads\'
            - '\Public\'

    filter_legit_wer:
        Image|endswith: '\WerFault.exe'
        ParentImage|endswith: '\lsass.exe'

    filter_security_agents:
        Image|contains:
            - '\CrowdStrike\'
            - '\SentinelOne\'
            - '\Windows Defender\'
            - '\Microsoft Defender ATP\'
            - '\CarbonBlack\'
        User|startswith:
            - 'NT AUTHORITY\SYSTEM'

    condition: 
        (selection_illegal_spawn or selection_exploit_cmd or selection_suspicious_source) 
        and not (filter_legit_wer or filter_security_agents)

fields:
    - User
    - Image
    - ParentImage
    - CommandLine
    - IntegrityLevel
    - CurrentDirectory
    - Hashes

falsepositives:
    - Approved memory dump / credential audit tools (ProcDump, Task Manager, Sysinternals)
    - Security software internal tests or scripts
    - Windows Error Reporting (WerFault) interactions with LSASS

level: critical
