name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sigma-cli pysigma-backend-splunk pytest "pyyaml>=6.0"
          sigma plugin install splunk sysmon windows netwitness
          sigma plugin install --force-install qradar || echo "QRadar forced"
          python -m pip install --upgrade "pysigma>=1.1.0" "pyparsing>=3.0.0" sigma-cli

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek vagy hiba történt."

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar rules/netwitness
          rm -f rules/splunk/*.spl rules/qradar/*.aql rules/netwitness/*.txt
          
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba: $file"
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || \
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba: $file"
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ RSA hiba: $file"
          done

      - name: Run Integrity Check
        run: |
          python tools/check_integrity.py

      - name: Calculate Rule Scores
        if: github.event_name == 'push'
        run: |
          # Ez a lépés generálja a rule_scores.json fájlt a Wiki számára
          python tools/score_rules.py

      - name: Generate MITRE Layer and Wiki Docs
        if: github.event_name == 'push'
        run: |
          python tools/generate_nav_layer.py
          python tools/generate_docs.py

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Hozzáadjuk a SIEM szabályokat
          git add rules/splunk/ rules/qradar/ rules/netwitness/
          
          # Hozzáadjuk a dokumentációt ÉS az új pontszám JSON-t
          git add DETECTION_WIKI.md attack_navigator_layer.json rule_scores.json
          
          # Hozzáadjuk a dashboard elemeket
          git add COVERAGE.md README.md *.svg
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard, SIEM rules, MITRE Layer, Scores & Wiki"
            
            git pull --rebase -X ours origin test
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

      - name: Check Validation Status
        if: always()
        run: |
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált korábban. A folyamat leáll."
            exit 1
          fi
