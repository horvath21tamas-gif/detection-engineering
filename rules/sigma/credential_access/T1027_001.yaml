title: Binary Padding Activity (T1027.001)
id: 900c3f77-a105-4247-96e2-319e97eb1dc6
status: stable
description: >
  Detects malicious binary padding attempts where attackers artificially inflate
  file sizes to bypass security scanners or modify file hashes. Focuses on 
  fsutil, dd, and binary copy commands targeting executables and system files
  in suspicious directories, while filtering legitimate system operations.

author: hota05
date: 2026-02-23
tags:
  - attack.defense_evasion
  - attack.t1027.001

logsource:
  product: windows
  category: process_creation

detection:
  selection_tools:
    CommandLine|contains:
      - 'fsutil file setzero'
      - 'fsutil file seteof'
      - 'dd if='
      - 'copy /b'

  selection_extensions:
    CommandLine|contains:
      - '.exe'
      - '.dll'
      - '.ocx'
      - '.sys'
      - '.scr'

  selection_paths:
    CommandLine|contains:
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'
      - '\Downloads\'
      - '\PerfLogs\'

  filter_trusted_processes:
    Image|startswith:
      - 'C:\Windows\System32\msiexec.exe'
      - 'C:\Windows\System32\CompatTelRunner.exe'
      - 'C:\Program Files\Common Files\Microsoft Shared\'
    username: 'NT AUTHORITY\SYSTEM'

  condition: selection_tools and selection_extensions and selection_paths and not filter_trusted_processes

falsepositives:
  - Legitimate use of fsutil or dd by IT or backup scripts
  - Binary operations during automated deployments in trusted directories

level: high
