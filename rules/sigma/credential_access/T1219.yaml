title: Suspicious Service Creation via Remote Administration Tools Outside Approved Management Scope
id: b132d51c-1bc1-4f6c-a1c8-337dc5dfefff
status: stable
description: >
  Detects the creation of Windows services commonly associated with
  legitimate remote administration tools (e.g., PsExec, PAExec, RemCom)
  when executed outside approved enterprise management patterns.

  Adversaries frequently abuse these tools for lateral movement by
  remotely creating temporary services on target systems. The rule
  filters known management hosts, service accounts, and approved
  enterprise tooling paths to reduce false positives.

author: hota05
date: 2026/02/20
references:
  - https://attack.mitre.org/techniques/T1219/
  - https://attack.mitre.org/techniques/T1021/

logsource:
  product: windows
  category: service_creation

detection:

  selection_remote_admin_services:
    ServiceName|startswith:
      - 'PSEXEC'
      - 'PAExec'
      - 'RemCom'
      - 'CSEXEC'
      - 'ATSVC'

  selection_suspicious_binary_path:
    ImagePath|contains:
      - '\ADMIN$'
      - '\C$\Windows\'
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'

  filter_legit_management_hosts:
    Computer|startswith:
      - 'MGMT-'
      - 'SCCM-'
      - 'DEPLOY-'
      - 'ADMIN-'

  filter_legit_service_accounts:
    User|contains:
      - 'svc_'
      - 'admin_'
      - 'deploy'
      - 'sccm'
      - 'ansible'
      - 'pdq'

  filter_legit_tooling_paths:
    ImagePath|contains:
      - '\Windows\CCM\'
      - '\Microsoft Configuration Manager\'
      - '\PDQ\'
      - '\Ivanti\'
      - '\ManageEngine\'
      - '\Tanium\'

  condition: >
    selection_remote_admin_services
    and (selection_suspicious_binary_path
        or not (filter_legit_management_hosts
            or filter_legit_service_accounts
            or filter_legit_tooling_paths))

falsepositives:
  - Approved penetration testing activities
  - Red team / purple team operations
  - Emergency IT troubleshooting from non-standard hosts
  - Temporary admin activity during incident response

level: high

tags:
  - attack.lateral_movement
  - attack.execution
  - attack.t1219
  - attack.t1021
  - attack.windows
  - attack.defense_evasion
