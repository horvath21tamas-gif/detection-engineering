title: Ultra-Pro Outlook Home Page Hijacking & Bypass (T1137.004)
id: 45fd419d-b509-4ed8-ae1d-45b41f53a062
status: stable
description: |
    Detects unauthorized modification of Outlook Folder Home Pages and the 
    enabling of WebView bypass keys. This technique is used to execute 
    arbitrary code when a user clicks on an Outlook folder.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1137.004
logsource:
    product: windows
    category: registry_event
detection:
    selection_registry:
        TargetObject|contains: '\Software\Microsoft\Office\'
        TargetObject|endswith:
            - '\Outlook\WebView\URL'              
            - '\Outlook\Security\EnableRoamingFolderHomepages' 
            - '\Outlook\Security\EnableExternalFolderHomepages'

    selection_suspicious_values:
        - Details|contains: 
            - 'http'
            - 'script'
            - 'file://'
            - 'C:\Users\Public'
            - 'C:\Windows\Temp'

    selection_unauthorized_editor:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\reg.exe'
            - '\cscript.exe'
            - '\wscript.exe'

    filter_trusted:
        Details|contains:
            - 'https://outlook.office365.com'
            - 'res://' 
        Image|endswith: '\gpscript.exe'

    condition: selection_registry and (selection_suspicious_values or selection_unauthorized_editor) and not filter_trusted
level: critical
