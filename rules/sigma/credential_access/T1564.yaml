title: Hide Artifacts Detection (T1564)
id: 09afb312-767c-4b0b-98fb-e7c57145d81e
status: stable
description: |
  Detects targeted artifact hiding techniques including:
  - NTFS Alternative Data Streams (ADS)
  - Registry-based user account hiding
  - Suspicious file attribute manipulation
  Initiated by untrusted parent processes or from user-writable/non-standard paths.
author: hota05
date: 2026-02-11
tags:
  - attack.defense_evasion
  - attack.t1564
  - attack.t1564.001
  - attack.t1564.002
  - attack.t1564.004
logsource:
  product: windows
  category: process_creation

detection:
  selection_attrib_stealth:
    Image|endswith: '\attrib.exe'
    CommandLine|contains|all:
      - ' +h'
      - ' +s'

  selection_ads_redirection:
    CommandLine|contains:
      - ' > *:*'
      - 'type *:*'
      - 'expand *:*'
      - 'makecab *:*'
      - 'findstr /v *:*'
      - 'start *:*'

  selection_registry_hide:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
      - 'SpecialAccounts\UserList'
      - ' /d 0'  # DWORD 0 = hidden

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\browser.exe'

  selection_suspicious_paths:
    CommandLine|contains:
      - '\Users\Public\'
      - '\Windows\Temp\'
      - '\AppData\Roaming\'
      - '\Downloads\'

  filter_trusted_system:
    User: 'NT AUTHORITY\SYSTEM'
    ParentImage|contains:
      - '\Windows\servicing\TrustedInstaller.exe'
      - '\CcmExec.exe'
      - '\Windows\System32\wbem\WMIC.exe'
    CommandLine|contains:
      - 'AppData\Local\Packages'
      - 'desktop.ini'
      - 'Program Files'

  condition: 
    (selection_attrib_stealth or selection_ads_redirection or selection_registry_hide) and
    (selection_suspicious_parent or selection_suspicious_paths) and
    not filter_trusted_system

fields:
  - Time
  - SourceImage
  - ParentImage
  - CommandLine
  - SourceUsername
  - TargetFilePath
  - FileAttributes

falsepositives:
  - Sysadmin scripts hiding desktop.ini or temp files
  - Automated installers or packaging tools modifying file attributes
  - Legitimate ADS usage in backup or archival scripts

level: high
