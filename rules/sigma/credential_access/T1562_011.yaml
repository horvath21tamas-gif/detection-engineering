title: Ultra-Pro High-Fidelity Virtualization and Sandbox Evasion (T1564.011)
id: 1b14b775-b527-4763-8aff-7399bda480ef
status: stable
description: |
    Detects targeted environment fingerprinting used by malware to detect virtualization, 
    sandboxes, or analysis environments. Focuses on WMI hardware queries, MAC address OUI 
    checks, and VM-specific driver searches from untrusted process chains.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1562.011
logsource:
    product: windows
    category: process_creation
detection:
    selection_wmi_evasion:
        Image|endswith: 
            - '\wmic.exe'
            - '\wbem\wmiprvse.exe'
        CommandLine|contains:
            - 'baseboard get manufacturer'
            - 'bios get serialnumber'
            - 'computersystem get model'
            - 'csproduct get uuid'
        CommandLine|contains:
            - 'VMware'
            - 'Virtual'
            - 'VBOX'
            - 'QEMU'
            - 'Xen'

    selection_network_fingerprint:
        CommandLine|contains:
            - 'getmac'
            - 'ipconfig /all'
            - 'netsh interface show interface'
            - 'arp -a'

    selection_driver_checks:
        CommandLine|contains:
            - 'VBoxGuest'
            - 'vmtoolsd'
            - 'vmmouse'
            - 'vboxguest.sys'
            - 'vmsrvc'
            - 'vmusbmouse'

    selection_suspicious_context:
        - ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\w3wp.exe'
            - '\mshta.exe'
        - Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Downloads\'

    filter_trusted_inventory_tools:
        - Image|contains:
            - '\Program Files\Lansweeper\'
            - '\Program Files\SCCM\'
            - '\Program Files\Tanium\'
            - '\Windows\System32\ServerManager.exe'
        - username: 'NT AUTHORITY\SYSTEM'

    condition: (selection_wmi_evasion or selection_network_fingerprint or selection_driver_checks) and (selection_suspicious_context and not filter_trusted_inventory_tools)
level: high
