title: Ultra-Pro Pre-OS Boot Manipulation (T1542)
id: d614824d-459b-4d52-b24a-6ea4190f340e
status: stable
description: |
    Detects unauthorized firmware or bootloader modifications. Monitors for 
    suspicious mounting of the EFI partition, unauthorized use of firmware 
    flashing tools, and UEFI variable manipulation from non-standard parent processes.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1542
logsource:
    product: windows
    category: process_creation
detection:
    selection_firmware_tools:
        - Image|endswith:
            - '\flashrom.exe'
            - '\FPTW64.exe'    
            - '\AfuEfix64.exe' 
            - '\H2OFFT-W.exe'  
        - OriginalFileName:
            - 'FPTW64.exe'
            - 'flashrom.exe'

    selection_efi_mount:
        Image|endswith: '\mountvol.exe'
        CommandLine|contains: ' /s'

    selection_unauthorized_issuer:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\wmiprvse.exe'

    filter_trusted_updaters:
        ParentImage|contains:
            - '\Dell\CommandUpdate\'
            - '\Lenovo\SystemUpdate\'
            - '\HP\HP Support Assistant\'
        Image|contains: 'C:\Windows\System32\SystemSettingsAdminFlows.exe'

    condition: (selection_firmware_tools or selection_efi_mount) and selection_unauthorized_issuer and not filter_trusted_updaters
level: critical
