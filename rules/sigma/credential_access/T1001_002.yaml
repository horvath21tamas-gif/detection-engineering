title: Steganography & Data Reconstruction (T1001.002)
id: f3bc15b3-8067-4e88-a575-e1c2899f10ad
status: stable
description: |
  Detects programmatic extraction of hidden data from images (de-steganography) by monitoring:
  - Pixel-level access routines (GetPixel, LockBits)
  - GDI+ / System.Drawing API usage
  - Script interpreter or suspicious process execution contexts
author: hota05
date: 2026-02-09
tags:
  - attack.command_and_control
  - attack.t1001.002

logsource:
  category: process_creation
  product: windows

detection:
  selection_stego_logic:
    CommandLine|contains:
      - 'GetPixel'
      - 'LockBits'
      - 'Bitmap.new'
      - 'System.Drawing.'
      - 'windowscodecs.dll'

  selection_script_procs:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\rundll32.exe'
      - '\mshta.exe'
      - '\cscript.exe'
      - '\wscript.exe'

  selection_suspicious_context:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\w3wp.exe'

  filter_legit_apps:
    Image|contains:
      - '\Adobe\'
      - '\Microsoft Office\'
      - '\PhotosApp.exe'
      - '\Snagit\'
    CommandLine|contains:
      - 'C:\Program Files\'
    username: 'NT AUTHORITY\SYSTEM'

  condition: (selection_stego_logic and (selection_script_procs or selection_suspicious_context)) and not filter_legit_apps

level: critical
