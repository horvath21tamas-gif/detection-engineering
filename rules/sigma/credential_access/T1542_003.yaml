title: Ultra-Pro Bootkit Persistence & EFI Tampering (T1542.003)
id: ed77f5f6-ce71-4d5e-baa3-577e799a32ce
status: stable
description: |
    Detects unauthorized bootloader modification by monitoring for BCD integrity bypasses, 
    manual EFI partition mounting, and suspicious boot path redirection. 
    Filters out legitimate OS repairs and BitLocker operations.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1542.003
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        - Image|endswith: 
            - '\mountvol.exe'
            - '\bcdedit.exe'
        - OriginalFileName: 
            - 'mountvol.exe'
            - 'bcdedit.exe'

    selection_suspicious_args:
        CommandLine|contains:
            - ' /s'                    
            - 'nointegritychecks'     
            - 'testsigning'            
            - 'loadoptions DDISABLE_INTEGRITY_CHECKS'
            - 'path \EFI\'             
            - 'recoveryenabled no'    

    selection_unauthorized_issuer:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\psexec.exe'
            - '\python.exe'
        Image|contains:
            - '\Users\'
            - '\Temp\'

    filter_trusted_system:
        - ParentImage|endswith: '\svchost.exe'
        - Image|contains: 'C:\Windows\System32\SystemSettingsAdminFlows.exe'
        - CommandLine|contains: 'recoverysequence' 

    condition: selection_tools and selection_suspicious_args and selection_unauthorized_issuer and not filter_trusted_system
level: critical
