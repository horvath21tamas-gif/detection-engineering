title: Scheduled Transfer (T1029)
id: 7212cee0-8c78-43ed-a05f-90ada4c168d4
status: stable
description: >
  Detects creation of scheduled tasks for automated data exfiltration by analyzing
  Task XML for suspicious command-line tools, cloud-sync arguments, and high-frequency
  or off-hours triggers. Filters out legitimate system updates and enterprise
  management tasks.

author: hota05
date: 2026-02-23
tags:
  - attack.exfiltration
  - attack.t1029
  - attack.execution

logsource:
  product: windows
  service: security

detection:
  selection_action:
    EventData|contains:
      - '\rclone.exe'
      - '\bitsadmin.exe'
      - '\certutil.exe'
      - '\megatools.exe'
      - 'curl '
      - 'powershell'

  selection_logic:
    EventData|contains:
      - ' sync '
      - ' upload '
      - ' -post '
      - ' -transfer '
      - ' -ExecutionPolicy Bypass '
      - 'WebClient.UploadFile'

  selection_trigger:
    EventData|contains:
      - '<Interval>PT5M</Interval>'
      - '<Interval>PT10M</Interval>'
      - '<StartBoundary>202[0-9]-[0-9]{2}-[0-9]{2}T0[0-3]:'

  filter_legit:
    - EventData|contains:
        - '\Windows\System32\Tasks\Microsoft'
        - '\Program Files\'
    - SubjectUserName:
        - 'SYSTEM'
    - EventData|contains:
        - 'Telemetry'
        - 'Windows Update'

  condition: >
    selection_action
    and (selection_logic or selection_trigger)
    and not filter_legit

falsepositives:
  - Legitimate Windows Update scheduled tasks
  - Enterprise deployment or SCCM/MECM automation tasks
  - Internal telemetry and monitoring scripts
  - Red team or security testing automation

level: critical
