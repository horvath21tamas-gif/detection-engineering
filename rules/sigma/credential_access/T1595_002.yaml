title: High-Confidence External Vulnerability Scanning Activity
id: 91f59502-9c2d-4f1e-b2a7-159500200002
status: stable
description: >
  Detects high-confidence vulnerability scanning activity by
  correlating aggressive request behavior, exploit discovery
  paths, payload indicators, and known scanner tooling.
  Optimized to minimize false positives in enterprise environments.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1595/002/

logsource:
  product: generic
  category: webserver

detection:

  selection_external:
    SrcIp|startswith:
      - '1.'
      - '2.'
      - '3.'
      - '4.'
      - '5.'
      - '6.'
      - '7.'
      - '8.'
      - '9.'

  selection_offensive_ua:
    UserAgent|contains:
      - 'nuclei'
      - 'sqlmap'
      - 'nikto'
      - 'acunetix'
      - 'wpscan'
      - 'zgrab'

  selection_exploit_paths:
    UriStem|contains:
      - '/.env'
      - '/.git'
      - '/vendor/phpunit'
      - '/phpmyadmin'
      - '/cgi-bin'
      - '/wp-config'
      - '/wp-admin'
      - '/actuator'
      - '/console'

  selection_exploit_payloads:
    UriQuery|contains:
      - '../'
      - '%2e%2e'
      - 'cmd='
      - 'exec='
      - 'shell'
      - 'whoami'
      - 'id='
      - 'base64'
      - 'payload='

  selection_scan_responses:
    Status:
      - 400
      - 401
      - 403
      - 404
      - 405
      - 500
      - 502
      - 503

  timeframe: 60s

  filter_allowed_scanners:
    SrcIp:
      - '203.0.113.10'
      - '203.0.113.11'

  filter_legit_bots:
    UserAgent|contains:
      - 'googlebot'
      - 'bingbot'
      - 'uptimerobot'
      - 'pingdom'
      - 'statuscake'
      - 'datadog'
      - 'newrelic'

  condition: >
    selection_external
    and selection_scan_responses
    and (
      selection_offensive_ua
      or (
        selection_exploit_paths
        and selection_exploit_payloads
      )
    )
    and not (
      filter_legit_bots
      or filter_allowed_scanners
    )

fields:
  - SrcIp
  - UriStem
  - UriQuery
  - Status
  - UserAgent

falsepositives:
  - Approved external penetration tests not yet allowlisted
  - Newly onboarded security vendors performing scans

level: high

tags:
  - attack.reconnaissance
  - attack.t1595
  - attack.t1595.002
