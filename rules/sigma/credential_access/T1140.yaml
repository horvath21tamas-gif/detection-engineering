title: Stealthy Deobfuscation/Decoding (T1140)
id: e0f0c9b6-01b4-4cd8-b505-9eeae318a7d4
status: stable
description: |
    Detects deobfuscation and decoding activity by monitoring:
      - Native Windows tools (certutil, expand, extrac32)
      - Decoding binaries from non-executable sources (txt, jpg, xml, log)
      - Suspicious parent processes or targeting sensitive/untrusted directories

author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1140

logsource:
    product: windows
    category: process_creation

detection:
    selection_tools:
        Image|re: '(certutil\.exe|expand\.exe|extrac32\.exe)$'
        CommandLine|re: '(-decode|-decodehex|(\.txt|\.jpg|\.png|\.xml|\.log))'

    selection_suspicious_parent:
        ParentImage|re: '(cmd\.exe|powershell\.exe|pwsh\.exe|wscript\.exe|cscript\.exe|nginx\.exe|httpd\.exe|mshta\.exe)$'

    selection_suspicious_output:
        CommandLine|re: '(\\Users\\|\\Temp\\|\\AppData\\).*|(\.exe|\.dll|\.vbs|\.ps1)$'

    filter_trusted_installers:
        ParentImage|re: '(\\Windows\\servicing\\TrustedInstaller\.exe|\\CcmExec\.exe|\\Package Cache\\)'
        Image|re: '(\\Program Files\\|\\Windows\\System32\\)'
        CommandLine|re: 'Microsoft\\Windows\\SoftwareDistribution'

    condition: >
        selection_tools 
        and (selection_suspicious_parent or (selection_suspicious_output and not filter_trusted_installers))

level: high
