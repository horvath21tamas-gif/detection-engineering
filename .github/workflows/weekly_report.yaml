name: Weekly Detection Engineering Report

on:
  schedule:
    # Minden hétfőn reggel 08:00-kor (UTC szerint 07:00)
    - cron: '0 7 * * 1'
  workflow_dispatch: # Kézi indításhoz

jobs:
  create_report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: test # Biztosítjuk, hogy a test ágról olvasson

      - name: Extract Dashboard Summary
        id: report
        run: |
          echo "## 🚀 Heti Detection Engineering Jelentés" > weekly_summary.txt
          echo "Dátum: $(date +'%Y-%m-%d')" >> weekly_summary.txt
          echo "" >> weekly_summary.txt

          echo "### 📊 Aktuális Szabály Statisztikák" >> weekly_summary.txt
          # Ellenőrizzük, létezik-e a fájl, mielőtt beleolvasunk
          if [ -f "DETECTION_WIKI_HU.md" ]; then
            # A 3-15. sor kinyerése (a Dashboard táblázat helye)
            sed -n '3,15p' DETECTION_WIKI_HU.md >> weekly_summary.txt
          else
            echo "⚠️ A magyar nyelvű Wiki (DETECTION_WIKI_HU.md) még nem jött létre." >> weekly_summary.txt
          fi
          
          echo "" >> weekly_summary.txt
          echo "### ⛓️ Cyber Kill Chain Lefedettség" >> weekly_summary.txt
          if [ -f "KILL_CHAIN_REPORT.md" ]; then
            # Kivesszük a Kill Chain táblázatot és a vakfoltokat (5. sortól lefelé)
            sed -n '5,50p' KILL_CHAIN_REPORT.md >> weekly_summary.txt
          else
            echo "⚠️ A Kill Chain jelentés (KILL_CHAIN_REPORT.md) még nem jött létre." >> weekly_summary.txt
          fi
          
          echo "" >> weekly_summary.txt
          echo "---" >> weekly_summary.txt
          echo "🔗 [Teljes Wiki megtekintése](https://github.com/${{ github.repository }}/blob/test/DETECTION_WIKI_HU.md)" >> weekly_summary.txt
          
          # Dátum beállítása a címhez
          echo "REPORT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create Issue Report
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚀 Heti Detection Report - ${{ env.REPORT_DATE }}"
          content-filepath: ./weekly_summary.txt
          labels: automated-report, management
