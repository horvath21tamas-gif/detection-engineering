title: Browser Credential Harvesting Detection (T1555.003)
id: d9c8576a-ff1b-40ce-bb36-05d578026026
status: stable
description: >
    Detects potential unauthorized access and exfiltration of browser credential databases 
    (Chrome, Edge, Firefox, Brave) by monitoring suspicious command-line file operations 
    targeting 'Login Data', 'Cookies', 'Web Data', 'key4.db', or 'logins.json'. Filters 
    legitimate browser processes and backup/sync tools.
author: hota05 
date: 2026-02-12
references:
    - https://attack.mitre.org/techniques/T1555/003/
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: process_creation
    product: windows

detection:
    selection_files:
        CommandLine|contains:
            - '\Login Data'
            - '\Cookies'
            - '\Web Data'
            - '\key4.db'
            - '\logins.json'

    selection_ops:
        CommandLine|contains:
            - 'copy '
            - 'type '
            - 'add '
            - 'tar '
            - 'Get-Content'
            - 'cp '
            - '7z '
            - 'rar '
            - 'zip '
        Image|endswith:
            - '\sqlite3.exe'
            - '\esentutl.exe'
            - '\7z.exe'
            - '\rar.exe'
            - '\tar.exe'
            - '\gzip.exe'

    selection_untrusted_context:
        Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\Public\'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\python.exe'
            - '\cscript.exe'
            - '\node.exe'

    filter_native_browsers:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\brave.exe'
        ParentImage|contains:
            - '\Program Files\'
            - '\Windows\System32\'

    filter_known_backups:
        Image|contains:
            - '\Program Files\Veeam\'
            - '\Program Files\Microsoft OneDrive\'
            - '\Program Files\Dropbox\'
            - '\Program Files\Google\Drive\'
        username: 'NT AUTHORITY\SYSTEM'

    condition:
        selection_files
        and (selection_ops or selection_untrusted_context)
        and not (filter_native_browsers or filter_known_backups)

falsepositives:
    - Legitimate browser backup or sync operations
    - Security auditing tools accessing browser profiles
    - Dev/test environments with automated browser testing scripts
    - User-initiated copying/export of browser data

level: critical
