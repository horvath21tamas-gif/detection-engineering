title: Cloud Storage Exfil (T1567.002)
id: 6f66d5d7-8534-49e3-b266-2b6053ea5947
status: stable
description: |
  Detects systematic data exfiltration to cloud storage platforms by monitoring:
  1. CLI tools (rclone, megatools, pcloud clients) using embedded credentials 
     or custom config files.
  2. Triggering by non-administrative or suspicious parent processes 
     (Office apps, Beacon hosts, scripts).
  3. Targeted cloud endpoints including mega.nz, Dropbox, Google Drive, pCloud, 
     and Transfer.sh.
  Filters legitimate system/administrative usage to reduce false positives.
author: hota05 
date: 2026-02-11
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows

detection:
  selection_tools:
    Image|endswith:
      - '\rclone.exe'
      - '\megatools.exe'
      - '\mega-put.exe'
      - '\pcloud.exe'
    CommandLine|contains:
      - ' upload '
      - ' sync '
      - ' --ignore-existing'

  selection_logic:
    CommandLine|contains:
      - ' --config '
      - ' --no-check-certificate'
      - ' --bwlimit '
      - ' --include '

  selection_context:
    - Image|contains:
        - '\Users\'
        - '\AppData\'
        - '\Temp\'
    - ParentImage|endswith:
        - '\winword.exe'
        - '\excel.exe'
        - '\rundll32.exe'
        - '\powershell.exe'

  selection_endpoints:
    CommandLine|contains:
      - 'mega.nz'
      - 'dropboxapi.com'
      - 'googleapis.com/upload'
      - 'pcloud.com'
      - 'transfer.sh'

  filter_legit:
    - Image|contains:
        - '\Program Files\'
        - '\System32\OneDrive.exe'
    - username: 'NT AUTHORITY\SYSTEM'
    - ParentImage|endswith:
        - '\services.exe'

  condition: (selection_tools and (selection_logic or selection_endpoints)) and selection_context and not filter_legit

fields:
  - Time
  - SourceImage
  - ParentImage
  - CommandLine
  - ProcessId
  - SourceUsername
  - DestinationUrl

falsepositives:
  - Legitimate cloud sync or upload by end-user applications
  - Approved DevOps automation using rclone/CLI for backups
  - IT-managed scripts using cloud CLI for maintenance

level: critical
