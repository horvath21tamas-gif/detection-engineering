title: AWS Cloud Security Control Impairment Attempt
id: 266d137f-9ba3-4a65-9428-2792a3d8f682
status: stable
description: >
  Detects attempts to impair AWS-native security controls such as GuardDuty,
  Security Hub, and Inspector2 via detector deletion, suppression abuse,
  or threat intelligence tampering. Focuses on high-risk identities and
  non-standard automation tooling.

author: hota05
date: 2026-02-24

tags:
  - attack.defense_evasion
  - attack.t1562.012
  - attack.impact

logsource:
  product: aws
  service: cloudtrail

detection:

  selection_services:
    eventSource:
      - guardduty.amazonaws.com
      - securityhub.amazonaws.com
      - inspector2.amazonaws.com

  selection_impairment_actions:
    eventName:
      - DeleteDetector
      - UpdateDetector
      - DeleteMembers
      - DisassociateMembers
      - DisableSecurityHub
      - BatchDisableStandards
      - DeleteThreatIntelSet
      - DeleteIPSet

  selection_suppression_actions:
    eventName:
      - CreateFilter
      - UpdateFilter
      - CreateSuppressionRule
      - BatchUpdateFindings

  selection_suppression_keywords:
    requestParameters|contains:
      - ARCHIVE
      - SUPPRESS
      - Workflow
      - RecordState

  selection_api_activity:
    eventType: AwsApiCall
    readOnly: false

  selection_high_risk_identity:
    userIdentity.type:
      - Root
      - IAMUser

  selection_suspicious_useragent:
    userAgent|contains:
      - python
      - curl
      - postman
      - httpclient
      - boto3
      - aws-cli

  filter_trusted_roles:
    userIdentity.arn|contains:
      - role/Security-Infrastructure-Terraform
      - role/AWSServiceRoleForGuardDuty
      - role/AWSServiceRoleForSecurityHub
      - role/OrganizationAccountAccessRole

  filter_internal_ips:
    sourceIPAddress|startswith:
      - 10.
      - 192.168.
      - 172.16.

  filter_mfa_authenticated:
    userIdentity.sessionContext.attributes.mfaAuthenticated: "true"

  condition:
    selection_services
    and selection_api_activity
    and (selection_impairment_actions
          or (selection_suppression_actions and selection_suppression_keywords))
    and (selection_high_risk_identity
          or selection_suspicious_useragent)
    and not (filter_trusted_roles
          or filter_internal_ips
          or filter_mfa_authenticated)

fields:
  - eventTime
  - eventSource
  - eventName
  - userIdentity.type
  - userIdentity.arn
  - sourceIPAddress
  - userAgent
  - requestParameters
  - awsRegion

falsepositives:
  - Infrastructure-as-code deployments without MFA
  - Initial security service onboarding
  - MSSP tuning activity

level: critical
