title: Mainboard Boot Image & SPI Flash Tampering (T1505.004)
id: 72853bc5-b6a8-4a3f-82bf-b47943462e77
status: stable
description: |
    Detects unauthorized firmware manipulation and SPI flash tampering by monitoring
    low-level hardware access tools, suspicious command-line flags, and driver 
    registrations originating from non-standard process chains or user paths.
    Focuses on boot image injection, SPI write operations, and untrusted execution contexts.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1505/004/
tags:
    - attack.persistence
    - attack.t1505.004
    - attack.firmware
    - attack.credential_access
    - attack.privilege_escalation

logsource:
    product: windows
    category: process_creation

detection:

    selection_firmware_tools:
        Image|endswith:
            - '\flashrom.exe'
            - '\FPTW64.exe'
            - '\AFUWINx64.exe'
            - '\UEFITool.exe'
        OriginalFileName:
            - 'flashrom.exe'
            - 'FPTW64.exe'
            - 'AFUWINx64.exe'
            - 'UEFITool.exe'

    selection_suspicious_commands:
        CommandLine|contains:
            - ' /d '
            - ' /f '
            - ' /p '
            - ' -write'
            - ' -save'
            - ' /capsule'
            - ' /program'
            - ' /flash'
            - '-image'

    selection_untrusted_origin:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'
            - '\Desktop\'

    filter_trusted_management:
        Image|contains:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
        ParentImage|endswith:
            - '\svchost.exe'
        username: 'NT AUTHORITY\SYSTEM'

    condition: selection_firmware_tools and selection_suspicious_commands and selection_untrusted_origin and not filter_trusted_management

falsepositives:
    - Legitimate firmware update tools executed by IT admins
    - OEM update utilities running from Program Files directories
    - Automated provisioning scripts executed by trusted accounts

level: critical
