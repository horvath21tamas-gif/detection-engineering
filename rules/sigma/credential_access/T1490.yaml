title: Suspicious Deletion of Volume Shadow Copies via VSSAdmin (High Fidelity)
id: 4302be70-b2f8-458f-a43a-a09eec5151b6
status: stable
description: >
  Detects suspicious deletion of Volume Shadow Copies using vssadmin.exe,
  commonly observed during ransomware and destructive attacks.
  The rule focuses on attacker-typical command-line arguments,
  non-service execution context, and excludes known backup solutions
  to minimize false positives.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1490/

logsource:
  product: windows
  category: process_creation

detection:

  vssadmin_execution:
    Image|endswith: '\vssadmin.exe'

  destructive_arguments:
    CommandLine|contains:
      - 'delete shadows'
      - 'delete shadow'
      - '/all'
      - '/quiet'

  suspicious_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'

  filter_service_accounts:
    User|contains:
      - 'SYSTEM'
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'

  filter_backup_tools:
    ParentImage|contains:
      - '\Veeam\'
      - '\Acronis\'
      - '\Commvault\'
      - '\Veritas\'
      - '\Dell\'
      - '\Microsoft Azure Backup\'
      - '\Datto\'

  condition: >
    vssadmin_execution
    and destructive_arguments
    and suspicious_parent
    and not (
      filter_service_accounts
      or filter_backup_tools
    )

falsepositives:
  - Rare manual administrative maintenance
  - Approved disaster recovery testing

level: high

tags:
  - attack.impact
  - attack.t1490
