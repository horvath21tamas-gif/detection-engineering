title: Resource Hijacking (T1496)
id: 44345809-d2ce-40dd-af5d-46a5986ef9ce
status: stable
description: |
  Detects unauthorized resource hijacking (cryptomining) by monitoring for 
  specific miner protocols (stratum), algorithm flags, and hardware 
  optimization arguments originating from untrusted process lineages.
author: hota05
date: 2026-02-09
tags:
  - attack.impact
  - attack.t1496
logsource:
  category: process_creation
  product: windows
detection:
  miner_signatures:
    CommandLine|contains:
      - 'stratum+tcp://'
      - 'stratum+ssl://'
      - '--url='
      - '--user='
      - '--pass='
      - '--algo='
      - '--donate-level='
      - 'cryptonight'
      - 'nicehash'

  optimization_flags:
    CommandLine|contains:
      - '--cpu-max-threads-hint'
      - '--cpu-no-yield'
      - '--randomx-1gb-pages'
      - '--cuda-devices'
      - '--opencl-platform'

  suspicious_context:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
      - '\ProgramData\'
      - '\Windows\Temp\'
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\httpd.exe'
      - '\powershell.exe'
      - '\cmd.exe'

  legit_workload_filter:
    - username: 'NT AUTHORITY\SYSTEM'
    - Image|contains:
        - '\Program Files\'
        - '\Program Files (x86)\'
    - CommandLine|contains:
        - 'Azure'
        - 'Telemetry'
        - 'Diagnostic'

  condition: miner_signatures and (optimization_flags or suspicious_context) 
             and not legit_workload_filter
level: high
