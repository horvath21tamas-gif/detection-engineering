title: Hidden File Attribute Manipulation (T1564.001)
id: d5202884-3885-4b9e-b4d0-a9808c85d7e7
status: stable
description: |
  Detects suspicious use of file and directory hiding via System (+s) and Hidden (+h) attributes.
  Focuses on untrusted parent processes, sensitive user-writable directories, and avoids 
  known safe system or automation activities.  
author: hota05 
date: 2026-02-11
tags:
  - attack.defense_evasion
  - attack.t1564.001
logsource:
  product: windows
  category: process_creation

detection:
  selection_tool:
    Image|endswith: '\attrib.exe'

  selection_flags:
    CommandLine|contains|all:
      - ' +h'
      - ' +s'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\mshta.exe'
      - '\powershell.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'

  selection_suspicious_path:
    CommandLine|contains:
      - '\Users\Public\'
      - '\Windows\Temp\'
      - '\AppData\Roaming\'
      - '\AppData\Local\Temp\'
      - '\Downloads\'

  filter_trusted_system_activity:
    username: 'NT AUTHORITY\SYSTEM'
    ParentImage|contains:
      - '\Windows\servicing\TrustedInstaller.exe'
      - '\CcmExec.exe'
      - '\Windows\System32\wbem\WMIC.exe'
    CommandLine|contains:
      - 'desktop.ini'
      - 'attrib +h +s system32'
      - 'Program Files'

  condition: selection_tool and selection_flags and (selection_suspicious_parent or selection_suspicious_path) and not filter_trusted_system_activity

fields:
  - Time
  - SourceImage
  - ParentImage
  - CommandLine
  - SourceUsername
  - TargetFilePath
  - FileAttributes

falsepositives:
  - Legitimate sysadmin scripts hiding desktop.ini or temp files
  - Automated installers setting hidden/system attributes in user directories
  - Security software managing temp files or quarantine directories

level: high
