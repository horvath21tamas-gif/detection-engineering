title: Stealthy Module Overwriting (ATT&CK T1055.009)
id: 05cc9e81-f6df-49b6-98ce-4c7a7103fadf
status: stable
description: >
  Detects stealthy process or module overwriting by monitoring cross-process memory 
  access with VM_WRITE permissions where the calling stack originates from unbacked memory 
  (shellcode), targeting critical system processes.
author: hota05
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1055/009/
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055.009
  - attack.host

logsource:
  product: windows
  category: process_access

detection:
  selection_access_mask:
    GrantedAccess|contains:
      - '0x1410'
      - '0x1411'
      - '0x1438'
      - '0x143a'
      - '0x1F1FFF'

  selection_unbacked_calltrace:
    CallTrace|contains: 'unknown'

  selection_critical_targets:
    TargetImage|endswith:
      - '\lsass.exe'
      - '\svchost.exe'
      - '\explorer.exe'
      - '\winlogon.exe'
      - '\spoolsv.exe'

  selection_suspicious_source:
    SourceImage|contains:
      - '\Users\'
      - '\Temp\'
      - '\AppData\'

  filter_trusted:
    - SourceProcessName: 'C:\Windows\System32\csrss.exe'
    - SourceImage|endswith:
        - '\MsMpEng.exe'
        - '\CcmExec.exe'
    - CallTrace|contains:
        - 'clr.dll+'
        - 'wer.dll+'
        - 'ntdll.dll+LdrpWorkItem'
    - condition: SourceProcessName == TargetImage

  condition: selection_access_mask
             and selection_unbacked_calltrace
             and selection_critical_targets
             and selection_suspicious_source
             and not filter_trusted

falsepositives:
  - AV or EDR software performing legitimate memory manipulations
  - System maintenance or patching processes accessing critical processes

level: critical
