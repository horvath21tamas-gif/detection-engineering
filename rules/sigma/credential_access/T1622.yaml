title: Suspicious Anti-Debug API Access From Unbacked or User-Space Memory
id: 2bcdc689-6373-4494-9607-a3776240964d
status: stable
description: >
  Detects potential debugger evasion techniques by identifying suspicious
  access to processes combined with anti-debug API patterns in CallTrace,
  especially when originating from unbacked memory regions or non-standard
  execution paths. Filters known development tools and Windows error reporting.

author: hota05 
date: 2026-02-03
modified: 2026-02-11
references:
  - https://attack.mitre.org/techniques/T1622/
tags:
  - attack.defense_evasion
  - attack.t1622

logsource:
  product: windows
  category: process_access

detection:

  selection_debug_access:
    GrantedAccess:
      - '0x400'     
      - '0x410'
      - '0x1000'    
      - '0x1400'
      - '0x1F0FFF'
      - '0x1F1FFF'  

  selection_anti_debug_apis:
    CallTrace|contains:
      - 'IsDebuggerPresent'
      - 'CheckRemoteDebuggerPresent'
      - 'NtQueryInformationProcess'
      - 'NtSetInformationThread'
      - 'OutputDebugString'
      - 'DbgBreakPoint'
      - 'DbgUiRemoteBreakin'

  selection_unbacked_memory:
    CallTrace|contains:
      - 'UNKNOWN'
      - 'Unbacked'
      - 'MEM_PRIVATE'

  selection_suspicious_source_path:
    SourceImage|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'
      - '\ProgramData\'

  selection_medium_integrity:
    IntegrityLevel: 'Medium'

  filter_legitimate_debuggers:
    SourceImage|endswith:
      - '\devenv.exe'
      - '\windbg.exe'
      - '\x64dbg.exe'
      - '\ollydbg.exe'
      - '\code.exe'
      - '\pycharm64.exe'

  filter_windows_error_reporting:
    SourceImage|endswith:
      - '\WerFault.exe'
      - '\vsjitdebugger.exe'
      - '\csrss.exe'

  filter_dotnet_runtime:
    CallTrace|contains:
      - 'clr.dll+'
      - 'mscor'

  filter_system_context:
    SourceImage|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'

  condition:
    selection_debug_access
    and selection_anti_debug_apis
    and (
          selection_unbacked_memory
          or selection_suspicious_source_path
          or selection_medium_integrity
        )
    and not filter_legitimate_debuggers
    and not filter_windows_error_reporting
    and not filter_dotnet_runtime
    and not filter_system_context

falsepositives:
  - Legitimate debugging sessions
  - Development environments
  - Windows error reporting
  - .NET runtime diagnostic activity
  - Authorized reverse engineering

level: high
