name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

# Szükséges az írási jog a README és az új .spl fájlok feltöltéséhez
permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml sigma-cli

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q

      - name: Lint and validate Sigma rules
        run: |
          python tools/lint_rules.py
          python tools/validate_metadata.py

      - name: Convert Sigma rules to Splunk (.spl files)
        run: |
          # Célmappa létrehozása
          mkdir -p rules/splunk
          
          # Töröljük a régi .spl fájlokat, hogy a törölt Sigma szabályok ne maradjanak ott
          rm -f rules/splunk/*.spl
          
          # Végigmegyünk minden Sigma fájlon és egyenként lefordítjuk
          # A 'find' parancs segít megtalálni az összes .yaml fájlt az almappákban is
          for file in $(find rules/sigma -name "*.yaml"); do
            # Fájlnév kinyerése kiterjesztés nélkül
            filename=$(basename "$file" .yaml)
            
            echo "Converting $file to Splunk..."
            
            # Sigma konverzió:
            # -t splunk: Splunk backend használata
            # -p sysmon: Sysmon mezőleképezés (ezt módosítsd windows-ra, ha nem csak sysmonod van)
            # -o: a kimeneti fájl helye
            sigma convert -t splunk -p sysmon "$file" -o "rules/splunk/${filename}.spl"
          done

      - name: Update README.md
        if: github.event_name == 'push'
        run: |
          python tools/update_readme.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Hozzáadjuk a README-t és az összes új/módosított .spl fájlt
          git add README.md rules/splunk/*.spl
          
          # Csak akkor commitolunk, ha történt tényleges változás
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: README and Sigma-to-Splunk conversion" && git push)
