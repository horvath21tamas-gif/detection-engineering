title: Ultra-Pro Stealthy TLS Injection (T1055.005)
id: aae72238-f20f-4f1b-94e8-3876df018ec3
status: stable
description: |
    Detects high-fidelity TLS injection by monitoring for cross-process memory 
    manipulation targeting PE headers where the execution flow originates 
    from unbacked memory (shellcode).
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1055.005
logsource:
    product: windows
    category: process_access 
detection:
    selection_access_mask:
        GrantedAccess:
            - '0x1410'
            - '0x1411'
            - '0x1438'
            - '0x1F1FFF'

    selection_unbacked_calltrace:
        CallTrace|contains: 'unknown'

    selection_gui_targets:
        TargetImage|endswith:
            - '\explorer.exe'
            - '\svchost.exe'
            - '\lsass.exe'
            - '\winlogon.exe'

    filter_trusted:
        - Sourceprocessname: 'C:\Windows\System32\csrss.exe'
        - SourceImage|endswith:
            - '\MsMpEng.exe'        
            - '\CcmExec.exe'      
        - CallTrace|contains:
            - 'ntdll.dll+LdrpWorkItem'
            - 'ntdll.dll+LdrpInitializeProcess'
        - condition: selection_source_equals_target

    selection_suspicious_source:
        SourceImage|contains:
            - '\Users\'
            - '\Temp\'
            - '\AppData\'

    condition: selection_access_mask and selection_unbacked_calltrace and selection_gui_targets and not filter_trusted
level: critical
