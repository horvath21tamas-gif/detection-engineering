title: Ultra-Pro AppleScript Privilege Escalation (T1548.004)
id: 5204521c-b47f-4471-9ac9-afb4e9665101
status: stable
description: |
    Detects unauthorized AppleScript elevation attempts. Specifically monitors 
    osascript execution with "administrator privileges" from untrusted parent 
    processes such as browsers, office suites, or temporary directories.
author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.t1548.004
logsource:
    product: macos
    category: process_creation
detection:
    selection_osascript:
        - Image|endswith: '/osascript'
        - OriginalFileName: 'osascript'

    selection_elevation_args:
        CommandLine|contains:
            - 'with administrator privileges'
            - 'do shell script'
            - 'display dialog' 

    selection_suspicious_parent:
        ParentImage|contains:
            - '/Applications/Google Chrome.app/'
            - '/Applications/Safari.app/'
            - '/Applications/Microsoft Word.app/'
            - '/Applications/Microsoft Excel.app/'
            - '/Applications/Slack.app/'
            - '/Applications/Microsoft Teams.app/'
            - '/private/tmp/'
            - '/Users/Shared/'

    filter_trusted_management:
        - ParentImage|contains:
            - '/Library/Application Support/JamfSoftware/' 
            - '/usr/local/bin/kandji'                       
            - '/System/Library/PrivateFrameworks/'        
        - Image|contains:
            - '/usr/sbin/softwareupdate'
        - username: 'root'

    condition: selection_osascript and selection_elevation_args and selection_suspicious_parent and not filter_trusted_management
level: critical
