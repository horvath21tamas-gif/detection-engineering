title: Detektalni a poweshellbol base64-encoded parancsot 
id: 'f18c91cf-5d2f-4687-8691-eb54f0fd574d'
status: experimental
description: Detektalni a powershellbol a base64-encoded parancsot
author: hota05
date: 2026/01/13
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - "-enc"
      - "-encodedcommand"
  selection_network:
    CommandLine|contains:
      - "Invoke-WebRequest"
      - "iwr"
      - "wget"
      - "curl"
      - "DownloadString"
      - "DownloadFile"
      - "Net.WebClient"
  condition: selection and selection_network
level: high
tags:
  - attack.t1027
  - attack.t1105
falsepositives:
  - admin scriptet futtat
  - pentesteles
