title: Ultra-Pro High-Fidelity Data Archiving via Library (T1560.002)
id: 4931d4e8-110c-40c6-9ac4-676cb51a3308
status: stable
description: |
    Detects advanced data staging for exfiltration using .NET/PowerShell 
    compression libraries. Filters enterprise automation by analyzing 
    parent process lineage, command-line entropy, and integrity levels.
author: hota05
date: 2026-02-05
tags:
    - attack.collection
    - attack.exfiltration
    - attack.t1560.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_api:
        CommandLine|contains:
            - 'System.IO.Compression'   
            - 'Compress-Archive'          
            - 'zipfile'                   
            - 'IO.Compression.FileSystem' 

    selection_suspicious_args:
        CommandLine|contains:
            - ' -enc '                    
            - ' -e '                      
            - ' -DestinationPath '        
            - ' -Update'                  
            - ' [Convert]::ToBase64'    

    selection_paths:
        CommandLine|contains:
            - '\Desktop'
            - '\Documents'
            - '\AppData\Local\Microsoft\Outlook' 
            - 'C:\inetpub\'                        
            - 'C:\Users\Public'                    

    selection_context:
        ParentImage|endswith:
            - '\w3wp.exe'                
            - '\httpd.exe'                
            - '\winword.exe'              
            - '\cmd.exe'
            - '\powershell.exe'
        IntegrityLevel: 'Medium'           

    filter_enterprise_apps:
        - Image|contains:
            - 'C:\Program Files\Microsoft Visual Studio\'
            - 'C:\Program Files\Azure\'
        - CommandLine|contains:
            - 'C:\Windows\CCM\'         
            - 'C:\ProgramData\Microsoft\Intune\'
        - username: 'NT AUTHORITY\SYSTEM'

    condition: selection_api and (selection_suspicious_args or selection_paths) and selection_context and not filter_enterprise_apps
level: critical
