title: Ultra-Pro High-Fidelity Malicious Network OS Upgrade (T1601.002)
id: 9f142517-dab5-4f05-925a-3339d78cfd70
status: stable
description: |
    Detects unauthorized or malicious network OS upgrades by correlating 
    upgrade commands with insecure protocols, untrusted sources, or 
    cryptographic signature failures.
author: hota05
date: 2026-02-03
tags:
    - attack.persistence
    - attack.t1601.002
logsource:
    product: network
    service: FortiOS
detection:
    selection_upgrade_ops:
        Message|contains:
            - 'software install'
            - 'request system software add' 
            - 'firmware upgrade'
            - 'boot system flash'          
            - 'install activate'           
            - 'request platform software'

    selection_suspicious_attributes:
        Message|contains:
            - 'tftp://'     
            - 'http://'    
            - 'ftp://'
            - '.bin'        
            - '.tar'

    selection_integrity_failures:
        Message|contains:
            - 'signature validation failed'
            - 'hash mismatch'
            - 'invalid image signature'
            - 'checksum error'
            - 'not a trusted image'

    filter_trusted_source:
        SourceIP:
            - '10.50.0.10' 
            - '10.50.0.11'
    filter_secure_transfer:
        Message|contains:
            - 'scp://'
            - 'https://'
            - 'sftp://'

    condition: selection_upgrade_ops and (selection_suspicious_attributes or selection_integrity_failures) and not (filter_trusted_source or filter_secure_transfer)
level: critical
