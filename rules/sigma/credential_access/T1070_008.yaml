title: Email Storage and Database Destruction (T1070.008)
id: d3c115c3-798c-4f74-add2-966d932eb390
status: stable
description: |
  Detects targeted destruction of email storage files (PST/OST) and Exchange Databases (EDB).
  Focuses on programmatic deletion, database dismounting, and forensic wiping patterns
  originating from untrusted processes or suspicious parent-child process chains.
author: hota05
date: 2026-02-03
tags:
  - attack.defense_evasion
  - attack.t1070.008
logsource:
  product: windows
  category: process_creation
detection:
  selection_exchange_mgmt:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Dismount-Database'
      - 'Remove-MailboxDatabase'
      - 'Remove-StoreMailbox'
    CommandLine|contains:
      - ' -Confirm:$false'
      - ' -Force'

  selection_file_destruction:
    CommandLine|contains:
      - 'del '
      - 'rm '
      - 'Remove-Item'
      - 'sdelete'
      - 'fsutil file setzero'
    CommandLine|contains:
      - '.pst'
      - '.ost'
      - '.edb'
      - '.nst'

  selection_suspicious_origin:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\winword.exe'
      - '\excel.exe'
      - '\mshta.exe'
      - '\php-cgi.exe'
      - '\nginx.exe'

  filter_trusted_apps:
    - Image|endswith: '\SearchIndexer.exe'
    - ParentImage|endswith:
        - '\outlook.exe'
        - '\backup.exe'
        - '\veeam'
    - CommandLine|contains: '\AppData\Local\Microsoft\Outlook'
    - username: 'NT AUTHORITY\SYSTEM'

  condition: 
    (selection_exchange_mgmt or selection_file_destruction) 
    and (selection_suspicious_origin and not filter_trusted_apps)
level: critical
