title: Sandbox Breakout / Privilege Escalation Exploitation (T1211)
id: 2f5af2c1-943c-4e14-9704-1fa342de4fec
status: stable
description: |
    Detects potential privilege escalation via exploitation of vulnerable 
    client applications (browsers, Office, PDF readers) by identifying:
    - Sandbox breakout behavior
    - Suspicious LOLBin child processes
    - Encoded/hidden command execution
    - UAC bypass and token abuse indicators
    Designed to reduce noise from legitimate browser/Office subprocesses.

author: hota05
date: 2026-02-20
references:
    - https://attack.mitre.org/techniques/T1211/
tags:
    - attack.privilege_escalation
    - attack.execution
    - attack.t1211
logsource:
    product: windows
    category: process_creation

detection:
    selection_vulnerable_parents:
        ParentImage|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\acrord32.exe'
            - '\acrobat.exe'

    selection_suspicious_children:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'
            - '\mshta.exe'
            - '\regsvr32.exe'
            - '\schtasks.exe'
            - '\fodhelper.exe'
            - '\eventvwr.exe'
            - '\computerdefaults.exe'
            - '\whoami.exe'
            - '\net.exe'
            - '\net1.exe'

    selection_suspicious_args:
        CommandLine|contains:
            - '-enc'
            - '-encodedcommand'
            - ' bypass'
            - ' hidden'
            - 'http://'
            - 'https://'
            - 'FromBase64String'
            - 'DownloadString'
            - 'Invoke-Expression'
            - 'IEX '

    selection_privilege_indicators:
        CommandLine|contains:
            - 'runas'
            - ' /savecred'
            - 'token::elevate'
            - 'uac'
        IntegrityLevel:
            - 'High'
            - 'System'

    filter_legit_browser_subprocess:
        CommandLine|contains:
            - '--type=renderer'
            - '--type=utility'
            - '--type=gpu-process'
            - '--type=extension'
            - 'Microsoft\EdgeUpdate'

    filter_legit_windows:
        Image|endswith:
            - '\WerFault.exe'
            - '\conhost.exe'
        ParentCommandLine|contains:
            - 'TrustedInstaller.exe'

    condition:
        (selection_vulnerable_parents
            and selection_suspicious_children
            and (selection_suspicious_args or selection_privilege_indicators))
        and not (filter_legit_browser_subprocess or filter_legit_windows)

fields:
    - User
    - Image
    - ParentImage
    - CommandLine
    - ParentCommandLine
    - IntegrityLevel
    - CurrentDirectory
    - Hashes

falsepositives:
    - Admin troubleshooting from Office macros
    - Enterprise browser extensions invoking system tools
    - Approved IT automation scripts
    - Legitimate UAC elevation workflows

level: critical
