title: Ultra-Pro High-Fidelity Network Sniffing Detection (T1040)
id: ac19d0e3-b22b-4a78-8729-97fbed28c876
status: stable
description: |
    Detects unauthorized network sniffing by monitoring for administrative tools 
    used in capture mode, driver installation for packet interception, 
    and offensive sniffing frameworks running from untrusted paths.
author: hota05
date: 2026-02-04
tags:
    - attack.credential_access
    - attack.t1040
logsource:
    category: process_creation
    product: windows
detection:
    selection_native_sniff:
        - Image|endswith: '\netsh.exe'
          CommandLine|contains:
              - 'trace start'
              - 'capture=yes' 
              - 'report=yes'
        - Image|endswith: '\pktmon.exe' 
          CommandLine|contains:
              - 'start'
              - 'capture'
              - '--etw'

    selection_driver_install:
        CommandLine|contains:
            - 'npcap'
            - 'winpcap'
            - 'packet.dll'
            - 'wpcap.dll'
            - 'ndiscap.sys' 

    selection_offensive:
        - Image|endswith:
            - '\tshark.exe'
            - '\windump.exe'
            - '\ettercap.exe'
            - '\bettercap.exe'
            - '\dsniff.exe'
        - CommandLine|contains:
            - 'responder'      
            - 'scapy'          
            - '-i eth0'        

    selection_untrusted_source:
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'
            - '\Public\'

    filter_authorized_admin:
        Image|contains:
            - '\Program Files\Wireshark\'
            - '\Program Files\Microsoft Message Analyzer\'
            - '\Windows\System32\wbem\wmiprvse.exe'
        username: 'NT AUTHORITY\SYSTEM'

    condition: (selection_native_sniff or selection_driver_install or selection_offensive) and selection_untrusted_source and not filter_authorized_admin
level: high
