title: High-Fidelity Social Media Entity Harvesting - T1593.003
id: 00f7a8eb-12f6-490c-a806-cbfba77d1010
status: stable
description: >
  Detects automated social media reconnaissance using headless browsers or specialized OSINT tools. 
  Focuses on identifying systematic data scraping while excluding legitimate browser-based user activity.
author: hota05
date: 2026/01/27
references:
  - https://attack.mitre.org/techniques/T1593/003/
tags:
  - attack.reconnaissance
  - attack.t1593.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_specialized_tools:
    - Image|endswith:
        - '\sherlock.exe'      
        - '\maigret.exe'       
        - '\ghunt.exe'         
        - '\twint.exe'         
    - CommandLine|contains:
        - 'socialscan'
        - 'linkedintools'
        - 'instagram-scraper'

  selection_automation_flags:
    CommandLine|contains|all:
      - '--headless'           
      - 'webdriver'            
    CommandLine|contains:
      - 'linkedin.com/in/'
      - 'twitter.com/'
      - 'facebook.com/profile'

  selection_scripted_recon:
    - Image|endswith:
        - '\python.exe'
        - '\node.exe'
        - '\curl.exe'
    - CommandLine|contains:
        - 'api.linkedin.com'
        - 'api.twitter.com'
        - '/users/lookup'
        - 'search_user'

  filter_interactive:
    ParentImage|endswith: '\explorer.exe'
    condition: not selection_specialized_tools

  filter_authorized_apps:
    Image|contains:
      - '\LinkedInRecruiter\'
      - '\Hootsuite\'
      - '\Buffer\'
      - '\Salesforce\'

  filter_system_user:
    username: 'NT AUTHORITY\SYSTEM'

  condition: (selection_specialized_tools or (selection_automation_flags and selection_scripted_recon)) and not filter_interactive and not filter_authorized_apps and not filter_system_user
falsepositives:
  - Authorized recruitment automation tools used by HR.
  - Social media management platforms (Hootsuite, etc.).
  - QA engineers testing web applications with Selenium.
level: high
