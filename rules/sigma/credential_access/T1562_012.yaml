title: AWS Cloud Security Control Impairment Attempt
id: 266d137f-9ba3-4a65-9428-2792a3d8f682
status: stable
description: >
  Detects attempts to impair AWS-native security controls such as GuardDuty,
  Security Hub, and Inspector2 via detector deletion, suppression abuse,
  or threat intelligence tampering.

author: hota05
date: 2026-02-24

tags:
  - attack.defense_evasion
  - attack.t1562.012
  - attack.impact

logsource:
  product: aws
  service: cloudtrail

detection:

  selection_guardduty_impair:
    eventSource: guardduty.amazonaws.com
    eventName:
      - DeleteDetector
      - UpdateDetector
      - DeleteMembers
      - DisassociateMembers
      - DeleteThreatIntelSet
      - DeleteIPSet

  selection_securityhub_impair:
    eventSource: securityhub.amazonaws.com
    eventName:
      - DisableSecurityHub
      - BatchDisableStandards
      - CreateFilter
      - UpdateFilter
      - BatchUpdateFindings

  selection_inspector_impair:
    eventSource: inspector2.amazonaws.com
    eventName:
      - UpdateConfiguration
      - Disable

  selection_root_identity:
    userIdentity.type: Root

  selection_iam_identity:
    userIdentity.type: IAMUser

  selection_suspicious_useragent:
    userAgent|contains:
      - curl
      - python
      - postman
      - httpclient
      - boto3
      - aws-cli

  filter_trusted_roles:
    userIdentity.arn|contains:
      - Security-Infrastructure-Terraform
      - AWSServiceRoleForGuardDuty
      - AWSServiceRoleForSecurityHub
      - OrganizationAccountAccessRole

  filter_internal_ip:
    sourceIPAddress|startswith:
      - 10.
      - 192.168.
      - 172.
      - 127.

  condition:
    (selection_guardduty_impair
      or selection_securityhub_impair
      or selection_inspector_impair)
    and
    (selection_root_identity
      or selection_iam_identity
      or selection_suspicious_useragent)
    and not (filter_trusted_roles
      or filter_internal_ip)

fields:
  - eventTime
  - eventSource
  - eventName
  - userIdentity.type
  - userIdentity.arn
  - sourceIPAddress
  - userAgent
  - awsRegion

falsepositives:
  - Planned security configuration changes
  - Infrastructure-as-code deployments
  - MSSP-managed security operations

level: critical
