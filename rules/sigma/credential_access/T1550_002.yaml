title: Pass-the-Hash Detection (T1550.002)
id: bc5a4957-34e0-4a37-aafe-509dd9dd7c3d
status: stable
description: |
    Detects Pass-the-Hash (PtH) attacks by identifying anomalous NTLM loopback authentication, 
    restricted admin logons (LogonType 9 via seclogo), and credential injection tool activity, 
    while excluding legitimate service and machine accounts.
author: hota05
date: 2026-02-03
tags:
    - attack.lateral_movement
    - attack.t1550.002
logsource:
    product: windows
    service: security
detection:
    selection_restricted_admin:
        EventID: 4624
        LogonType: 9                    
        LogonProcessName: 'seclogo'
        AuthenticationPackage: 'Negotiate'

    selection_ntlm_loopback:
        EventID: 4624
        LogonType: 3                    
        AuthenticationPackage: 'NTLM'
        IpAddress:
            - '127.0.0.1'
            - '::1'

    selection_credential_tools:
        CommandLine|contains:
            - 'sekurlsa::pth'
            - 'Invoke-TheHash'
            - 'mimikatz.exe'
            - 'pth-winexe'

    filters_legitimate:
        - TargetUserName|endswith: '$'       
        - SubjectUserName|endswith: '$'      
        - LogonProcessName: 'NtMapi'         

    condition: (selection_restricted_admin or selection_ntlm_loopback or selection_credential_tools) and not filters_legitimate
level: critical
