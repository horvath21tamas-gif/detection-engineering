title: Suspicious Modification of Office Global Template (Normal.dotm)
id: 3840d2b9-4a1f-419c-8d28-d9be0173f744
status: stable
description: >
  Detects high-risk modification or creation of Microsoft Office global 
  templates (Normal.dotm / NormalEmail.dotm) by non-Office processes or 
  from suspicious execution paths. This may indicate macro-based persistence 
  (MITRE ATT&CK T1137.001).

author: hota05 
date: 2026-02-02
modified: 2026-02-11
references:
  - https://attack.mitre.org/techniques/T1137/001/
tags:
  - attack.persistence
  - attack.t1137.001
  - attack.execution

logsource:
  product: windows
  category: file_event

detection:

  selection_target_template:
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Templates\'
    TargetFilename|endswith:
      - '\Normal.dotm'
      - '\NormalEmail.dotm'

  selection_file_modification:
    EventType:
      - 'Create'
      - 'Write'
      - 'Modify'
      - 'Rename'
      - 'Delete'

  filter_legitimate_office_process:
    Image|endswith:
      - '\winword.exe'
      - '\outlook.exe'
      - '\OfficeClickToRun.exe'

  selection_suspicious_process_path:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
      - '\Windows\Temp\'

  selection_script_engines:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'

  filter_management_agents:
    Image|contains:
      - '\Windows\ccm\'
      - '\IntuneManagementExtension\'
      - '\Tanium\'
      - '\Program Files\OneDrive\'
      - '\MigrateUser.exe'

  filter_system_context:
    User|startswith:
      - 'NT AUTHORITY\'
      - 'NT SERVICE\'

  condition:
    selection_target_template
    and selection_file_modification
    and (
          selection_script_engines
          or selection_suspicious_process_path
          or not filter_legitimate_office_process
        )
    and not filter_management_agents
    and not filter_system_context

falsepositives:
  - Legitimate Office template customization
  - Enterprise profile migration activity
  - OneDrive template synchronization
  - Authorized administrative automation

level: critical
