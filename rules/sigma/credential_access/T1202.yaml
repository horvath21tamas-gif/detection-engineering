title: Indirect Command Execution via Proxy Binaries (T1202)
id: 60c31408-b278-4028-b2e0-b496d29c3544
status: stable
description: |
    Detects execution of binaries often abused for indirect command execution or proxying.
    Focuses on non-standard parent processes and suspicious command-line arguments for:
      - pcalua.exe
      - forfiles.exe
      - conhost.exe

    Monitors for execution of scripts, binaries, and DLLs initiated by unexpected applications,
    commonly used for defense evasion or living-off-the-land attacks.

author: hota05
date: 2026-02-03
modified: 2026-02-20
tags:
    - attack.defense_evasion
    - attack.t1202
    - attack.living_off_the_land
logsource:
    product: windows
    category: process_creation

detection:

    selection_pcalua:
        Image|endswith: '\pcalua.exe'
        CommandLine|contains|all:
            - ' -a '
        CommandLine|contains:
            - '.exe'
            - '.ps1'
            - '.bat'
            - '.vbs'
            - '.dll'

    selection_forfiles:
        Image|endswith: '\forfiles.exe'
        CommandLine|contains:
            - ' /c '
            - ' -c '
        CommandLine|contains:
            - 'cmd'
            - 'powershell'
            - 'pwsh'
            - 'regsvr32'
            - 'mshta'
            - 'bitsadmin'
            - 'wscript'
            - 'cscript'

    selection_conhost:
        Image|endswith: '\conhost.exe'
        CommandLine|contains:
            - ' -- '
            - ' -e '

    selection_suspicious_origin:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\powerpnt.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\w3wp.exe'
            - '\sqlservr.exe'
            - '\php-cgi.exe'

    filter_trusted_system:
        User|startswith: 'NT AUTHORITY\'
        ParentImage|endswith:
            - '\services.exe'
            - '\msiexec.exe'
            - '\TiWorker.exe'
            - '\explorer.exe'
        CommandLine|contains:
            - '\Windows\SoftwareDistribution\'
            - 'Program Files'
        Image|contains:
            - '\Windows\System32\'

    condition: 
        (selection_pcalua or selection_forfiles or selection_conhost)
        and selection_suspicious_origin
        and not filter_trusted_system

falsepositives:
    - Legitimate use of pcalua.exe or forfiles.exe by admins
    - Explorer-launched binaries/scripts
    - Software deployment tasks from MSI or TiWorker
    - Office macros executed in normal workflow

level: high
