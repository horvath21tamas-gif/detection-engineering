title: Windows Credential Manager Harvesting Detection (T1555.004)
id: b0bd85b5-e705-428e-bae9-deb4affd80e1
status: stable
description: >
    Detects potential unauthorized credential harvesting via Windows Credential Manager (cmdkey.exe)
    by monitoring suspicious command-line usage, redirection, untrusted parent processes, and 
    non-interactive execution contexts. Filters legitimate IT management scripts and user activity.
author: hota05 
date: 2026-02-12
references:
    - https://attack.mitre.org/techniques/T1555/004/
tags:
    - attack.credential_access
    - attack.t1555.004
logsource:
    category: process_creation
    product: windows

detection:
    selection_cmdkey:
        Image|endswith: '\cmdkey.exe'
        CommandLine|contains:
            - ' /list'
            - ' /l '

    selection_redirection:
        CommandLine|contains:
            - ' > '
            - ' >> '
            - ' | '
            - ' *'

    selection_bad_parents:
        ParentImage|endswith:
            - '\wmiprvse.exe'
            - '\scrcons.exe'
            - '\psexesvc.exe'
            - '\java.exe'
            - '\nginx.exe'
            - '\httpd.exe'
            - '\powershell.exe'
            - '\cmd.exe'

    selection_untrusted_location:
        ParentImage|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'
            - '\Public\'
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\pwsh.exe'

    filter_legit_scripts:
        CommandLine|contains:
            - 'C:\Program Files\IT_Management\'
        User: 'NT AUTHORITY\SYSTEM'

    filter_explorer:
        ParentImage|endswith: '\explorer.exe'

    condition:
        selection_cmdkey
        and (selection_redirection or selection_bad_parents or selection_untrusted_location)
        and not (filter_legit_scripts or filter_explorer)

falsepositives:
    - Legitimate IT management scripts running cmdkey.exe
    - Interactive user listing credentials via cmdkey
    - Security auditing or backup processes using cmdkey
    - Dev/test environments with automation scripts

level: high
