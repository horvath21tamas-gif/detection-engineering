title: Masquerading and Process Path Abuse (T1036)
id: 8d80649e-c2bf-443f-8769-dbb2ecddd833
status: stable
description: >
  Detects advanced masquerading techniques including system binary path anomalies,
  double extensions, critical system processes spawned by untrusted parents,
  and executables with suspicious trailing or leading spaces. Optimized to filter
  out legitimate Windows Update, system maintenance, and side-loading behaviors.

author: hota05
date: 2026-02-23
tags:
  - attack.defense_evasion
  - attack.t1036
  - attack.execution

logsource:
  product: windows
  category: process_creation

detection:
  selection_path_anomaly:
    Image|endswith:
      - '\svchost.exe'
      - '\lsass.exe'
      - '\services.exe'
      - '\wininit.exe'
      - '\smss.exe'
      - '\csrss.exe'
      - '\winlogon.exe'
      - '\taskhost.exe'
      - '\taskhostw.exe'
      - '\spoolsv.exe'

  filter_legit_paths:
    Image|contains:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
      - 'C:\Windows\WinSxS\'

  selection_double_extension:
    Image|contains:
      - '.pdf.exe'
      - '.docx.exe'
      - '.xlsx.exe'
      - '.txt.exe'
      - '.rtf.exe'
      - '.jpg.exe'
      - '.zip.exe'

  selection_impossible_parent:
    Image|endswith:
      - '\lsass.exe'
      - '\svchost.exe'
      - '\services.exe'
      - '\smss.exe'
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
      - '\w3wp.exe'
      - '\sqlservr.exe'
      - '\powershell.exe'

  selection_special_chars:
    Image|contains:
      - '.exe '
      - ' .exe'

  filter_trusted_maintenance:
    - User:
        - 'NT AUTHORITY\SYSTEM'
        - 'NT AUTHORITY\LOCAL SERVICE'
        - 'NT AUTHORITY\NETWORK SERVICE'
    - ParentImage|endswith:
        - '\services.exe'
    - ParentImage|endswith:
        - '\msiexec.exe'
    - Image|contains:
        - '\Windows\SoftwareDistribution\'

  condition: >
    (selection_path_anomaly and not filter_legit_paths)
    or selection_double_extension
    or selection_special_chars
    or (selection_impossible_parent and not filter_trusted_maintenance)

falsepositives:
  - Windows Update / SoftwareDistribution operations
  - System maintenance tasks from NT AUTHORITY accounts
  - Enterprise deployment tools
  - Internal security testing and red team exercises

level: critical
