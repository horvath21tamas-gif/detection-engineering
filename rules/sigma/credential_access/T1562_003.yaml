title: Command History Logging Impairment
id: c411146e-ff5f-4a6a-b918-2679122b822b
status: stable
description: |
    Detects high-confidence attempts to suppress or tamper with interactive
    command history logging on Windows systems.

    Focuses on:
      - PowerShell PSReadLine abuse (SaveNothing, HistorySavePath redirection)
      - History file deletion (ConsoleHost_history.txt, bash history)
      - Registry-based console buffer suppression
      - Encoded PowerShell attempts to modify logging behavior

    Aligned with MITRE ATT&CK T1562.003.

author: hota05
date: 2026-02-11
tags:
    - attack.defense_evasion
    - attack.t1562.003
    - attack.t1070

logsource:
    product: windows
    category: process_creation

detection:

    selection_psreadline_core:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Set-PSReadLineOption'

    selection_psreadline_disable:
        CommandLine|contains:
            - 'SaveNothing'
            - 'AddToHistoryHandler'
            - 'HistorySavePath'
            - 'HistoryNoDuplicates'
        CommandLine|contains:
            - '$false'
            - '$null'
            - '""'
            - '/dev/null'

    selection_psreadline_encoded:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '-enc'
            - '-EncodedCommand'

    selection_registry_console_history:
        Image|endswith:
            - '\reg.exe'
        CommandLine|contains|all:
            - 'add'
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Console'
            - 'HistoryBufferSize'
        CommandLine|contains:
            - ' 0'
            - '/d 0'

    selection_history_delete:
        CommandLine|contains:
            - 'Remove-Item'
            - 'del '
            - 'erase '
            - 'rm '
        CommandLine|contains:
            - '\ConsoleHost_history.txt'
            - '\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\'
            - '\.bash_history'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\w3wp.exe'
            - '\mshta.exe'
            - '\rundll32.exe'

    filter_dev_tools:
        ParentImage|contains:
            - '\Common7\IDE\devenv.exe'
            - '\Microsoft VS Code\Code.exe'
            - '\JetBrains\'
    
    filter_system_context:
        User|startswith: 'NT AUTHORITY'
        ParentImage|endswith: '\services.exe'

    filter_temp_installers:
        CommandLine|contains:
            - 'AppData\Local\Temp\SDI'
            - 'Chocolatey'
            - 'SCCM'

    condition: ((selection_psreadline_core and selection_psreadline_disable)
                 or selection_psreadline_encoded
                 or selection_registry_console_history
                 or selection_history_delete)
               and
               (selection_suspicious_parent
                    or not (filter_dev_tools or filter_system_context or filter_temp_installers))

level: high
