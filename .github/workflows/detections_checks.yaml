name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Alapcsomagok és stabil backendek
          python -m pip install sigma-cli pysigma-backend-splunk pysigma-backend-qradar pytest "pyyaml>=6.0"
          
          # Sentinel backend telepítése kényszerítve a legbiztosabb forrásból
          python -m pip install git+https://github.com/SigmaHQ/pySigma-backend-microsoft-sentinel.git || \
          python -m pip install pySigma-backend-microsoft-sentinel || echo "⚠️ Sentinel backend hiba"
          
          # Egyéb pluginok a CLI-n keresztül
          sigma plugin install sysmon windows netwitness || echo "Néhány plugin nem elérhető"
          
          # Függőségek szinkronizálása
          python -m pip install --upgrade "pysigma>=1.1.0" sigma-cli

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek vagy hiba történt."

      - name: Convert Sigma rules to SIEM queries
        run: |
          # Mappák előkészítése
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/sentinel
          rm -f rules/splunk/*.spl
          rm -f rules/qradar/*.aql
          rm -f rules/netwitness/*.txt
          rm -f rules/sentinel/*.kql
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk konverzió
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba: $file"
            
            # QRadar konverzió (fallback logikával)
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || \
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba: $file"
            
            # NetWitness konverzió
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ NetWitness hiba: $file"

            # Microsoft Sentinel (KQL) konverzió
            # A pip-es telepítés után a technikai azonosító: microsoft_sentinel
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || \
            sigma convert -t sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "⚠️ Sentinel hiba: $file"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Változások hozzáadása
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard and SIEM rules (Splunk, QRadar, Sentinel, NetWitness)"
            
            # Pull rebase-szel a konfliktusok ellen
            git pull --rebase origin test
            
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

          # Ha a validáció korábban elbukott, itt állítjuk meg a pipeline-t
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált."
            exit 1
          fi
