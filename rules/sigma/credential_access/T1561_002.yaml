title: Disk Structure Wipe
id: e52848f9-bc27-4329-8e76-b6076d1af7a5
status: stable
description: |
    Detects destructive low-level disk operations such as partition table wiping, 
    MBR overwriting, and full-disk clearing.

    Monitors for destructive CLI arguments, raw device access patterns, and 
    untrusted execution context to prevent ransomware, wipers, or malicious scripts
    from destroying disk structures.

author: hota05 
date: 2026-02-11
tags:
    - attack.impact
    - attack.t1561.002
    - attack.t1070
    - attack.t1499

logsource:
    product: windows
    category: process_creation

detection:

    selection_tools:
        Image|endswith:
            - '\diskpart.exe'
            - '\format.com'
            - '\dd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\manage-bde.exe'
        CommandLine|contains|any:
            - 'clean'
            - 'delete partition'
            - 'Remove-Partition'
            - 'Clear-Disk'
            - 'Initialize-Disk'
            - '\\.\PhysicalDrive'
            - 'count=1 bs=512'
            - '/MBR'
            - '/GPT'

    selection_suspicious_context:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\httpd.exe'
            - '\w3wp.exe'
            - '\rundll32.exe'
        Image|contains:
            - '\Temp\'
            - '\Users\Public\'
            - '\AppData\Local\Temp\'

    filter_legit_imaging:
        - username: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\CcmExec.exe'
            - '\setup.exe'
            - '\vds.exe'
        - CommandLine|contains:
            - 'deployment\scripts'
            - 'imaging'
            - 'diskpart /s'

    condition: selection_tools and selection_suspicious_context and not filter_legit_imaging

level: critical
