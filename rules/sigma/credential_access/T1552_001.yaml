title: Ultra-Pro High-Fidelity Credentials In Files Discovery (T1552.001)
id: c52dba60-a368-492f-b6b8-724270c4f2b7
status: stable
description: |
    Detects targeted, recursive searches for credentials in configuration files and scripts. 
    Correlates search tools (findstr, grep, PowerShell) with high-risk file extensions 
    and anomalous parent processes to minimize false positives from dev/admin activity.
author: hota05
date: 2026-02-04
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_recursive_intent:
        - CommandLine|contains|all:
            - 'findstr'
            - '/s'              
        - CommandLine|contains|all:
            - 'grep'
            - '-r'              
        - CommandLine|contains|all:
            - 'Get-ChildItem'
            - '-Recurse'

    selection_sensitive_targets:
        CommandLine|contains:
            - '.config'
            - '.xml'            
            - '.unattend'      
            - '.git\config'     
            - '.aws\credentials' 
            - 'id_rsa'          
            - 'password='       
            - 'access_key'

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\wsmprovhost.exe' 
            - '\psexesvc.exe'    
            - '\httpd.exe'       
            - '\php-cgi.exe'
            - '\nginx.exe'
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'

    filter_legit_systems:
        User: 'NT AUTHORITY\SYSTEM'
        Image|contains:
            - '\Windows\System32\SearchIndexer.exe'
            - '\Windows\System32\CompatTelRunner.exe' 
            - '\Microsoft Visual Studio\'             

    condition: selection_recursive_intent and selection_sensitive_targets and selection_suspicious_parent and not filter_legit_systems
level: high
