title: Data Archiving via Library
id: 4931d4e8-110c-40c6-9ac4-676cb51a3308
status: stable
description: |
    Detects high-confidence data staging for exfiltration using .NET or 
    PowerShell compression libraries.

    Coverage includes:

      - Direct use of System.IO.Compression APIs
      - PowerShell Compress-Archive with user/server data targeting
      - Archive creation followed by encoding behavior
      - Suspicious execution lineage (webserver, macro, shell)

    Focused on ATT&CK T1560.002 (Archive via Library).

author: hota05 
date: 2026-02-12
tags:
    - attack.collection
    - attack.exfiltration
    - attack.t1560.002

logsource:
    product: windows
    category: process_creation

detection:
    selection_dotnet_compression:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'System.IO.Compression'
            - 'IO.Compression.FileSystem'
            - 'GzipStream'
            - 'BrotliStream'
            - 'ZipArchive'

    selection_compress_archive:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Compress-Archive'
            - '-DestinationPath'

    selection_sensitive_paths:
        CommandLine|contains:
            - '\Desktop\'
            - '\Documents\'
            - '\Downloads\'
            - '\AppData\Local\Microsoft\Outlook\'
            - 'C:\inetpub\'
            - 'C:\Users\Public\'
            - '\ProgramData\'

    selection_archive_output:
        CommandLine|contains:
            - '.zip'
            - '.gz'
            - '.tar'
            - '.dat'
            - '.tmp'

    selection_post_archive_encoding:
        CommandLine|contains:
            - '[Convert]::ToBase64String'
            - '-enc '
            - '-EncodedCommand'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\w3wp.exe'
            - '\httpd.exe'
            - '\winword.exe'
            - '\excel.exe'
            - '\rundll32.exe'
            - '\mshta.exe'
            - '\cmd.exe'

    selection_temp_execution:
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Windows\Temp\'

    filter_system_context:
        User|startswith: 'NT AUTHORITY'
        ParentImage|endswith:
            - '\services.exe'
            - '\svchost.exe'

    filter_enterprise_agents:
        Image|startswith:
            - 'C:\Program Files\Microsoft Monitoring Agent\'
            - 'C:\Program Files\Azure\'
            - 'C:\Program Files\Splunk\'
            - 'C:\Program Files\Elastic\'

    filter_dev_tools:
        ParentImage|contains:
            - '\Visual Studio\'
            - '\AzureDevOps\'
            - '\Jenkins\'
            - '\GitLab\'

    condition: (
                    (
                        selection_dotnet_compression
                        or selection_compress_archive
                    )
                    and selection_sensitive_paths
                    and selection_archive_output
               )
               and (selection_suspicious_parent or selection_temp_execution)
               and not filter_system_context
               and not filter_enterprise_agents
               and not filter_dev_tools

level: critical
