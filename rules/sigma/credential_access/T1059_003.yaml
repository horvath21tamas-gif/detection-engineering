title: Advanced Windows Command Shell Contextual Anomaly
id: f08e9831-a8d5-4aef-b296-54c4c3496992
status: stable
description: |
    Detects suspicious cmd.exe execution by correlating risky parent processes 
    (Web Servers, Office, SQL) with anomalous command-line patterns like 
    command chaining and discovery.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1059/003/
tags:
    - attack.execution
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd:
        Image|endswith: '\cmd.exe'

    selection_risky_parents:
        ParentImage|endswith:
            - '\w3wp.exe'        
            - '\sqlservr.exe'    
            - '\winword.exe'     
            - '\excel.exe'       
            - '\mshta.exe'       
            - '\tomcat.exe'      

    selection_attack_patterns:
        CommandLine|contains:
            - ' /c '
            - ' /r '
        CommandLine|contains|all:
            - ' && '             
            - 'whoami'           

    filter_legit_admin:
        - ParentImage|endswith: '\services.exe'
        - CommandLine|contains: 
            - 'C:\Windows\System32\wbem\WMIC.exe'
            - 'Microsoft Monitoring Agent'
        - username: 'NT AUTHORITY\SYSTEM'
          CommandLine|contains: 'C:\Windows\TEMP\'

    condition: selection_cmd and (selection_risky_parents or selection_attack_patterns) and not filter_legit_admin
level: critical
