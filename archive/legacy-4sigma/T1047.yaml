title: Tavoli hoston inditott folyamat wmic.exe segitsegevel
id: 1
status: experimental
description: Tavoli hoston inditott folyamat wmic.exe segitsegevel
author: hota05
date: 2026/01/13
logsource:
  product: windows
  category: process_creation
detection:
  selection_remote:
    Image|endswith: "\wmic.exe"
    CommandLine|contains: 
      - "/node:"
      - "process"
      - "call"
      - "create"
  selection_user:
    User:
      - "SYSTEM"
  condition: selection_remote and not selection_user
level: medium
tags:
  - attack.t1047
falsepositives:
  - admin scriptek
  - management tooling
