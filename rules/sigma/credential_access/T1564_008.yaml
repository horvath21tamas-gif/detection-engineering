title: Ultra-Pro High-Fidelity Email Hiding Rules Detection (T1564.008)
id: 7afba0fb-5168-4f01-b10d-f233a952144f
status: stable
description: |
    Detects targeted email hiding rules by identifying suspicious inbox rule 
    modifications that automate the deletion or hiding of security alerts, 
    initiated by untrusted parent processes or non-admin shells.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1564.008
logsource:
    product: windows
    category: process_creation
detection:
    selection_cmdlets:
        CommandLine|contains:
            - 'New-InboxRule'
            - 'Set-InboxRule'
            - 'Set-MailboxForwardingConfiguration'

    selection_silencing_actions:
        CommandLine|contains:
            - 'DeleteMessage'
            - 'PermanentDelete'
            - 'MarkAsRead'
            - 'MoveToFolder'

    selection_security_keywords:
        CommandLine|contains:
            - 'Security'
            - 'Alert'
            - 'Password'
            - 'MFA'
            - 'Sign-in'
            - 'Phish'
            - 'Compromise'
            - 'Unauthorized'

    selection_suspicious_parents:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\msedge.exe'
            - '\chrome.exe'
            - '\mshta.exe'

    filter_trusted_admin_activity:
        - username: 'NT AUTHORITY\SYSTEM'
        - CommandLine|contains:
            - 'Spam'
            - 'Junk'
            - 'Internal-Auto-Forward'
        - ParentImage|contains:
            - '\Windows\System32\svchost.exe'

    condition: selection_cmdlets and ((selection_silencing_actions and selection_security_keywords) or selection_suspicious_parents) and not filter_trusted_admin_activity
level: critical
