name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ez kell a hibamentes feltöltéshez (pull --rebase)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml sigma-cli
          sigma plugin install splunk
          sigma plugin install sysmon
          sigma plugin install windows

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q

      - name: Lint and validate Sigma rules
        run: |
          python tools/lint_rules.py
          python tools/validate_metadata.py

      - name: Convert Sigma rules to Splunk (.spl files)
        run: |
          mkdir -p rules/splunk
          rm -f rules/splunk/*.spl
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            sigma convert -t splunk -p sysmon "$file" -o "rules/splunk/${filename}.spl"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          # Ez a script generálja a README-t és az SVG képet is
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # FONTOS: Itt hozzáadtuk a coverage_map.svg-t is!
          git add README.md COVERAGE.md attack_navigator_layer.json coverage_map.svg rules/splunk/*.spl
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard and SVG Coverage Map"
            # Megelőzzük a korábbi hibát: lekérjük a változásokat és rátesszük a miénket
            git pull --rebase origin test
            git push origin test
          else
            echo "Nincs változás, nem kell commitolni."
          fi
