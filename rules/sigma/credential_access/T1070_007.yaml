title: Ultra-Pro High-Fidelity Network History and RDP Trace Removal (T1070.007)
id: 5f42e70e-5f13-4128-a952-d6192be29631
status: stable
description: |
    Detects targeted attempts to clear network connection history, focusing on RDP 
    Terminal Server Client MRU lists and network share metadata removal. 
    Filters out common helpdesk troubleshooting (DNS flush) unless part of a broader attack.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1070.007
logsource:
    product: windows
    category: process_creation
detection:
    selection_rdp_registry_wipe:
        - CommandLine|contains|all:
            - 'reg'
            - 'delete'
        - CommandLine|contains:
            - '\Software\Microsoft\Terminal Server Client\Default'
            - '\Software\Microsoft\Terminal Server Client\Servers'
            - 'MRU0' 

    selection_net_share_wipe:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains|all:
            - 'use'
            - '/delete'
        CommandLine|contains:
            - '*' 
            - ' /y' 

    selection_dns_flush:
        CommandLine|contains: 'ipconfig /flushdns'

    selection_suspicious_chain:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\chrome.exe'
            - '\powershell.exe'
            - '\mshta.exe'

    filter_trusted_admin_behavior:
        - User: 'NT AUTHORITY\SYSTEM'
          ParentImage|endswith: '\services.exe'
        - CommandLine|contains:
            - 'AppData\Local\Temp\SDI'  
            - 'SystemReset.exe'         
        - ParentImage|endswith: '\msiexec.exe' 

    condition: (selection_rdp_registry_wipe or selection_net_share_wipe or (selection_dns_flush and selection_suspicious_chain)) and not filter_trusted_admin_behavior
level: high
