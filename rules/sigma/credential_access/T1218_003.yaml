title: Ultra-Pro High-Fidelity MsiExec Proxy Execution (T1218.003)
id: b8e2ecc7-fa30-4668-acdd-29f3174d26d9
status: stable
description: |
    Detects the abuse of msiexec.exe to execute malicious payloads. 
    Focuses on non-standard parent-child relationships (e.g., Office to MsiExec) 
    and remote resource fetching while filtering out legitimate enterprise installers.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1218.003
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\msiexec.exe'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'

    selection_cmd_args:
        CommandLine|contains:
            - 'http'         
            - 'ftp'
            - ' /q'          
            - ' /p '         
            - ' /y '         
            - ' /z '        

    selection_paths:
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Downloads\'

    filter_trusted_management:
        ParentImage|startswith:
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\CCM\CcmExec.exe'
            - 'C:\Program Files\Microsoft.Management.Services.IntuneWindowsAgent.exe'
        username: 'NT AUTHORITY\SYSTEM'

    condition: selection_img and (selection_suspicious_parent or (selection_cmd_args and selection_paths)) and not filter_trusted_management
level: critical
