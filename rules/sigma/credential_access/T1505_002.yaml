title: Ultra-Pro IIS Native Module Injection (T1505.002)
id: 9d6a26d8-6d55-4d0b-b0d4-9432f799a75b
status: stable
description: |
    Detects the registration or manual injection of IIS modules by monitoring 
    appcmd.exe usage, direct applicationHost.config edits, and DLL loads 
    from non-standard or user-writable paths.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1505.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_appcmd:
        - Image|endswith: '\appcmd.exe'
        - OriginalFileName: 'appcmd.exe'
    
    selection_appcmd_args:
        CommandLine|contains:
            - 'install module'
            - 'add module'
            - 'image-path' 

    selection_config_tamper:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\notepad.exe'
        - CommandLine|contains:
            - '\inetsrv\Config\applicationHost.config'
            - '\inetsrv\Config\web.config'

    selection_suspicious_path:
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
            - '\PerfLogs\'
            - '\ProgramData\'

    filter_trusted_processes:
        - username: 'NT AUTHORITY\SYSTEM'
          Image|contains: 
            - '\Windows\System32\inetsrv\iissetup.exe'
            - '\Windows\SoftwareDistribution\'
        - Image|endswith: '\ngen.exe'

    condition: (selection_appcmd and selection_appcmd_args) or (selection_config_tamper or selection_suspicious_path) and not filter_trusted_processes
level: critical
