name: CI/CD for Detection Rules

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # 1. JOB: QRadar - Speciális konverzió hibatűréssel (VÁLTOZATLAN, MŰKÖDŐ RÉSZ)
  qradar_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QRadar environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyparsing==3.1.1" "pysigma==0.9.11" "pysigma-backend-qradar"

      - name: Convert QRadar rules (Skip Unsupported Fields)
        run: |
          mkdir -p rules/qradar
          cat <<EOF > convert_qradar.py
          import os
          import sigma.backends.qradar
          from sigma.collection import SigmaCollection
          import inspect

          QRadarBackend = None
          for name, obj in inspect.getmembers(sigma.backends.qradar):
              if inspect.isclass(obj) and "Backend" in name and ("QRadar" in name or "Qradar" in name):
                  QRadarBackend = obj
                  break

          if QRadarBackend is None:
              print("Critical: QRadar Backend not found!")
              exit(1)

          backend = QRadarBackend()
          rules_path = "rules/sigma"
          
          success_count = 0
          skip_count = 0
          
          for root, _, files in os.walk(rules_path):
              for file in files:
                  if file.endswith((".yaml", ".yml")):
                      try:
                          with open(os.path.join(root, file), "r", encoding="utf-8") as f:
                              rule = SigmaCollection.from_yaml(f.read())
                              result = backend.convert(rule)
                              if result:
                                  out_name = file.rsplit(".", 1)[0] + ".aql"
                                  with open(f"rules/qradar/{out_name}", "w") as out:
                                      out.write(result[0])
                                      success_count += 1
                      except Exception as e:
                          skip_count += 1
          
          print(f"DONE: {success_count} rules converted, {skip_count} skipped.")
          EOF
          python convert_qradar.py

      - name: Upload QRadar rules
        uses: actions/upload-artifact@v4
        with:
          name: qradar-results
          path: rules/qradar/
          retention-days: 1

  # 2. JOB: Modern SIEM-ek - JAVÍTOTT RÉSZ a korrelációs hiba ellen
  modern_siem_job:
    needs: qradar_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download QRadar artifacts
        uses: actions/download-artifact@v4
        with:
          name: qradar-results
          path: rules/qradar/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modern SIEM environment (Clean & Force Update)
        run: |
          python -m pip install --upgrade pip
          
          # Eltávolítunk minden maradványt, ami bekavarhat
          python -m pip uninstall -y pysigma sigma-cli pyparsing
          
          # Legfrissebb motor telepítése (ebben már benne van a correlations modul)
          python -m pip install "pysigma==1.1.0" "pyparsing==3.1.1" "packaging>=24.0"
          
          # CLI telepítése a saját függőségei nélkül, hogy ne írja felül a motort
          python -m pip install --no-deps "sigma-cli==2.0.1"
          python -m pip install "click>=8.0.0" "colorama>=0.4.6" "prettytable>=3.0.0"
          
          # Backendek manuális telepítése a konfliktusok elkerülésére
          python -m pip install pysigma-backend-splunk pysigma-backend-azure pysigma-backend-elasticsearch pysigma-backend-insightidr
          
          # Alapvető pluginok felrakása
          sigma plugin install -f windows sysmon

      - name: Update and Validate
        run: |
          mkdir -p inventory rules/splunk rules/netwitness rules/elastic rules/sentinel
          python tools/update_inventory.py
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV
          python tools/preprocess_sigma.py

      - name: Convert Modern SIEM rules
        run: |
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            
            # Splunk konverzió
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "Err Splunk: $file"
            
            # Sentinel konverzió
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "Err Sentinel: $file"
            
            # Elastic konverzió
            sigma convert -t lucene -p ecs_windows "$file" -o "rules/elastic/${filename}.kql" || echo "Err Elastic: $file"
          done

      - name: Post-processing and Commit
        run: |
          python tools/final_siem_fixer.py
          python tools/check_integrity.py
          if [ "${{ github.event_name }}" == "push" ]; then
            python tools/score_rules.py
            python tools/generate_docs.py
            python tools/update_all.py
            
            git config --local user.email "action@github.com"
            git config --local user.name "github-actions[bot]"
            git add rules/ inventory/ *.md *.json *.svg
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update: Multi-SIEM detections (Fixed pysigma correlation error)"
              git pull --rebase -X ours origin test
              git push origin test
            fi
          fi

      - name: Check Status
        if: always()
        run: |
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            exit 1
          fi
