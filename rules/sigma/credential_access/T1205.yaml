title: Traffic Signaling and Port Knocking Activity (T1205)
id: b62c91ed-1865-4084-bca3-67a15b778596
status: stable
description: |
    Detects attempts to implement or trigger Port Knocking / Traffic Signaling.
    Monitors:
      - Raw packet capture tools (Npcap/WinPcap/sniffer tools)
      - Suspicious firewall rule modifications allowing UDP/ICMP/Any port
      - Execution from untrusted scripting or shell environments

    This technique is often used by attackers to stealthily signal C2, 
    bypass firewalls, or trigger hidden services.

author: hota05
date: 2026-02-02
modified: 2026-02-20
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1205
    - attack.t1562.001
    - attack.t1049
logsource:
    product: windows
    category: process_creation

detection:

    selection_netsh_firewall:
        Image|endswith:
            - '\netsh.exe'
        OriginalFileName:
            - 'netsh.exe'
        CommandLine|contains|all:
            - 'advfirewall firewall add rule'
            - 'action=allow'
            - 'protocol=UDP'
        CommandLine|contains:
            - 'protocol=ICMP'
            - 'localport=any'
            - 'remoteport=any'

    selection_sniffers:
        Image|endswith:
            - '\tcpdump.exe'
            - '\windump.exe'
            - '\scapy.exe'
            - '\nmap.exe'
            - '\hping.exe'
        CommandLine|contains:
            - ' -i '
            - 'sniffer'
            - 'npcap'
            - 'winpcap'

    selection_untrusted_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'
            - '\AppData\'
            - '\ProgramData\'

    filter_trusted_apps:
        User|startswith: 'NT AUTHORITY\'
        Image|contains:
            - '\Windows\System32\svchost.exe'
            - '\Program Files\Windows Defender\'
            - '\Program Files\CrowdStrike\'
            - '\Program Files\SentinelOne\'
        CommandLine|contains: 'description='

    condition: 
        (selection_netsh_firewall or selection_sniffers)
        and selection_untrusted_parent
        and not filter_trusted_apps

falsepositives:
    - Enterprise firewall deployments or scripts
    - Legitimate network scanning or monitoring tools
    - Security lab or pentesting activity in controlled environments

level: high
