title: Ultra-Pro Environmental Keying Discovery (T1480.001)
id: 72473592-3c50-4f77-ad84-3ca36f6a798b
status: stable
description: |
    Detects targeted environmental keying by identifying hardware fingerprinting 
    and machine-specific registry lookups initiated by suspicious, unbacked, 
    or non-standard parent processes.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1480.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_hardware_id:
        CommandLine|contains:
            - 'csproduct get uuid'          
            - 'diskdrive get serialnumber'   
            - 'bios get serialnumber'      
            - 'MachineGuid'              

    selection_ad_sid:
        CommandLine|contains:
            - 'get-adpdmomainsid'            
            - 'objectSid'
            - 'machineObjectGuid'

    selection_suspicious_context:
        - Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\Public\'
        - ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\winword.exe'
            - '\excel.exe'

    filter_trusted_apps:
        - User: 'NT AUTHORITY\SYSTEM'
        - Image|contains:
            - '\Windows\System32\wbem\WmiPrvSE.exe'
            - '\Windows\System32\svchost.exe'
            - '\Program Files\Microsoft Monitoring Agent\'
            - '\Program Files\Tanium\'
            - '\Program Files (x86)\Kaspersky Lab\'
        - CommandLine|contains:
            - 'InTune'
            - 'AzureAD'

    condition: (selection_hardware_id or selection_ad_sid) and selection_suspicious_context and not filter_trusted_apps
level: high
