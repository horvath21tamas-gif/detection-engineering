title: Ultra-Pro High-Fidelity System Location Discovery (T1614)
id: 3e13bde8-b6ca-4453-bfc2-4a8a4d642cd1
status: stable
description: |
    Detects targeted system location and language discovery, often used by ransomware 
    for regional targeting or exclusion (kill-switch check). Focuses on Registry-based 
    keyboard layout enumeration and external IP-to-geo API calls from non-standard processes.
author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1614
logsource:
    category: process_creation
    product: windows
detection:
    selection_external_geo:
        CommandLine|contains:
            - 'ipinfo.io'
            - 'ifconfig.me'
            - 'icanhazip.com'
            - 'api.ipify.org'
            - 'checkip.amazonaws.com'
            - 'ip-api.com'

    selection_registry_locale:
        CommandLine|contains:
            - 'Keyboard Layout\Preload'      
            - 'Control Panel\International'  
            - 'MUILanguages'
            - 'GeoID'                       

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\wsmprovhost.exe'   
            - '\httpd.exe'           
        IntegrityLevel: 'Medium'     

    selection_ps_cmdlets:
        CommandLine|contains:
            - 'Get-Culture'
            - 'Get-WinSystemLocale'
            - 'Get-TimeZone'

    filter_legit_software:
        - username: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\msiexec.exe'        
            - '\CcmExec.exe'         
            - '\svchost.exe'         
        - CommandLine|contains:
            - 'Program Files'        
            - 'Splunk'              

    condition: (selection_external_geo or selection_registry_locale or selection_ps_cmdlets) and selection_suspicious_parent and not filter_legit_software
level: high
