title: Ultra-Pro High-Fidelity SIP Hijacking and Trust Subversion (T1553.002)
id: 783f4673-576c-4ccf-8a17-a1f4d2a2e24b
status: stable
description: |
    Detects unauthorized modification of Subject Interface Packages (SIP) and Trust Providers. 
    Focuses on DLL registrations from non-standard or user-writable paths which is a 
    common technique to make malicious binaries appear as validly signed.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1553.002
logsource:
    product: windows
    category: registry_event
detection:
    selection_sip_registry:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Cryptography\OID\EncodingType 0\CryptSIPDllVerifyIndirectData\'
            - '\SOFTWARE\Microsoft\Cryptography\OID\EncodingType 0\CryptSIPDllGetSignedDataMsg\'
            - '\SOFTWARE\Microsoft\Cryptography\Providers\Trust\FinalPolicy\'

    selection_suspicious_path:
        Details|contains:
            - '\AppData\'
            - '\Users\Public\'
            - '\Windows\Temp\'
            - '\Downloads\'
            - '\PerfLogs\'
            - '\ProgramData\' 

    selection_process:
        Image|endswith:
            - '\reg.exe'
            - '\powershell.exe'
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'

    filter_trusted_installers:
        Image|startswith:
            - 'C:\Windows\servicing\TrustedInstaller.exe'
            - 'C:\Windows\System32\sysprep\'
            - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\' 
        username: 'NT AUTHORITY\SYSTEM'

    condition: selection_sip_registry and (selection_suspicious_path or selection_process) and not filter_trusted_installers
level: critical
