title: Gyanús Named Pipe létrehozása (High Fidelity - Fixed)
id: 519fab54-5841-48d3-b600-bb082c0251e6
status: stable
description: >
  Javított verzió, amely kompatibilis a Splunk, Elastic, QRadar és NetWitness backendekkel.
author: hota05
date: 2026/01/21
logsource:
  product: windows
  category: pipe_created

detection:
  selection_known_malicious:
    # A backslash-eket dupla \\-el vagy idézőjellel kell védeni
    PipeName|contains:
      - '\msagent_'
      - '\postex_'
      - '\status_'
      - '\psexec'
      - '\paexec'
      - '\remcom'
      - '\lsadump'
      - '\cachedump'
      - '\mypipe'
      - '\win_svc'

  selection_regex_patterns:
    # A hiba itt volt: A Sigma regexben a \ karaktert duplázni kell: \\\\ 
    # Vagy használjunk egyszerűbb illeszkedést, amit minden backend szeret.
    PipeName|re: '^\\+[a-f0-9]{8,10}$'

  selection_suspicious_paths:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\powershell_ise.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
      - '\mshta.exe'

  filter_legit_microsoft:
    Image|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
    PipeName|contains:
      - '\lsass'
      - '\ntsvcs'
      - '\scerpc'
      - '\epmapper'
      - '\atsvc'
      - '\spoolss'
      - '\srvsvc'

  filter_legit_apps:
    Image|endswith:
      - '\vmtoolsd.exe'
      - '\docker.exe'
      - '\vboxservice.exe'
      - '\chrome.exe'
      - '\msedge.exe'

  condition: (selection_known_malicious or (selection_suspicious_paths and selection_regex_patterns)) and not (filter_legit_microsoft or filter_legit_apps)

falsepositives:
  - Egyedi fejlesztésű szoftverek
level: high
tags:
  - attack.lateral_movement
  - attack.t1559.001
