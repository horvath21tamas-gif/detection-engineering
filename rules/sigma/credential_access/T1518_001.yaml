title: Security Software Discovery Detection (T1518.001)
id: 348830cf-841c-48c4-bf03-bccb1b626e4c
status: stable
description: |
    Detects targeted discovery of security products such as AV, EDR, HIPS, and sandbox environments.
    Focuses on keyword-specific enumeration, suspicious command-line usage (findstr, grep, Get-Process/Service),
    and anomalous parent process lineages (Office apps, web servers, non-elevated shells).  
    Also detects attempts to fingerprint virtual machines.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1518/001/
tags:
    - attack.discovery
    - attack.t1518.001
    - attack.reconnaissance
    - attack.endpoint

logsource:
    category: process_creation
    product: windows

detection:

    selection_discovery_tools:
        Image|endswith:
            - '\wmic.exe'
            - '\tasklist.exe'
            - '\sc.exe'
            - '\reg.exe'
            - '\net.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Get-Process'
            - 'Get-Service'
            - 'Get-ItemProperty'
            - 'tasklist'
            - 'sc query'
            - 'reg query'
            - 'net start'
            - 'findstr'
            - 'grep'

    selection_security_keywords:
        CommandLine|contains:
            - 'defender'
            - 'sentinel'
            - 'falcon'
            - 'crowdstrike'
            - 'carbonblack'
            - 'fireeye'
            - 'cylance'
            - 'sophos'
            - 'antivirus'
            - 'firewall'
            - 'edr'
            - 'hip' 
            - 'sandbox'

    selection_vm_enumeration:
        CommandLine|contains:
            - 'VBOX'
            - 'VMWARE'
            - 'VirtualBox'
            - 'Guest Additions'
            - 'Hyper-V'
            - 'VirtualMachine'

    selection_suspicious_parents:
        ParentImage|endswith:
            - '\wsmprovhost.exe'
            - '\httpd.exe'
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\powerpoint.exe'
        IntegrityLevel: 'Medium'

    filter_legit_system_noise:
        User: 'NT AUTHORITY\SYSTEM'
        ParentImage|endswith:
            - '\CcmExec.exe'
            - '\svchost.exe'
            - '\services.exe'
        CommandLine|contains:
            - 'Program Files'
            - 'Google\Update'
            - 'Windows Defender'
            - 'Microsoft Security'

    condition: 
        selection_discovery_tools 
        and (selection_security_keywords or selection_vm_enumeration or selection_suspicious_parents) 
        and not filter_legit_system_noise

falsepositives:
    - Scheduled antivirus or EDR scans querying local services
    - IT admins performing system audits or using WMIC/PowerShell
    - Legitimate software installation or update routines

level: high
