title: SSH Lateral Movement & Tunneling (T1021.004)
id: f59d3599-03d4-4e9e-956b-228856d73a99
status: stable
description: |
  Detects advanced SSH lateral movement and tunneling. Filters legitimate 
  DevOps/Git activity by analyzing parent process lineage, command-line 
  entropy, and non-standard authentication patterns.
author: hota05
date: 2026-02-05
tags:
  - attack.lateral_movement
  - attack.t1021.004

logsource:
  category: process_creation
  product: windows

detection:
  selection_img:
    - Image|endswith:
        - '\ssh.exe'
        - '\sshd.exe'
    - OriginalFileName:
        - 'ssh.exe'
        - 'sshd.exe'

  selection_tunneling:
    CommandLine|contains:
      - ' -L '
      - ' -R '
      - ' -D '
      - ' -N'
      - ' -f'

  selection_suspicious_lineage:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\httpd.exe'
      - '\winword.exe'
    CommandLine|contains:
      - 'StrictHostKeyChecking=no'
      - 'UserKnownHostsFile=/dev/null'

  selection_sshd_payload:
    ParentImage|endswith: '\sshd.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -w hidden'
      - 'IEX'
      - 'DownloadString'

  filter_devops_tools:
    - ParentImage|contains:
        - '\Git\'
        - '\VSCode\'
        - '\JetBrains\'
    - CommandLine|contains:
        - 'git-upload-pack'
        - 'git-receive-pack'
        - 'vscode-remote'
    - username: 'NT AUTHORITY\SYSTEM'

  condition: >
    selection_img and
    (selection_tunneling or selection_suspicious_lineage or selection_sshd_payload) and
    not filter_devops_tools

level: critical
