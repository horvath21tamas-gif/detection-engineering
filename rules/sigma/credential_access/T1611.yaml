title: Ultra-Pro Container Escape & Host Access (T1611)
id: 4cb24ad2-86f5-4a4a-9453-f6c67523cfca
status: stable
description: |
  Detects unauthorized container escape attempts and host access. Focuses on 
  non-standard privileged executions, dangerous mounts, and unconfined security 
  contexts, while filtering out legitimate cluster infrastructure components.

author: hota05 
date: 2026-02-02
modified: 2026-02-11
tags:
  - attack.privilege_escalation
  - attack.t1611

logsource:
  product: linux
  category: process_creation

detection:

  selection_escape_flags:
    CommandLine|contains:
      - '--privileged'
      - '--cap-add=SYS_ADMIN'
      - '--cap-add=SYS_PTRACE'
      - '--pid=host'
      - '--net=host'
      - '--ipc=host'
      - '--security-opt=seccomp=unconfined'
      - '--security-opt=apparmor=unconfined'

  selection_dangerous_mounts:
    CommandLine|contains:
      - '-v /:/'
      - '-v /proc:/proc'
      - '-v /sys:/sys'
      - '-v /var/run/docker.sock:/var/run/docker.sock'
      - '-v /run/containerd:/run/containerd'
      - '-v /etc/kubernetes:/etc/kubernetes'
      - '-v /root/.ssh:/root/.ssh'

  selection_interactive:
    ParentImage|endswith:
      - '/bash'
      - '/sh'
      - '/zsh'
      - '/python'
      - '/ruby'
      - '/php'
      - '/node'

  filter_infrastructure:
    Image|contains:
      - 'kube-proxy'
      - 'calico/node'
      - 'cilium'
      - 'datadog/agent'
      - 'node-exporter'
      - 'istio-proxy'
      - 'fluentd'
      - 'prometheus'
    username: 'root'

  condition: (selection_escape_flags or selection_dangerous_mounts) and selection_interactive and not filter_infrastructure

falsepositives:
  - Legitimate privileged container builds or debugging sessions by ops
  - Monitoring agents mounting Docker socket in orchestrated environments
  - Root user containers managed by trusted CI/CD pipelines

level: critical
