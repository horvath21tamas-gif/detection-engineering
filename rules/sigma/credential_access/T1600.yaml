title: Weaken Encryption Attempt (T1600)
id: 40421183-fce5-4ad4-8a66-b2527a9d5360
status: stable
description: |
    Detects unauthorized attempts to weaken system encryption, including TLS protocol downgrades
    and PowerShell certificate validation bypasses. Focuses on non-system processes and
    suspicious locations while excluding trusted installers and browser updates.
author: hota05 
date: 2026-02-11
tags:
    - attack.defense_evasion
    - attack.t1600
logsource:
    category: registry_event
    product: windows

detection:
  selection_tls_downgrade:
    TargetObject|re:
      - 'SCHANNEL\\Protocols\\TLS 1\.2\\Client\\Enabled'
      - 'SCHANNEL\\Protocols\\TLS 1\.3\\Client\\Enabled'
      - '\\.NETFramework\\v\d+\.\d+\\System\.Net\.ServicePointManager\.SecurityProtocol'
    Details|in:
      - '0x00000000'  
      - '0x00000030'  
      - '0x000000C0' 

  selection_ps_bypass:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'ServerCertificateValidationCallback'
      - 'CheckCertificateRevocationList = $false'
      - '[Net.ServicePointManager]::SecurityProtocol ='
      - '[System.Net.ServicePointManager]::SecurityProtocol'

  selection_suspicious_actor:
    Image|contains:
      - '\Users\'
      - '\AppData\Local\Temp\'
      - '\Downloads\'
      - '\Public\'
      - '\Desktop\'
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'

  filter_trusted_installers:
    Image|endswith:
      - '\msiexec.exe'
      - '\TrustedInstaller.exe'
      - '\CcmExec.exe'
    username: 'NT AUTHORITY\SYSTEM'

  filter_browser_updates:
    Image|contains:
      - '\Google\Chrome\Application\'
      - '\Microsoft\Edge\Application\'
      - '\Mozilla Firefox\'

  condition: (selection_tls_downgrade or selection_ps_bypass) and selection_suspicious_actor and not (filter_trusted_installers or filter_browser_updates)

fields:
  - Time
  - User
  - Image
  - ParentImage
  - CommandLine
  - TargetObject
  - Details

falsepositives:
  - IT administrators temporarily disabling TLS for testing in controlled environments
  - Automated deployment scripts updating .NET security protocols
  - Browser or system updates modifying TLS registry keys

level: high
