name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # --- 1. JOB: SENTINEL KONVERZIÓ (Izolált környezet) ---
  sentinel_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sentinel Environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyparsing==3.1.1" "pysigma<0.11.0" "pysigma-backend-azure==0.1.3"

      - name: Convert Sentinel rules
        run: |
          mkdir -p rules/sentinel
          python -c "
          import os
          from sigma.collection import SigmaCollection
          from sigma.backends.azure import AzureBackend
          
          backend = AzureBackend()
          for root, _, files in os.walk('rules/sigma'):
              for file in files:
                  if file.endswith(('.yaml', '.yml')):
                      try:
                          with open(os.path.join(root, file), 'r', encoding='utf-8') as f:
                              rule = SigmaCollection.from_yaml(f.read())
                              result = backend.convert(rule)
                              if result:
                                  out_name = file.rsplit('.', 1)[0] + '.kql'
                                  with open(f'rules/sentinel/{out_name}', 'w') as out:
                                      out.write(result[0])
                      except Exception as e:
                          print(f'Error converting {file}: {e}')
          "

      - name: Upload Sentinel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-queries
          path: rules/sentinel/
          retention-days: 1

  # --- 2. JOB: FŐ PIPELINE ---
  detection_pipeline:
    needs: sentinel_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Sentinel results
        uses: actions/download-artifact@v4
        with:
          name: sentinel-queries
          path: rules/sentinel/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Fordításhoz szükséges könyvtár telepítése
          python -m pip install googletrans==4.0.0-rc1
          sigma plugin install splunk sysmon windows netwitness elasticsearch
          sigma plugin install --force-install qradar || echo "QRadar forced"
          python -m pip install --upgrade "pysigma>=1.1.0" "pyparsing>=3.0.0" sigma-cli

      - name: Update Dynamic Inventory from SIEM
        run: |
          mkdir -p inventory
          python tools/update_inventory.py

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Log Source Validation
        run: python tools/check_log_sources.py

      - name: Run Simulation Tests (Logic Verification)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/test_detection_logic.py -v || echo "⚠️ Szimulációs tesztek sikertelenek."

      - name: Run Unit Tests (General)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --ignore=test/test_detection_logic.py --maxfail=5 --disable-warnings -q || echo "Nincsenek általános tesztek."

      - name: Preprocess Sigma rules
        run: python tools/preprocess_sigma.py

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/elastic
          
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            
            # WINDOWS ÉS PROCESS CREATION SZABÁLYOK
            if grep -qiE "windows|process_creation|sysmon|registry|service_control" "$file"; then
              sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "conversion_failed" > "rules/splunk/${filename}.spl"
              sigma convert -t lucene -p ecs_windows "$file" -o "rules/elastic/${filename}.kql" || echo "conversion_failed" > "rules/elastic/${filename}.kql"
              sigma convert -t qradar --without-pipeline "$file" -o "rules/qradar/${filename}.aql" || echo "conversion_failed" > "rules/qradar/${filename}.aql"
            
            # EGYÉB SZABÁLYOK
            else
              sigma convert -t splunk --without-pipeline "$file" -o "rules/splunk/${filename}.spl" || echo "conversion_failed" > "rules/splunk/${filename}.spl"
              sigma convert -t lucene --without-pipeline "$file" -o "rules/elastic/${filename}.kql" || echo "conversion_failed" > "rules/elastic/${filename}.kql"
              sigma convert -t qradar --without-pipeline "$file" -o "rules/qradar/${filename}.aql" || echo "conversion_failed" > "rules/qradar/${filename}.aql"
            fi
            
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "conversion_failed" > "rules/netwitness/${filename}.txt"
          done

      - name: Final SIEM Query Fixer (QRadar, NetWitness & Sentinel)
        run: python tools/final_siem_fixer.py

      - name: Run Integrity Check
        run: python tools/check_integrity.py

      # --- DOKUMENTÁCIÓS FOLYAMAT ---
      - name: Score Detection Rules
        run: python tools/score_rules.py

      - name: Run Gap Analysis
        run: python tools/gap_analysis.py

      - name: Update LOLBAS Inventory
        run: python tools/update_lolbas.py

      - name: Generate Multi-language Wiki and Dashboard
        run: |
          # Alap dokumentáció generálás
          python tools/generate_docs.py
          # Fordított, LOLBAS-szel és Zajszinttel bővített Wiki generálás
          python tools/generate_wiki.py
          # Összesített update
          python tools/update_all.py

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Multi-SIEM queries, Multi-lang Wiki, Scores and Gap Analysis [skip ci]"
            git pull --rebase -X ours origin test
            git push origin test
          fi

      - name: Check Validation Status
        if: always()
        run: |
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            exit 1
          fi
