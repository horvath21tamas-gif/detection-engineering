title: Network Share Automated Collection (T1602)
id: 7553b83c-5a54-4641-93b9-822ec0016cd2
status: stable
description: |
    Detects highly suspicious, automated collection of sensitive data from network shares.
    Focuses on UNC path traversal, sensitive file extensions, recursive copy logic, and 
    untrusted process lineage. Filters legitimate IT management, backup, and system processes
    to reduce false positives.
author: hota05 
date: 2026-02-11
tags:
    - attack.collection
    - attack.t1602
    - attack.lateral_movement
logsource:
    product: windows
    category: process_creation

detection:

  selection_automation:
    CommandLine|contains:
      - ' -Recurse'
      - ' /s '
      - ' -Include '
      - ' -Filter '
      - 'robocopy'
      - 'xcopy'
      - 'Copy-Item'
      - 'Copy-File'

  selection_unc_path:
    CommandLine|contains:
      - '\\\\'         
      - 'net use'
      - 'net view'
      - 'New-PSDrive'

  selection_sensitive_files:
    CommandLine|contains:
      - '.doc'
      - '.docx'
      - '.xls'
      - '.xlsx'
      - '.pdf'
      - '.pst'
      - '.kdbx'
      - '.key'
      - '.config'
      - 'id_rsa'
      - '.zip'
      - '.7z'
      - '.rar'

  selection_suspicious_context:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\w3wp.exe'
      - '\rundll32.exe'
      - '\explorer.exe'
    IntegrityLevel: 'Medium'

  filter_trusted_processes:
    - Image|contains:
        - 'C:\Program Files\Microsoft System Center\'
        - 'C:\Windows\CCM\'
        - 'C:\Program Files\Veritas\'
        - 'C:\Program Files\Commvault\'
        - 'C:\Program Files\Veeam\'
    - CommandLine|contains:
        - 'SoftwareDistribution'
        - '.log'
    - username: 'NT AUTHORITY\SYSTEM'

  condition: selection_automation and selection_unc_path and selection_sensitive_files and selection_suspicious_context and not filter_trusted_processes

fields:
  - CommandLine
  - ParentImage
  - User

falsepositives:
  - IT Admin scripts copying files for migrations or backup
  - Scheduled backups (Commvault, Veritas, Veeam)
  - Security or compliance scanning scripts

level: critical
