title: Disable Entity Verification (T1600.002)
id: a1102620-fcb4-4a2d-a54b-095dd5a9c9cb
status: stable
description: |
    Detects unauthorized attempts to bypass system trust verification, 
    certificate validation, and Authenticode/WinTrust checks. Focuses on 
    suspicious certutil usage and registry-based policy modifications 
    executed by untrusted processes. Minimizes false positives by excluding 
    known IT management tools and signed software updaters.
author: hota05 
date: 2026-02-11
tags:
    - attack.defense_evasion
    - attack.t1600.002
logsource:
    category: process_creation
    product: windows

detection:
  selection_untrusted_actor:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Downloads\'
      - '\Desktop\'
      - '\PerfLogs\'
    ParentImage|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\pwsh.exe'

  selection_certutil:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - '-addstore'
      - '-importcert'
    CommandLine|re: '.*(cert|crt|cer|pfx)$'
  selection_certutil_and2:
    CommandLine|contains:
      - 'Root'
      - 'AuthRoot'
      - 'TrustedPublisher'

  selection_wintrust_bypass:
    CommandLine|contains:
      - '\WinTrust\Trust Providers\Software Publishing'
      - '\CurrentVersion\Policies\Associations'
  selection_wintrust_bypass_and2:
    CommandLine|contains:
      - 'State'
      - '0x00023e00'
      - 'LowRiskFileTypes'

  filter_trusted_it:
    ParentImage|endswith:
      - '\msiexec.exe'
      - '\TrustedInstaller.exe'
      - '\CcmExec.exe'
      - '\gpscript.exe'
    User: 'NT AUTHORITY\SYSTEM'

  filter_known_updaters:
    Image|contains:
      - '\Program Files\'
      - '\Program Files (x86)\'
      - '\Windows\System32\'

  condition: selection_untrusted_actor and ((selection_certutil and selection_certutil_and2) or (selection_wintrust_bypass and selection_wintrust_bypass_and2)) and not (filter_trusted_it or filter_known_updaters)

fields:
  - Time
  - User
  - Image
  - ParentImage
  - CommandLine

falsepositives:
  - IT or security administrators adding trusted certificates in standard locations
  - Enterprise software deployment tools (signed installers, MSI packages)
  - Antivirus or endpoint protection updates writing to trusted stores

level: high
