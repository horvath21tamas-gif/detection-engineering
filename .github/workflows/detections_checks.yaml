name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # 1. JOB: QRadar konverzió (Stabil középút a függőségekben)
  qradar_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QRadar environment
        run: |
          python -m pip install --upgrade pip
          # 0.10.11 kell, mert ebben már benne van a sigma.correlations, amit a CLI keres
          python -m pip install "pyparsing==3.1.1" "pysigma==0.10.11" "packaging<23.0"
          python -m pip install --no-deps sigma-cli==2.0.1
          python -m pip install "click>=8.0.0" "colorama>=0.4.6" "prettytable>=3.0.0"
          python -m pip install pysigma-backend-qradar

      - name: Convert QRadar rules
        run: |
          mkdir -p rules/qradar
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            # A CLI most már látni fogja a correlations modult
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "Skip: $file"
          done

      - name: Upload QRadar rules as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qradar-results
          path: rules/qradar/
          retention-days: 1

  # 2. JOB: Modern SIEM-ek (Legfrissebb verziók, javított pyparsing-el)
  modern_siem_job:
    needs: qradar_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download QRadar artifacts
        uses: actions/download-artifact@v4
        with:
          name: qradar-results
          path: rules/qradar/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modern SIEM environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyparsing==3.1.1" "pysigma==0.11.23" "packaging>=24.0"
          python -m pip install --no-deps sigma-cli==2.0.1
          python -m pip install "click>=8.0.0" "colorama>=0.4.6" "prettytable>=3.0.0"
          
          # Plugin telepítés után kényszerítjük a jó pyparsing verziót (ez javítja a Set import hibát)
          sigma plugin install -f splunk sysmon windows netwitness elasticsearch
          python -m pip install pysigma-backend-azure
          python -m pip install --force-reinstall "pyparsing==3.1.1"

      - name: Update and Validate
        run: |
          mkdir -p inventory rules/splunk rules/netwitness rules/elastic rules/sentinel
          python tools/update_inventory.py
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV
          python tools/check_log_sources.py
          python tools/preprocess_sigma.py

      - name: Convert Modern SIEM rules
        run: |
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "Error $file"
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "Error $file"
            sigma convert -t lucene -p ecs_windows "$file" -o "rules/elastic/${filename}.kql" || echo "Error $file"
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "Error $file"
          done

      - name: Post-processing and Docs
        if: github.event_name == 'push'
        run: |
          python tools/final_siem_fixer.py
          python tools/check_integrity.py
          python tools/score_rules.py
          python tools/generate_nav_layer.py
          python tools/generate_docs.py
          python tools/gap_analysis.py
          python tools/update_all.py

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add rules/ inventory/ test/
          git add DETECTION_WIKI.md GAP_ANALYSIS.md rule_scores.json
          git add attack_navigator_layer.json COVERAGE.md README.md *.svg
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Fixed dependencies for QRadar and pyparsing"
            git pull --rebase -X ours origin test
            git push origin test
          fi

      - name: Check Status
        if: always()
        run: |
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            exit 1
          fi
