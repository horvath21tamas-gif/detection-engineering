title: Steganography & Data Reconstruction (T1001)
id: f7904eab-e014-4fd9-827e-991b6bb5adb1
status: stable
description: |
  Detects data de-steganography by monitoring anomalous programmatic access
  to image manipulation APIs (GDI+, System.Drawing, WindowsCodecs) from script
  interpreters or non-standard parent processes, specifically targeting
  pixel-level extraction routines.
author: hota05
date: 2026-02-09
tags:
  - attack.command_and_control
  - attack.t1001

logsource:
  category: process_creation
  product: windows

detection:
  selection_stego_logic:
    CommandLine|contains:
      - 'GetPixel'                   
      - 'LockBits'                  
      - 'Bitmap.new'                
      - 'System.Drawing.'            
      - 'windowscodecs.dll'          

  selection_script_procs:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\rundll32.exe'
      - '\mshta.exe'
      - '\cscript.exe'
      - '\wscript.exe'

  selection_suspicious_parents:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\w3wp.exe'

  filter_legit_apps:
    Image|contains:
      - '\Adobe\'
      - '\Microsoft Office\'
      - '\PhotosApp.exe'
      - '\Snagit\'
    CommandLine|contains: 'C:\Program Files\'
    username: 'NT AUTHORITY\SYSTEM'

  condition: selection_stego_logic and (selection_script_procs or selection_suspicious_parents) and not filter_legit_apps

level: critical
