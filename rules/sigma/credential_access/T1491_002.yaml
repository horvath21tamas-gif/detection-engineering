title: External Defacement (T1491.002)
id: ab19728a-1343-4aa3-a88c-466a8fd89cd5
status: stable
description: |
  Detects unauthorized external website defacement by identifying suspicious file 
  manipulation commands (move, copy, echo, Set-Content) executed by web server 
  worker processes within sensitive webroot directories.
author: hota05
date: 2026-02-09
tags:
  - attack.impact
  - attack.t1491.002
logsource:
  category: process_creation
  product: windows
detection:
  web_server_parents:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\httpd.exe'
      - '\nginx.exe'
      - '\php-cgi.exe'
      - '\tomcat.exe'

  shell_processes:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'

  file_modification_commands:
    CommandLine|contains:
      - 'index.html'
      - 'index.php'
      - 'default.aspx'
      - 'logo.'
      - 'echo '
      - 'move '
      - 'copy '
      - 'Set-Content'

  sensitive_paths:
    CommandLine|contains:
      - '\inetpub\wwwroot\'
      - '\var\www\'
      - '\htdocs\'

  deployment_filter:
    - username:
        - 'AD\svc_deploy'
        - 'AD\github_actions'
    - CommandLine|contains:
        - 'node_modules'
        - 'npm install'
        - 'composer install'
    - ParentImage|endswith:
        - '\msiexec.exe'

  condition: web_server_parents and shell_processes and file_modification_commands 
             and sensitive_paths and not deployment_filter
level: critical
