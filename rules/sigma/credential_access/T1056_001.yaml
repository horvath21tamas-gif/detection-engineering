title: Keylogging & Input Hooking (ATT&CK T1056.001)
id: a0a5d51e-48b7-4d0c-a957-278578b7c7f0
status: stable
description: >
  Detects advanced keylogging by identifying suspicious API calls from unprivileged
  or ephemeral processes, targeting the use of SetWindowsHookEx and GetAsyncKeyState
  within non-standard execution contexts (e.g., PowerShell, Rundll32).

author: hota05
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1056/001/
tags:
  - attack.collection
  - attack.t1056.001
  - attack.host
  - attack.credential_access

logsource:
  product: windows
  category: process_creation

detection:
  selection_interpreter_hook:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\mshta.exe'
      - '\cscript.exe'
      - '\wscript.exe'
    CommandLine|contains:
      - 'SetWindowsHook'
      - 'GetAsyncKeyState'
      - 'GetKeyboardState'
      - 'user32.dll'

  selection_append_behavior:
    CommandLine|contains:
      - ' >> '
      - 'Add-Content'
      - 'tee -a'
  selection_append_behavior_and2:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Public\'

  filter_trusted_processes:
    Image|contains:
      - '\Windows\System32\'
      - '\Program Files\'
      - '\Program Files (x86)\'

  filter_common_tools:
    Image|endswith:
      - '\AnyDesk.exe'
      - '\TeamViewer.exe'
      - '\tv_w32.exe'
      - '\RemoteDesktopManager.exe'
    User|startswith: 'NT AUTHORITY\'

  condition: (selection_interpreter_hook or (selection_append_behavior and selection_append_behavior_and2))
             and not (filter_trusted_processes or filter_common_tools)

falsepositives:
  - Legitimate PowerShell or script-based automation writing to user temp/AppData
  - Authorized remote support tools logging input for troubleshooting
  - System management scripts using SetWindowsHookEx in trusted contexts

level: high
