title: Service Exhaustion Detection (T1499.002)
id: 3d9e2001-b464-453d-9c1f-da5ece7b65e2
status: stable
description: |
    Detects potential endpoint denial-of-service (DoS) attempts via targeted service
    exhaustion. Monitors unauthorized service stops, persistent configuration changes 
    (disabling), and binary path modifications targeting security and critical 
    infrastructure services. Filters out legitimate system management, patching, 
    and monitoring activities to reduce false positives.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1499/002/
tags:
    - attack.impact
    - attack.t1499.002
    - attack.dos

logsource:
    category: process_creation
    product: windows

detection:

  selection_tools:
    Image|endswith:
      - '\sc.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\net.exe'
      - '\net1.exe'

  selection_service_commands:
    CommandLine|contains:
      - 'stop '
      - 'config '
      - 'start= disabled'
      - 'binpath='
      - 'Stop-Service'
      - 'Set-Service'
      - ' -Status Stopped'
      - ' -StartupType Disabled'

  selection_target_services:
    CommandLine|contains:
      - 'WinDefend'
      - 'MpsSvc'
      - 'EventLog'
      - 'RpcSs'
      - 'LanmanServer'
      - 'SDRSVC'
      - 'VSS'
      - 'Schedule'         
      - 'W32Time'          
      - 'BITS'             

  selection_suspicious_context:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\rundll32.exe'
      - '\httpd.exe'
      - '\nginx.exe'
    Image|contains:
      - '\Temp\'
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
      - '\Downloads\'

  filter_legit_management:
    User: 'NT AUTHORITY\SYSTEM'
    ParentImage|endswith:
      - '\CcmExec.exe'
      - '\msiexec.exe'
      - '\TiWorker.exe'
      - '\TrustedInstaller.exe'
    CommandLine|contains:
      - 'HealthCheck'
      - 'Update'
      - 'Diagnostic'
      - 'Patch'
      - 'Maintenance'

  condition: selection_tools and selection_service_commands and selection_target_services and selection_suspicious_context and not filter_legit_management

falsepositives:
  - Legitimate service configuration changes via SCCM, Group Policy, or administrative scripts
  - Security software self-remediation (real-time protection restart)
  - Maintenance scripts on test or development systems

level: critical
