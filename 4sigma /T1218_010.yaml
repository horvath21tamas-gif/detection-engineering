title: Gyanus regsvr32.exe futtatasa
id: 1
status: experimental
description: Gyanus regsvr32.exe futtatasa
author: hota05
date: 2026/01/13
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: "\regsvr32.exe"
    CommandLine|contains:
      - "\Users\"
      - "\AppData\"
      - "\Temp\"
  filter_dll:
    CommandLine|endswith: ".dll"
  condition: selection and not filter_dll
level: medium
tags: 
  - attack.t1218.010
falsepositives:
  - regi alkalmazasok
  - frissites
