title: Allure Document & RTLO Masquerading Detection
id: cb293582-a39b-478c-b718-ae8041315843
status: stable
description: >
  Detects masquerading using double file extensions and
  Right-to-Left Override (RTLO - U+202E) characters. Focuses on execution
  from user-writable directories or suspicious parent processes such as
  browsers, mail clients, and archive utilities. Designed to reduce
  developer and system noise.

author: hota05
date: 2026-02-23
tags:
  - attack.defense_evasion
  - attack.t1036.009
  - attack.execution
  - attack.initial_access

logsource:
  product: windows
  category: process_creation

detection:
  selection_double_extension:
    Image|endswith:
      - '.pdf.exe'
      - '.doc.exe'
      - '.docx.exe'
      - '.xls.exe'
      - '.xlsx.exe'
      - '.ppt.exe'
      - '.pptx.exe'
      - '.txt.exe'
      - '.jpg.exe'
      - '.jpeg.exe'
      - '.png.exe'
      - '.zip.exe'
      - '.rar.exe'

  selection_rtlo:
    CommandLine|contains:
      - '‮'        # Actual U+202E character
      - '\u202e'
      - '%E2%80%AE'

  selection_untrusted_path:
    Image|contains:
      - '\Users\'
      - '\Downloads\'
      - '\Desktop\'
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Users\Public\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
      - '\outlook.exe'
      - '\thunderbird.exe'
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\acrord32.exe'
      - '\winrar.exe'
      - '\7zFM.exe'
      - '\explorer.exe'

  filter_legitimate_dev_paths:
    Image|contains:
      - '\node_modules\'
      - '\bin\Debug\'
      - '\bin\Release\'
      - '\AppData\Local\Programs\'

  filter_system_accounts:
    User:
      - 'NT AUTHORITY\SYSTEM'
      - 'NT AUTHORITY\LOCAL SERVICE'
      - 'NT AUTHORITY\NETWORK SERVICE'

  filter_installer_parents:
    ParentImage|endswith:
      - '\msiexec.exe'
      - '\trustedinstaller.exe'

  condition: >
    (selection_double_extension or selection_rtlo)
    and (selection_untrusted_path or selection_suspicious_parent)
    and not (filter_legitimate_dev_paths
             or filter_system_accounts
             or filter_installer_parents)

falsepositives:
  - Internal red team simulations
  - Security research tools using RTLO for testing
  - Developer build artifacts executed from user profile

level: critical
