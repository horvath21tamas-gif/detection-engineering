title: Adatok gyanús archiválása exfiltráció céljából
id: f672c0fe-c3df-4d17-b71e-d731bd89e930
status: stable
description: >
  Észleli a fájlok gyanús tömörítését és archiválását (7z, rar, tar, PowerShell), különösen ha jelszavas védelmet 
  alkalmaznak vagy gyanús ideiglenes könyvtárakat használnak célhelyként.
author: hota05
date: 2026/01/21
references:
  - https://attack.mitre.org/techniques/T1560/
  - https://attack.mitre.org/techniques/T1560/001/
tags:
  - attack.collection
  - attack.exfiltration
  - attack.t1560.001
  - attack.t1560

logsource:
  product: windows
  category: process_creation

detection:
  selection_tools:
    - Image|endswith:
        - '\7z.exe'
        - '\7za.exe'
        - '\rar.exe'
        - '\WinRAR.exe'
        - '\tar.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
    - TargetFilename:
        - '7z.exe'
        - '7za.exe'
        - 'Rar.exe'
        - 'tar.exe'
        - 'PowerShell.EXE'

  selection_archive_params:
    CommandLine|contains:
      - ' a '         
      - ' -a'         
      - ' -cf '       
      - 'Compress-Archive'
      - 'New-Object System.IO.Compression'

  selection_suspicious_flags:
    CommandLine|contains:
      - ' -p'         
      - ' -hp'        
      - ' -v'         
      - ' -mhe=on'    
      - ' -sdel'      

  selection_locations:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
      - 'C:\PerfLogs\'

  filter_legit_installers:
    ParentImage|endswith:
      - '\msiexec.exe'
      - '\CcmExec.exe'
    CommandLine|contains:
      - '\Microsoft\Windows\SoftwareDistribution\'

  condition: selection_tools and selection_archive_params and (selection_suspicious_flags or selection_locations) and not filter_legit_installers

falsepositives:
  - Rendszergazdai mentési scriptek
  - Szoftverfrissítések, amelyek ideiglenes mappákban tömörítenek
  - Felhasználók, akik jelszóval védett tömörítményt készítenek legális célból

level: high
