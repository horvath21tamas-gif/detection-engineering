title: LLMNR/NBT-NS Poisoning & SMB Relay Detection (T1557.001)
id: a3449acb-f915-4e09-9bf0-3dcd777ef196
status: stable
description: >
    Detects potential LLMNR/NBT-NS poisoning and SMB relay activity (MITRE ATT&CK T1557.001) 
    by monitoring unauthorized processes attempting to bind to network resolution ports 
    and executing known attack tools with suspicious command-line arguments.
author: hota05 
date: 2026-02-12
references:
    - https://attack.mitre.org/techniques/T1557/001/
tags:
    - attack.credential_access
    - attack.collection
    - attack.t1557.001
logsource:
    category: process_creation
    product: windows

detection:
    selection_cmd_args:
        CommandLine|contains:
            - ' -i '
            - ' -r '
            - ' -force'
            - ' -wpad'
            - ' -p '
            - 'LLMNR'
            - 'NBTNS'
            - 'mDNS'
            - 'Responder'
            - 'Inveigh'
            - 'mitm6'
            - 'SMBRelay'

    selection_interpreters:
        Image|endswith:
            - '\python.exe'
            - '\pythonw.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'

    selection_non_system_user:
        User|startswith: 'NT AUTHORITY\'

    selection_untrusted_location:
        Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\Public\'

    filter_native_windows:
        Image|endswith:
            - '\svchost.exe'
            - '\lsass.exe'
            - '\System32\nbtstat.exe'
        User: 'NT AUTHORITY\SYSTEM'

    filter_security_tools:
        Image|contains:
            - '\Program Files\Wireshark\'
            - '\Program Files\Nmap\'
            - '\Program Files\CrowdStrike\'
            - '\Program Files\OpenVPN\'
            - '\Program Files\Microsoft\Network Monitor\'

    condition:
        (
            (selection_interpreters and selection_cmd_args)
            or
            (selection_untrusted_location and selection_cmd_args)
        )
        and selection_non_system_user
        and not (filter_native_windows or filter_security_tools)

falsepositives:
    - Security / network diagnostic tools
    - Red team / penetration testing
    - Developer labs / testing environments
    - Network simulations or training environments

level: critical
