title: Ultra-Pro High-Fidelity Video Hosting Exfil (T1567.003)
id: 5c7b84b0-f3ac-479e-b297-8566b89efa06
status: stable
description: |
    Detects covert data exfiltration via video hosting platforms by identifying 
    steganographic embedding (metadata abuse, stream attachment) and CLI-based 
    uploads from non-creative department assets.
author: hota05
date: 2026-02-09
tags:
    - attack.exfiltration
    - attack.t1567.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\ffmpeg.exe'         
            - '\ffprobe.exe'
            - '\mkvmerge.exe'        
            - '\youtube-upload.exe' 
        - CommandLine|contains:
            - 'youtube.googleapis.com'
            - 'vimeo.com/api'

    selection_logic:
        CommandLine|contains:
            - ' -attach '            
            - ' -metadata '          
            - ' -map_metadata '     
            - ' -f nut '             
            - ' -vcodec copy -acodec copy' 

    selection_context:
        - Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
        - ParentImage|endswith:
            - '\winword.exe'       
            - '\excel.exe'
            - '\powershell.exe'
            - '\rundll32.exe'        

    filter_legit_apps:
        - Image|contains:
            - '\Program Files\Adobe\'
            - '\Program Files\OBS Studio\'
            - '\Program Files\Blackmagic Design\' 
        - CommandLine|contains:
            - ' --version'           
        - username: 'NT AUTHORITY\SYSTEM'

    condition: (selection_tools and (selection_logic or selection_context)) and not filter_legit_apps
level: critical
