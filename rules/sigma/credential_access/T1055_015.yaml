title: Stealthy ListPlanting Injection (ATT&CK T1055.015)
id: 89acb64e-0037-4326-81ba-5dee5e222345
status: stable
description: >
  Detects ListPlanting injection by identifying suspicious cross-process access
  requests to ListView-capable processes where the execution flow originates
  from unbacked memory regions (shellcode) rather than signed modules.

author: hota05
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1055/015/
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055.015
  - attack.host

logsource:
  product: windows
  category: process_access

detection:
  selection_access_mask:
    GrantedAccess|contains:
      - '0x1410'
      - '0x1411'
      - '0x1438'
      - '0x143a'
      - '0x1F1FFF'

  selection_gui_targets:
    TargetImage|endswith:
      - '\explorer.exe'
      - '\taskmgr.exe'
      - '\mmc.exe'
      - '\dllhost.exe'

  selection_unbacked_calltrace:
    CallTrace|contains: 'unknown'

  selection_suspicious_source:
    SourceImage|contains:
      - '\Users\'
      - '\Temp\'
      - '\AppData\'

  filter_trusted:
    - SourceProcessName: 'C:\Windows\System32\csrss.exe'
    - SourceImage|endswith:
        - '\MsMpEng.exe'
        - '\CcmExec.exe'
    - CallTrace|contains:
        - 'comctl32.dll+'
        - 'user32.dll+'
        - 'ntdll.dll+LdrpWorkItem'
    - condition: SourceProcessName == TargetImage

  condition: selection_access_mask
             and selection_gui_targets
             and selection_unbacked_calltrace
             and selection_suspicious_source
             and not filter_trusted

falsepositives:
  - Legitimate automation or accessibility tools writing to GUI processes
  - Antivirus or management software performing instrumentation from signed modules
  - Admin scripts using Task Manager or MMC with elevated rights

level: critical
