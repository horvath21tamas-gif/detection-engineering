title: Outlook Home Page Hijacking & Bypass (T1137.004)
id: 45fd419d-b509-4ed8-ae1d-45b41f53a062
status: stable
description: |
    Detects unauthorized modification of Outlook Folder Home Pages and WebView bypass keys:
      - Tracks registry changes that enable execution of arbitrary code via folder clicks
      - Monitors suspicious URLs or local file references
      - Detects non-standard processes attempting registry edits

author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1137.004

logsource:
    product: windows
    category: registry_event

detection:
    selection_registry:
        TargetObject|re: '\\Software\\Microsoft\\Office\\.*\\Outlook\\(WebView\\URL|Security\\EnableRoamingFolderHomepages|Security\\EnableExternalFolderHomepages)$'

    selection_suspicious_values:
        Details|re: '(http|script|file://|C:\\Users\\Public|C:\\Windows\\Temp)'

    selection_unauthorized_editor:
        Image|re: '(powershell\.exe|pwsh\.exe|cmd\.exe|reg\.exe|cscript\.exe|wscript\.exe)$'

    filter_trusted:
        Details|re: '(https://outlook\.office365\.com|res://)'
        Image|re: 'gpscript\.exe$'

    condition: selection_registry and (selection_suspicious_values or selection_unauthorized_editor) and not filter_trusted

level: critical
