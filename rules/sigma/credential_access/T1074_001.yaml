title: Ultra-Pro High-Fidelity Local Data Staging Anomaly (T1074.001)
id: 366e6544-0fca-441e-b6c4-4311a686d210
status: stable
description: |
    Detects systematic local data staging by identifying anomalous file aggregation 
    patterns, specific low-compression or password-protected archival switches, 
    and mass-copy operations into hidden system directories from untrusted contexts.
author: hota05
date: 2026-02-09
tags:
    - attack.collection
    - attack.t1074.001
    - attack.t1074
logsource:
    category: process_creation
    product: windows
detection:
    selection_staging_paths:
        CommandLine|contains:
            - ':\PerfLogs\'            
            - ':\Users\Public\'
            - ':\Windows\Temp\'
            - ':\RECYCLER\'             
            - ':\ProgramData\'
            - '\AppData\Local\Temp\'

    selection_archive_flags:
        CommandLine|contains:
            - ' -m0'                  
            - ' -mx0'                 
            - ' -p '                 
            - ' -hp'                   
            - ' -ta'                   
            - 'type * >> '              

    selection_tools:
        - Image|endswith:
            - '\7z.exe'
            - '\rar.exe'
            - '\makecab.exe'           
            - '\powershell.exe'
            - '\tar.exe'
        - CommandLine|contains:
            - 'Compress-Archive'
            - 'xcopy '
            - 'robocopy '

    selection_context:
        ParentImage|endswith:
            - '\w3wp.exe'              
            - '\powershell.exe'
            - '\cmd.exe'
            - '\httpd.exe'
        IntegrityLevel: 'Medium'        

    filter_trusted_automation:
        - Image|contains:
            - 'C:\Windows\CCM\'         
            - 'C:\Program Files\Microsoft\' 
        - User: 'NT AUTHORITY\SYSTEM'
        - CommandLine|contains:
            - 'SoftwareDistribution'    
            - 'C:\Windows\Installer'
            - 'OneDrive.exe'
            - 'AppData\Local\Microsoft\Teams'

    condition: selection_staging_paths and (selection_archive_flags or selection_tools) and selection_context and not filter_trusted_automation
level: critical
