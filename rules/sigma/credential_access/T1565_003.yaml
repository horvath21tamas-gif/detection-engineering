title: Ultra-Pro High-Fidelity Runtime Process Manipulation (T1565.003)
id: 03c21e12-3c6d-4942-bc30-7647b1246849
status: stable
description: |
    Detects runtime process manipulation by monitoring for suspicious memory access 
    masks (e.g., PROCESS_ALL_ACCESS) and remote thread injection between unrelated 
    processes, specifically filtering out known-good administrative and security tools.
author: hota05
date: 2026-02-09
tags:
    - attack.impact
    - attack.t1565.003
    - attack.defense_evasion
logsource:
    product: windows
    service: sysmon
detection:
    selection_mem_access:
        EventID: 10
        TargetImage|endswith:
            - '\lsass.exe'          
            - '\svchost.exe'         
            - '\explorer.exe'        
            - '\browser.exe'         
        GrantedAccess: 
            - '0x1F1FFF'              
            - '0x1F3FFF'              
            - '0x1438'                

    selection_remote_thread:
        EventID: 8
        SourceImage|contains:
            - '\Users\'             
            - '\Temp\'
            - '\AppData\'
        condition: selection_remote_thread and NOT (SourceProcessId == TargetProcessId)

    selection_context:
        - SourceImage|endswith:
            - '\winword.exe'         
            - '\excel.exe'
            - '\powershell.exe'      
            - '\rundll32.exe'        

    filter_legit_tools:
        - SourceImage|endswith:
            - '\CcmExec.exe'        
            - '\MsMpEng.exe'         
            - '\Taskmgr.exe'       
            - '\Sysmon.exe'         
        - CallTrace|contains:
            - 'unknown'              
        - username: 'NT AUTHORITY\SYSTEM'

    condition: (selection_mem_access or selection_remote_thread) and selection_context and not filter_legit_tools
level: critical
