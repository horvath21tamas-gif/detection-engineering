title: Ultra-Pro High-Fidelity Virtual Instance Abuse (T1564.011)
id: 17a18b59-2a6a-48d2-b033-7808e238ac06
status: stable
description: |
    Detects suspicious use of Windows Sandbox and WSL to evade EDR monitoring. 
    Focuses on untrusted parent processes, non-standard configuration loading, 
    and direct command execution within virtual instances.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1564.011
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        - Image|endswith:
            - '\WindowsSandbox.exe'
            - '\wsl.exe'
            - '\wslhost.exe'
            - '\vmcompute.exe'

    selection_dangerous_params:
        CommandLine|contains:
            - '.wsb'
            - '--exec'
            - ' -e '
            - '--mount'
            - 'HostFolder'
            - 'LogonCommand'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\mshta.exe'
            - '\sqlservr.exe'

    selection_suspicious_path:
        CommandLine|contains:
            - '\Users\'
            - '\Downloads\'
            - '\Temp\'
            - '\AppData\'

    filter_trusted_dev_env:
        - ParentImage|contains:
            - '\Common7\IDE\devenv.exe' 
            - '\bin\code.exe'         
            - '\Program Files\Docker\'
        - CommandLine|contains:
            - 'docker-desktop'
            - 'Microsoft.WSL'

    condition: selection_tools and (selection_suspicious_parent or (selection_dangerous_params and selection_suspicious_path)) and not filter_trusted_dev_env
level: high
