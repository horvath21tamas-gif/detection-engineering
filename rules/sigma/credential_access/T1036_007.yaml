title: Double File Extension Execution (T1036.007)
id: b0aa04bf-5031-430e-b916-ea8dfb789cb5
status: stable
description: >
  Detects execution of binaries masquerading as documents via double file
  extensions (e.g., .pdf.exe, .docx.exe). Filters out developer artifacts
  (.min.js, .map), system binaries, and verified installers. Focuses on
  high-risk user directories and suspicious parent processes.

author: hota05
date: 2026-02-23
tags:
  - attack.defense_evasion
  - attack.t1036.007
  - attack.t1036
  - attack.execution

logsource:
  product: windows
  category: process_creation

detection:
  selection_dangerous_extensions:
    Image|contains:
      - '.pdf.exe'
      - '.doc.exe'
      - '.docx.exe'
      - '.xls.exe'
      - '.xlsx.exe'
      - '.ppt.exe'
      - '.pptx.exe'
      - '.txt.exe'
      - '.jpg.exe'
      - '.png.exe'
      - '.zip.exe'
      - '.pdf.vbs'
      - '.txt.vbs'
      - '.pdf.js'
      - '.pdf.ps1'
      - '.pdf.scr'

  selection_untrusted_path:
    Image|contains:
      - '\Downloads\'
      - '\Desktop\'
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Content.Outlook\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
      - '\outlook.exe'
      - '\winrar.exe'
      - '\7zFM.exe'
      - '\explorer.exe'

  filter_legit_patterns:
    - Image|contains:
        - '.min.js'
        - '.js.map'
        - '.config.xml'
    - Image|startswith:
        - 'C:\Windows\System32\'
        - 'C:\Windows\SysWOW64\'
        - 'C:\Program Files\'
        - 'C:\Program Files (x86)\'
    - User:
        - 'NT AUTHORITY\SYSTEM'
        - 'NT AUTHORITY\LOCAL SERVICE'
        - 'NT AUTHORITY\NETWORK SERVICE'

  condition: >
    selection_dangerous_extensions
    and (selection_untrusted_path or selection_suspicious_parent)
    and not filter_legit_patterns

falsepositives:
  - Internal developer or testing artifacts
  - Enterprise deployment tools
  - Security / red team simulations
  - Trusted installers executed from system paths

level: critical
