title: Peripheral Device Discovery (T1120)
id: 4642e41b-d17b-4c85-a9ec-b8071f91ca80
status: stable
description: |
    Detects targeted peripheral device enumeration, focusing on USB, disk, and network devices.
    High-fidelity detection filters legitimate system PnP activity and driver management
    by analyzing process integrity, parent-child relationships, and metadata query patterns.

author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1120

logsource:
    category: process_creation
    product: windows

detection:
    selection_tools:
        processname: '(wmic\.exe|pnputil\.exe|driverquery\.exe|devcon\.exe)$'
        processcommandline: '(Get-PnpDevice|Get-WmiObject|gwmi)'

    selection_keywords:
        processcommandline: '(Win32_USBController|Win32_DiskDrive|Win32_NetworkAdapter|USBSTOR|/enum-devices|/deviceid)'

    selection_suspicious_lineage:
        Parentprocessname: '(cmd\.exe|powershell\.exe|wsmprovhost\.exe|httpd\.exe|winword\.exe)$'
        IntegrityLevel: 'Medium'

    selection_extraction:
        processcommandline: '(>\s|ConvertTo-Json|format-list)'

    filter_legit_system:
        username: 'NT AUTHORITY\SYSTEM'
        Parentprocessname: '(svchost\.exe|msiexec\.exe)$'
        CommandLine|contains: 'Program Files'

    condition: selection_tools and (selection_keywords or selection_extraction or selection_suspicious_lineage) and not filter_legit_system

level: high
