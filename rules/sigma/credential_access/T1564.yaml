title: Ultra-Pro High-Fidelity Hide Artifacts Detection (T1564)
id: 09afb312-767c-4b0b-98fb-e7c57145d81e
status: stable
description: |
    Detects targeted artifact hiding techniques including NTFS Alternative Data Streams (ADS), 
    registry-based user account hiding, and suspicious file attribute manipulation 
    initiated by untrusted parents.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1564
    - attack.t1564.001
    - attack.t1564.002
    - attack.t1564.004
logsource:
    product: windows
    category: process_creation
detection:
    selection_attrib_stealth:
        Image|endswith: '\attrib.exe'
        CommandLine|contains:
            - ' +h'
        CommandLine|contains:
            - ' +s'

    selection_ads_redirection:
        CommandLine|contains:
            - ' > *:*'   
            - 'type *:*' 
            - 'expand *:*'
            - 'makecab *:*'


    selection_registry_hide:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
            - 'SpecialAccounts\UserList'
            - ' /d 0' # 0 = rejtett

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\browser.exe'
            - '\chrome.exe'

    selection_suspicious_paths:
        CommandLine|contains:
            - '\Users\Public\'
            - '\Windows\Temp\'
            - '\AppData\Roaming\'

    filter_trusted_system:
        - username: 'NT AUTHORITY\SYSTEM'
        - ParentImage|contains:
            - '\Windows\servicing\TrustedInstaller.exe'
            - '\CcmExec.exe'
        - CommandLine|contains:
            - 'AppData\Local\Packages'
            - 'desktop.ini'          

    condition: (selection_attrib_stealth or selection_ads_redirection or selection_registry_hide) and (selection_suspicious_parent or selection_suspicious_paths) and not filter_trusted_system
level: high
