title: High-Fidelity WHOIS Database Reconnaissance - T1596.001
id: 48367349-ea0d-47fe-9461-56b226445aa5
status: stable
description: >
  Detects automated WHOIS reconnaissance patterns. Focuses on bulk domain registration 
  queries via CLI tools and API-based scripts (RDAP) while filtering out standard 
  browser-based research, software licensing, and routine IT diagnostics.
author: hota05
date: 2026/01/27
references:
  - https://attack.mitre.org/techniques/T1596/001/
tags:
  - attack.reconnaissance
  - attack.t1596.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_specialized_tools:
    - Image|endswith:
        - '\whois.exe'
        - '\amass.exe'
        - '\subfinder.exe'
        - '\jwhois.exe'
    - CommandLine|contains:
        - ' -h '          
        - ' --rwhois'      
        - ' -nobanner'    
        - ' -raw'          

  selection_api_patterns:
    - Image|endswith:
        - '\curl.exe'
        - '\wget.exe'
        - '\python.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
    - CommandLine|contains:
        - 'api.whoisxmlapi.com'
        - 'rdap.org'         
        - 'reverse-whois'    
        - 'whois-history'   

  filter_browsers:
    - Image|endswith:
        - '\chrome.exe'
        - '\msedge.exe'
        - '\firefox.exe'
    - ParentImage|endswith:
        - '\explorer.exe'

  filter_security_context:
    User: 'NT AUTHORITY\SYSTEM'
    Image|contains:
      - '\SentinelOne\'
      - '\CrowdStrike\'
      - '\Microsoft Security Client\'

  filter_admin_tools:
    User|contains:
      - 'svc_soc'
      - 'adm_net'
    Image|contains:
      - '\Nmap\'
      - '\Wireshark\'

  condition: (selection_specialized_tools or selection_api_patterns) and not filter_browsers and not filter_security_context and not filter_admin_tools
falsepositives:
  - Domain administrators verifying registration details via CLI.
  - Legal departments using WHOIS APIs for trademark enforcement.
  - Procurement auditing vendor domain ownership.
level: high
