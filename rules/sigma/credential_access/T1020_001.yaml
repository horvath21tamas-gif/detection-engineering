title: Client-Linked Cloud Exfil (T1020.001)
id: c85ae9ce-c3d2-406e-8078-72a0054e054d
status: stable
description: |
  Detects data exfiltration by identifying official cloud storage clients 
  (OneDrive, Dropbox, Google Drive, Box) being manipulated via command-line 
  to sync non-standard staging directories or running with high-entropy/scripted arguments.
author: hota05
date: 2026-02-09
tags:
  - attack.exfiltration
  - attack.t1020.001

logsource:
  category: process_creation
  product: windows

detection:
  selection_clients:
    Image|endswith:
      - '\OneDrive.exe'
      - '\Dropbox.exe'
      - '\googledrivesync.exe'
      - '\Box.exe'

  selection_anomalous_args:
    CommandLine|contains:
      - ' /move '
      - ' /upload '
      - ' /shutdown'
      - ' -s '
      - ' --path '

  selection_staging:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Windows\Temp\'
      - '\PerfLogs\'
      - 'C:\Temp\'

  selection_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'

  filter_legit_activity:
    - CommandLine|contains:
        - ' /background'
        - ' /client=personal'
    - username: 'NT AUTHORITY\SYSTEM'
    - Image|contains:
        - '\Program Files\'

  condition: >
    selection_clients and
    (selection_anomalous_args or selection_staging) and
    selection_parent and
    not filter_legit_activity

level: critical
