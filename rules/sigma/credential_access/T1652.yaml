title: Ultra-Pro High-Fidelity Device Driver Discovery (T1652)
id: 7c9ea581-3758-4c92-acf3-12ebb09de530
status: stable
description: |
    Detects systematic discovery of device drivers by monitoring for high-fidelity 
    enumeration patterns (WMI/CLI) originating from non-standard lineages. 
    Specifically targets behaviors associated with BYOVD (Bring Your Own Vulnerable Driver) 
    reconnaissance.
author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1652
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\driverquery.exe'
            - '\pnputil.exe'
            - '\sc.exe'
        - CommandLine|contains:
            - 'query type= driver'
            - 'enum-drivers'

    selection_wmi:
        CommandLine|contains:
            - 'Win32_PnPSignedDriver'
            - 'Win32_SystemDriver'
            - 'Get-WindowsDriver'
            - 'Get-PnpDevice'

    selection_extraction:
        CommandLine|contains:
            - ' > '                         
            - ' | clip'                      
            - 'ConvertTo-Json'              
            - 'Export-Csv'
            - '/fo csv'                  
            - 'base64'                       

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\wsmprovhost.exe'             
            - '\httpd.exe'                   
            - '\winword.exe'                 
            - '\excel.exe'
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'

    filter_legit_it_mgmt:
        Image|contains:
            - '\Program Files\Tanium\'
            - '\Program Files\Splunk\'
            - '\Program Files\Datadog\'
        User: 'NT AUTHORITY\SYSTEM'

    condition: (selection_tools or selection_wmi) and (selection_extraction or selection_suspicious_lineage) and not filter_legit_it_mgmt
level: high
