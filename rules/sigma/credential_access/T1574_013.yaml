title: Exploit-Grade KernelCallbackTable Manipulation 
id: b6d6a120-3026-4973-8efa-60dc760106d0
status: stable
description: |
  Detects suspicious remote memory write operations targeting GUI processes, 
  which are indicative of KernelCallbackTable hijacking attempts. This technique 
  is commonly used for stealthy process injection that bypasses traditional hook-based monitoring.
author: hota05 
date: 2026-02-11
tags:
  - attack.privilege_escalation
  - attack.defense_evasion
  - attack.t1574.013
logsource:
  product: windows
  category: process_access

detection:
  gui_target_process:
    TargetImage|endswith:
      - '\explorer.exe'
      - '\dwm.exe'
      - '\taskhostw.exe'
      - '\csrss.exe'       

  dangerous_memory_access:
    GrantedAccess|contains:
      - '0x1fffff' 
      - '0x28'     
      - '0x20'     

  exclude_standard_software:
    SourceImage|contains:
      - '\Visual Studio\'
      - '\WinDbg\'
      - '\Windows Defender\'
      - '\CrowdStrike\'
      - '\SentinelOne\'
      - '\CarbonBlack\'
      - '\Tanium\'
    SourceImage|endswith:
      - '\procmon.exe'
      - '\procexp.exe'
      - '\taskmgr.exe'

  exclude_system_and_parent:
    - SourceUsername: 'NT AUTHORITY\SYSTEM'
    - ParentImage|endswith:
        - '\explorer.exe'
        - '\services.exe'

  condition: gui_target_process and dangerous_memory_access and not (exclude_standard_software or exclude_system_and_parent)

fields:
  - Time
  - SourceImage
  - SourceUsername
  - ParentImage
  - TargetImage
  - GrantedAccess
  - ProcessId
  - ThreadId

falsepositives:
  - Debugging or reverse engineering sessions by IT/security staff
  - Legitimate automation tools injecting into GUI processes (rare)
  - Memory inspection by AV or EDR products

level: critical
