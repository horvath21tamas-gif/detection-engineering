title: Ultra-Pro High-Fidelity Alternative Protocol Exfiltration (T1048)
id: ef99c2e8-73e5-4c16-8549-a56e545b9a96
status: stable
description: |
    Detects data exfiltration over non-standard protocols by identifying 
    abnormal ICMP buffer sizes, SSH/tunneling flags in non-admin contexts, 
    and network-capable LoLBins executing from suspicious paths.
author: hota05
date: 2026-02-09
tags:
    - attack.exfiltration
    - attack.t1048
logsource:
    category: process_creation
    product: windows
detection:
    selection_protocol_abuse:
        CommandLine|contains:
            - ' -l 14'             
            - ' -s 14'              
            - ' -R '                
            - ' -L '               
            - ' -D '                
            - ' -X '               
            - ' -N '               

    selection_tools:
        Image|endswith:
            - '\plink.exe'           
            - '\pscp.exe'          
            - '\ncat.exe'           
            - '\nc.exe'
            - '\socat.exe'
            - '\iodine.exe'          

    selection_context:
        Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
            - '\PerfLogs\'
        CommandLine|contains:
            - ' -pw '               

    filter_legit_admin:
        - Image|contains:
            - '\Program Files\'
            - '\Program Files (x86)\'
        - CommandLine|contains:
            - '127.0.0.1'            
            - 'localhost'
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\services.exe'

    condition: (selection_protocol_abuse or selection_tools) and selection_context and not filter_legit_admin
level: critical
