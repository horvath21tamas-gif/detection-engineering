title: Ultra-Pro Systemd Service Persistence (T1543.002)
id: 2f32f57d-cdfd-4684-911b-77e4eef6e7cc
status: stable
description: |
    Detects unauthorized creation or modification of systemd units by monitoring 
    suspicious process lineages and unusual executable paths within the service file.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1543/002/
tags:
    - attack.persistence
    - attack.t1543.002
logsource:
    product: linux
    category: file_event
detection:
    selection_paths:
        TargetFilename|contains:
            - '/etc/systemd/system/'
            - '/usr/lib/systemd/system/'
            - '/lib/systemd/system/'
            - '/.config/systemd/user/'
        TargetFilename|endswith: '.service'

    selection_suspicious_writer:
        Image|endswith:
            - '/bash'
            - '/sh'
            - '/zsh'
            - '/python3'
            - '/perl'
            - '/curl'
            - '/wget'
            - '/nc'
            - '/php'

    selection_suspicious_payload:
        CommandLine|contains:
            - 'ExecStart=/tmp/'      
            - 'ExecStart=/dev/shm/'  
            - 'ExecStart=/var/tmp/'
            - 'ExecStart=python'     
            - 'ExecStart=perl'

    filter_trusted_automation:
        ParentImage|endswith:
            - '/ansible-playbook'
            - '/chef-client'
            - '/salt-minion'
            - '/puppet'
            - '/dpkg'
            - '/apt-get'
            - '/dnf'
            - '/yum'
        username: 'root'

    condition: selection_paths and (selection_suspicious_writer or selection_suspicious_payload) and not filter_trusted_automation
level: critical
