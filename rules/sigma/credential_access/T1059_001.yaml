title: Gyanus Poweshell parancs vegrehajtasa
id: '70c58b24-653f-487d-a8ee-c4237439dce2'
status: experimental
description: Poweshell parancsok eszlelese, melyek hasznalhatoak rosszindulatu kodok futtatasara
author: hota05
date: 2026/01/07
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
  selection_encoded:
    CommandLine|contains:
      - '-enc'
      - '-encodedcommand'
      - '-EncodedCommand'
  condition: selection_image and selection_encoded
level: medium
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1027
  - attack.defense-evasion
falsepositive:
  - Adminisztrator altal tesztek kodolt scriptek
  - automatikus eszkozok frissitese
