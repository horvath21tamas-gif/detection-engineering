title: System Network Connections Discovery (ATT&CK T1049)
id: fe347f5b-3329-427f-8ff3-49bcfb3cc89d
status: stable
description: >
  Detects targeted discovery of active network connections and established sessions.
  Focuses on attacker tradecraft such as advanced netstat/net usage, PowerShell
  network cmdlets, suspicious parent process lineage (Office, web services, remote
  management), and automated output parsing or redirection.
author: hota05 
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1049/
tags:
  - attack.discovery
  - attack.t1049
  - attack.host

logsource:
  product: windows
  category: process_creation

detection:
  selection_native_tools:
    Image|endswith:
      - '\netstat.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\nbtstat.exe'
      - '\arp.exe'

  selection_powershell_cmdlets:
    CommandLine|contains:
      - 'Get-NetTCPConnection'
      - 'Get-NetUDPEndpoint'
      - 'Get-NetIPAddress'
      - 'Get-NetRoute'
      - 'net session'
      - 'net use'
      - 'net view'

  selection_patterns:
    CommandLine|contains:
      - ' -ano'
      - ' -na '
      - ' -p tcp'
      - ' -s '
      - ' /domain'

  selection_suspicious_lineage:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\httpd.exe'
      - '\wsmprovhost.exe'
    IntegrityLevel: 'Medium'

  selection_automation:
    CommandLine|contains:
      - 'findstr'
      - 'select-string'
      - ' > '
      - ' >> '
      - 'ConvertTo-Json'
      - 'Out-File'

  filter_legit_noise:
    - User: 'NT AUTHORITY\SYSTEM'
    - ParentImage|endswith:
        - '\svchost.exe'
        - '\CcmExec.exe'
        - '\msiexec.exe'
    - CommandLine|contains:
        - 'Program Files'
        - 'Splunk'
        - 'healthcheck'

  condition: (selection_native_tools or selection_powershell_cmdlets)
             and (selection_patterns or selection_suspicious_lineage or selection_automation)
             and not filter_legit_noise

falsepositives:
  - Legitimate administrative network troubleshooting
  - IT monitoring or health-check scripts
  - SCCM/EDR telemetry collection

level: high
