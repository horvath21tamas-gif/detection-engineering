title: Command History Logging Impairment
id: c411146e-ff5f-4a6a-b918-2679122b822b
status: stable
description: |
    Detects high-confidence attempts to suppress, redirect, or tamper with
    interactive command history logging on Windows systems.

    Detection coverage includes:

      - PowerShell PSReadLine logging suppression (SaveNothing, HistorySavePath abuse)
      - History file deletion (ConsoleHost_history.txt, PSReadLine folder, bash history)
      - Registry-based console history buffer suppression
      - Encoded PowerShell modifying history behavior

    Aligned with MITRE ATT&CK T1562.003 (Impair Command History Logging).

author: hota05
date: 2026-02-12
tags:
    - attack.defense_evasion
    - attack.t1562.003
    - attack.t1070

logsource:
    product: windows
    category: process_creation

detection:
    selection_psreadline_core:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Set-PSReadLineOption'

    selection_psreadline_impairment:
        CommandLine|contains:
            - 'SaveNothing'
            - 'HistorySavePath'
            - 'AddToHistoryHandler'
    selection_psreadline_impairment_and2:
        CommandLine|contains:
            - '$false'
            - '$null'
            - '""'
            - '/dev/null'

    selection_ps_encoded:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '-enc '
            - '-EncodedCommand'

    selection_history_keywords:
        CommandLine|contains:
            - 'PSReadLine'
            - 'ConsoleHost_history'
            - 'HistorySavePath'
            - 'SaveNothing'

    selection_registry_console_history:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - ' add '
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Console'
            - 'HistoryBufferSize'
        CommandLine|contains:
            - ' 0'
            - '/d 0'

    selection_history_delete:
        CommandLine|contains:
            - 'Remove-Item '
            - 'del '
            - 'erase '
            - 'rm '
    selection_history_delete_and2:
        CommandLine|contains:
            - '\ConsoleHost_history.txt'
            - '\PSReadLine\'
            - '\.bash_history'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\w3wp.exe'
            - '\mshta.exe'
            - '\rundll32.exe'

    filter_dev_tools:
        ParentImage|contains:
            - '\Common7\IDE\devenv.exe'
            - '\Microsoft VS Code\Code.exe'
            - '\JetBrains\'

    filter_system_context:
        User|startswith: 'NT AUTHORITY'
        ParentImage|endswith: '\services.exe'

    filter_software_distribution:
        CommandLine|contains:
            - 'Chocolatey'
            - 'SCCM'
            - 'Intune'
            - 'AppData\Local\Temp\SDI'

    condition: (
                    (selection_psreadline_core and (selection_psreadline_impairment and selection_psreadline_impairment_and2))
                    or (selection_ps_encoded and selection_history_keywords)
                    or selection_registry_console_history
                    or (selection_history_delete and selection_history_delete_and2)
               )
               and selection_suspicious_parent
               and not filter_dev_tools
               and not filter_system_context
               and not filter_software_distribution

level: high
