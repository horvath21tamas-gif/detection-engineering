title: Network-to-Cloud Auth Hijacking Detection (T1556.008)
id: 2f48a160-be90-4731-9c23-25c878b58c23
status: stable
description: >
    Detects high-risk modifications to enterprise applications, service principals, 
    and conditional access policies in Azure that could indicate network-to-cloud 
    authentication hijacking (MITRE ATT&CK T1556.008). Focuses on MFA bypasses, 
    unauthorized credential additions, and suspicious service principal changes.
author: hota05 
date: 2026-02-12
references:
    - https://attack.mitre.org/techniques/T1556/008/
tags:
    - attack.persistence
    - attack.credential_access
    - attack.t1556.008
logsource:
    product: azure
    service: audit

detection:
    selection_network_apps:
        targetResources.displayName|contains:
            - 'AnyConnect'
            - 'FortiGate'
            - 'GlobalProtect'
            - 'Check Point'
            - 'Pulse Secure'
            - 'F5 Big-IP'
            - 'Palo Alto'

    selection_ca_downgrade:
        operationName: 'Update conditional access policy'
        targetResources.displayName|contains: 'MFA'

    selection_app_credentials:
        operationName|contains:
            - 'Add owner to application'
            - 'Update application – Certificates and secrets management'
            - 'Add credential'
            - 'Update service principal credentials'

    filter_trusted_admins:
        initiatedBy.userPrincipalName|endswith:
            - 'admin_secure@company.com'
            - 'itops@company.com'
        userAgent|contains:
            - 'HashiCorp/'
            - 'Ansible'
            - 'Terraform/'

    condition:
        (
            selection_network_apps
            or selection_ca_downgrade
            or selection_app_credentials
        )
        and not filter_trusted_admins

falsepositives:
    - Legitimate network application administration by approved admins
    - Automated deployment pipelines using Terraform, Ansible, HashiCorp tools
    - Security audit or compliance scanning operations

level: critical
