title: High-Fidelity Exchange Mailbox Permission Grant (T1098.002)
id: a151217a-6f13-463e-a680-15d34e6f2c7a
status: stable
description: |
    Detects the granting of critical mailbox permissions (FullAccess, SendAs). 
    Filters out common service accounts and focuses on cross-tenant or 
    unauthorized administrative actions, especially on high-value targets.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1098/002/
tags:
    - attack.persistence
    - attack.t1098.002
logsource:
    product: m365
    service: exchange
detection:
    selection_operation:
        Operation:
            - 'Add-MailboxPermission'
            - 'Add-RecipientPermission'
    
    selection_permissions:
        AccessRights|contains:
            - 'FullAccess'
            - 'SendAs'
            - 'SendOnBehalf'

    filter_internal_sync:
        UserId:
            - 'NT AUTHORITY\SYSTEM'
            - 'Microsoft.Exchange.ServiceMS'
        UserAgent|contains:
            - 'ExchangeConfiguration/15' # Automatizált Exchange szinkron

    filter_known_admin_tools:
        UserId|contains:
            - 'svc-backup-cloud'
            - 'it-automation-principal'

    selection_unusual_actor:
        - UserId|contains: 'admin-' 
        - ClientIPAddress|contains: '10.50.' 

    selection_priority_targets:
        TargetUser|contains:
            - 'ceo'
            - 'cfo'
            - 'director'
            - 'legal'
            - 'finance'

    condition: selection_operation and selection_permissions and (selection_unusual_actor or selection_priority_targets) and not (filter_internal_sync or filter_known_admin_tools)
level: critical
