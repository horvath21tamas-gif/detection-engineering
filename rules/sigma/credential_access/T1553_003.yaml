title: Windows Catalog Database Subversion (T1553.003)
id: ffdb0a12-c266-4964-944a-f79392a1bffb
status: stable
description: |
    Detects suspicious manipulation or unauthorized addition of catalog files
    to the Windows Code Integrity Catalog Database (CatRoot / CatRoot2).
    Focuses on high-risk tooling, abnormal parent-child relationships,
    non-standard source paths, and uncommon user contexts to reduce
    enterprise deployment false positives.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1553/003/
tags:
    - attack.defense_evasion
    - attack.t1553.003
    - attack.persistence
    - attack.privilege_escalation

logsource:
    product: windows
    category: process_creation

detection:
    selection_tooling:
        Image|endswith:
            - '\makecat.exe'
            - '\signtool.exe'
            - '\pvk2pfx.exe'
            - '\inf2cat.exe'
            - '\certutil.exe'

    selection_catalog_db_target:
        CommandLine|contains:
            - '\System32\CatRoot\'
            - '\System32\CatRoot2\'
            - ' -addstore '
            - ' -catdb '
    selection_catalog_db_target_and2:
        CommandLine|contains:
            - '.cat'

    selection_suspicious_origin:
        CommandLine|contains:
            - '\AppData\'
            - '\Users\Public\'
            - '\Downloads\'
            - '\Desktop\'
            - '\PerfLogs\'
            - '\Temp\'
            - '\ProgramData\'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\acrord32.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_non_system_user:
        User|contains:
            - '\'
    selection_non_system_user_and2:
        User|contains:
            - 'NT AUTHORITY\SYSTEM'
            - 'NT AUTHORITY\LOCAL SERVICE'
            - 'NT AUTHORITY\NETWORK SERVICE'

    filter_legitimate_servicing:
        ParentImage|startswith:
            - 'C:\Windows\servicing\TrustedInstaller.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\System32\dism.exe'
            - 'C:\Windows\System32\TiWorker.exe'
            - 'C:\Program Files\Microsoft Configuration Manager\'
        User|startswith:
            - 'NT AUTHORITY\SYSTEM'

    filter_driver_dev:
        CommandLine|contains:
            - '\Windows Kits\'
            - '\WDK\'

    condition:
        selection_tooling
        and (selection_catalog_db_target and selection_catalog_db_target_and2)
        and (selection_suspicious_origin or selection_suspicious_parent or not (selection_non_system_user and selection_non_system_user_and2))
        and not filter_legitimate_servicing
        and not filter_driver_dev

falsepositives:
    - Windows Updates and servicing stack operations
    - Enterprise driver deployment
    - Microsoft Configuration Manager (SCCM) package deployments
    - Developer environments building signed drivers

level: critical
