title: Ultra-Pro High-Fidelity Asymmetric Encrypted Exfiltration (T1048.002)
id: d80e4ddb-6b41-48df-9ea6-d984b4de1e3e
status: stable
description: |
    Detects data exfiltration over asymmetric encrypted protocols (HTTPS) 
    by identifying command-line tools (curl, powershell) using upload-specific 
    flags from untrusted paths or launched by suspicious parent processes.
author: hota05
date: 2026-02-09
tags:
    - attack.exfiltration
    - attack.t1048.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith:
            - '\curl.exe'
            - '\wget.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\bitsadmin.exe'
            - '\certutil.exe'

    selection_upload_flags:
        CommandLine|contains:
            - ' -F '                         
            - ' --data-binary'                
            - ' -T '                        
            - ' -k'                       
            - ' --insecure'
            - 'UploadFile('                  
            - 'PutAsync('                   
            - 'PostAsync('

    selection_context:
        - Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
        - ParentImage|endswith:
            - '\winword.exe'                
            - '\excel.exe'
            - '\outlook.exe'
            - '\explorer.exe'               

    filter_legit_traffic:
        - Image|contains:
            - '\Program Files\'
            - '\Program Files (x86)\'
        - CommandLine|contains:
            - 'microsoft.com'               
            - 'office.com'
            - '127.0.0.1'                  
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\services.exe'

    condition: selection_tools and (selection_upload_flags or selection_context) and not filter_legit_traffic
level: critical
