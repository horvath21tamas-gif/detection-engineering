title: Ultra-Pro High-Fidelity Regsvcs/Regasm Proxy Execution (T1218.009)
id: 56d6f16d-72ee-480a-a530-c12eefeb3317
status: stable
description: |
    Detects the abuse of regsvcs.exe or regasm.exe to execute malicious .NET assemblies. 
    Focuses on the /U flag for proxy execution, non-standard parent processes, 
    and execution from writable/untrusted paths.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1218.009
    - attack.t1218
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: 
            - '\regsvcs.exe'
            - '\regasm.exe'
        - OriginalFileName: 
            - 'regsvcs.exe'
            - 'RegAsm.exe'

    selection_flags:
        CommandLine|contains:
            - ' /U '
            - ' /uninstall '
            - ' /regfile' 

    selection_paths:
        CommandLine|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
            - '\Downloads\'
            - '\\'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'

    filter_trusted_context:
        username: 'NT AUTHORITY\SYSTEM'
        ParentImage|startswith: 
            - 'C:\Windows\Microsoft.NET\Framework'
            - 'C:\Windows\Installer\'
        CommandLine|contains: 'C:\Windows\Microsoft.NET\Framework'

    condition: selection_img and selection_flags and (selection_paths or selection_suspicious_parent) and not filter_trusted_context
level: critical
