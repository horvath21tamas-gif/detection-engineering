title: Ultra-Pro High-Fidelity Network Share and Credential Removal (T1070.005)
id: 889b8be9-9bf6-4a6a-9cb8-397ed550cace
status: stable
description: |
    Detects systematic removal of network shares and stored credentials using wildcard 
    deletion and force flags. Distinguishes between manual user activity and 
    automated anti-forensic cleanup post-lateral movement.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1070.005
logsource:
    product: windows
    category: process_creation
detection:
    selection_net_share_bulk:
        - Image|endswith:
            - '\net.exe'
            - '\net1.exe'
          CommandLine|contains|all:
            - 'use'
            - '/delete'
          CommandLine|contains:
            - '*'        
            - ' /y'       
            - ' /yes'

    selection_cred_wipe:
        - Image|endswith: '\cmdkey.exe'
          CommandLine|contains: ' /delete'
        - Image|endswith: '\vaultcmd.exe' 
          CommandLine|contains: ' /delete'

    selection_suspicious_origin:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\w3wp.exe'      
            - '\powershell.exe'  

    filter_trusted_automation:
        - User: 'NT AUTHORITY\SYSTEM'
          ParentImage|endswith: '\services.exe'
        - CommandLine|contains:
            - 'logon.bat'      
            - 'netlogon'
            - 'policy'        
        - ParentImage|endswith: '\explorer.exe' 

    condition: (selection_net_share_bulk or selection_cred_wipe) and (selection_suspicious_origin or not filter_trusted_automation)
level: high
