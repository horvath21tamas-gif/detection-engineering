title: Ultra-Pro Socket Filter & WFP Traffic Signaling (T1205.002)
id: 9465896f-5613-4f21-b297-53ebc482618a
status: stable
description: |
    Detects unauthorized registration of network socket filters or WFP callouts. 
    Monitors for low-level driver loading and WFP database manipulation from 
    untrusted process lineages, a common technique for stealthy port knocking.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1205.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_wfp_ops:
        - Image|endswith:
            - '\netsh.exe'
            - '\fltMC.exe'     
        - CommandLine|contains:
            - 'wfp'             
            - 'callout'     
            - 'filter'
            - 'add callout'
            - 'vfp'             

    selection_driver_reg:
        - Image|endswith:
            - '\sc.exe'
            - '\reg.exe'
        - CommandLine|contains:
            - 'create'
            - 'binPath='
            - 'type= kernel'    
        - CommandLine|contains:
            - '\Temp\'
            - '\AppData\'
            - '\Users\Public\'

    selection_unauthorized_actor:
        ParentImage|not|endswith:
            - '\services.exe'
            - '\svchost.exe'
            - '\TrustedInstaller.exe'
            - '\msiexec.exe'   
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\python.exe'  

    filter_trusted_security:
        - Image|contains:
            - '\Program Files\Windows Defender\'
            - '\Program Files\CrowdStrike\'
            - '\SentinelOne\'
        - User: 'NT AUTHORITY\SYSTEM'

    condition: (selection_wfp_ops or selection_driver_reg) and selection_unauthorized_actor and not filter_trusted_security
level: critical
