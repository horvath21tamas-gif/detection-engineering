title: Video Capture Anomaly (T1125)
id: 89a26b4a-2b75-4ae7-8f9b-e63005fc1f61
status: stable
description: |
    Detects unauthorized video capture by monitoring:
      - Programmatic access to multimedia APIs (DirectShow, Media Foundation)
      - Use of standalone media binaries (FFmpeg, VLC) with capture parameters
      - Headless or script-based execution contexts (PowerShell, cmd, IIS worker)
    Filters out legitimate conferencing, collaboration, and system processes to reduce false positives.

author: hota05
date: 2026-02-09
tags:
    - attack.collection
    - attack.t1125

logsource:
    category: process_creation
    product: windows

detection:
    selection_multimedia_apis:
        CommandLine|re|i: '(avicap32\.dll|capCreateCaptureWindow|ksuser\.dll|mfplat\.dll|Windows\.Media\.Capture)'

    selection_media_bins:
        Image|re|i: '(ffmpeg\.exe|vlc\.exe)$'
        CommandLine|re|i: '(-dshow|-f dshow|-video_size|capture)'

    selection_context:
        ParentImage|re|i: '(powershell\.exe|cmd\.exe|w3wp\.exe|rundll32\.exe|regsvr32\.exe)$'
        IntegrityLevel: 'Medium'

    filter_trusted_apps:
        Image|re|i: '(Microsoft Teams|Zoom\.exe|Webex\.exe|Slack\.exe|CameraSettingsUIHost\.exe)'
        CommandLine|re|i: '(skype\.exe)'
        User: 'NT AUTHORITY\SYSTEM'

    condition: (selection_multimedia_apis or selection_media_bins) and selection_context and not filter_trusted_apps

level: critical
