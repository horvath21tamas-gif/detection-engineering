title: Ultra-Pro High-Fidelity Windows Catalog Database Subversion (T1553.003)
id: ffdb0a12-c266-4964-944a-f79392a1bffb
status: stable
description: |
    Detects unauthorized additions to the Windows Catalog database. 
    Focuses on non-system accounts and suspicious source paths to prevent 
    unsigned malware from appearing as validly signed by the OS.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1553.003
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        Image|endswith:
            - '\makecat.exe'    
            - '\pvk2pfx.exe'    
            - '\signtool.exe'   
            - '\upwiz.exe'      

    selection_target_paths:
        CommandLine|contains:
            - '\System32\CatRoot\'
            - '\System32\CatRoot2\'
        CommandLine|contains:
            - '.cat' 

    selection_origin:
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Downloads\'
            - '\Desktop\'
            - '\PerfLogs\'

    selection_parents:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'

    filter_legit_os:
        Image|startswith:
            - 'C:\Windows\servicing\TrustedInstaller.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\System32\CCM\'
        username: 'NT AUTHORITY\SYSTEM'

    condition: (selection_tools or (selection_target_paths and selection_origin and selection_parents)) and not filter_legit_os
level: critical
