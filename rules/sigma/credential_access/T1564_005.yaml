title: Ultra-Pro High-Fidelity Hidden File System Manipulation (T1564.005)
id: 72f58c9b-b325-4b60-b2a2-306064e4213d
status: stable
description: |
    Detects suspicious mounting or creation of virtual disk images (VHD, VHDX, ISO) 
    initiated by untrusted parent processes or targeting non-standard paths, 
    often used to bypass MOTW or hide malicious payloads.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1564.005
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        - Image|endswith:
            - '\diskpart.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        - CommandLine|contains:
            - 'Mount-VHD'
            - 'Mount-DiskImage'
            - 'attach vdisk'
            - 'create vdisk'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'

    selection_suspicious_source:
        CommandLine|contains:
            - '\Users\'
            - '\Downloads\'
            - '\Temp\'
            - '\AppData\'
            - '.iso'
            - '.vhd'
            - '.vhdx'

    filter_trusted_automation:
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|contains:
            - '\Windows\System32\svchost.exe'
            - '\Program Files\Hyper-V\'
            - '\Program Files\Microsoft Visual Studio\'
            - '\CcmExec.exe'
        - CommandLine|contains:
            - 'Program Files'
            - 'WindowsImageBackup'

    condition: selection_tools and (selection_suspicious_parent or (selection_suspicious_source and not filter_trusted_automation))
level: high
