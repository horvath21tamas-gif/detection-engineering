title: Ultra-Pro Mach-O LC_LOAD_DYLIB Injection (T1546.006)
id: 8b8f0766-2e5d-4414-ac92-35d73e57bd76
status: stable
description: |
    Detects unauthorized modification of Mach-O binaries to inject malicious dylibs. 
    Focuses on non-developer tools modifying Application binaries and checks for 
    suspicious dylib search paths or unsigned library loads.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1546/006/
tags:
    - attack.persistence
    - attack.t1546.006
logsource:
    product: macos
    category: process_creation
detection:
    selection_tools:
        - Image|endswith:
            - '/optool'
            - '/insert_dylib'
            - '/yololib'
            - '/patcho'
        - CommandLine|contains:
            - 'LC_LOAD_DYLIB'
            - 'install_name_tool -add_rpath'

    selection_suspicious_paths:
        CommandLine|contains:
            - '/tmp/'
            - '/Users/Shared/'
            - '/Library/Caches/'
            - '/Downloads/'
            - '.hidden/'

    filter_trusted_dev:
        ParentImage|startsWith:
            - '/Applications/Xcode.app/'
            - '/Library/Developer/'
        Image|endswith:
            - '/usr/bin/codesign'
            - '/usr/bin/xcodebuild'
            - '/usr/bin/ld'
        User: 'root'

    filter_installers:
        Image|endswith:
            - '/installd'
            - '/softwareupdated'

    condition: (selection_tools or selection_suspicious_paths) and not (filter_trusted_dev or filter_installers)
level: critical
