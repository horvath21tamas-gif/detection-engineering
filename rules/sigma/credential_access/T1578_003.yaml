title: Cloud Instance Destruction (T1578.003)
id: 7372c9e9-6a46-4018-9cab-2b8565bb8011
status: stable
description: |
    Detects unauthorized or mass deletion of cloud instances across Azure, AWS, 
    and GCP environments. Focuses on manual, non-MFA, or suspicious scripted 
    deletions that may indicate sabotage or defense evasion, while excluding 
    legitimate automated scaling events.
author: hota05 
date: 2026-02-11
tags:
    - attack.impact
    - attack.defense_evasion
    - attack.t1578.003
logsource:
    product: cloud
    service: Azure Activity

detection:

  selection_delete_ops:
    operation_name|contains:
      - 'TerminateInstances'
      - 'Microsoft.Compute/virtualMachines/delete'
      - 'v1.compute.instances.delete'
      - 'DeleteVM'
      - 'DeleteInstance'
      - 'Compute.instances.delete'

  selection_suspicious_context:
    mfa_authenticated: 'false'
    user_agent|contains:
      - 'kali'
      - 'python-requests'
      - 'boto3'
      - 'curl'
      - 'postman'
      - 'Mozilla'
      - 'powershell'
      - 'Terraform'
      - 'Pulumi'

  filter_automation_identities:
    user_name|startswith:
      - 'svc-terraform'
      - 'svc-ansible'
      - 'aws-autoscaling'
      - 'cloud-controller'
      - 'svc-pulumi'

  filter_internal:
    user_name|contains:
      - 'system-internal'
      - 'scaling-manager'
      - 'azuremonitor'
      - 'loganalytics'

  condition: selection_delete_ops and selection_suspicious_context and not (filter_automation_identities or filter_internal)

fields:
  - Time
  - user_name
  - operation_name
  - user_agent
  - mfa_authenticated
  - resource_id
  - subscription_id
  - tenant_id

falsepositives:
  - Legitimate auto-scaling termination events
  - Cloud CI/CD pipelines tearing down temporary VMs
  - Maintenance scripts by trusted internal service accounts

level: critical
