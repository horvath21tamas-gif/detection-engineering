title: Mainboard Boot Image & SPI Flash Tampering (T1542.004)
id: 91efd01c-1abe-41f8-97e0-e3d277c08f01
status: stable
description: |
    Detects unauthorized firmware manipulation by monitoring low-level hardware access 
    tools and driver registrations initiated from non-standard process chains. 
    Focuses on SPI flash writing and image injection attempts, while filtering 
    trusted management tools.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1542.004
logsource:
    product: windows
    category: process_creation
detection:
    selection_firmware_tools:
        Image|endswith:
            - '\flashrom.exe'
            - '\FPTW64.exe'
            - '\AFUWINx64.exe'
            - '\UEFITool.exe'
        OriginalFileName:
            - 'flashrom.exe'
            - 'FPTW64.exe'
            - 'AFUWINx64.exe'
            - 'UEFITool.exe'

    selection_firmware_commands:
        CommandLine|contains:
            - ' /d '
            - ' /f '
            - ' /p '
            - ' -write'
            - ' -save'
            - ' /capsule'

    selection_untrusted_origins:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'

    filters_trusted_management:
        - Image|contains:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
        - ParentImage|endswith: '\svchost.exe'
        - User: 'NT AUTHORITY\SYSTEM'

    condition: selection_firmware_tools and selection_firmware_commands and selection_untrusted_origins and not filters_trusted_management
level: critical
