title: Indicator Removal and Signature Theft (T1027.005)
id: 0128ec66-fd73-4e3c-bbe2-c181bfe14c7a
status: stable
description: >
  Detects attempts to remove indicators or manipulate digital signatures on binaries.
  Focuses on signature theft (SigThief), PE header stripping, and string replacement
  in suspicious execution contexts. Optimized to reduce false positives from 
  legitimate build tools and developer environments.

author: hota05
date: 2026-02-23
tags:
  - attack.defense_evasion
  - attack.t1027.005

logsource:
  product: windows
  category: process_creation

detection:
  selection_signature_tampering:
    CommandLine|contains:
      - 'sigthief'
      - 'copy-signature'
      - 'osslsigncode'
      - 'deltasig'

  selection_binary_manipulation:
    CommandLine|contains:
      - 'petools '
      - 'sethc.exe'
      - 'strings -d'
      - 'strip -s'

  selection_paths:
    CommandLine|contains:
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'
      - '\PerfLogs\'

  filter_legit_tools:
    Image|contains:
      - '\Microsoft SDKs\'
      - '\Windows Kits\'
      - '\Visual Studio\'
    CommandLine|contains:
      - 'signtool.exe sign'

  filter_build_users:
    User|contains:
      - 'svc-build'
      - 'cicd'

  condition: >
    (selection_signature_tampering or selection_binary_manipulation)
    and selection_paths
    and not (filter_legit_tools or filter_build_users)

falsepositives:
  - Legitimate builds or signing processes using Microsoft SDKs, Visual Studio, or signtool.exe
  - Automated CI/CD pipelines in trusted development environments
  - Security research or penetration testing labs

level: critical
