title: Disk Wipe
id: 96c6c77c-67a8-49a6-9105-45e00aef8f65
status: stable
description: |
    Detects destructive low-level disk operations, including MBR overwrite, 
    partition wiping, and full-disk content destruction.

    Monitors:
      - Raw physical disk access
      - Destructive CLI arguments (diskpart, dd, format, PowerShell)
      - Suspicious execution context (Office apps, web servers, temp paths)
      - Filters out known-good imaging, admin, and security tools

author: hota05
date: 2026-02-11
tags:
    - attack.impact
    - attack.t1561.001
    - attack.t1561.002
    - attack.t1499

logsource:
    product: windows
    category: process_creation

detection:
    selection_tools:
        Image|endswith:
            - '\diskpart.exe'
            - '\dd.exe'
            - '\format.com'
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|any:
            - '\\.\PhysicalDrive'
            - '\\.\Harddisk'
            - 'clean'
            - 'delete partition'
            - 'Remove-Partition'
            - 'Clear-Disk'
            - 'Initialize-Disk'
            - 'if=/dev/zero'
            - 'if=/dev/urandom'
            - 'Format-Volume'
            - '/MBR'
            - '/GPT'
    selection_suspicious_context:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\httpd.exe'
            - '\w3wp.exe'
            - '\rundll32.exe'
            - '\explorer.exe'
        Image|contains:
            - '\Temp\'
            - '\Users\Public\'
            - '\AppData\Local\Temp\'

    filter_legit_admin:
        - username: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\msiexec.exe'
            - '\CcmExec.exe'
            - '\setup.exe'
            - '\vds.exe'
        - CommandLine|contains:
            - 'Deployment\Scripts'
            - 'imaging'
            - 'Program Files'
            - '127.0.0.1'


    condition: selection_tools and selection_suspicious_context and not filter_legit_admin

level: critical
