title: IIS Native Module Injection (T1505.002)
id: 80e88d7b-623f-45e0-9dd5-79a4f0bf86fa
status: stable
description: |
    Detects unauthorized IIS native module registration or injection by monitoring
    usage of appcmd.exe, direct edits to applicationHost.config or web.config, 
    and DLL loads from non-standard, user-writable, or suspicious paths.
    Focuses on anomalous command-line arguments and execution contexts to minimize
    false positives from standard IIS or Windows servicing processes.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1505/002/
tags:
    - attack.persistence
    - attack.t1505.002
    - attack.privilege_escalation
    - attack.execution

logsource:
    product: windows
    category: process_creation

detection:

    selection_appcmd:
        Image|endswith:
            - '\appcmd.exe'
        OriginalFileName:
            - 'appcmd.exe'

    selection_appcmd_args:
        CommandLine|contains:
            - 'install module'
            - 'add module'
            - 'uninstall module'
            - 'remove module'
            - 'image-path'
            - 'dllpath'

    selection_config_tamper:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\notepad.exe'
            - '\cmd.exe'
        CommandLine|contains:
            - '\inetsrv\Config\applicationHost.config'
            - '\inetsrv\Config\web.config'

    selection_suspicious_path:
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
            - '\PerfLogs\'
            - '\ProgramData\'
            - '\Downloads\'
            - '\Desktop\'

    filter_trusted_processes:
        - User: 'NT AUTHORITY\SYSTEM'
          Image|contains:
            - '\Windows\System32\inetsrv\iissetup.exe'
            - '\Windows\SoftwareDistribution\'
        - Image|endswith: 
            - '\ngen.exe'
            - '\msiexec.exe'
            - '\svchost.exe'

    condition: (selection_appcmd and selection_appcmd_args) or (selection_config_tamper or selection_suspicious_path) and not filter_trusted_processes

falsepositives:
    - Legitimate IIS module installations or uninstalls by administrators
    - Approved configuration edits during deployments
    - Standard Windows servicing tasks or automated patching

level: critical
