title: Mailbox Data Clearing and Rule Manipulation (ATT&CK T1070.003)
id: b68b842f-d6af-47ae-ac3c-24b3dc71efbf
status: stable
description: >
  Detects systematic mailbox data removal and the creation of malicious inbox rules.
  Focuses on bulk deletion cmdlets and automated rule sets designed to suppress
  security notifications or hide attacker communication.

author: hota05 
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1070/003/
tags:
  - attack.defense-evasion
  - attack.t1070.003
  - attack.email
  - attack.lateral-movement

logsource:
  product: windows
  category: process_creation

detection:
  selection_bulk_delete:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Search-Mailbox'
      - 'New-MailboxSearch'
      - 'Export-Mailbox'
      - ' -DeleteContent'
      - ' -Force'
      - ' -Purge'

  selection_malicious_rules:
    CommandLine|contains:
      - 'New-InboxRule'
      - 'Set-InboxRule'
      - ' -DeleteMessage $true'
      - ' -MoveToFolder'
  selection_malicious_rules_and2:
    CommandLine|contains:
      - 'Junk'
      - 'Trash'
      - 'Deleted Items'
      - 'Archive'
  selection_malicious_rules_and3:
    CommandLine|contains:
      - 'Security'
      - 'Alert'
      - 'Phish'
      - 'Login'

  selection_suspicious_chain:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\winword.exe'
      - '\excel.exe'
      - '\mshta.exe'
      - '\php-cgi.exe'
      - '\powershell.exe'
      - '\cmd.exe'

  filter_trusted_operations:
    - User|startswith: 'NT AUTHORITY\'
    - CommandLine|contains:
        - 'Discovery Management'
        - 'Compliance'
        - 'Retention'
    - ParentImage|endswith: '\ExSetup.exe'

  condition: (selection_bulk_delete or (selection_malicious_rules and selection_malicious_rules_and2 and selection_malicious_rules_and3))
             and (selection_suspicious_chain or not filter_trusted_operations)

falsepositives:
  - IT administrators performing mailbox searches or exports
  - Compliance and retention policy scripts
  - Email migration or cleanup operations
  - Exchange server setup or automated rule management

level: high
