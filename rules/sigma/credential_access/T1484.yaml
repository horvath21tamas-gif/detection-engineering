title: Ultra-Pro Domain Policy Manipulation & GPO Abuse (T1484)
id: 4672f956-2eac-4429-89b8-4cc99481d7bb
status: stable
description: |
    Detects unauthorized modifications to critical Domain Policies by monitoring 
    file system writes to the SYSVOL folder and GPO link changes, filtering out 
    standard administrative tools (GPMC).
author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.persistence
    - attack.t1484.001
logsource:
    product: windows
    category: file_event
detection:
    selection_critical_files:
        TargetFilename|contains: '\Windows\SYSVOL\domain\Policies\'
        TargetFilename|endswith:
            - '\GptTmpl.inf'        
            - '\Scripts.ini'        
            - '\ScheduledTasks.xml' 
            - '\Registry.pol'      

    selection_suspicious_writer:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\python.exe'
            - '\bitsadmin.exe' 

    selection_gplink_modification:
        EventID: 5136
        AttributeCommonName: 'gPLink'

    filter_trusted:
        - Image|endswith: 
            - '\mmc.exe'      
            - '\svchost.exe' 
        - User: 'NT AUTHORITY\SYSTEM'
        - SubjectUserName|contains: 'GPO_Admin_' 

    condition: (selection_critical_files and selection_suspicious_process) or (selection_gplink_modification and not filter_trusted)
level: critical
