title: Direct Flow Flood (T1498.001)
id: f0bd2223-8331-4e71-ab9a-c97ed8d07c69
status: stable
description: |
  Detects high-fidelity direct network flooding attempts (SYN, UDP, ICMP) 
  by monitoring processes with aggressive packet generation parameters 
  originating from untrusted or suspicious process lineages.
author: hota05
date: 2026-02-09
tags:
  - attack.impact
  - attack.t1498.001
logsource:
  category: process_creation
  product: windows
detection:
  engines:
    - Image|endswith:
        - '\hping3.exe'
        - '\loic.exe'
        - '\hoic.exe'
        - '\iperf.exe'
        - '\iperf3.exe'
        - '\nping.exe'
        - '\pktmon.exe'

  flood_flags:
    CommandLine|contains:
      - '--flood'
      - '--syn'
      - '--udp'
      - '-u -b 0'
      - '-i u'
      - '--icmp'
      - '--rand-source'

  suspicious_context:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\httpd.exe'
      - '\chrome.exe'
      - '\rundll32.exe'
      - '\outlook.exe'
    Image|contains:
      - '\Temp\'
      - '\Users\Public\'
      - '\AppData\Local\Temp\'

  allowlist:
    - username: 'NT AUTHORITY\SYSTEM'
    - Image|contains:
        - '\Program Files\NetworkMonitoring\'
        - '\Azure\'
    - CommandLine|contains:
        - 'Speedtest'
        - 'HealthCheck'

  condition: engines and flood_flags and suspicious_context and not allowlist
level: high
