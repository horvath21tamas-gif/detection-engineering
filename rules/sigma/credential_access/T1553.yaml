title: Subvert Trust Controls (T1553)
id: 612083f8-71f6-4ebd-8361-8a9c153dc09d
status: stable
description: |
    Detects attempts to subvert Windows trust controls including forced
    root certificate installation and Mark-of-the-Web (MotW) / Security
    Zone manipulation. Focuses on suspicious execution context, non-standard
    source paths, and abnormal parent-child relationships to reduce
    enterprise deployment false positives.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1553/
    - https://attack.mitre.org/techniques/T1553/004/
    - https://attack.mitre.org/techniques/T1553/005/
tags:
    - attack.defense_evasion
    - attack.t1553
    - attack.t1553.004
    - attack.t1553.005
    - attack.persistence
    - attack.privilege_escalation

logsource:
    product: windows
    category: process_creation

detection:
    selection_cert_tools:
        Image|endswith:
            - '\certutil.exe'
            - '\certmgr.exe'
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_root_store:
        CommandLine|contains:
            - ' -addstore '
            - ' -importcert '
            - ' -installcert '
            - ' Import-Certificate '
    selection_root_store_and2:
        CommandLine|contains:
            - ' Root'
            - ' AuthRoot'
            - ' TrustedPublisher'
            - ' Cert:\LocalMachine\Root'
            - ' Cert:\CurrentUser\Root'

    selection_cert_high_risk_flags:
        CommandLine|contains:
            - ' -f'
            - ' -enterprise'
            - ' -user'
            - ' -silent'

    selection_motw_manipulation:
        CommandLine|contains:
            - 'Zone.Identifier'
            - 'SaveZoneInformation'
            - 'LowRiskFileTypes'
            - 'Unblock-File'
            - 'streams.exe -d'

    selection_suspicious_paths:
        CommandLine|contains:
            - '\AppData\'
            - '\Users\Public\'
            - '\Downloads\'
            - '\Desktop\'
            - '\Temp\'
            - '\ProgramData\'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\acrord32.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'

    selection_non_system_user:
        User|contains:
            - 'NT AUTHORITY\SYSTEM'
            - 'NT AUTHORITY\LOCAL SERVICE'
            - 'NT AUTHORITY\NETWORK SERVICE'

    filter_legitimate_automation:
        ParentImage|startswith:
            - 'C:\Windows\System32\msiexec.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\servicing\TrustedInstaller.exe'
            - 'C:\Program Files\Microsoft Endpoint Manager\'
            - 'C:\Program Files\Microsoft Configuration Manager\'
        User|startswith:
            - 'NT AUTHORITY\SYSTEM'

    condition:
        ((selection_cert_tools
                and (selection_root_store and selection_root_store_and2)
                and (selection_cert_high_risk_flags or selection_suspicious_paths or selection_suspicious_parent))
            or(selection_motw_manipulation
                and (selection_suspicious_paths or selection_suspicious_parent or not selection_non_system_user)))
        and not filter_legitimate_automation

falsepositives:
    - Enterprise PKI deployment
    - Group Policy certificate distribution
    - Configuration management platforms (SCCM, Intune)
    - Legitimate software installers removing MotW
    - Developer testing workflows

level: critical
