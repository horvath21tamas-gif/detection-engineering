title: Pre-OS Boot Manipulation (T1542)
id: d614824d-459b-4d52-b24a-6ea4190f340e
status: stable
description: |
    Detects unauthorized firmware or bootloader modifications. Monitors for 
    EFI partition mounting, unauthorized firmware flashing tool usage, and 
    UEFI variable manipulation initiated from non-standard process trees. 
    Filters out trusted vendor update utilities to reduce false positives.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1542
logsource:
    product: windows
    category: process_creation
detection:
    selection_firmware_tools:
        Image|endswith:
            - '\flashrom.exe'
            - '\FPTW64.exe'
            - '\AfuEfix64.exe'
            - '\H2OFFT-W.exe'
        OriginalFileName:
            - 'flashrom.exe'
            - 'FPTW64.exe'

    selection_efi_mount:
        Image|endswith: '\mountvol.exe'
        CommandLine|contains: ' /s'

    selection_untrusted_origins:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\wmiprvse.exe'

    filters_trusted_vendors:
        ParentImage|contains:
            - '\Dell\CommandUpdate\'
            - '\Lenovo\SystemUpdate\'
            - '\HP\HP Support Assistant\'
        Image|contains: 'C:\Windows\System32\SystemSettingsAdminFlows.exe'

    condition: (selection_firmware_tools or selection_efi_mount) and selection_untrusted_origins and not filters_trusted_vendors
level: critical
