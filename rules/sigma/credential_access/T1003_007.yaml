title: LSASS Memory Dump & LOLBin Abuse (T1003.007)
id: 76aebc90-5a8f-44ca-827d-bd63ed108dda
status: stable
description: |
  Detects sophisticated LSASS memory dumping techniques. Focuses on:
  - Procdump argument patterns (-ma, -mm) targeting LSASS
  - Task Manager-initiated dumps via WerFault (-u -p)
  - COM+ (comsvcs.dll) exports using ordinal-based calls (#24, MiniDump)
  Incorporates parent process context and filters legitimate development/diagnostic activity.
author: hota05
date: 2026-02-04
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.t1003.007

logsource:
  category: process_creation
  product: windows

detection:
  selection_procdump:
    CommandLine|contains:
      - ' -ma '
      - ' -mm '
  selection_procdump_and2:
    CommandLine|contains: 'lsass'

  selection_comsvcs_ordinal:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - 'comsvcs.dll, #24'
      - 'comsvcs.dll,#24'
      - 'comsvcs.dll, MiniDump'

  selection_taskmgr_werfault:
    ParentImage|endswith: '\taskmgr.exe'
    Image|endswith: '\werfault.exe'
    CommandLine|contains: '-u -p '

  selection_suspicious_context:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wsmprovhost.exe'
      - '\psexesvc.exe'
      - '\httpd.exe'

  filter_legit_diagnostic:
    ParentImage|contains: '\Microsoft Visual Studio\'
    User: 'NT AUTHORITY\SYSTEM'

  condition: >
    ((selection_procdump and selection_procdump_and2) or selection_comsvcs_ordinal or selection_taskmgr_werfault)
    and selection_suspicious_context
    and not filter_legit_diagnostic

level: critical
