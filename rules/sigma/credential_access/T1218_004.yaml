title: InstallUtil .NET Proxy Execution
id: f0927570-028a-4b2e-b9a6-6107410f6393
status: stable
description: >
  Detects high-confidence abuse of InstallUtil.exe for proxy execution
  (MITRE ATT&CK T1218.004). Adversaries leverage InstallUtil to execute
  malicious .NET assemblies via installer/uninstaller methods.

  The rule focuses on suspicious uninstall flags, execution of assemblies
  from user-writable or remote paths, anomalous parent processes,
  relocated binary usage, and uncommon integrity contexts.

  Designed to reduce noise from legitimate .NET framework installation
  and MSI-driven deployment activity.

author: hota05
date: 2026/02/20
references:
  - https://attack.mitre.org/techniques/T1218/004/
  - https://lolbas-project.github.io/lolbas/Binaries/Installutil/

logsource:
  product: windows
  category: process_creation

detection:

  selection_installutil_image:
    Image|endswith: '\InstallUtil.exe'
    OriginalFileName: 'InstallUtil.exe'

  selection_relocated_binary:
    Image|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'

  selection_uninstall_flags:
    CommandLine|contains:
      - ' /u '
      - ' /uninstall '
      - ' /LogToConsole=false'
      - ' /logfile='

  selection_user_writable_payload:
    CommandLine|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\Public\'
      - '\Downloads\'
      - '\PerfLogs\'

  selection_remote_payload:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '\\\\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'

  selection_low_integrity:
    IntegrityLevel:
      - 'Low'
      - 'Medium'

  filter_legitimate_framework_path:
    Image|startswith:
      - 'C:\Windows\Microsoft.NET\Framework\'
      - 'C:\Windows\Microsoft.NET\Framework64\'

  filter_legitimate_installers:
    ParentImage|endswith:
      - '\msiexec.exe'
      - '\trustedinstaller.exe'
    IntegrityLevel: 'High'

  filter_system_context:
    User|startswith: 'NT AUTHORITY\'

  condition: >
    selection_installutil_image
    and selection_low_integrity
    and (selection_relocated_binary
        or (selection_uninstall_flags
            and (selection_user_writable_payload
                or selection_remote_payload
                or selection_suspicious_parent)))
    and not (filter_legitimate_framework_path
        and filter_legitimate_installers)
    and not filter_system_context

falsepositives:
  - Rare enterprise deployment scripts registering assemblies from user paths
  - Development or build environments invoking InstallUtil
  - Security testing activities

level: critical

tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1218.004
  - attack.lolbas
  - attack.dotnet
  - attack.windows
