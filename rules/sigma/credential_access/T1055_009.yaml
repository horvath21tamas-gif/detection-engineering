title: Ultra-Pro Stealthy Module Overwriting (T1055.009)
id: 05cc9e81-f6df-49b6-98ce-4c7a7103fadf
status: stable
description: |
    Detects process or module overwriting by identifying cross-process access 
    requests with VM_WRITE permissions where the calling stack originates from 
    unbacked memory (shellcode) rather than a signed on-disk module.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1055.009
logsource:
    product: windows
    category: process_access 
detection:
    selection_access_mask:
        GrantedAccess:
            - '0x1410'
            - '0x1411'
            - '0x1438'
            - '0x143a'
            - '0x1F1FFF' 

    selection_unbacked_calltrace:
        CallTrace|contains: 'unknown'

    selection_critical_targets:
        TargetImage|endswith:
            - '\lsass.exe'
            - '\svchost.exe'
            - '\explorer.exe'
            - '\winlogon.exe'
            - '\spoolsv.exe'

    filter_trusted:
        - Sourceprocessname: 'C:\Windows\System32\csrss.exe'
        - SourceImage|endswith:
            - '\MsMpEng.exe'        
            - '\CcmExec.exe'       
        - CallTrace|contains:
            - 'clr.dll+'
            - 'wer.dll+'
            - 'ntdll.dll+LdrpWorkItem'
        - condition: selection_source_equals_target

    selection_suspicious_source:
        SourceImage|contains:
            - '\Users\'
            - '\Temp\'
            - '\AppData\'

    condition: selection_access_mask and selection_unbacked_calltrace and selection_critical_targets and not filter_trusted
level: critical
