title: Ultra-Pro High-Fidelity Reflective Code Loading (T1620)
id: 71d9c34f-73c9-4a7f-bd1d-80cac6678d8f
status: stable
description: |
    Detects reflective code loading by identifying the specific combination of 
    memory allocation APIs, executable memory flags, and .NET assembly loading 
    methods within a single process context.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1620
logsource:
    product: windows
    category: process_creation
detection:
    selection_win32_api:
        CommandLine|contains:
            - 'VirtualAlloc'
            - 'VirtualProtect'
            - 'WriteProcessMemory'
            - 'CreateRemoteThread'
            - 'GetDelegateForFunctionPointer' 

    selection_mem_flags:
        CommandLine|contains:
            - '0x40'      
            - '0x20'     
            - '0x3000'   

    selection_reflective_methods:
        CommandLine|contains:
            - '[System.Reflection.Assembly]::Load('
            - 'Reflection.Emit'
            - 'Marshal.Copy'

    selection_obfuscation:
        CommandLine|contains:
            - 'FromBase64String'
            - 'IO.MemoryStream'
            - 'IO.Compression'

    filter_trusted_dev:
        Image|contains:
            - '\Visual Studio\'
            - '\MSBuild.exe'
        User|contains:
            - 'svc-build'
            - 'cicd'

    condition: ((selection_win32_api and selection_mem_flags) or (selection_reflective_methods and selection_obfuscation)) and not filter_trusted_dev
level: critical
