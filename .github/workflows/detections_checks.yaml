name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml sigma-cli
          sigma plugin install splunk
          sigma plugin install sysmon
          sigma plugin install windows

      # 1. LÉPÉS: Okos ellenőrzés és Automatikus javítás
      # A "|| true" miatt a folyamat nem áll le itt, ha hibát talál, 
      # így a 5. lépésben a bot vissza tudja tölteni a javított elírásokat.
      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      # 2. LÉPÉS: Meglévő Unit Tesztek (Pytest)
      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek vagy hiba történt."

      # 3. LÉPÉS: Konvertálás Splunk formátumba
      - name: Convert Sigma rules to Splunk (.spl files)
        run: |
          mkdir -p rules/splunk
          rm -f rules/splunk/*.spl
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            sigma convert -t splunk -p sysmon "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Átugorva: $file"
          done

      # 4. LÉPÉS: Dashboard és MITRE Mátrix (SVG) frissítése
      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      # 5. LÉPÉS: Mentés és Visszatöltés (Auto-fix + Dashboard fájlok)
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Hozzáadjuk a javított Sigma szabályokat, Splunk fájlokat és a Dashboard-ot
          git add README.md COVERAGE.md attack_navigator_layer.json mitre_matrix.svg rules/splunk/*.spl rules/sigma/*.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard, Coverage Map and Sigma auto-fixes"
            git pull --rebase origin test
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

          # VÉGSŐ ELLENŐRZÉS: Ha az 1. lépésben volt hiba, itt dobjuk el a pipeline-t.
          # Így a piros X megmarad a GitHubon, jelezve, hogy kézzel még javítanod kell az author-t/szintet.
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált (pl. hiányzó author), de az elírásokat a bot kijavította."
            exit 1
          fi
