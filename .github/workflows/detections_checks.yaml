name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # --- 1. KÖRNYEZET: Splunk (Modern) ---
      - name: Setup Splunk Environment and Generate
        run: |
          python -m venv venv_splunk
          source venv_splunk/bin/activate
          python -m pip install --upgrade pip
          pip install sigma-cli pysigma-backend-splunk pyyaml
          sigma plugin install splunk sysmon windows
          
          mkdir -p rules/splunk
          rm -f rules/splunk/*.spl
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba: $file"
          done
          deactivate

      # --- 2. KÖRNYEZET: QRadar (Legacy / Régi) ---
      - name: Setup QRadar Environment and Generate
        run: |
          python -m venv venv_qradar
          source venv_qradar/bin/activate
          python -m pip install --upgrade pip
          # Itt a régi pysigma és pyparsing verziókat használjuk az izolált venv-ben
          pip install "pysigma<0.10.0" "pyparsing<3.0.0" pysigma-backend-qradar pyyaml "sigma-cli<0.8.0"
          
          mkdir -p rules/qradar
          rm -f rules/qradar/*.aql
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            # A régi verzióban a pipeline neve gyakran csak 'qradar' vagy nincs rá szükség
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba: $file"
          done
          deactivate

      # --- 3. LÉPÉS: Közös eszközök telepítése a fő környezetbe a többi híváshoz ---
      - name: Install validation tools
        run: |
          python -m pip install pytest pyyaml sigma-cli

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek vagy hiba történt."

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          git add README.md COVERAGE.md attack_navigator_layer.json mitre_matrix.svg \
                  rules/splunk/*.spl \
                  rules/qradar/*.aql \
                  rules/sigma/*.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard, Splunk & QRadar rules, and Sigma auto-fixes"
            git pull --rebase origin test
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált, de a javításokat és a konverziókat elmentettem."
            exit 1
          fi
