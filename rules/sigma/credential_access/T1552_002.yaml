title: Credentials In Registry Discovery (T1552.002)
id: ce6a56f9-a5fc-491d-920a-41029fd99051
status: stable
description: |
    Detects unauthorized discovery or extraction of credentials stored in
    Windows Registry (PuTTY, WinSCP, RDP, LSA secrets, SAM, VPN clients).
    Correlates registry enumeration or export commands with suspicious
    parent processes, recursive search patterns, and non-system user context
    to reduce false positives.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1552/002/
tags:
    - attack.credential_access
    - attack.t1552.002
    - attack.t1552
    - attack.discovery

logsource:
    category: process_creation
    product: windows

detection:

    selection_registry_keys:
        CommandLine|contains:
            - 'Software\SimonTatham\PuTTY\Sessions'
            - 'Software\Martin Prikryl\WinSCP 2\Sessions'
            - 'Software\Microsoft\Terminal Server Client\Servers'
            - 'Software\ORL\WinVNC3'
            - 'ControlSet001\Control\Lsa\Data'
            - 'ControlSet001\Control\Lsa\JD'
            - 'ControlSet001\Control\Lsa\Skew1'
            - 'SAM\SAM\Domains\Account\Users'
            - 'Software\Cisco\AnyConnect'
            - 'Software\OpenVPN'
            - 'Software\Microsoft\Windows\CurrentVersion\Internet Settings\Credentials'

    selection_extraction_methods:
        - CommandLine|contains:
            - 'reg'
            - 'query'
            - '/s'
        - CommandLine|contains:
            - 'reg'
            - 'export'
        - CommandLine|contains:
            - 'regedit'
            - '/e'
        - CommandLine|contains:
            - 'Get-ItemProperty'
            - 'Registry::'
        - CommandLine|contains:
            - 'Invoke-Expression'
            - 'Export-Registry'

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\wsmprovhost.exe'
            - '\psexesvc.exe'
            - '\wmiprvse.exe'
            - '\httpd.exe'
            - '\nginx.exe'
            - '\php-cgi.exe'
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'

    selection_non_system_user:
        User|contains:
            - 'NT AUTHORITY\SYSTEM'
            - 'NT AUTHORITY\LOCAL SERVICE'
            - 'NT AUTHORITY\NETWORK SERVICE'

    filter_legit_os:
        Image|endswith:
            - '\Windows\System32\svchost.exe'
            - '\Windows\System32\msiexec.exe'
            - '\Windows\System32\wbem\wmiprvse.exe'
            - '\Windows\System32\TrustedInstaller.exe'
        User|startswith:
            - 'NT AUTHORITY'

    condition:
        (selection_registry_keys or selection_extraction_methods)
        and selection_suspicious_lineage
        and not selection_non_system_user
        and not filter_legit_os

falsepositives:
    - Administrative registry backups or exports
    - Security audits or compliance scans
    - Legitimate remote management scripts using reg / regedit
    - Enterprise automation accessing PuTTY/WinSCP sessions

level: high
