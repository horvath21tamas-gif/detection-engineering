title: Suspicious COM Hijacking for User-Level Persistence (High Fidelity)
id: baa8a9f1-3141-4c00-aaeb-feffe1c9cc88
status: stable
description: >
  Detects suspicious COM hijacking attempts used for user-level persistence
  by monitoring registry modifications of CLSID InprocServer32 and LocalServer32
  entries pointing to non-standard execution paths. The rule focuses on HKCU
  modifications combined with scripting or LOLBin execution to reduce false positives.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1546/015/

logsource:
  product: windows
  category: registry_set

detection:

  # === 1. User-level COM hijack locations ===
  com_hijack_keys:
    TargetObject|contains:
      - '\Software\Classes\CLSID\'
    TargetObject|endswith:
      - '\InprocServer32'
      - '\LocalServer32'

  # === 2. Suspicious COM server locations ===
  suspicious_server_location:
    Details|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'
      - '\Downloads\'

  # === 3. Suspicious execution context ===
  suspicious_process:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'

  # === 4. Exclude system context ===
  filter_system:
    User|contains:
      - 'SYSTEM'

  # === 5. Legit Windows COM servers ===
  filter_legit_windows_com:
    Details|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'

  # === 6. Installer & updater allowlist ===
  filter_legit_installers:
    Image|contains:
      - '\Windows\Installer\'
      - '\Microsoft\EdgeUpdate\'
      - '\Google\Update\'
      - '\Mozilla Maintenance Service\'
      - '\Adobe\'
      - '\Microsoft\Teams\Update\'

  condition: >
    com_hijack_keys
    and suspicious_server_location
    and suspicious_process
    and not (
      filter_system
      or filter_legit_windows_com
      or filter_legit_installers
    )

falsepositives:
  - Rare legacy applications using user-level COM registration
  - Custom enterprise automation frameworks

level: high

tags:
  - attack.persistence
  - attack.t1546
  - attack.t1546.015
