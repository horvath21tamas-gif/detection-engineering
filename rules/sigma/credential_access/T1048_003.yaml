title: Ultra-Pro High-Fidelity Unencrypted Protocol Exfil (T1048.003)
id: c352950f-1d8c-4162-b0c5-2d224582c305
status: stable
description: |
    Detects stealthy data exfiltration via DNS and ICMP by correlating 
    anomalous payload sizes and non-standard query types with suspicious 
    process lineages and untrusted execution paths.
author: hota05
date: 2026-02-09
tags:
    - attack.exfiltration
    - attack.t1048.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_dns_abuse:
        - CommandLine|contains:
            - ' -type=TXT'            
            - ' -querytype=TXT'
            - ' -q=TXT'
            - ' -class=IN'            
        - CommandLine|re: '(?i)nslookup.*[a-zA-Z0-9+/=]{30,}\.' 

    selection_icmp_abuse:
        CommandLine|contains: 'ping '
        CommandLine|re: '.* -l (1[0-9]{3}|[2-9][0-9]{3}).*' 

    selection_context:
        Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\certutil.exe'
            - '\nslookup.exe'

    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\wscript.exe'
            - '\cscript.exe'

    filter_legit:
        - Image|contains:
            - '\Program Files\'
            - '\Program Files (x86)\'
        - CommandLine|contains:
            - 'microsoft.com'
            - '127.0.0.1'
        - username: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\services.exe'

    condition: (selection_dns_abuse or selection_icmp_abuse) and (selection_context or selection_parent) and not filter_legit
level: critical
