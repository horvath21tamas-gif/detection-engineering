name: CI/CD for Detection Rules

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # 1. JOB: QRadar - Speciális, robusztus konverzió régi függőségekkel
  qradar_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QRadar environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyparsing==3.1.1" "pysigma==0.9.11" "pysigma-backend-qradar"

      - name: Convert QRadar rules (Dynamic Class Discovery)
        run: |
          mkdir -p rules/qradar
          cat <<EOF > convert_qradar.py
          import os
          import sigma.backends.qradar
          from sigma.collection import SigmaCollection
          import inspect

          # Dinamikus osztálykeresés a QRadar backendhez
          QRadarBackend = None
          
          # Megpróbáljuk a standard elérési utakat
          try:
              from sigma.backends.qradar import QRadarBackend as QB
              QRadarBackend = QB
          except ImportError:
              # Ha nem megy, megkeressük az összes osztályt a modulban
              for name, obj in inspect.getmembers(sigma.backends.qradar):
                  if inspect.isclass(obj) and "Backend" in name and ("QRadar" in name or "Qradar" in name):
                      QRadarBackend = obj
                      print(f"Found QRadar class: {name}")
                      break

          if QRadarBackend is None:
              print("Critical Error: Could not find QRadar Backend class!")
              exit(1)

          backend = QRadarBackend()
          rules_path = "rules/sigma"
          
          count = 0
          for root, _, files in os.walk(rules_path):
              for file in files:
                  if file.endswith((".yaml", ".yml")):
                      try:
                          with open(os.path.join(root, file), "r", encoding="utf-8") as f:
                              rule = SigmaCollection.from_yaml(f.read())
                              result = backend.convert(rule)
                              if result:
                                  out_name = file.rsplit(".", 1)[0] + ".aql"
                                  with open(f"rules/qradar/{out_name}", "w") as out:
                                      out.write(result[0])
                                      count += 1
                      except Exception as e:
                          print(f"Error converting {file}: {e}")
          print(f"Successfully converted {count} rules to QRadar AQL.")
          EOF
          python convert_qradar.py

      - name: Upload QRadar rules as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qradar-results
          path: rules/qradar/
          retention-days: 1

  # 2. JOB: Modern SIEM-ek és Dokumentáció
  modern_siem_job:
    needs: qradar_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download QRadar artifacts
        uses: actions/download-artifact@v4
        with:
          name: qradar-results
          path: rules/qradar/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modern SIEM environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyparsing==3.1.1" "pysigma==0.11.23" "packaging>=24.0"
          python -m pip install --no-deps sigma-cli==2.0.1
          python -m pip install "click>=8.0.0" "colorama>=0.4.6" "prettytable>=3.0.0"
          
          # Pluginok telepítése modern SIEM-ekhez
          sigma plugin install -f splunk sysmon windows netwitness elasticsearch
          python -m pip install pysigma-backend-azure
          
          # Pyparsing kényszerítése (visszaállítás a plugin install után)
          python -m pip install --force-reinstall "pyparsing==3.1.1"

      - name: Update and Validate
        run: |
          mkdir -p inventory rules/splunk rules/netwitness rules/elastic rules/sentinel
          python tools/update_inventory.py
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV
          python tools/preprocess_sigma.py

      - name: Convert Modern SIEM rules
        run: |
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "Err $file"
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "Err $file"
            sigma convert -t lucene -p ecs_windows "$file" -o "rules/elastic/${filename}.kql" || echo "Err $file"
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "Err $file"
          done

      - name: Post-processing and Commit
        run: |
          python tools/final_siem_fixer.py
          python tools/check_integrity.py
          if [ "${{ github.event_name }}" == "push" ]; then
            python tools/score_rules.py
            python tools/generate_docs.py
            python tools/update_all.py
          fi

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add rules/ inventory/ *.md *.json *.svg
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Multi-stage pipeline with robust QRadar conversion"
            git pull --rebase -X ours origin test
            git push origin test
          fi

      - name: Check Status
        if: always()
        run: |
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ Critical validation error occurred."
            exit 1
          fi
