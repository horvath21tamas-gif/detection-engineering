title:  Internal Repository Mass Dump Detection (T1213)
id: 7a299c8a-de68-4c54-9eec-99e582b1f901
status: stable
description: |
    Detects unauthorized mass data collection from internal knowledge bases 
    (Confluence, Jira, SharePoint, Wiki) by monitoring:
    - Suspicious API-driven export commands
    - Bulk or recursive download attempts
    - Non-standard process execution contexts
    - Staging/export to temporary or public directories
    Excludes trusted automation and system processes to reduce false positives.

author: hota05
date: 2026-02-20
references:
    - https://attack.mitre.org/techniques/T1213/
tags:
    - attack.collection
    - attack.exfiltration
    - attack.t1213
logsource:
    category: process_creation
    product: windows

detection:
    selection_api_logic:
        CommandLine|contains:
            - 'rest/api/'
            - 'api/v2/spaces'
            - 'api/v2/pages'
            - 'rest/api/2/issue'
            - '_vti_bin/lists.asmx'
            - 'Get-SPO'
            - 'export-sharepoint'
            - 'Get-PnP'
            - '/wiki/pages/viewpage'
            - '.wiki.git'

    selection_export_intent:
        CommandLine|contains:
            - 'export'
            - 'backup'
            - 'download-all'
            - 'recursive'
            - 'dump'
            - '--mirror'
            - '--all'
            - '--depth'
            - 'clone'
            - 'archive'

    selection_suspicious_source:
        CommandLine|contains:
            - '\Users\'
            - '\Temp\'
            - '\AppData\Local\Temp\'
            - '\Public\'
            - '-OutFile'
            - '>'

    selection_context:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\w3wp.exe'
            - '\httpd.exe'
            - '\python.exe'
            - '\node.exe'
        IntegrityLevel:
            - 'Medium'
            - 'High'

    filter_trusted_automation:
        - Image|contains:
            - 'C:\Program Files\Atlassian\'
            - 'C:\Program Files\Microsoft Monitoring Agent\'
            - 'C:\Windows\CCM\'
            - 'C:\Program Files\Elastic\'
            - 'C:\Program Files\Splunk\'
        - User|startswith:
            - 'NT AUTHORITY\SYSTEM'
            - 'DOMAIN\svc_'
            - 'DOMAIN\backup_'
        - CommandLine|contains:
            - 'healthcheck'
            - 'ping'
            - '--version'
            - '-help'

    condition: selection_api_logic 
               and (selection_export_intent or selection_suspicious_source) 
               and selection_context 
               and not filter_trusted_automation

fields:
    - User
    - Image
    - ParentImage
    - CommandLine
    - IntegrityLevel
    - CurrentDirectory
    - Hashes

falsepositives:
    - Approved repository backup or migration scripts
    - Approved DevOps or CI/CD jobs exporting docs
    - Disaster recovery validation
    - Security scanning / compliance exports

level: critical
