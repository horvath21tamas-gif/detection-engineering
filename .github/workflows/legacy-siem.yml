name: Legacy SIEM queries (QRadar, NetWitness, Sentinel)

# Best effort: these backends need old pySigma and are not part of the quality gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install legacy toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyparsing==3.1.1" "pysigma<0.11.0" "pysigma-backend-azure==0.1.3" pyyaml
          python -m pip install sigma-cli
          sigma plugin install qradar net_witness || echo "plugin install reported a problem"
      - run: python tools/convert_legacy.py --out build/legacy
      - name: Post-process queries (field/syntax fixes)
        run: SIEM_ROOT=build/legacy python tools/final_siem_fixer.py
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-siem-queries
          path: build/legacy
          retention-days: 30
