name: Docs and dashboards

# Regenerates wiki, scores, coverage and dashboard. Only generated documentation is
# committed (never rules, never SIEM queries) and the commit does not re-trigger CI.
on:
  push:
    branches: [test]
    paths: ["rules/sigma/**", "tools/**", "inventory/**", "mappings/**"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  docs:
    # skip commits made by this workflow itself
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: python -m pip install -e ".[siem]" && python -m pip install requests googletrans==4.0.0rc1
      - name: Build query folders the dashboard counts (not committed)
        run: |
          python tools/convert_siem.py --max-failures 1 --out build/siem
          mkdir -p rules/splunk rules/elastic
          cp build/siem/splunk/*.spl rules/splunk/
          cp build/siem/elastic/*.kql rules/elastic/
      - name: Compile Wazuh rules (for the coverage table)
        run: dectools-wazuh build --out build/wazuh --registry wazuh/id_registry.json || true
      - name: Scores, LOLBAS, wiki, kill chain, dashboard
        run: |
          python tools/score_rules.py
          python tools/update_lolbas.py
          python tools/generate_docs.py
          python tools/analyze_coverage.py
          python tools/update_all.py
      - name: Commit generated documentation
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DETECTION_WIKI*.md COVERAGE.md DASHBOARD.md GAP_ANALYSIS.md KILL_CHAIN_REPORT.md \
                  rule_scores.json attack_navigator_layer.json mitre_matrix.svg coverage_map.svg \
                  tools/translation_cache.json inventory/lolbas_map.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate wiki, scores and dashboard [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
