title: Ultra-Pro Terminal Services DLL Hijacking (T1505.005)
id: 78af9ef4-1b30-479e-a3ee-ce63b8c4db1f
status: stable
description: |
    Detects unauthorized modification of Terminal Services (RDP) service DLLs 
    and providers. Monitors for ServiceDll and ProviderPath tampering from 
    untrusted processes and non-standard file paths.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1505.005
logsource:
    product: windows
    category: registry_event
detection:
    selection_registry_path:
        TargetObject|contains:
            - 'SYSTEM\CurrentControlSet\Services\TermService\Parameters\ServiceDll'
            - 'SYSTEM\CurrentControlSet\Control\Terminal Server\Providers\'

    selection_suspicious_path:
        Details|contains:
            - '\Users\'
            - '\Temp\'
            - '\AppData\'
            - '\ProgramData\'
            - '\Public\'
            - '\PerfLogs\'

    selection_unauthorized_actor:
        Image|contains:
            - '\Windows\servicing\TrustedInstaller.exe'
            - '\Windows\System32\svchost.exe'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\reg.exe'
            - '\net.exe'
            - '\python.exe'

    filter_trusted_binaries:
        Details|endswith:
            - '\System32\termsrv.dll'
            - '\System32\rdpcorets.dll'

    condition: selection_registry_path and (selection_suspicious_path or selection_unauthorized_actor) and not filter_trusted_binaries
level: critical
