title: Ultra-Pro High-Fidelity Remote System Discovery (T1018)
id: d186372c-ef00-498e-bd5a-ccbad4b0b4e9
status: stable
description: |
    Detects systematic remote system discovery with a focus on Domain Controller identification 
    and network topology mapping. Filters out high-volume noise from system services, 
    browsers, and inventory agents using integrity levels and parent process gating.
author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1018
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\nltest.exe'         
            - '\nslookup.exe'
            - '\net.exe'
            - '\net1.exe'
            - '\arp.exe'
            - '\qwinsta.exe'        
        - CommandLine|contains:
            - 'Get-ADComputer'
            - 'Get-DomainController' 
            - 'Get-NetComputer'

    selection_patterns:
        CommandLine|contains:
            - '/dclist:'            
            - '/dsgetdc:'          
            - '/domain_trusts'      
            - 'view /domain'        
            - '-type=SRV'          
            - '_ldap._tcp'        

    selection_suspicious_lineage:
        ParentImage|endswith:
            - '\wsmprovhost.exe'    
            - '\httpd.exe'          
            - '\winword.exe'        
            - '\powershell.exe'     
        IntegrityLevel: 'Medium'     

    selection_automation:
        CommandLine|contains:
            - 'ConvertTo-Json'
            - 'Export-Csv'
            - ' > '                 
            - 'for /L'               

    filter_legit_system:
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|endswith:
            - '\svchost.exe'
            - '\CcmExec.exe'        
            - '\msiexec.exe'
        - CommandLine|contains:
            - 'Program Files'       
            - 'nslookup -q=srv'      

    condition: selection_tools and (selection_patterns or selection_automation or selection_suspicious_lineage) and not filter_legit_system
level: high
