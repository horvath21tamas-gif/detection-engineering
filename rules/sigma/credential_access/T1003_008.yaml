title: Linux Shadow File Extraction (T1003.008)
id: 6adcdb54-5167-4bf2-8236-5044de9a4067
status: stable
description: |
  Detects unauthorized extraction of the /etc/shadow file. Focuses on 
  redirection to suspicious paths, archiving, and exfiltration via network tools 
  or native utilities from interactive shells, while filtering legitimate system operations.
author: hota05
date: 2026-02-04
tags:
  - attack.credential_access
  - attack.t1003.008

logsource:
  product: linux
  category: process_creation

detection:
  selection_redirection:
    CommandLine|contains:
      - 'cat /etc/shadow'
      - 'grep . /etc/shadow'
      - 'dd if=/etc/shadow'
      - 'python -c .* /etc/shadow'
  selection_redirection_and2:
    CommandLine|contains:
      - ' > /tmp/'
      - ' > /var/tmp/'
      - ' > /dev/shm/'
      - ' > /home/'

  selection_archive:
    CommandLine|contains:
      - 'tar '
      - 'zip '
      - '7z '
      - 'gzip '
  selection_archive_and2:
    CommandLine|contains:
      - '/etc/shadow'
      - '/etc/passwd'

  selection_network:
    CommandLine|contains:
      - 'nc '
      - 'curl '
      - 'wget '
      - 'base64'
  selection_network_and2:
    CommandLine|contains:
      - '/etc/shadow'

  selection_tools:
    CommandLine|contains:
      - 'unshadow '
      - 'mimipenguin'
      - 'linpeas.sh'

  filter_legit_behavior:
    CommandLine|contains:
      - '/usr/sbin/pwconv'
      - '/usr/sbin/useradd'
      - '/usr/sbin/usermod'
      - 'logrotate'
    ParentImage|startswith: '/etc/cron.'

  condition: >
    ((selection_redirection and selection_redirection_and2) or (selection_archive and selection_archive_and2) or (selection_network and selection_network_and2) or selection_tools)
    and not filter_legit_behavior

level: critical
