title: Pubprn.vbs Script Proxy Execution (T1216.001)
id: b2618334-7058-437e-ba70-2733e0dd2e02
status: stable
description: >
  Detects high-confidence abuse of the signed Windows script pubprn.vbs
  to proxy the execution of remote scriptlets (.sct) (MITRE ATT&CK T1216.001).  

  Focuses on anomalous argument injection using the 'script:' protocol, HTTP/UNC
  references, SOAP calls, and suspicious process lineage while filtering out
  legitimate administrative execution contexts and localhost-based scripts.

author: hota05
date: 2026/02/20
references:
  - https://attack.mitre.org/techniques/T1216/001/
  - https://lolbas-project.github.io/lolbas/Binaries/Pubprn/

logsource:
  product: windows
  category: process_creation

detection:
  selection_itp:
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
    OriginalFileName:
      - 'wscript.exe'
      - 'cscript.exe'

  selection_pubprn_script:
    CommandLine|contains:
      - 'pubprn.vbs'

  selection_attack_args:
    CommandLine|contains:
      - 'script:'
      - 'http://'
      - 'https://'
      - 'soap:'
      - '\\\\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\powershell.exe'
      - '\pwsh.exe'

  filter_legit_admin:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\svchost.exe'
    CommandLine|contains: '127.0.0.1'
    username: 'NT AUTHORITY\SYSTEM'

  selection_low_integrity:
    IntegrityLevel:
      - 'Low'
      - 'Medium'

  selection_relocated_binary:
    Image|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'

  condition: >
    selection_itp
    and selection_pubprn_script
    and selection_low_integrity
    and (selection_attack_args
        or selection_suspicious_parent
        or selection_relocated_binary)
    and not filter_legit_admin

falsepositives:
  - Enterprise scripts using pubprn.vbs locally for print automation
  - Admin troubleshooting invoking localhost scripts
  - Red team / penetration testing

level: critical

tags:
  - attack.defense_evasion
  - attack.t1216.001
  - attack.lolbas
  - attack.windows
