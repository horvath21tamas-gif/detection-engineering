title: Hidden User Account Creation (T1564.002)
id: 87077e22-8987-4a8b-b0e9-5c5f0eb38689
status: stable
description: |
  Detects attempts to hide Windows user accounts from the logon screen by 
  monitoring modifications to 'SpecialAccounts\UserList' and related registry keys.
  Focuses on suspicious parent processes, non-system users, and untrusted execution paths,
  while filtering out legitimate system installers and administrative automation.
author: hota05 
date: 2026-02-11
tags:
  - attack.defense_evasion
  - attack.persistence
  - attack.t1564.002
logsource:
  product: windows
  category: process_creation

detection:
  selection_registry:
    CommandLine|re: '.*\\Winlogon\\(SpecialAccounts\\UserList|UserList).*'

  selection_value:
    CommandLine|re: '.*(/d\s*0|REG_DWORD).*'

  selection_suspicious_context:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powershell.exe'
      - '\cmd.exe'
      - '\mshta.exe'
      - '\cscript.exe'
      - '\wscript.exe'
      - '\bash.exe'
    Image|contains:
      - '\Users\'
      - '\Temp\'
      - '\AppData\'

  filter_trusted_system:
    username: 'NT AUTHORITY\SYSTEM'
    ParentImage|contains:
      - '\Windows\System32\svchost.exe'
      - '\Windows\servicing\TrustedInstaller.exe'
      - '\CcmExec.exe'
      - '\Program Files\Microsoft SQL Server\'
      - '\Program Files\Microsoft Visual Studio\'
    CommandLine|contains:
      - 'InstallShield'
      - 'msiexec'
      - 'SQLSetup'

  condition: selection_registry and selection_value and (selection_suspicious_context and not filter_trusted_system)

fields:
  - Time
  - SourceImage
  - ParentImage
  - CommandLine
  - SourceUsername
  - TargetRegistryKey
  - RegistryValue

falsepositives:
  - Legitimate administrative scripts modifying accounts
  - Installer packages with custom account setup in Temp directories
  - Dev/test environments creating service accounts

level: critical
