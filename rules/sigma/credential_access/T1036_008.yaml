title: Masquerade via Interpreter Misuse (T1036.008)
id: ede64a6c-9ad4-4b71-bc41-8751bdfa0392
status: stable
description: >
  Detects mismatched file type execution where legitimate interpreters
  (wscript, cscript, powershell, regsvr32, mshta, rundll32) execute
  files with non-standard extensions (.jpg, .txt, .png, etc.).
  Focuses on untrusted user directories and suspicious parent processes
  while filtering system-level automation and developer artifacts.

author: hota05
date: 2026-02-23
tags:
  - attack.defense_evasion
  - attack.t1036.008
  - attack.execution
  - attack.initial_access

logsource:
  product: windows
  category: process_creation

detection:
  selection_interpreters:
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\regsvr32.exe'
      - '\mshta.exe'
      - '\rundll32.exe'

  selection_mismatched_ext:
    CommandLine|contains:
      - '.jpg'
      - '.jpeg'
      - '.png'
      - '.gif'
      - '.txt'
      - '.log'
      - '.pdf'
      - '.doc'
      - '.docx'
      - '.xls'
      - '.xlsx'
      - '.ppt'
      - '.pptx'
      - '.tmp'
      - '.ini'
      - '.dat'
      - '.cfg'

  selection_untrusted_path:
    CommandLine|contains:
      - '\Users\'
      - '\Downloads\'
      - '\Temp\'
      - '\Windows\Temp\'
      - '\ProgramData\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
      - '\winrar.exe'
      - '\7zFM.exe'
      - '\explorer.exe'

  filter_trusted_apps:
    - username:
        - 'NT AUTHORITY\SYSTEM'
        - 'NT AUTHORITY\LOCAL SERVICE'
        - 'NT AUTHORITY\NETWORK SERVICE'
      ParentImage|endswith:
        - '\services.exe'
    - ParentImage|endswith:
        - '\msiexec.exe'
        - '\trustedinstaller.exe'
    - CommandLine|contains:
        - 'C:\Windows\ccmcache\'
        - 'healthcheck.txt'
        - 'Telemetry'

  condition: >
    selection_interpreters
    and selection_mismatched_ext
    and (selection_untrusted_path or selection_suspicious_parent)
    and not filter_trusted_apps

falsepositives:
  - Internal automation scripts
  - IT management and deployment tools
  - Security testing / red team scenarios
  - Developer build artifacts executed from user profile

level: critical
