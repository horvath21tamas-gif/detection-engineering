title: UAC Bypass via Fodhelper Registry Hijack (High Fidelity)
id: 916a4331-a8fb-43bf-bc87-57d4f291fa26
status: stable
description: >
  Detects UAC bypass attempts abusing fodhelper.exe by monitoring
  registry hijacking of the ms-settings protocol combined with
  suspicious child process execution. This rule focuses on
  user-context auto-elevation to reduce false positives.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1548/002/

logsource:
  product: windows
  category: process_creation

detection:

  fodhelper_execution:
    Image|endswith: '\fodhelper.exe'
    IntegrityLevel:
      - 'High'
      - 'System'

  suspicious_child_process:
    ParentImage|endswith: '\fodhelper.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\rundll32.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\regsvr32.exe'
      - '\python.exe'

  filter_system:
    User|contains:
      - 'SYSTEM'

  filter_legit_admin_tools:
    Image|contains:
      - '\Windows\CCM\'
      - '\Microsoft Configuration Manager\'
      - '\PDQ\'
      - '\Ivanti\'

  condition: >
    fodhelper_execution
    and suspicious_child_process
    and not (
      filter_system
      or filter_legit_admin_tools
    )

falsepositives:
  - Advanced administrative automation using fodhelper (rare)
  - DFIR or red team activity

level: high

tags:
  - attack.privilege_escalation
  - attack.t1548.002
