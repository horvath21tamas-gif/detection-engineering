name: Deploy rules to Wazuh

# Compiles the Sigma rules on a GitHub-hosted runner, then ships the bundle over SSH from a
# SELF-HOSTED runner that lives inside the lab (it only makes outbound connections to GitHub,
# so no inbound port has to be opened). The SSH key is a file on that runner - not a GitHub
# secret - and can only run wazuh-deploy-gate on the manager (see wazuh/README.md).
#
# SECURITY: never add `pull_request` triggers to this workflow. In a public repository a fork PR
# could run code on the self-hosted runner. The `wazuh-prod` environment must require a reviewer.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the Wazuh manager
        type: choice
        options: [deploy, rollback, status]
        default: deploy
  push:
    branches: [main]
    paths: ["rules/sigma/**", "wazuh/**", "src/dectools/wazuh/**"]

concurrency:
  group: deploy-wazuh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/wazuh -q
      - run: dectools-wazuh build --check-registry --max-unsupported 80
      - run: dectools-wazuh bundle --git-sha "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wazuh-bundle
          path: build/wazuh-bundle.tar.gz
          retention-days: 14

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: [self-hosted, linux, lab]
    environment: wazuh-prod        # add "Required reviewers" in Settings > Environments
    timeout-minutes: 30
    env:
      WAZUH_HOST: ${{ vars.WAZUH_HOST }}                       # e.g. 192.168.10.xx
      WAZUH_DEPLOY_USER: ${{ vars.WAZUH_DEPLOY_USER || 'wazuh-deploy' }}
      SSH_KEY: ${{ vars.WAZUH_SSH_KEY_PATH || '~/.ssh/wazuh_deploy' }}
      KNOWN_HOSTS: ${{ vars.WAZUH_KNOWN_HOSTS_PATH || '~/.ssh/known_hosts_wazuh' }}
    steps:
      - name: Download bundle
        if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
        uses: actions/download-artifact@v4
        with:
          name: wazuh-bundle
      - name: Run on the manager
        shell: bash
        run: |
          set -euo pipefail
          action="${{ github.event_name == 'push' && 'deploy' || inputs.action }}"
          ssh_cmd=(ssh -i "${SSH_KEY/#\~/$HOME}" -o BatchMode=yes -o IdentitiesOnly=yes
                   -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${KNOWN_HOSTS/#\~/$HOME}"
                   -o ConnectTimeout=20 "${WAZUH_DEPLOY_USER}@${WAZUH_HOST}")
          if [[ "$action" == deploy ]]; then
            { printf 'deploy\n'; cat wazuh-bundle.tar.gz; } | "${ssh_cmd[@]}" | tee deploy.log
          else
            printf '%s\n' "$action" | "${ssh_cmd[@]}" | tee deploy.log
          fi
      - name: Summary
        if: always()
        run: |
          { echo '### Wazuh deployment'; echo '```json'; cat deploy.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
