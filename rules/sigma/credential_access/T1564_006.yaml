title: Virtual Instance Execution Abuse (T1564.006)
id: 17fc9311-30a0-4e23-8273-6a0a8247fa45
status: stable
description: |
  Detects suspicious execution of virtual instances (Docker, VirtualBox, VMware)
  by monitoring for anti-forensic flags (--rm), privileged escalation attempts,
  host network usage, and execution from untrusted parent processes (Office apps, 
  web servers, scripts). Trusted developer and orchestration environments are filtered.
author: hota05 
date: 2026-02-11
tags:
  - attack.defense_evasion
  - attack.t1564.006
logsource:
  product: windows
  category: process_creation

detection:
  selection_tools:
    Image|endswith:
      - '\docker.exe'
      - '\dockerd.exe'
      - '\VBoxManage.exe'
      - '\VBoxHeadless.exe'
      - '\vmrun.exe'
      - '\vmware-kvm.exe'
      - '\vboxmanage.exe'        
      - '\qemu-system-x86_64.exe'

  selection_dangerous_params:
    CommandLine|contains:
      - '--rm'                 
      - '--privileged'          
      - '--net=host'            
      - '--entrypoint'          
      - '--device'            
      - 'nogui'                
      - 'startvm'               
      - ' -it '                 
      - '--detach'             

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\w3wp.exe'
      - '\php-cgi.exe'
      - '\httpd.exe'
      - '\nginx.exe'
      - '\mshta.exe'
      - '\powershell.exe'
      - '\cmd.exe'

  filter_trusted_dev_env:
    - ParentImage|contains:
        - '\Common7\IDE\devenv.exe'
        - '\bin\code.exe'
        - '\Program Files\Docker\'
        - '\Program Files\VMware\'
        - '\Program Files\VirtualBox\'
    - CommandLine|contains:
        - 'docker-desktop'
        - 'docker-compose'
        - 'minikube'
        - 'vagrant'

  condition: selection_tools and (selection_suspicious_parent or (selection_dangerous_params and not filter_trusted_dev_env))

fields:
  - Time
  - SourceImage
  - ParentImage
  - CommandLine
  - SourceUsername

falsepositives:
  - Legitimate container/VM usage from developer machines
  - Orchestration scripts running headless VMs or containers
  - Automated CI/CD pipelines (if not filtered)

level: high
