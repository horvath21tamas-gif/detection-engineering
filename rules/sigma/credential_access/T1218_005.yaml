title: Gyanus mshta.exe URL-rol futtat scriptet
id: '24d8de69-1ec4-42d9-8e5e-38d6e36e9a48'
status: experimental
description: Gyanus mshta.exe URL-rol futtat scriptet
author: hota05
date: 2026/01/13
logsource:
  product: windows
  category: process_creation
detection:
  selection_remote:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
  selection_user:
    username:
      - 'SYSTEM'
  condition: selection_remote and not selection_user
level: medium
tags:
  - attack.t1218.005
falsepositives:
  - admin script futtatasa
  - pentesteles
