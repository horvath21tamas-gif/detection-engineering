title: ROM Kit & UEFI Firmware Tampering (T1542.001)
id: 5c8bebe8-05a3-45b9-b1de-1f1a622fe1ab
status: stable
description: |
    Detects unauthorized firmware manipulation by monitoring high-risk driver 
    registrations and firmware update utilities initiated from suspicious 
    process trees, specifically targeting BYOVD and SPI flash access. 
    Filters out trusted vendor update utilities to minimize false positives.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1542.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_firmware_tools:
        Image|endswith:
            - '\flashrom.exe'
            - '\FPTW64.exe'
            - '\AfuEfix64.exe'
            - '\InsydeFlash.exe'
        OriginalFileName:
            - 'flashrom.exe'
            - 'FPTW64.exe'
            - 'amifldrv64.sys'

    selection_driver_creation:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - ' create '
            - ' type= kernel'
            - ' binpath='

    selection_untrusted_origins:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
        Image|contains:
            - '\temp\'
            - '\public\'
            - '\download\'

    filters_trusted_vendors:
        ParentImage|contains:
            - '\Dell\CommandUpdate\'
            - '\Lenovo\SystemUpdate\'
            - '\HP\HP Support Assistant\'
        Image|contains: 'C:\Windows\System32\SystemSettingsAdminFlows.exe'

    condition: (selection_firmware_tools or selection_driver_creation) and selection_untrusted_origins and not filters_trusted_vendors
level: critical
