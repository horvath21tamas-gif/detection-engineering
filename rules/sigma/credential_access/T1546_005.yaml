title: Ultra-Pro Shell Trap Persistence Detection (T1546.005)
id: ffd2352d-60d7-4fe9-95a4-d0678c26c55d
status: stable
description: |
    Detects unauthorized shell trap persistence by monitoring writes to shell profile files 
    that include 'trap' commands combined with suspicious network payloads or execution patterns.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1546/005/
tags:
    - attack.persistence
    - attack.t1546.005
logsource:
    product: linux
    category: process_creation
detection:
    selection_target_files:
        CommandLine|contains:
            - '.bashrc'
            - '.bash_profile'
            - '.zshrc'
            - '.profile'
            - '/etc/profile'
            - '/etc/bash.bashrc'

    selection_trap_syntax:
        CommandLine|contains: 'trap '
    selection_trap_syntax_and2:
        CommandLine|contains:
            - 'DEBUG'
            - 'EXIT'
            - 'RETURN'

    selection_suspicious_payload:
        CommandLine|contains:
            - 'curl'
            - 'wget'
            - 'base64'
            - 'python'
            - '/dev/tcp/'
            - 'sh -i'
            - 'nc '

    filter_trusted_automation:
        ParentImage|endswith:
            - '/ansible-playbook'
            - '/chef-client'
            - '/salt-minion'
            - '/puppet'
            - '/dpkg'
            - '/apt'

    filter_dev_tools:
        CommandLine|contains:
            - 'rbenv rehash'
            - 'pyenv'
            - 'bash_completion'

    condition: selection_target_files and (selection_trap_syntax and selection_trap_syntax_and2) and selection_suspicious_payload and not (filter_trusted_automation or filter_dev_tools)
level: critical
