title: Ultra-Pro SQL Server Command Shell Execution (T1505.001)
id: 2feffae6-283b-421f-8f08-dcf1f0099f60
status: stable
description: |
    Detects unauthorized OS command execution through SQL Server extended stored procedures 
    and CLR assemblies. Filters legitimate SQL Agent maintenance while flagging 
    suspicious discovery commands and configuration changes (xp_cmdshell, sp_configure).
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.execution
    - attack.t1505.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_sql_engine:
        ParentImage|endswith: '\sqlservr.exe'

    selection_suspicious_children:
        - Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\bitsadmin.exe'
            - '\certutil.exe'      
            - '\net.exe'          
            - '\net1.exe'
            - '\whoami.exe'
            - '\systeminfo.exe'
            - '\nltest.exe'       
            - '\scrcons.exe'      

    selection_sql_config_cmd:
        CommandLine|contains:
            - 'sp_configure'
            - 'xp_cmdshell'
            - 'RECONFIGURE'
            - 'show advanced options'
            - 'Ole Automation Procedures'

    filter_sql_agent_jobs:
        ParentImage|endswith: '\sqlagent.exe'
    
    filter_installers:
        Image|contains: '\Microsoft SQL Server\...\Setup\'
        CommandLine|contains: 'sqlagent.exe -i'

    condition: selection_sql_engine and (selection_suspicious_children or selection_sql_config_cmd) and not (filter_sql_agent_jobs or filter_installers)
level: critical
