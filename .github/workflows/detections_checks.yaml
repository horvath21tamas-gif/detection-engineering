name: CI/CD for Detection Rules

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # --- 1. JOB: QRADAR KONVERZIÓ (Izolált, régi környezet) ---
  qradar_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QRadar environment
        run: |
          python -m pip install --upgrade pip
          # A QRadar-nak szüksége van a régi pyparsingra
          python -m pip install "pyparsing==3.1.1" "pysigma==0.9.11" "pysigma-backend-qradar"

      - name: Convert QRadar rules (Robust Script)
        run: |
          mkdir -p rules/qradar
          cat <<EOF > convert_qradar.py
          import os
          import sigma.backends.qradar
          from sigma.collection import SigmaCollection
          import inspect

          QRadarBackend = None
          for name, obj in inspect.getmembers(sigma.backends.qradar):
              if inspect.isclass(obj) and "Backend" in name and ("QRadar" in name or "Qradar" in name):
                  QRadarBackend = obj
                  break
          if QRadarBackend:
              backend = QRadarBackend()
              rules_path = "rules/sigma"
              for root, _, files in os.walk(rules_path):
                  for file in files:
                      if file.endswith((".yaml", ".yml")):
                          try:
                              with open(os.path.join(root, file), "r", encoding="utf-8") as f:
                                  rule = SigmaCollection.from_yaml(f.read())
                                  result = backend.convert(rule)
                                  if result:
                                      out_name = file.rsplit(".", 1)[0] + ".aql"
                                      with open(f"rules/qradar/{out_name}", "w") as out:
                                          out.write(result[0])
                          except:
                              pass
          EOF
          python convert_qradar.py

      - name: Upload QRadar rules as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qradar-results
          path: rules/qradar/
          retention-days: 1

  # --- 2. JOB: MODERN SIEMS & VALIDATION (Új környezet) ---
  detection_pipeline:
    needs: qradar_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download QRadar results
        uses: actions/download-artifact@v4
        with:
          name: qradar-results
          path: rules/qradar/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Modern SIEM environment
        run: |
          python -m pip install --upgrade pip
          # 1. Alap csomagok a scriptekhez
          python -m pip install "pyyaml" "packaging" "requests"
          
          # 2. Virtuális környezet a SPLUNK/ELASTIC-nak (Modern)
          python -m venv venv_modern
          ./venv_modern/bin/pip install "pysigma>=1.1.0" "sigma-cli==2.0.1" "pysigma-backend-splunk>=2.0.0" "pysigma-backend-elasticsearch>=2.0.2"
          
          # 3. Virtuális környezet a SENTINEL-nek (Külön sziget az Azure-nak)
          python -m venv venv_sentinel
          ./venv_sentinel/bin/pip install "pysigma<0.11.0" "pysigma-backend-azure==0.1.3"

      - name: Convert Sigma rules (Environment Switch)
        run: |
          mkdir -p rules/splunk rules/netwitness rules/elastic rules/sentinel
          
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            
            # SPLUNK & ELASTIC (Modern környezet használata)
            ./venv_modern/bin/sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "Splunk error"
            ./venv_modern/bin/sigma convert -t lucene -p ecs_windows "$file" -o "rules/elastic/${filename}.kql" || echo "Elastic error"
            
            # SENTINEL (Speciális környezet használata)
            # Itt manuálisan hívjuk a backendet, mert a régi verzió máshogy működik
            ./venv_sentinel/bin/python -c "
            import sys
            from sigma.collection import SigmaCollection
            from sigma.backends.azure import AzureBackend
            try:
                with open('$file', 'r') as f:
                    rule = SigmaCollection.from_yaml(f.read())
                    backend = AzureBackend()
                    print(backend.convert(rule)[0])
            except Exception as e:
                sys.stderr.write(str(e))
            " > "rules/sentinel/${filename}.kql" || echo "Sentinel error"
          done

      - name: Update Dynamic Inventory
        run: |
          mkdir -p inventory
          python tools/update_inventory.py

      - name: Smart Validation
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Log Source Validation
        run: python tools/check_log_sources.py

      - name: Preprocess Sigma rules
        run: python tools/preprocess_sigma.py

      - name: Convert Sigma rules (Modern SIEMs)
        run: |
          mkdir -p rules/splunk rules/netwitness rules/elastic rules/sentinel
          
          for file in $(find rules/sigma -name "*.yaml" -o -name "*.yml"); do
            filename=$(basename "$file" .yaml)
            filename=$(basename "$filename" .yml)
            
            # SPLUNK
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "Splunk error: $file"
            
            # SENTINEL
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "Sentinel error: $file"
            
            # RSA NETWITNESS
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "RSA error: $file"
            
            # ELASTIC
            sigma convert -t lucene -p ecs_windows "$file" -o "rules/elastic/${filename}.kql" || echo "Elastic error: $file"
          done

      - name: Final SIEM Query Fixer
        run: python tools/final_siem_fixer.py

      - name: Run Integrity Check
        run: python tools/check_integrity.py

      - name: Generate MITRE, Wiki & Stats
        if: github.event_name == 'push'
        run: |
          python tools/score_rules.py
          python tools/generate_nav_layer.py
          python tools/generate_docs.py
          python tools/gap_analysis.py
          python tools/update_all.py

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add rules/ inventory/ *.md *.json *.svg
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Multi-agent pipeline with Sentinel support (fixed dependency conflict)"
            git pull --rebase -X ours origin test
            git push origin test
          fi

      - name: Check Status
        if: always()
        run: |
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ Validációs hiba történt korábban."
            exit 1
          fi
