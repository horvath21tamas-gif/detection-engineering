title: Ultra-Pro High-Fidelity Asymmetric Encryption C2 (T1573.002)
id: b55dc284-ebd0-4215-a97f-713dd479c2be
status: stable
description: |
    Detects custom asymmetric encryption (RSA/ECC) by identifying programmatic 
    trust chain overrides (ServerCertificateValidationCallback) and raw public key 
    imports (FromXmlString/ImportSubjectPublicKeyInfo) from non-standard processes.
author: hota05
date: 2026-02-09
tags:
    - attack.command_and_control
    - attack.t1573.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_trust_override:
        CommandLine|contains:
            - 'ServerCertificateValidationCallback' 
            - 'return $true'                        
            - 'ServicePointManager]::Expect100Continue' 
            - 'SecurityProtocolType]::Tls12'         

    selection_asym_import:
        CommandLine|contains:
            - 'RSACryptoServiceProvider'           
            - 'FromXmlString'                       
            - 'ImportSubjectPublicKeyInfo'          
            - 'X509Certificate2'                    

    selection_procs:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'

    filter_legit_infra:
        - CommandLine|contains:
            - 'C:\Program Files\'
            - 'Microsoft\Azure'                    
            - 'HealthCheck'                       
        - User: 'NT AUTHORITY\SYSTEM'             
        - ParentImage|endswith:
            - '\services.exe'                       

    condition: (selection_trust_override or selection_asym_import) and selection_procs and not filter_legit_infra
level: critical
