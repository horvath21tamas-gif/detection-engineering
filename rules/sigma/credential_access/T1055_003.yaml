title: Thread Hijacking Detection (ATT&CK T1055.003)
id: dbc7132c-1726-453e-9e07-9cfc1ed15f1e
status: stable
description: >
  Detects stealthy thread execution hijacking by monitoring cross-process access
  requests with thread manipulation rights (SET_CONTEXT) where the calling stack
  originates from unbacked or injected memory (shellcode). Targets high-value
  processes to identify advanced privilege escalation attempts.
author: hota05
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1055/003/
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055.003
  - attack.host

logsource:
  product: windows
  category: process_access

detection:
  selection_access_mask:
    GrantedAccess|contains:
      - '0x10'        
      - '0x16'
      - '0x1FFFFF'    

  selection_unbacked_calltrace:
    CallTrace|contains: 'unknown'

  selection_critical_targets:
    TargetImage|endswith:
      - '\lsass.exe'
      - '\svchost.exe'
      - '\explorer.exe'
      - '\winlogon.exe'
      - '\spoolsv.exe'

  filter_trusted:
    - Sourceprocessname: 'C:\Windows\System32\csrss.exe'
    - SourceImage|endswith:
        - '\MsMpEng.exe'
        - '\CcmExec.exe'
    - CallTrace|contains:
        - 'clr.dll+'
        - 'wer.dll+'
        - 'ntdll.dll+LdrpWorkItem'
    - condition: selection_source_equals_target

  selection_suspicious_source:
    SourceImage|contains:
      - '\Users\'
      - '\Temp\'
      - '\AppData\'

  condition: selection_access_mask 
             and selection_unbacked_calltrace 
             and selection_critical_targets 
             and not filter_trusted

falsepositives:
  - Legitimate system or AV thread operations
  - Debugging and monitoring tools manipulating threads

level: critical
