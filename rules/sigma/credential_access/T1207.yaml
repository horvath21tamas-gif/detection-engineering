title: Rogue DC / DCShadow Detection (T1207)
id: 6558bf71-2871-406e-a9e1-9c0cda8b65be
status: stable
description: |
    Detects suspicious Domain Controller topology changes, including:
    - Creation of nTDSDSA objects by non-DC accounts
    - Registration of critical Domain Controller SPNs (E3514235 / GC)
    - Indicative of Rogue DC deployment or DCShadow attacks
    Legitimate domain admins and existing DC accounts are excluded to reduce false positives.

author: hota05
date: 2026-02-20
references:
    - https://attack.mitre.org/techniques/T1207/
tags:
    - attack.t1207
    - attack.persistence
    - attack.lateral_movement
logsource:
    product: windows
    service: security

detection:
    selection_ntdsdsa_creation:
        EventID: 5136
        ObjectClass|contains: 'nTDSDSA'

    selection_spn_registration:
        EventID: 4742
        ServicePrincipalNames|contains:
            - 'E3514235-4B06-11D1-AB04-00C04FC2DCD2/' 
            - 'GC/'                                   

    filter_legit_actors:
        SubjectUserName|contains:
            - 'NT AUTHORITY'
            - 'AD-ADMIN-'
        SubjectUserName|endswith: '$'

    filter_known_dcs:
        TargetUserName|contains:
            - 'DC-PROD-'
            - 'DC-BACKUP-'
            - 'DC-ARCHIVE-'

    condition: 
        (selection_ntdsdsa_creation or selection_spn_registration)
        and not (filter_legit_actors or filter_known_dcs)

fields:
    - TimeCreated
    - SubjectUserName
    - SubjectDomainName
    - TargetUserName
    - TargetDomainName
    - ObjectClass
    - ServicePrincipalNames
    - EventID

falsepositives:
    - Approved DC provisioning or cloning processes
    - Disaster recovery or lab DC creation
    - AD forest migrations performed by authorized admins

level: critical
