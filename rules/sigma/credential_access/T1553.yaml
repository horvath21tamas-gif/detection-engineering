title: Ultra-Pro High-Fidelity Subvert Trust Controls (T1553)
id: 612083f8-71f6-4ebd-8361-8a9c153dc09d
status: stable
description: |
    Detects attempts to subvert trust controls by force-installing root certificates 
    or modifying security zones/MotW settings from non-standard processes and paths.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1553.004
    - attack.t1553.005
logsource:
    product: windows
    category: process_creation
detection:
    selection_cert_injection:
        Image|endswith:
            - '\certutil.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - ' -addstore '
            - ' -importcert '
            - ' -installcert '
            - ' Import-Certificate '

    selection_root_stores:
        CommandLine|contains:
            - ' Root'           
            - ' AuthRoot'      
            - ' TrustedPublisher'

    selection_zone_bypass:
        CommandLine|contains:
            - 'SaveZoneInformation'  
            - 'LowRiskFileTypes'    
            - 'Zone.Identifier'   

    selection_paths:
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Downloads\'
            - '\Desktop\'

    filter_trusted_automation:
        ParentImage|startswith:
            - 'C:\Windows\System32\msiexec.exe'
            - 'C:\Program Files\Microsoft Endpoint Manager\'
        username: 'NT AUTHORITY\SYSTEM'

    condition: ((selection_cert_injection and selection_root_stores and selection_paths) or (selection_zone_bypass and selection_paths)) and not filter_trusted_automation
level: critical
