title: Exploit-Grade KernelCallbackTable Manipulation via Remote Memory Write
id: b6d6a120-3026-4973-8efa-60dc760106d0
status: stable
description: |
  Detects remote memory write operations into GUI processes which are prerequisites 
  for KernelCallbackTable hijacking. This technique is often used for process 
  injection that evades standard hook-based monitoring.
author: hota05 
date: 2026/02/02
tags:
  - attack.privilege_escalation
  - attack.defense_evasion
  - attack.t1574.013
logsource:
  product: windows
  category: process_access 
detection:
  gui_target_process:
    TargetImage|endswith:
      - '\explorer.exe'
      - '\dwm.exe'
      - '\taskhostw.exe'

  dangerous_memory_access:
    GrantedAccess|contains:
      - '0x28'
      - '0x20'
      - '0x1fffff'

  exclude_standard_software:
    SourceImage|contains:
      - '\Visual Studio\'
      - '\WinDbg\'
      - '\Windows Defender\'
      - '\CrowdStrike\'
      - '\SentinelOne\'
      - '\CarbonBlack\'
      - '\Tanium\'
    SourceImage|endswith:
      - '\procmon.exe'
      - '\procexp.exe'
      - '\taskmgr.exe' 

  exclude_system_and_parent:
    - SourceUser: 'NT AUTHORITY\SYSTEM'
    - ParentImage|endswith: '\explorer.exe' 

  condition: gui_target_process and dangerous_memory_access and not (exclude_standard_software or exclude_system_and_parent)
level: critical
