title: High-Fidelity Python Interpreter Abuse Detection
id: e43c2add-0050-487f-a3a6-f5b5908d57a0
status: stable
description: |
    Detects suspicious Python execution patterns, focusing on one-liner reverse shells, 
    interactive shell upgrades, and execution originating from high-risk network-facing 
    parent processes (Web Servers, SQL).
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1059/006/
    - https://gtfobins.github.io/gtfobins/python/
tags:
    - attack.execution
    - attack.t1059.006
logsource:
    product: linux
    category: process_creation
detection:
    selection_interpreter:
        Image|endswith:
            - '/python'
            - '/python3'
            - '/python2'
            - '/pythonw.exe'

    selection_one_liner_logic:
        CommandLine|contains:
            - ' -c '
        CommandLine|contains:
            - 'import socket'   
            - 'pty.spawn'       
            - 'base64.b64decode'
            - 'requests.get'    
            - 'os.system'      

    selection_risky_parents:
        ParentImage|endswith:
            - '/httpd'
            - '/apache2'
            - '/nginx'
            - '/php-fpm'
            - '/w3wp.exe'
            - '/sqlservr.exe'
            - '/redis-server'

    filter_legit_automation:
        - CommandLine|contains:
            - 'yum '
            - 'dnf '
            - 'cloud-init'
            - 'aws-cli'
        - ParentImage|endswith:
            - '/systemd'
            - '/sbin/init'
        - User: 'root'
          ParentImage: '/usr/sbin/sshd' 

    condition: selection_interpreter and (selection_one_liner_logic or selection_risky_parents) and not filter_legit_automation
level: critical
