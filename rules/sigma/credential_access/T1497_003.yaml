title: Time-based Evasion (T1497.003)
id: d5678671-3bfa-4b14-8a28-82e0e85e3be9
status: stable
description: |
  Detects sophisticated time-based evasion by monitoring non-standard delay mechanisms 
  (ping, choice, timeout) initiated by untrusted binaries. Targets long-duration stalls 
  used to exhaust sandbox analysis limits.
author: hota05
date: 2026-02-03
tags:
  - attack.defense_evasion
  - attack.t1497.003
logsource:
  category: process_creation
  product: windows
detection:
  untrusted_origins:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Downloads\'
      - '\Desktop\'
      - '\PerfLogs\'

  ping_stall:
    CommandLine|contains:
      - 'ping 127.0.0.1 -n '
      - 'ping ::1 -n '
    CommandLine|re|i: '.* -n (?:[1-9][0-9]{2,}|[1-9][0-9]{3,}).*'

  choice_timeout:
    CommandLine|contains:
      - 'choice /t'
      - 'choice /d y /t'
    CommandLine|re|i: '.* /t (?:[6-9][0-9]|[1-9][0-9]{2,}).*'

  timeout_abuse:
    CommandLine|contains: 'timeout /t'
    CommandLine|re|i: '.* /t (?:[1-9][0-9]{2,}).*'

  trusted_system_filter:
    ParentImage|endswith:
      - '\msiexec.exe'
      - '\TrustedInstaller.exe'
      - '\CcmExec.exe'
    User: 'NT AUTHORITY\SYSTEM'

  common_admin_filter:
    CommandLine|contains:
      - 'net use'
      - 'subst'
      - 'net time'

  condition: untrusted_origins and (ping_stall or choice_timeout or timeout_abuse) 
             and not (trusted_system_filter or common_admin_filter)
level: high
