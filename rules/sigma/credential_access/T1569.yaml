title: High-Fidelity System Service Execution Detection
id: 28f0ad7c-3272-4e8e-9c6b-0c647a3f24dc
status: stable
description: |
    Detects the creation or execution of system services with suspicious characteristics, 
    such as binaries located in world-writable directories or services used as 
    wrappers for shell commands. Optimized to filter out legitimate software installers.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1569/002/
tags:
    - attack.execution
    - attack.t1569
    - attack.t1569.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith: 
            - '\sc.exe'
        - OriginalFileName: 'sc.exe'
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_action:
        CommandLine|contains:
            - ' create '
            - ' config '
            - ' binPath'
            - 'New-Service'
            - 'Set-Service'

    selection_suspicious_paths:
        CommandLine|contains:
            - ':\Windows\Temp\'
            - ':\Users\Public\'
            - ':\ProgramData\'
            - '\AppData\Local\Temp\'
            - 'admin$'
            - 'c$'
            - '\\127.0.0.1\'

    selection_shell_wrappers:
        CommandLine|contains:
            - 'cmd.exe /c'
            - 'cmd.exe /k'
            - 'powershell.exe -enc'
            - ' -ExecutionPolicy Bypass '

    filter_legit_installers:
        - ParentImage|endswith:
            - '\msiexec.exe'
            - '\TrustedInstaller.exe'
            - '\CcmExec.exe'
        - username: 'NT AUTHORITY\SYSTEM'
          CommandLine|contains: 'C:\Windows\System32\'

    condition: selection_tools and selection_action and (selection_suspicious_paths or selection_shell_wrappers) and not filter_legit_installers
level: high
