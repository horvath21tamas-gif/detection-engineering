title: Regsvcs/Regasm .NET Proxy Execution
id: 56d6f16d-72ee-480a-a530-c12eefeb3317
status: stable
description: >
  Detects high-confidence abuse of regsvcs.exe or regasm.exe for
  proxy execution of malicious .NET assemblies (MITRE ATT&CK T1218.009).

  The rule focuses on suspicious uninstall flags (/U, /uninstall),
  execution of assemblies from user-writable or remote paths,
  anomalous parent processes, integrity level context, and relocated
  binary execution outside the default .NET Framework directories.

  Designed to reduce noise from legitimate .NET registration
  and MSI-driven installation activity.

author: hota05
date: 2026/02/20
references:
  - https://attack.mitre.org/techniques/T1218/009/
  - https://lolbas-project.github.io/lolbas/Binaries/Regsvcs/
  - https://lolbas-project.github.io/lolbas/Binaries/Regasm/

logsource:
  product: windows
  category: process_creation

detection:

  selection_regasm_regsvcs_image:
    Image|endswith:
      - '\regsvcs.exe'
      - '\regasm.exe'
    OriginalFileName:
      - 'regsvcs.exe'
      - 'RegAsm.exe'

  selection_relocated_binary:
    Image|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'

  selection_uninstall_flags:
    CommandLine|contains:
      - ' /U '
      - ' /uninstall '
      - ' /regfile'

  selection_user_writable_assembly:
    CommandLine|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'
      - '\Public\'

  selection_remote_assembly:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '\\\\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\powerpnt.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'

  selection_low_integrity:
    IntegrityLevel:
      - 'Low'
      - 'Medium'

  filter_legitimate_framework_path:
    Image|startswith:
      - 'C:\Windows\Microsoft.NET\Framework\'
      - 'C:\Windows\Microsoft.NET\Framework64\'

  filter_legitimate_installers:
    ParentImage|endswith:
      - '\msiexec.exe'
      - '\trustedinstaller.exe'
    IntegrityLevel: 'High'

  filter_system_context:
    User|startswith: 'NT AUTHORITY\'

  condition: >
    selection_regasm_regsvcs_image
    and selection_low_integrity
    and (selection_relocated_binary
        or (selection_uninstall_flags
            and (selection_user_writable_assembly
                or selection_remote_assembly
                or selection_suspicious_parent)))
    and not (filter_legitimate_framework_path
        and filter_legitimate_installers)
    and not filter_system_context

falsepositives:
  - Rare enterprise deployment scripts registering assemblies from user paths
  - Development environments performing custom .NET registration
  - Security testing activities

level: critical

tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1218.009
  - attack.lolbas
  - attack.dotnet
  - attack.windows
