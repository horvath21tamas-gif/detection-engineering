title: Web Shell Execution Patterns (T1505)
id: cdc72232-a07f-42b2-aaf7-4070536508e5
status: stable
description: |
    Detects high-confidence indicators of web shell activity by monitoring web server 
    processes spawning interactive shells, reconnaissance utilities, or lateral movement tools. 
    Includes strict filtering for legitimate .NET compilation, IIS administration, 
    and authorized server maintenance tasks.

author: hota05
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1505/
tags:
    - attack.persistence
    - attack.t1505
    - attack.execution
    - attack.lateral_movement

logsource:
    product: windows
    category: process_creation

detection:

  selection_web_servers:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\httpd.exe'
      - '\nginx.exe'
      - '\php-cgi.exe'
      - '\tomcat.exe'
      - '\java.exe'

  selection_suspicious_children:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\sh.exe'
      - '\bash.exe'
      - '\whoami.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\ipconfig.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\systeminfo.exe'
      - '\nltest.exe'
      - '\netstat.exe'
      - '\curl.exe'
      - '\wget.exe'
      - '\rundll32.exe'
      - '\cscript.exe'
      - '\wscript.exe'

  filter_legit_compilation:
    Image|endswith:
      - '\csc.exe'
      - '\cvtres.exe'
    CommandLine|contains:
      - '\Windows\Microsoft.NET\Framework'
      - '\Temporary ASP.NET Files\'

  filter_iis_management:
    CommandLine|contains:
      - 'appcmd.exe list config'
      - 'iisreset.exe'
    username: 'NT AUTHORITY\SYSTEM'

  filter_legit_automation:
    ParentImage|contains:
      - '\Jenkins\'
      - '\GitLab-Runner\'
      - '\Terraform\'
      - '\Ansible\'
    username: 'NT AUTHORITY\SYSTEM'

  condition: selection_web_servers and selection_suspicious_children and not (filter_legit_compilation or filter_iis_management or filter_legit_automation)

falsepositives:
  - Authorized server maintenance tasks or automated deployments
  - .NET compilation processes for legitimate web applications
  - Approved penetration testing or red team exercises

level: critical
