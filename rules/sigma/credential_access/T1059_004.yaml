title: High-Fidelity Unix Shell Abuse and Reverse Shell Detection
id: 872ba5dc-0c00-40e8-9e12-ede6f29b7a60
status: stable
description: |
    Detects suspicious Unix shell behavior, focusing on reverse shells, 
    pipe-to-shell patterns, and execution from high-risk network-facing 
    processes (web servers, databases) while filtering common automation.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1059/004/
    - https://gtfobins.github.io/
tags:
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_shells:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/zsh'
            - '/dash'
            - '/ash'

    selection_suspicious_parents:
        ParentImage|endswith:
            - '/httpd'
            - '/apache2'
            - '/nginx'
            - '/php-fpm'
            - '/python' 
            - '/node'
            - '/mysqld'
            - '/postgres'
            - '/redis-server'

    selection_attack_logic:
        - CommandLine|contains:
            - '/dev/tcp/'
            - '/dev/udp/'
            - 'interactive'
            - '>&'
            - '0>&1'
        - CommandLine|contains|all:
            - 'curl'
            - '|'
            - 'sh'
        - CommandLine|contains|all:
            - 'wget'
            - '-O-'

    filter_automation_and_admin:
        - ParentImage|endswith: 
            - '/systemd'
            - '/sbin/init'
        - CommandLine|contains:
            - '/var/lib/apt/'
            - '/tmp/terraform_'
            - 'logrotate'
        - User: 'root'
          ParentImage: '/usr/sbin/sshd' 

    condition: selection_shells and (selection_suspicious_parents or selection_attack_logic) and not filter_automation_and_admin
level: critical
