title: High-Fidelity Reflective Code Loading and In-Memory Assembly Execution
id: 71d9c34f-73c9-4a7f-bd1d-80cac6678d8f
status: stable
description: >
  Detects reflective code loading and in-memory assembly execution by monitoring 
  memory allocation with execution flags, process memory writes, and .NET reflection 
  assembly loading patterns in combination. Filters legitimate development and CI/CD processes.

author: hota05 
date: 2026-02-03
modified: 2026-02-11
tags:
  - attack.defense_evasion
  - attack.t1620
  - attack.execution
  - attack.persistence

logsource:
  product: windows
  category: process_creation

detection:

  selection_win32_memory:
    CommandLine|contains:
      - 'VirtualAlloc'
      - 'VirtualProtect'
      - 'WriteProcessMemory'
      - 'CreateRemoteThread'
      - 'NtMapViewOfSection'
      - 'QueueUserAPC'

  selection_mem_execute_flags:
    CommandLine|contains:
      - '0x20'       
      - '0x40'       
      - '0x3000'    

  selection_reflection_methods:
    CommandLine|contains:
      - '[System.Reflection.Assembly]::Load('
      - 'Reflection.Emit'
      - 'Marshal.Copy'
      - '[Activator]::CreateInstance('
      - '[AppDomain]::CurrentDomain'

  selection_obfuscation_patterns:
    CommandLine|contains:
      - 'FromBase64String'
      - 'IO.MemoryStream'
      - 'IO.Compression'
      - 'ConvertFrom-SecureString'
      - 'AES'       

  selection_suspicious_paths:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Temp\'
      - '\ProgramData\'

  selection_suspicious_parents:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\explorer.exe'
      - '\wsmprovhost.exe'

  filter_trusted_dev:
    Image|contains:
      - '\Visual Studio\'
      - '\MSBuild.exe'
      - '\dotnet.exe'
      - '\GitHub\'
      - '\Jenkins\'
      - '\AzureDevOps\'
    User|contains:
      - 'svc-build'
      - 'ci'
      - 'cicd'
      - 'jenkins'

  condition:
    (
      (selection_win32_memory and selection_mem_execute_flags)
      or
      (selection_reflection_methods and selection_obfuscation_patterns)
    )
    and (selection_suspicious_paths or selection_suspicious_parents)
    and not filter_trusted_dev

falsepositives:
  - Build agents performing legitimate in-memory assembly compilation
  - Developer machines using Visual Studio or dotnet hot-reload
  - CI/CD pipelines for automated testing
  - Security monitoring tools that perform reflective loads (e.g., automated pentest agents)

level: critical
