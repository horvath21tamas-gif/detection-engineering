title: Suspicious File Download via Bitsadmin (High Fidelity)
id: cb18e931-1e03-47dd-a4fe-37bda286a68f
status: stable
description: >
  Detects suspicious file downloads performed using bitsadmin.exe,
  a deprecated but still abused Windows LOLBAS utility. The rule
  focuses on attacker-typical usage patterns, execution context,
  and download targets to reduce false positives.
author: hota05
date: 2026/01/26
references:
  - https://attack.mitre.org/techniques/T1197/

logsource:
  product: windows
  category: process_creation

detection:

  bitsadmin_execution:
    Image|endswith: '\bitsadmin.exe'

  download_activity:
    CommandLine|contains:
      - '/transfer'
      - '/addfile'
      - 'http://'
      - 'https://'

  suspicious_target_path:
    CommandLine|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'

  suspicious_parent:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'

  filter_service_accounts:
    User|contains:
      - 'SYSTEM'
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'

  filter_legit_tooling:
    ParentImage|contains:
      - '\Windows\CCM\'
      - '\Microsoft Configuration Manager\'
      - '\PDQ\'
      - '\Ivanti\'
      - '\ManageEngine\'
      - '\Tanium\'
      - '\Intune\'
      - '\WindowsUpdate\'

  condition: >
    bitsadmin_execution
    and download_activity
    and suspicious_target_path
    and suspicious_parent
    and not (
      filter_service_accounts
      or filter_legit_tooling
    )

falsepositives:
  - Rare legacy administrative scripts
  - Approved red team or malware simulation

level: high

tags:
  - attack.command_and_control
  - attack.t1197
