name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. Alap csomagok + Sentinel backend telepítése közvetlenül GitHubról
          python -m pip install sigma-cli pysigma-backend-splunk pytest "pyyaml>=6.0"
          python -m pip install git+https://github.com/SigmaHQ/pySigma-backend-microsoft-sentinel.git
          
          # 2. A többi stabil plugin
          sigma plugin install splunk sysmon windows netwitness
          
          # 3. QRadar kényszerített telepítése
          sigma plugin install --force-install qradar || echo "QRadar forced"
          
          # 4. Verzió helyreállítás a biztonság kedvéért
          python -m pip install --upgrade "pysigma>=1.1.0" "pyparsing>=3.0.0" sigma-cli

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek vagy hiba történt."

      - name: Convert Sigma rules to SIEM queries
        run: |
          # Mappák létrehozása (Splunk, QRadar, NetWitness és ÚJ: Sentinel számára)
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/sentinel
          rm -f rules/splunk/*.spl
          rm -f rules/qradar/*.aql
          rm -f rules/netwitness/*.txt
          rm -f rules/sentinel/*.kql
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk konverzió
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba: $file"
            
            # QRadar konverzió
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || \
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba: $file"
            
            # RSA NetWitness konverzió
            sigma convert -t net_witness "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ RSA hiba: $file"

            # Microsoft Sentinel (KQL) konverzió
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "⚠️ Sentinel hiba: $file"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Alap fájlok hozzáadása
          git add README.md COVERAGE.md attack_navigator_layer.json mitre_matrix.svg \
                  rules/sigma/*.yaml
          
          # SIEM fájlok hozzáadása csak ha léteznek (Hiba megelőzése)
          if ls rules/splunk/*.spl 1> /dev/null 2>&1; then git add rules/splunk/*.spl; fi
          if ls rules/qradar/*.aql 1> /dev/null 2>&1; then git add rules/qradar/*.aql; fi
          if ls rules/netwitness/*.txt 1> /dev/null 2>&1; then git add rules/netwitness/*.txt; fi
          if ls rules/sentinel/*.kql 1> /dev/null 2>&1; then git add rules/sentinel/*.kql; fi
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard, Splunk, QRadar, NetWitness & Sentinel rules"
            git pull --rebase origin test
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált."
            exit 1
          fi
