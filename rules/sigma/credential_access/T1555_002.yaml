title: Ultra-Pro High-Fidelity Securityd Memory Dumping (T1555.002)
id: 7cfc3314-933d-47ce-8741-d228dada9398
status: stable
description: |
    Detects unauthorized attempts to dump or read the memory of the 'securityd' process. 
    It focuses on non-standard debugger usage and memory mapping tools targeting 
    securityd, while strictly filtering Apple-signed diagnostic utilities.
author: hota05
date: 2026-02-04
tags:
    - attack.credential_access
    - attack.t1555.002
logsource:
    category: process_creation
    product: macos
detection:
    selection_target:
        CommandLine|contains:
            - 'securityd'
            - 'keychain.db'

    selection_methods:
        - Image|endswith:
            - '/lldb'         
            - '/gcore'        
            - '/vmmap'        
            - '/heap'         
        - CommandLine|contains:
            - 'attach'         
            - 'memory read'    
            - 'dump'
            - 'save'

    selection_untrusted_location:
        Image|contains:
            - '/Users/'
            - '/tmp/'
            - '/var/tmp/'
            - '/Library/Caches/'

    filter_apple_diagnostics:
        ParentImage|endswith:
            - '/usr/bin/sysdiagnose'
            - '/usr/libexec/periodic-wrapper'
            - '/System/Library/CoreServices/ReportCrash'
    
    filter_xcode_dev:
        ParentImage|contains: '/Applications/Xcode.app/'

    condition: selection_target and (selection_methods or selection_untrusted_location) and not filter_apple_diagnostics
level: critical
