title: Ultra-Pro High-Fidelity Indirect Command Execution (T1202)
id: 60c31408-b278-4028-b2e0-b496d29c3544
status: stable
description: |
    Detects the execution of binaries that can be used to proxy command execution. 
    Focuses on non-standard parent processes and specific command-line arguments 
    for pcalua.exe, conhost.exe, and forfiles.exe to minimize false positives.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1202
logsource:
    product: windows
    category: process_creation
detection:
    selection_pcalua:
        Image|endswith: '\pcalua.exe'
        CommandLine|contains: ' -a '
        CommandLine|contains:
            - '.exe'
            - '.ps1'
            - '.bat'
            - '.vbs'
            - '.dll'

    selection_forfiles:
        Image|endswith: '\forfiles.exe'
        CommandLine|contains:
            - ' /c '
            - ' -c '
        CommandLine|contains:
            - 'cmd'
            - 'powershell'
            - 'pwsh'
            - 'regsvr32'
            - 'mshta'
            - 'bitsadmin'

    selection_conhost:
        Image|endswith: '\conhost.exe'
        CommandLine|contains:
            - ' -- '
            - ' -e '

    selection_suspicious_origin:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\w3wp.exe'     
            - '\sqlservr.exe' 
            - '\php-cgi.exe'

    filter_trusted_system:
        - User: 'NT AUTHORITY\SYSTEM'
          ParentImage|endswith: 
            - '\services.exe'
            - '\msiexec.exe'
            - '\TiWorker.exe'
        - CommandLine|contains:
            - '\Windows\SoftwareDistribution\'
            - 'Program Files'
        - ParentImage|endswith: '\explorer.exe'

    condition: (selection_pcalua or selection_forfiles or selection_conhost) and (selection_suspicious_origin or not filter_trusted_system)
level: high
