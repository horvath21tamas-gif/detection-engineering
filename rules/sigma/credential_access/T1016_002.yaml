title: Terminal Services Configuration Discovery (T1016.002)
id: a674d3e6-2f53-48ba-8c41-52e7182b045a
status: stable
description: |
  Detects targeted discovery of Terminal Services and RDP configurations. 
  Focuses on non-standard process lineages (e.g., Office, Browsers) and 
  detects specific command-line switches used to identify hijackable sessions 
  or disabled security settings.
author: hota05
date: 2026-02-04
tags:
  - attack.discovery
  - attack.t1016.002

logsource:
  category: process_creation
  product: windows

detection:
  selection_tools:
    - Image|endswith:
        - '\query.exe'
        - '\qwinsta.exe'
        - '\quser.exe'
        - '\reg.exe'
        - '\sc.exe'
        - '\tasklist.exe'
    - CommandLine|contains:
        - 'qwinsta'
        - 'quser'
        - 'query user'
        - 'query session'

  selection_rdp_registry:
    CommandLine|contains:
      - 'Terminal Server\fDenyTSConnections'
      - 'Terminal Server\WinStations\RDP-Tcp'
      - 'UserConfig'
      - 'AllowRemoteRPC'

  selection_suspicious_lineage:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\httpd.exe'
      - '\wsmprovhost.exe'
    IntegrityLevel: 'Medium'

  selection_automation:
    CommandLine|contains:
      - ' > '
      - 'findstr'
      - 'ConvertTo-Json'

  filter_legit_noise:
    - username: 'NT AUTHORITY\SYSTEM'
    - ParentImage|endswith:
        - '\svchost.exe'
        - '\msiexec.exe'
        - '\CcmExec.exe'
    - CommandLine|contains:
        - 'Program Files'
        - 'Splunk'

  condition: >
    (selection_tools or selection_rdp_registry) and
    (selection_suspicious_lineage or selection_automation) and
    not filter_legit_noise

level: high
