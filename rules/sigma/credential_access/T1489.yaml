title: Ultra-Pro High-Fidelity Service Stop (T1489)
id: f8f66619-569f-485c-a13b-2aa1f68f8f08
status: stable
description: |
    Detects unauthorized stopping of critical system and security services 
    by monitoring service control tools originating from suspicious process 
    lineages or targeting high-value defense mechanisms (EDR, VSS, AV).
author: hota05
date: 2026-02-09
tags:
    - attack.impact
    - attack.t1489
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\sc.exe'
            - '\net.exe'
            - '\net1.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\taskkill.exe'

    selection_logic:
        CommandLine|contains:
            - 'stop'                  
            - 'Stop-Service'          
            - 'Set-Service'           
            - ' -f '                  
            - ' -im '                 

    selection_targets:
        CommandLine|contains:
            - 'WinDefend'             
            - 'MpsSvc'                
            - 'EventLog'              
            - 'VSS'                   
            - 'Sentinel'             
            - 'CrowdStrike'          
            - 'Sophos'                
            - 'SepMasterService'      
            - 'CylanceSvc'           
            - 'MeSvc'                 

    selection_context:
        - ParentImage|endswith:
            - '\winword.exe'          
            - '\excel.exe'
            - '\httpd.exe'           
            - '\chrome.exe'          
            - '\rundll32.exe'        
            - '\outlook.exe'
            - '\wscript.exe'
            - '\cscript.exe'
        - Image|contains:
            - '\Temp\'
            - '\Users\Public\'
            - '\AppData\Local\Temp\'

    filter_legit_mgmt:
        - username: 'NT AUTHORITY\SYSTEM' 
        - ParentImage|endswith:
            - '\CcmExec.exe'          
            - '\msiexec.exe'          
            - '\TiWorker.exe'        
        - CommandLine|contains:
            - 'Update'
            - 'HealthCheck'
            - 'Diagnostic'

    condition: selection_tools and selection_logic and selection_targets and selection_context and not filter_legit_mgmt
level: critical
