title: Ultra-Pro High-Fidelity Masquerade File Type via Interpreter Misuse (T1036.008)
id: ede64a6c-9ad4-4b71-bc41-8751bdfa0392
status: stable
description: |
    Detects mismatched file type execution where legitimate interpreters (wscript, cscript, powershell, regsvr32) 
    execute files with non-standard extensions (e.g., .jpg, .txt, .png). 
    Filters out system-level automation and focuses on untrusted user directories.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1036.008
logsource:
    product: windows
    category: process_creation
detection:
    selection_interpreters:
        - Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\regsvr32.exe'
            - '\mshta.exe'
            - '\rundll32.exe'

    selection_mismatched_ext:
        CommandLine|contains:
            - '.jpg'
            - '.jpeg'
            - '.png'
            - '.gif'
            - '.txt'
            - '.log'
            - '.pdf'
            - '.docx'
            - '.xlsx'
            - '.tmp'
            - '.ini'
            - '.dat'
            - '.cfg'

    selection_untrusted_path:
        CommandLine|contains:
            - '\Users\'
            - '\ProgramData\'
            - '\Temp\'
            - '\Windows\Temp\'
            - '\Downloads\'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\winrar.exe'
            - '\7zFM.exe'
            - '\explorer.exe'

    filter_trusted_apps:
        - User: 'NT AUTHORITY\SYSTEM'
          ParentImage|endswith: '\services.exe'
        - CommandLine|contains:
            - 'C:\Windows\ccmcache\'     
            - 'healthcheck.txt'
            - 'Telemetry'
        - ParentImage|endswith: '\msiexec.exe' 

    condition: (selection_interpreters and selection_mismatched_ext) and (selection_untrusted_path or selection_suspicious_parent) and not filter_trusted_apps
level: critical
