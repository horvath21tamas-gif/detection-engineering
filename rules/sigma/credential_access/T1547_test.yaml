title: Emelt Szintű Perzisztencia Detekció - T1547.001
id: 0fbb3ef9-009d-4c89-aadd-cc4c5d5f5220
status: stable
description: Érzékeli a gyanús automatikus indulási bejegyzéseket, kizárva a legitim rendszerfolyamatokat és fókuszálva a gyanús végrehajtókra.
author: hota05
date: 2026/01/30
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\Microsoft\Windows\CurrentVersion\Run\'
            - '\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\Microsoft\Windows\CurrentVersion\Winlogon\Shell'
    
    # 1. Gyanús fájlformátumok az értékben
    selection_payload:
        Details|contains:
            - '.vbs'
            - '.ps1'
            - '.bat'
            - '.cmd'
            - 'javascript:'
            - 'powershell'
            - 'regsvr32'
            - 'rundll32'
            - 'cscript'
            - 'wscript'
            - 'AppData\'
            - 'C:\Windows\Temp\'

    # 2. Gyanús forrásfolyamatok (LOLBINS vagy nem tipikus admin eszközök)
    selection_source_process:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\bitsadmin.exe'
            - '\certutil.exe'

    # 3. Legitim folyamatok kizárása (Zajcsökkentés)
    filter_legit_source:
        Image|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
        Image|endswith:
            - '\msiexec.exe'
            - '\trustedinstaller.exe'
            - '\setup.exe'
            - '\update.exe'

    condition: selection_registry and (selection_payload or selection_source_process) and not filter_legit_source
fields:
    - ComputerName
    - User
    - Image
    - TargetObject
    - Details
falsepositives:
    - Speciális vállalati szoftverek, amelyek scriptből települnek.
    - Rosszul megírt, de legitim updater folyamatok.
level: high
