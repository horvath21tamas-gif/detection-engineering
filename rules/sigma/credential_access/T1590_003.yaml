title: Advanced Network Trust Dependencies Reconnaissance - T1590.003
id: b7ac6a83-0cbb-4320-8033-c4ad9d9b9242
status: stable
description: >
  Detects systematic discovery of network trust relationships and shared resources. 
  It minimizes noise by filtering standard GPO-driven drive mappings and focused 
  on high-intent enumeration commands like nltest domain trusts and remote session listing.
author: SOC Engineering
date: 2026/01/27
references:
  - https://attack.mitre.org/techniques/T1590/003/
tags:
  - attack.reconnaissance
  - attack.t1590.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_high_intent:
    - Image|endswith: '\nltest.exe'
      CommandLine|contains:
        - '/domain_trusts'
        - '/all_trusts'
        - '/dclist:'
    - Image|endswith: '\netdom.exe'
      CommandLine|contains: ' trust '

  selection_shares_manual:
    - Image|endswith: 
        - '\net.exe'
        - '\net1.exe'
      CommandLine|contains:
        - ' share'    
        - ' session'  
        - ' view /'   

  selection_powershell_recon:
    CommandLine|contains:
      - 'Get-NetDomainTrust'
      - 'Get-NetForestTrust'
      - 'Get-AdTrust'
      - 'Get-NetSession'

  filter_automation_mapping:
    CommandLine|contains:
      - 'use '
    ParentImage|endswith:
      - '\userinit.exe'
      - '\gpresult.exe'
      - '\gpscript.exe'

  filter_system_noise:
    username: 'NT AUTHORITY\SYSTEM'
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'

  filter_admin_tools:
    Image|contains:
      - '\AdminArsenal\'
      - '\SCCM\'

  condition: (selection_high_intent or selection_shares_manual or selection_powershell_recon) and not filter_automation_mapping and not filter_system_noise and not filter_admin_tools
falsepositives:
  - System administrators auditing domain trusts.
  - Legacy login scripts mapping drives on old workstations.
  - Automated security assessment tools (authorized).
level: high
