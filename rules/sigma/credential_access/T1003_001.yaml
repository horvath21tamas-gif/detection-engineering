title: Suspicious Access to LSASS Process Memory
id: ab19ed96-a870-43c9-a05c-5d85254852c7
status: stable
description: >
  Észleli a gyanús hozzáférést az LSASS folyamat memóriájához, ami hitelesítő adatok ellopására (Credential Dumping) utalhat. 
  A szabály figyeli a gyanús GrantedAccess maszkokat és szűri a gyakori legális folyamatokat.
author: hota05
date: 2026/01/21
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://docs.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
tags:
  - attack.credential_access
  - attack.t1003.001

logsource:
  product: windows
  category: process_access

detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x10'     
      - '0x1410'   
      - '0x1010'   
      - '0x1fffff' 
      - '0x1438'   

  filter_legit_images:
    SourceImage|endswith:
      - '\CcmExec.exe'
      - '\MsMpEng.exe'
      - '\mcafee.exe'
      - '\sentinelone.exe'
      - '\csagent.exe' 
      - '\taniumclient.exe'
      - '\taskmgr.exe' 
    
  filter_calltrace:
    CallTrace|contains:
      - 'C:\Windows\System32\ntdll.dll+'
      - 'C:\Windows\System32\kernelbase.dll+'

  condition: selection and not (filter_legit_images or filter_calltrace)

falsepositives:
  - Antivírus szoftverek és EDR ügynökök mélyvizsgálata
  - Rendszerfelügyeleti eszközök (pl. SCCM, Tanium)
  - Debuggerek használata jogosult adminisztrátorok által

level: high
