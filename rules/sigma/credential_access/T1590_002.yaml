title: Advanced DNS Infrastructure Reconnaissance - T1590.002
id: 56fa5707-f931-4902-bf11-1602ca2d58cf
status: stable
description: >
  Detects systematic DNS reconnaissance. It reduces false positives by filtering 
  legitimate single-host lookups and focusing on infrastructure-wide enumeration 
  attempts like Zone Transfers or specific record harvesting.
author: SOC Engineering
date: 2026/01/27
references:
  - https://attack.mitre.org/techniques/T1590/002/
tags:
  - attack.reconnaissance
  - attack.t1590.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_recon_args:
    CommandLine|contains:
      - ' -type=AXFR'      
      - ' -query=AXFR'
      - ' -type=ANY'       
      - ' -type=SOA'       
      - ' -type=TXT'       
      - 'ls -d'           
      - ' -q=srv'          

  selection_tools:
    Image|endswith:
      - '\dig.exe'
      - '\host.exe'
      - '\dnscmd.exe'
    CommandLine|contains:
      - ' /enumzones'      
      - ' /zoneprint'

  filter_normal_usage:
    CommandLine|contains:
      - 'nslookup.exe'
    CommandLine|length: < 25 

  filter_admin_scripts:
    User|contains:
      - 'svc_monitoring'
      - 'AD_Sync_Account'

  condition: (selection_recon_args or selection_tools) and not filter_normal_usage and not filter_admin_scripts
falsepositives:
  - High-level network troubleshooting by Domain Admins
  - Automated IT inventory or audit scripts
level: high
