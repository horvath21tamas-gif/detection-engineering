title: Admin Share Data Exfiltration (T1602.001)
id: 3db12b0d-3ccc-4f84-b7e5-614c127ed4d4
status: stable
description: |
    Detects high-fidelity indicators of data staging and exfiltration via administrative shares
    (C$, ADMIN$, IPC$, print$). Focuses on anomalous process lineages (web servers, shells),
    recursive discovery, and high-value file targeting combined with archival or transfer tools.
    Filters legitimate backup, migration, and IT automation tools to reduce false positives.
author: hota05 
date: 2026-02-11
tags:
    - attack.collection
    - attack.lateral_movement
    - attack.t1602.001
    - attack.t1021.002

logsource:
    product: windows
    category: process_creation

detection:

  selection_shares:
    CommandLine|contains:
      - '\\C$\'
      - '\\ADMIN$\'
      - '\\IPC$\'
      - '\\print$\'
      - '\\fax$\'
      - 'net use'
      - 'New-PSDrive'

  selection_high_value_files:
    CommandLine|contains:
      - '.zip'
      - '.7z'
      - '.rar'
      - '.docx'
      - '.xlsx'
      - '.kdbx'
      - '.pst'
      - 'lsass'
      - 'ntds.dit'

  selection_tools:
    Image|endswith:
      - '\robocopy.exe'
      - '\xcopy.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\7z.exe'
      - '\rar.exe'
    CommandLine|contains:
      - 'Compress-Archive'
      - ' /s '   # recursive
      - ' /e '   # robocopy recursive

  selection_suspicious_paths:
    CommandLine|contains:
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'
      - '\PerfLogs\'
      - ':\$Recycle.Bin\'

  selection_recon:
    CommandLine|contains:
      - 'dir /s'
      - 'ls -Recurse'
      - 'findstr'
      - 'select-string'
      - 'grep'
      - ' /s '
      - ' /e '   

  selection_anomalous_parents:
    ParentImage|endswith:
      - '\w3wp.exe'      
      - '\httpd.exe'
      - '\nginx.exe'
      - '\sqlservr.exe'
      - '\scrcons.exe'   
      - '\winword.exe'
      - '\excel.exe'
    IntegrityLevel: 'Medium'

  filter_legit_processes:
    Image|contains:
      - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
      - 'C:\Windows\CCM\CcmExec.exe'
      - 'C:\Program Files\Veeam\'
      - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    CommandLine|contains:
      - 'SoftwareDistribution'
      - 'CCMCACHE'

  filter_system_user:
    username: 'NT AUTHORITY\SYSTEM'

  condition: selection_shares and (
                selection_high_value_files
                or selection_tools
                or selection_suspicious_paths
                or selection_recon
                or selection_anomalous_parents
             ) and not (filter_legit_processes or filter_system_user)

fields:
  - CommandLine
  - ParentImage
  - User

falsepositives:
  - IT Admin scripts using Robocopy / PowerShell for migrations
  - Backup software (Veeam, Commvault)
  - Scheduled system scans or maintenance
  - Security monitoring scripts

level: critical
