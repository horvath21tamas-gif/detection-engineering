title: Ultra-Pro IFEO Debugger Hijacking Detection (T1546.012)
id: fb0a0e0f-d01b-4e9c-8809-765fe12c1d21
status: stable
description: |
    Detects unauthorized Debugger injection via Image File Execution Options (IFEO). 
    Filters out legitimate developer tools and focuses on high-risk system binaries 
    and accessibility features (Sticky Keys, Utility Manager).
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1546/012/
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1546.012
logsource:
    category: registry_event
    product: windows
detection:
    selection_registry:
        TargetObject|contains: 'Microsoft\Windows NT\CurrentVersion\Image File Execution Options\'
        TargetObject|endswith: '\Debugger'

    selection_critical_targets:
        TargetObject|contains:
            - '\utilman.exe'
            - '\sethc.exe'
            - '\osk.exe'
            - '\magnify.exe'
            - '\DisplaySwitch.exe'
            - '\AtBroker.exe'
            - '\taskmgr.exe'
            - '\lsass.exe'
            - '\svchost.exe'
            - '\csrss.exe'

    selection_suspicious_payloads:
        - Details|contains:
            - 'cmd.exe'
            - 'powershell'
            - 'pwsh'
            - 'cscript'
            - 'wscript'
            - 'mshta'
            - 'regsvr32'
        - Details|contains:
            - '\Users\'
            - '\ProgramData\'
            - '\Windows\Temp\'

    filter_trusted_debuggers:
        Image|contains:
            - '\Microsoft Visual Studio\'
            - '\Windows Kits\'
            - '\Common Files\Microsoft Shared\Windows Error Reporting\'
        Image|endswith:
            - '\trustedinstaller.exe'
            - '\msiexec.exe'
            - '\TiWorker.exe'

    filter_known_apps:
        TargetObject|contains:
            - '\Google\Update\'
            - '\Microsoft\EdgeUpdate\'

    condition: selection_registry and (selection_critical_targets or selection_suspicious_payloads) and not (filter_trusted_debuggers or filter_known_apps)
level: critical
