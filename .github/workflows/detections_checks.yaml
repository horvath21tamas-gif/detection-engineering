name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml sigma-cli
          sigma plugin install splunk
          sigma plugin install sysmon
          sigma plugin install windows

      # 1. LÉPÉS: OKOS ELLENŐRZÉS (Ha ez elbukik, a többi nem fut le)
      - name: Smart Validation with Suggestions
        run: |
          python tools/validate_metadata.py

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          # Csak akkor fut le, ha a validate_metadata.py sikeres volt
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek."

      - name: Convert Sigma rules to Splunk (.spl files)
        run: |
          mkdir -p rules/splunk
          rm -f rules/splunk/*.spl
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            sigma convert -t splunk -p sysmon "$file" -o "rules/splunk/${filename}.spl"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # A legfrissebb fájlok hozzáadása (README, COVERAGE, JSON, SVG, SPLUNK)
          git add README.md COVERAGE.md attack_navigator_layer.json mitre_matrix.svg rules/splunk/*.spl
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard, Coverage Map and Splunk rules"
            git pull --rebase origin test
            git push origin test
          else
            echo "Nincs változás, nem kell commitolni."
          fi
