title: High-Fidelity Open Technical Database Reconnaissance - T1596
id: 7e8ea06c-4700-4a50-a1ac-afa3503caaa0
status: stable
description: >
  Detects the systematic use of CLI tools and script-based API queries directed 
  at technical databases like Shodan, Censys, and VirusTotal. 
  Focuses on non-browser process chains and automated data extraction patterns.
author: hota05
date: 2026/01/27
references:
  - https://attack.mitre.org/techniques/T1596/
tags:
  - attack.reconnaissance
  - attack.t1596
logsource:
  category: process_creation
  product: windows
detection:
  selection_specialized_tools:
    - Image|endswith:
        - '\shodan.exe'
        - '\censys.exe'
        - '\amass.exe'
        - '\masscan.exe'
    - CommandLine|contains:
        - 'search --fields'    
        - 'host --facets'
        - 'view --snmp'        
        - 'crt.sh'

  selection_api_interaction:
    - Image|endswith:
        - '\curl.exe'
        - '\wget.exe'
        - '\python.exe'
        - '\pwsh.exe'
    - CommandLine|contains:
        - 'api.shodan.io'
        - 'api.censys.io'
        - 'api.virustotal.com'
        - 'otx.alienvault.com'
        - 'api.binaryedge.io'

  filter_security_products:
    User: 
      - 'NT AUTHORITY\SYSTEM'
      - 'NT AUTHORITY\NETWORK SERVICE'
    Image|contains:
      - '\SentinelOne\'
      - '\CrowdStrike\'
      - '\Microsoft Security Client\'

  filter_dev_context:
    ParentImage|endswith:
      - '\code.exe'       
      - '\java.exe'       
    CommandLine|contains:
      - '--config'
      - '--verify'

  filter_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'

  condition: (selection_specialized_tools or selection_api_interaction) and not filter_security_products and not filter_dev_context and not filter_browsers
falsepositives:
  - Authorized vulnerability assessments.
  - Threat hunters performing manual investigations.
  - Automated cloud asset inventory scripts.
level: high
