title: Parent PID Spoofing & Process Tree Violation (T1134.004)
id: 8928ef14-2dac-4146-9a36-aae418aad287
status: stable
description: |
    Detects Parent PID spoofing and process tree violations by monitoring:
      - Critical system processes (LSASS, CSRSS, Spooler) spawning shells or interpreters
      - User-level processes spawning unusual system utilities
      - Filters trusted Windows behavior and legitimate WMI/scheduled task activity

author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1134.004

logsource:
    product: windows
    category: process_creation

detection:
    selection_impossible_parent:
        ParentImage|re|i: '(lsass\.exe|lsm\.exe|csrss\.exe|wininit\.exe|smss\.exe|spoolsv\.exe)$'
        Image|re|i: '(cmd\.exe|powershell\.exe|pwsh\.exe|wscript\.exe|cscript\.exe|sh\.exe|bash\.exe|scrcons\.exe)$'

    selection_suspicious_context:
        ParentImage|re|i: '(chrome\.exe|msedge\.exe|winword\.exe|excel\.exe)$'
        Image|re|i: '(whoami\.exe|nltest\.exe|net\.exe|net1\.exe|ipconfig\.exe)$'

    filter_trusted_windows:
        - Image|re|i: '(WerFault\.exe|conhost\.exe|csc\.exe)$'
        - ParentCommandLine|re|i: 'svchost\.exe -k'
        - User: 'NT AUTHORITY\\SYSTEM'

    filter_wmi_sched:
        ParentImage|re|i: '(wmiprvse\.exe|taskhostw\.exe|svchost\.exe)$'

    condition: (selection_impossible_parent or selection_suspicious_context) and not (filter_trusted_windows or filter_wmi_sched)

level: critical
