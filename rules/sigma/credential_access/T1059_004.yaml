title: High-Fidelity Unix Shell Abuse and Reverse Shell Detection
id: 11adfa8a-54d3-4fa0-b0fb-7eeb09cee4b6
status: stable
description: |
    Detects suspicious Unix shell execution by monitoring for command injection 
    from web processes, reverse shell socket redirection, and fileless pipe-to-shell patterns.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1059/004/
    - https://gtfobins.github.io/
tags:
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_shells:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/zsh'
            - '/dash'

    selection_web_rce:
        ParentImage|endswith:
            - '/httpd'
            - '/apache2'
            - '/nginx'
            - '/php-fpm'
            - '/node'
            - '/python' 
            - '/java'
        username:
            - 'www-data'
            - 'apache'
            - 'nginx'
            - 'nobody'

    selection_attack_logic:
        - CommandLine|contains:
            - '/dev/tcp/'
            - '/dev/udp/'
            - '>&'
            - '0>&1'
        - CommandLine|contains|all:
            - 'curl'
            - '|'
            - 'sh'
        - CommandLine|contains|all:
            - 'wget'
            - '|'
            - 'bash'

    filter_legit_automation:
        - ParentImage|endswith: 
            - '/systemd'
            - '/sbin/init'
        - CommandLine|contains:
            - '/var/lib/apt/'
            - 'logrotate'
            - '/usr/bin/mandb'
        - username: 'root'
          Parentprocessname: '/usr/sbin/sshd' 

    condition: selection_shells and (selection_web_rce or selection_attack_logic) and not filter_legit_automation
level: critical
