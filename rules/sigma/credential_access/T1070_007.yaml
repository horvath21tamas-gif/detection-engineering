title: Network History and RDP Trace Removal (T1070.007)
id: 5f42e70e-5f13-4128-a952-d6192be29631
status: stable
description: |
  Detects targeted attempts to clear network connection history, focusing on RDP
  Terminal Server Client MRU lists, network share metadata removal, and DNS cache
  flushes from suspicious process chains. Filters out common administrative
  and helpdesk actions unless part of broader attack activity.
author: hota05
date: 2026-02-03
tags:
  - attack.defense_evasion
  - attack.t1070.007
logsource:
  product: windows
  category: process_creation
detection:
  selection_rdp_registry_wipe:
    CommandLine|contains:
      - 'reg'
      - 'delete'
  selection_rdp_registry_wipe_and2:
    CommandLine|contains:
      - '\Software\Microsoft\Terminal Server Client\Default'
      - '\Software\Microsoft\Terminal Server Client\Servers'
      - 'MRU0'

  selection_net_share_wipe:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains:
      - 'use'
      - '/delete'
  selection_net_share_wipe_and2:
    CommandLine|contains:
      - '*'
      - ' /y'

  selection_dns_flush:
    CommandLine|contains: 'ipconfig /flushdns'

  selection_suspicious_chain:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\chrome.exe'
      - '\powershell.exe'
      - '\mshta.exe'

  filter_trusted_admin_behavior:
    - User: 'NT AUTHORITY\SYSTEM'
      ParentImage|endswith: '\services.exe'
    - ParentImage|endswith: '\msiexec.exe'
    - CommandLine|contains:
        - 'AppData\Local\Temp\SDI'
        - 'SystemReset.exe'

  condition: 
    ((selection_rdp_registry_wipe and selection_rdp_registry_wipe_and2) 
     or (selection_net_share_wipe and selection_net_share_wipe_and2) 
     or (selection_dns_flush and selection_suspicious_chain))
    and not filter_trusted_admin_behavior
level: high
