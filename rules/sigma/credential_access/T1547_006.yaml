title: High-Fidelity Kernel Driver Registration (T1547.006)
id: 0b906425-56fe-4af1-b0a1-cf5680a315b5
status: stable
description: |
    Detects the registration of a new kernel-mode driver service.
    Attackers use this for rootkit-level persistence and to disable security tools.
    Optimized to flag drivers in non-standard paths and suspicious manual service creation.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1547/006/
tags:
    - attack.persistence
    - attack.t1547.006
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains: 'System\CurrentControlSet\Services\'
        TargetObject|endswith: '\ImagePath'

    selection_extension:
        Details|endswith: '.sys'

    selection_suspicious_paths:
        Details|contains:
            - ':\Users\'
            - ':\Temp\'
            - ':\Windows\Temp\'
            - ':\ProgramData\'
            - 'C:\PerfLogs\'
            - '\\' 

    filter_trusted_installer:
        Image|endswith:
            - '\trustedinstaller.exe'
            - '\System32\msiexec.exe'
            - '\System32\DriverStore\FileRepository\'

    filter_standard_location:
        Details|contains: 'System32\drivers\'
    
    selection_suspicious_parent:
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\reg.exe'
            - '\sc.exe'

    condition: selection_registry and selection_extension and (selection_suspicious_paths or selection_suspicious_parent) and not filter_trusted_installer
level: critical
