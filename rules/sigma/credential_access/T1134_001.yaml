title: Token Impersonation via LSASS Handle Duplication (T1134.001)
id: f8840dd1-a36d-4247-b8db-677fea4eabb1
status: stable
description: |
    Detects token theft via suspicious handle duplication targeting LSASS.exe.
    High-fidelity detection by filtering:
      - Known legitimate system processes
      - Security agents
      - Normal administrative activity

author: hota05
date: 2026-02-02
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1134.001

logsource:
    product: windows
    service: sysmon

detection:
    selection_target:
        TargetImage|re|i: '(lsaccess\.exe|lsass\.exe)$'

    selection_access_mask:
        GrantedAccess|re|i: '(0x1438|0x143a|0x1038)'

    selection_source:
        SourceImage|re|i: '(\\Temp\\|\\Users\\Public\\|\\AppData\\|cmd\.exe|powershell\.exe|wscript\.exe|cscript\.exe|rundll32\.exe)$'

    filter_trusted_apps:
        SourceImage|re|i: '(MsMpEng\.exe|Cyserver\.exe|wininit\.exe|services\.exe|csrss\.exe|GoogleUpdate\.exe)$'
        SourceUserName: 'NT AUTHORITY\\SYSTEM'

    filter_callstack:
        CallTrace|contains: 'unknown'

    condition: selection_target and selection_access_mask and selection_source and not filter_trusted_apps

level: critical
