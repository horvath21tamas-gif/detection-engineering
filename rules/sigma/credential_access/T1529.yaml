title: Unauthorized System Shutdown/Reboot Detection (T1529)
id: a89019a5-4c13-4893-986a-448e46d95435
status: stable
description: |
    Detects unauthorized or suspicious system shutdown or reboot commands.
    Monitors forced shutdowns or reboots originating from untrusted process lineages 
    (browsers, Office apps, scripts, temp folders) and filters legitimate system 
    automation, administrative, or health check tasks.

author: hota05 
date: 2026-02-16
references:
    - https://attack.mitre.org/techniques/T1529/
tags:
    - attack.impact
    - attack.t1529
    - attack.execution
    - attack.persistence

logsource:
    category: process_creation
    product: windows

detection:

    selection_shutdown_tools:
        Image|endswith:
            - '\shutdown.exe'
            - '\init.exe'
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_shutdown_commands:
        CommandLine|contains:
            - 'Stop-Computer'
            - 'Restart-Computer'
            - 'shutdown'
            - 'reboot'
    selection_shutdown_commands_and2:
        CommandLine|contains:
            - ' /f'
            - ' /t 0'
    selection_shutdown_commands_and3:
        CommandLine|contains:
            - ' /a'  # abort flag

    selection_suspicious_context:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\powerpoint.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\httpd.exe'
            - '\rundll32.exe'
            - '\wscript.exe'
            - '\cscript.exe'
        Image|contains:
            - '\Temp\'
            - '\Users\Public\'
            - '\AppData\Local\Temp\'

    filter_legit_system_automation:
        User: 'NT AUTHORITY\SYSTEM'
        ParentImage|endswith:
            - '\CcmExec.exe'
            - '\TiWorker.exe'
            - '\msiexec.exe'
            - '\svchost.exe'
            - '\Sppsvc.exe'
        CommandLine|contains:
            - 'HealthCheck'
            - 'Diagnostic'
            - 'AzureAD'
            - 'Update'
            - 'Patch'

    condition: 
        selection_shutdown_tools 
        and (selection_shutdown_commands and selection_shutdown_commands_and2 and selection_shutdown_commands_and3) 
        and selection_suspicious_context 
        and not filter_legit_system_automation

falsepositives:
    - Windows Update or patching operations
    - IT admins running health check or diagnostic scripts
    - Legitimate automation tasks triggered by SCCM, TiWorker, or AzureAD agents

level: critical
