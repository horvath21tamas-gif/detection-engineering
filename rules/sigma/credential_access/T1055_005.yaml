title: TLS Injection Detection (ATT&CK T1055.005)
id: aae72238-f20f-4f1b-94e8-3876df018ec3
status: stable
description: >
  Detects TLS injection by monitoring cross-process memory 
  manipulation targeting PE headers, where the execution flow originates 
  from unbacked memory regions (shellcode), while filtering out trusted system processes.
author: hota05 
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1055/005/
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055.005
  - attack.host

logsource:
  product: windows
  category: process_access

detection:
  selection_access_mask:
    GrantedAccess|contains:
      - '0x1410'    
      - '0x1411'    
      - '0x1438'    
      - '0x1F1FFF' 

  selection_unbacked_calltrace:
    CallTrace|contains: 'unknown'

  selection_gui_targets:
    TargetImage|endswith:
      - '\explorer.exe'
      - '\svchost.exe'
      - '\lsass.exe'
      - '\winlogon.exe'

  selection_suspicious_source:
    SourceImage|contains:
      - '\Users\'
      - '\Temp\'
      - '\AppData\'

  filter_trusted:
    - SourceImage: 'C:\Windows\System32\csrss.exe'
    - SourceImage|endswith:
        - '\MsMpEng.exe'
        - '\CcmExec.exe'
    - CallTrace|contains:
        - 'ntdll.dll+LdrpWorkItem'
        - 'ntdll.dll+LdrpInitializeProcess'
    - condition: selection_source_equals_target

  condition: selection_access_mask 
             and selection_unbacked_calltrace 
             and selection_gui_targets 
             and not filter_trusted

falsepositives:
  - Legitimate system or security processes performing memory operations
  - Rare software that legitimately manipulates PE headers in protected processes

level: critical
