title: High-Fidelity Logon Script Persistence (T1037)
id: 7f86dab5-00d6-4581-a8ab-f62de9f6d5ba
status: stable
description: |
    Detects the creation or modification of logon scripts in the registry (UserInitMprLogonScript).
    Attackers use this to bypass GPO-based logon scripts and execute malicious code at every logon.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1037/001/
tags:
    - attack.persistence
    - attack.t1037
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains: '\Environment\UserInitMprLogonScript'

    selection_suspicious_payload:
        Details|contains:
            - 'powershell'
            - 'pwsh'
            - 'cmd.exe'
            - 'mshta'
            - 'cscript'
            - 'wscript'
            - 'rundll32'
            - 'regsvr32'
            - 'bitsadmin'
            - 'certutil'

    selection_suspicious_paths:
        Details|contains:
            - ':\Users\'
            - ':\ProgramData\'
            - ':\Temp\'
            - ':\Windows\Temp\'
            - 'AppData\'
            - 'C:\PerfLogs\'

    filter_trusted_locations:
        Details|contains:
            - '\\NETLOGON\'
            - '\Scripts\Logon'
        Details|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Program Files\'

    filter_trusted_writers:
        Image|endswith:
            - '\System32\gpupdate.exe'
            - '\System32\reg.exe'
            - '\trustedinstaller.exe'

    condition: selection_registry and (selection_suspicious_payload or selection_suspicious_paths) and not (filter_trusted_locations or filter_trusted_writers)
level: critical
