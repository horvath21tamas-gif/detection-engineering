title: Ultra-Pro High-Fidelity macOS Plist Persistence Modification (T1647)
id: 717edd63-0e4b-45b9-a246-f5c948c1afda
status: stable
description: |
    Detects suspicious modifications of macOS Property List (.plist) files using CLI tools. 
    Focuses on persistence-related keys (LaunchAgents/LaunchDaemons) and filters out 
    legitimate system update processes.
author: hota05
date: 2026-02-03
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1647
logsource:
    product: macos
    category: process_creation
detection:
    selection_tools:
        Image|endswith:
            - '/PlistBuddy'
            - '/defaults'
            - '/plutil'

    selection_persistence_keys:
        CommandLine|contains:
            - 'RunAtLoad'
            - 'ProgramArguments'
            - 'StartCalendarInterval'
            - 'KeepAlive'
            - 'Label'
            - 'LaunchEvents'

    selection_sensitive_paths:
        CommandLine|contains:
            - '/LaunchAgents'
            - '/LaunchDaemons'
            - '/Preferences/com.apple.loginitems.plist'
            - '/Library/StartupItems'

    selection_suspicious_parents:
        ParentImage|contains:
            - '/Safari.app/'
            - '/Google Chrome.app/'
            - '/Microsoft Word.app/'
            - '/Terminal.app/'
            - '/iTerm.app/'

    filter_apple_legit:
        Image|startswith:
            - '/usr/sbin/softwareupdate'
            - '/System/Library/PrivateFrameworks/'
        ParentImage|startswith:
            - '/System/Library/CoreServices/'
            - '/usr/libexec/xpcproxy'

    condition: selection_tools and (selection_persistence_keys or selection_sensitive_paths) and (selection_suspicious_parents or not filter_apple_legit)
level: high
