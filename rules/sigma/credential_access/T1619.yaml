title: High-Fidelity Cloud Storage Object Discovery Detection
id: ad23f9dc-59e1-48b3-a671-493458eb45d2
status: stable
description: >
  Detects systematic cloud storage object discovery in AWS S3, Azure Blobs, 
  and Google Cloud Storage by monitoring recursive listing, metadata-heavy 
  API calls, and anomalous output redirection. Filters high-trust backup, 
  ETL, and DevOps automation accounts.

author: hota05 
date: 2026-02-04
modified: 2026-02-11
references:
  - https://attack.mitre.org/techniques/T1619/
tags:
  - attack.discovery
  - attack.t1619
  - attack.cloud

logsource:
  category: process_creation
  product: windows

detection:

  selection_cloud_cli:
    Image|endswith:
      - '\aws.exe'
      - '\az.cmd'
      - '\gcloud.cmd'
      - '\gsutil.py'
      - '\rclone.exe'

  selection_object_discovery:
    CommandLine|contains:
      - 's3 ls'
      - 's3api list-objects'
      - 's3api list-object-versions'
      - 'storage blob list'
      - 'storage container list'
      - 'storage ls'
      - 'storage objects list'
      - 'ls -R'                 

  selection_output_patterns:
    CommandLine|contains:
      - '--recursive'
      - '--query'
      - '--output json'
      - ' | jq'
      - ' > '
      - '| Out-File'
      - 'base64'

  selection_interactive_or_remote_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wsmprovhost.exe'
      - '\httpd.exe'
      - '\taskeng.exe'

  selection_temp_or_user_paths:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Temp\'
      - '\ProgramData\'

  filter_legit_automation:
    ParentImage|contains:
      - '\Veeam\'
      - '\Commvault\'
      - '\terraform.exe'
      - '\azcopy.exe'
      - '\rclone.exe'
    User|startswith:
      - 'NT AUTHORITY\'
      - 'SYSTEM'
      - 'svc-backup'
      - 'svc-automation'

  filter_cloud_admins:
    User|contains:
      - 'cloudadmin'
      - 'svc-cloudops'
      - 'svc-storage'

  condition:
    selection_cloud_cli
    and selection_object_discovery
    and (selection_output_patterns or selection_interactive_or_remote_parent or selection_temp_or_user_paths)
    and not filter_legit_automation
    and not filter_cloud_admins

falsepositives:
  - Automated backup jobs (Veeam, Commvault)
  - Terraform / CI/CD scripts listing cloud objects
  - Rclone sync operations by system accounts
  - Cloud administrators performing inventory/listing

level: high
