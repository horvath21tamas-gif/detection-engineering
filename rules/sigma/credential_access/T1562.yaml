title: Biztonsági szolgáltatások gyanús leállítása
id: 2db4d43e-eeec-4bc7-956a-b697622c73ae
status: stable
description: >
  Észleli a kritikus biztonsági szolgáltatások (Antivírus, EDR, Tűzfal) leállítására irányuló kísérleteket 
  olyan eszközökkel, mint a net.exe, sc.exe vagy PowerShell. Ez a védelem kiiktatására irányuló támadói tevékenység.
author: hota05
date: 2026/01/21
references:
  - https://attack.mitre.org/techniques/T1562/001/
tags:
  - attack.defense_evasion
  - attack.t1562.001

logsource:
  product: windows
  category: process_creation

detection:
  selection_tools:
    - Image|endswith:
        - '\net.exe'
        - '\net1.exe'
        - '\sc.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
        - '\taskkill.exe'
    - OriginalFileName:
        - 'net.exe'
        - 'net1.exe'
        - 'sc.exe'
        - 'PowerShell.EXE'
        - 'taskkill.exe'

  selection_commands:
    CommandLine|contains:
      - 'stop'
      - 'delete'
      - 'disable'
      - 'kill'
      - '/F' 

  selection_targets:
    CommandLine|contains:
      - 'WinDefend'       
      - 'MpsSvc'          
      - 'Sense'            
      - 'MsSense'
      - 'SentinelAgent'    
      - 'CarbonBlack'     
      - 'CylanceSvc'       
      - 'CrowdStrike'      
      - 'Symantec'         
      - 'Sophos'           
      - 'McAfee'           

  condition: selection_tools and selection_commands and selection_targets and not filter_legit

  filter_legit:
    ParentImage|endswith:
      - '\CcmExec.exe'    
      - '\Gpscript.exe'    

falsepositives:
  - Rendszergazdák által végzett hibaelhárítás vagy szoftvercsere
  - Biztonsági ügynökök frissítése (néha leállítják és újraindítják magukat)

level: critical
