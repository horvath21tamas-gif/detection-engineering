title: High-Fidelity COM Hijacking Persistence (T1547.012)
id: b10caab6-33a1-4803-910c-13fbea5b7268
status: stable
description: |
    Detects the creation of COM object handlers in HKCU that point to suspicious locations.
    Focuses on InprocServer32 and LocalServer32 keys, which are primary targets for hijacking.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1547/012/
tags:
    - attack.persistence
    - attack.t1547.012
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains: 'Classes\CLSID\'
        TargetObject|endswith: 
            - '\InprocServer32\(Default)'
            - '\LocalServer32\(Default)'

    selection_suspicious_paths:
        Details|contains:
            - ':\Users\'
            - ':\ProgramData\'
            - ':\Windows\Temp\'
            - ':\Temp\'
            - '.tmp'
            - '.bat'
            - '.ps1'

    selection_lolbin_artifacts:
        Details|contains:
            - 'scrobj.dll'  
            - 'comsvcs.dll' 
            - 'script:'     

    filter_trusted_apps:
        Image|endswith:
            - '\Microsoft\OneDrive\OneDrive.exe'
            - '\Microsoft\Teams\current\Teams.exe'
            - '\Office16\OUTLOOK.EXE'
            - '\System32\msiexec.exe'
            - '\trustedinstaller.exe'
        Details|contains:
            - '\AppData\Local\Microsoft\OneDrive\'
            - '\AppData\Local\Microsoft\Teams\'
            - '\AppData\Local\Microsoft\Office\'

    condition: selection_registry and (selection_suspicious_path or selection_lolbin_artifacts) and not filter_trusted_apps
level: high
