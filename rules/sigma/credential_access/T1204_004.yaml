title: Adathalászat rosszindulatú linken keresztül, domain és feladó rendellenességekkel
id: 8f3d9e42-5c41-4a61-9a2b-9a1e8d2e4b91
status: stable
description: |
    Észleli a rosszindulatú linkeket tartalmazó adathalász e-maileket URL-rövidítők, újonnan regisztrált domainek és feladó spoofing alapján.
author: SOC Team
date: 2026/01/26
references:
    - https://attack.mitre.org/techniques/T1204/004/
tags:
    - attack.initial_access
    - attack.t1204.004
logsource:
    category: email
    product: windows
detection:
    suspicious_url_shortener:
        url|contains:
            - 'bit.ly/'
            - 'tinyurl.com/'
            - 't.co/'
            - 'rebrand.ly/'
            - 'is.gd/'
            - 'cutt.ly/'

    suspicious_domain_characteristics:
        # A '|lt' (less than) operátor előtt győződj meg róla, hogy a SIEM-ed támogatja ezt a mezőt!
        url_domain_age|lt: 30
        url_reputation: 'low'

    html_email_with_link:
        email_content_type|contains: 'text/html'
        # Az 'url|exists: true' helyett biztosabb a kiterjesztett keresés
        url|re: '.+' 

    sender_displayname_spoofing:
        sender_display_name|contains:
            - 'Microsoft'
            - 'Office 365'
            - 'OneDrive'
            - 'DocuSign'
            - 'PayPal'
            - 'Bank'
        # A kizárásokat külön szelekcióba tesszük a tisztább logika miatt
    legit_sender_domains:
        sender_domain|contains:
            - 'microsoft.com'
            - 'office.com'
            - 'docusign.com'
            - 'paypal.com'

    trusted_domain_filter:
        url|contains:
            - 'microsoft.com'
            - 'google.com'
            - 'amazon.com'
            - 'github.com'
            - 'linkedin.com'

    condition: html_email_with_link and (suspicious_url_shortener or suspicious_domain_characteristics) and sender_displayname_spoofing and not legit_sender_domains and not trusted_domain_filter

falsepositives:
    - Belső biztonsági kampányok
    - Legális tömeges levelezők
level: high
