title: Ultra-Pro High-Fidelity Windows File Permissions Modification (T1222.001)
id: e2271034-dbb5-4349-bbda-990b84c58bd1
status: stable
description: |
    Detects targeted file permission modifications by identifying broad access 
    grants (Full Control, Everyone) or inheritance blocking, initiated by 
    suspicious/untrusted processes or targeting sensitive directories.
author: hota05 
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1222.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        - Image|endswith:
            - '\icacls.exe'
            - '\takeown.exe'
            - '\cacls.exe'
            - '\attrib.exe'

    selection_dangerous_flags:
        CommandLine|contains:
            - ':f'
            - ' /grant'
            - 'Everyone:'
            - 'Authenticated Users:'
            - '/setowner'
            - '/inheritance:r'
            - ' +r '

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\httpd.exe'
            - '\nginx.exe'
            - '\sqlservr.exe'

    selection_suspicious_path:
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\AppData\'
            - '\Downloads\'

    filter_trusted_system_activity:
        - User: 'NT AUTHORITY\SYSTEM'
        - ParentImage|contains:
            - '\Windows\servicing\TrustedInstaller.exe'
            - '\CcmExec.exe'
            - '\Program Files\Microsoft Visual Studio\'
        - CommandLine|contains:
            - 'Microsoft\Windows\SoftwareDistribution'
            - 'AppData\Local\Packages'
            - '\_Installer'

    condition: selection_tools and selection_dangerous_flags and (selection_suspicious_parent or selection_suspicious_path) and not filter_trusted_system_activity
level: high
