title: Ultra-Pro ROM Kit & UEFI Firmware Tampering (T1542.001)
id: 5c8bebe8-05a3-45b9-b1de-1f1a622fe1ab 
status: stable
description: |
    Detects unauthorized firmware manipulation by monitoring high-risk driver 
    registrations and firmware update utilities initiated from suspicious 
    process trees, specifically targeting BYOVD and SPI flash access.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.t1542.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        - Image|endswith:
            - '\flashrom.exe'
            - '\FPTW64.exe'    
            - '\AfuEfix64.exe' 
            - '\InsydeFlash.exe'
        - OriginalFileName:
            - 'flashrom.exe'
            - 'FPTW64.exe'
            - 'amifldrv64.sys' 

    selection_sc_create:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - ' create '
        CommandLine|contains:
            - 'type= kernel'
            - 'binpath='

    selection_unauthorized_issuer:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
        Image|contains:
            - 'temp'    
            - 'public'
            - 'download'

    filter_trusted_vendors:
        ParentImage|contains:
            - '\Dell\CommandUpdate\'
            - '\Lenovo\SystemUpdate\'
            - '\HP\HP Support Assistant\'
        Image|contains: 'C:\Windows\System32\SystemSettingsAdminFlows.exe'

    condition: (selection_tools or selection_sc_create) and selection_unauthorized_issuer and not filter_trusted_vendors
level: critical
