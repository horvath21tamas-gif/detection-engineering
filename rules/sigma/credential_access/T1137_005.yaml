title: Office Security Policy Tampering (T1137.005)
id: 8693d72f-0411-472d-8cb6-26cc5a0c2b70
status: stable
description: |
    Detects unauthorized modifications of Microsoft Office security policies by monitoring:
      - Global macro enablement changes
      - Addition of untrusted network locations
      - Policy modifications from non-standard processes

author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1137.005

logsource:
    product: windows
    category: registry_event

detection:
    selection_registry:
        TargetObject|re: '\\Software\\Microsoft\\Office\\.*\\Security\\(VBAWarnings|Trusted Locations\\|Trusted Documents\\DisableTrustedDocuments|BlockContentExecutionFromInternet)$'

    selection_values:
        Details|re: 'DWORD \(0x0000000[01]\)'

    selection_unauthorized_actor:
        Image|re: '(winword\.exe|excel\.exe|outlook\.exe|svchost\.exe|msiexec\.exe|powershell\.exe|cmd\.exe|reg\.exe|wscript\.exe|cscript\.exe)$'

    filter_trusted_paths:
        Details|re: '(\\\\InternalStorage\\Templates|C:\\Program Files\\)'

    condition: selection_registry and (selection_values or selection_unauthorized_actor) and not filter_trusted_paths

level: critical
