title: Ultra-Pro High-Fidelity MSCASH/DCC Extraction (T1003.005)
id: 961ed1a1-98fd-4ed0-98b0-4b3745f8df76
status: stable
description: |
    Detects unauthorized extraction of Cached Domain Credentials (MSCASH/DCC).
    Monitors for specialized tool fingerprints, registry save operations targeting 
    the Cache key, and anomalous parent-child process relationships.
author: hota05
date: 2026-02-04
tags:
    - attack.credential_access
    - attack.t1003.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        CommandLine|contains:
            - 'cachedump'      
            - 'lsadump::cache' 
            - 'Get-CachedCredentials' 
            - 'dcc2'            

    selection_reg_export:
        Image|endswith: '\reg.exe'
        CommandLine|contains: ' save '
        CommandLine|contains:
            - 'hklm\security'
            - '\cache'          

    selection_untrusted_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wsmprovhost.exe'
            - '\psexesvc.exe'   
            - '\wmiprvse.exe'    

    selection_output:
        CommandLine|contains:
            - '.tmp'             
            - '.log'
            - 'C:\Users\Public\' 
            - 'C:\Windows\Temp\'

    filter_legit_maintenance:
        User: 'NT AUTHORITY\SYSTEM'
        Image|contains:
            - '\Program Files\'
            - '\Program Files (x86)\'
        ParentImage|endswith: '\services.exe'

    condition: (selection_tools or selection_reg_export) and (selection_untrusted_parent or selection_output) and not filter_legit_maintenance
level: critical
