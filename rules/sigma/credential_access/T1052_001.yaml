title: USB Exfiltration Detection (ATT&CK T1052.001)
id: 24d0bb36-59f7-48e9-98ce-551ae31c3d07
status: stable
description: >
  Detects targeted data exfiltration to USB/removable drives by monitoring 
  non-interactive file copy, move, and archive operations. Focuses on suspicious 
  command-line arguments, stealthy automation flags, and unusual parent process lineage.
author: hota05
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1052/
tags:
  - attack.exfiltration
  - attack.t1052.001
  - attack.collection
  - attack.host

logsource:
  product: windows
  category: process_creation

detection:
  selection_tools:
    Image|endswith:
      - '\robocopy.exe'
      - '\xcopy.exe'
      - '\powershell.exe'
      - '\7z.exe'
      - '\rar.exe'
      - '\bitsadmin.exe'

  selection_usb_target:
    CommandLine|contains:
      - ' D:\'
      - ' E:\'
      - ' F:\'
      - ' G:\'
      - ' H:\'
      - '\Device\HarddiskVolume'
      - '\\*\root\'

  selection_flags:
    CommandLine|contains:
      - ' /S /E /H /K'
      - ' /R:0 /W:0'
      - ' -Recurse'
      - ' -Hidden'
      - ' a -p'

  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\sqlservr.exe'
      - '\wscript.exe'
      - '\cscript.exe'

  filter_legit:
    - ParentImage|endswith: '\explorer.exe'
    - Image|contains: '\Program Files\'
    - username: 'NT AUTHORITY\SYSTEM'
    - CommandLine|contains: 'SoftwareDistribution'

  condition: selection_tools and selection_usb_target and (selection_flags or selection_parent) and not filter_legit

falsepositives:
  - Legitimate backup or deployment scripts targeting removable drives
  - Admin or IT automation (e.g., SCCM, Intune, Windows Update copy tasks)
  - Temporary USB transfers from trusted applications

level: critical
