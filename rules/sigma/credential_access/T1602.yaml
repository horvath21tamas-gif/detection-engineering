title: Ultra-Pro High-Fidelity Network Share Automated Collection (T1602)
id: 7553b83c-5a54-4641-93b9-822ec0016cd2
status: stable
description: |
    Detects highly suspicious, automated data collection from network shares by 
    identifying the combination of UNC path traversal, sensitive file extensions, 
    and recursive copying logic originating from untrusted process lineages.
author: hota05
date: 2026-02-05
tags:
    - attack.collection
    - attack.t1602
logsource:
    category: process_creation
    product: windows
detection:
    selection_automation_logic:
        CommandLine|contains:
            - ' -Recurse'
            - ' /s '
            - ' -Include '
            - ' -Filter '
            - 'robocopy'
            - 'xcopy'

    selection_network_path:
        CommandLine|contains:
            - '\\\\'              
            - 'net use'
            - 'net view'

    selection_sensitive_files:
        CommandLine|contains:
            - '.doc'
            - '.pdf'
            - '.xls'
            - '.pst'              
            - '.kdbx'          
            - '.key'             
            - '.config'          
            - 'id_rsa'

    selection_context:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\w3wp.exe'          
            - '\rundll32.exe'
            - '\explorer.exe'      
        IntegrityLevel: 'Medium'   

    filter_trusted_systems:
        - Image|contains:
            - 'C:\Program Files\Microsoft System Center\'
            - 'C:\Windows\CCM\'    
            - 'C:\Program Files\Veritas\'
            - 'C:\Program Files\Commvault\'
        - CommandLine|contains:
            - 'SoftwareDistribution'  
            - '.log'                  
        - username: 'NT AUTHORITY\SYSTEM'

    condition: selection_automation_logic and selection_network_path and selection_sensitive_files and selection_context and not filter_trusted_systems
level: critical
