title: Embedded Payload Extraction (T1027.009)
id: 7ffab02f-eaca-46fc-9d9c-7831e44b4f0e
status: stable
description: >
  Detects extraction and execution of embedded payloads via memory-only code
  loading (Reflection), byte-array manipulation, and non-standard resource streams.
  Optimized to reduce false positives from standard .NET runtime and installer operations.

author: hota05
date: 2026-02-23
tags:
  - attack.defense_evasion
  - attack.t1027.009
  - attack.execution

logsource:
  product: windows
  category: process_creation

detection:
  selection_reflection_load:
    CommandLine|contains:
      - '[System.Reflection.Assembly]::Load('
      - 'Reflection.Emit'
      - 'GetManifestResourceStream'
      - 'LoadModule'

  selection_payload_assembly:
    CommandLine|contains:
      - 'FromBase64String'
      - ' [byte[]]'
      - 'BitConverter'
      - 'IO.MemoryStream'

  selection_suspicious_sources:
    CommandLine|contains:
      - '.dat'
      - '.bin'
      - '.png'
      - '.resources'

  filter_trusted_runtime:
    Image|startswith:
      - 'C:\Windows\Microsoft.NET\Framework'
      - 'C:\Program Files\Common Files\Microsoft Shared\'
      - 'C:\Windows\System32\wbem\WmiPrvSE.exe'

  filter_standard_installers:
    CommandLine|contains:
      - '/package'
      - '/update'
      - 'ngen.exe'

  condition: >
    (selection_reflection_load or selection_payload_assembly)
    and selection_suspicious_sources
    and not (filter_trusted_runtime or filter_standard_installers)

falsepositives:
  - Legitimate .NET applications using embedded resources
  - Standard runtime compilation or ngen operations
  - Enterprise deployment or update scripts
  - Security testing and red team payloads

level: critical
