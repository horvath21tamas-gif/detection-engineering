title: Ultra-Pro High-Fidelity Unsecured Credentials Discovery (T1552)
id: 6d389b19-c9b0-450d-b736-bed87aa7390a
status: stable
description: |
    Detects targeted discovery of credentials in files, registry, and shell history. 
    Uses advanced correlation between search tools (findstr, grep, PowerShell), 
    sensitive file extensions, and high-entropy keywords.
author: hota05
date: 2026-02-04
tags:
    - attack.credential_access
    - attack.t1552.001
    - attack.t1552.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_keywords:
        CommandLine|contains:
            - 'password='
            - 'pwd='
            - 'connectionstring'
            - 'access_key'
            - 'secret_key'
            - 'id_rsa'        
            - 'id_dsa'
            - 'amzn.mws'        
            - 'BEGIN RSA PRIVATE'

    selection_method:
        - CommandLine|contains|all:
            - 'findstr'
            - '/s'             
            - '/i'              
        - CommandLine|contains|all:
            - 'Get-ChildItem'
            - '-Recurse'
            - '-Include'
        - CommandLine|contains|all:
            - 'grep'
            - '-r'              

    selection_targets:
        CommandLine|contains:
            - '.config'
            - '.xml'
            - '.ini'
            - '.bak'
            - '.old'
            - '.history'
            - 'ConsoleHost_history' 
            - '.aws\credentials'
            - '.ssh\'

    selection_context:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\wsmprovhost.exe'
            - '\httpd.exe'       
        Image|endswith:
            - '\findstr.exe'
            - '\grep.exe'
            - '\powershell.exe'

    filter_legit_tools:
        Image|contains:
            - '\Windows\System32\SearchIndexer.exe'
            - '\Microsoft Visual Studio\'
            - '\Git\usr\bin\grep.exe'
        username: 'NT AUTHORITY\SYSTEM'

    condition: (selection_keywords or (selection_method and selection_targets)) and selection_context and not filter_legit_tools
level: high
