title: Ultra-Pro Hybrid Identity Sync Manipulation (T1556.007)
id: 314b62c8-4047-4834-a8c3-0ca50657e901
status: stable
description: |
    Detects unauthorized manipulation of the Entra ID (formerly Azure AD) Connect sync process.
    Focuses on MSOL account abuse from non-sync servers and unauthorized ADSync PowerShell usage.
author: hota05
date: 2026-02-02
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1556.007
logsource:
    product: windows
    category: process_creation
detection:
    selection_adsync_powershell:
        CommandLine|contains:
            - 'Get-ADSyncAccountPassword'     
            - 'Set-ADSyncServerConfiguration' 
            - 'Set-ADSyncAADPasswordReset'   
            - 'adsync.msc'                   

    selection_msol_abuse:
        User|startswith: 'MSOL_'
        ParentImage|endswith:
            - '\explorer.exe'
            - '\cmd.exe'
            - '\powershell.exe'
            - '\svchost.exe'

    selection_db_access:
        Image|endswith: '\sqlcmd.exe'
        CommandLine|contains: 'ADSync'
        Image:
            - '\miiserver.exe'
            - '\Microsoft.Identity.AadConnect.Health.AadSync.Host.exe'

    filter_trusted_sync_server:
        ComputerName: 
            - 'SRV-ADSYNC-01'
            - 'SRV-ADSYNC-BCK'
        SubjectUserSid: 'S-1-5-18' 

    condition: (selection_adsync_powershell or selection_msol_abuse or selection_db_access) and not filter_trusted_sync_server
level: critical
