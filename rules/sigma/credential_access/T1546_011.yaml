title: Ultra-Pro Application Shimming Persistence Detection (T1546.011)
id: 22120205-51ec-4e5e-8c53-75cc8031d868
status: stable
description: |
    Detects unauthorized Shim database installation by monitoring sdbinst.exe 
    execution with suspicious source paths and direct Registry writes to InstalledSDB.
author: hota05
date: 2026-02-02
references:
    - https://attack.mitre.org/techniques/T1546/011/
tags:
    - attack.persistence
    - attack.t1546.011
logsource:
    product: windows
    category: process_creation
detection:
    selection_sdbinst:
        Image|endswith: '\sdbinst.exe'
        CommandLine|contains: '.sdb'

    selection_suspicious_args:
        CommandLine|contains:
            - ' -i '   
            - ' -q '   
        CommandLine|contains:
            - '\Users\'
            - '\ProgramData\'
            - '\Windows\Temp\'
            - '\AppData\'

    selection_registry:
        TargetObject|contains: 'AppCompatFlags\InstalledSDB'

    filter_trusted_installers:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\trustedinstaller.exe'
            - '\TiWorker.exe'
        User: 'NT AUTHORITY\SYSTEM'

    filter_standard_location:
        CommandLine|contains: 'C:\Windows\AppPatch\'

    condition: (selection_sdbinst and selection_suspicious_args and not filter_standard_location) or (selection_registry and not filter_trusted_installers)
level: critical
