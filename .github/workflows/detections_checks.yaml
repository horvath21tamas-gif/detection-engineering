name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches: 
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Alap CLI telepítése
          python -m pip install sigma-cli pytest "pyyaml>=6.0"
          
          # PLUGINOK TELEPÍTÉSE (Ez a módszer nem igényel külső git clone-t a pip-től)
          # A --force-install segít, ha korábban félbemaradt volna
          sigma plugin install splunk --force-install || echo "Splunk már ott van"
          sigma plugin install qradar --force-install || echo "QRadar már ott van"
          sigma plugin install microsoft-sentinel --force-install || sigma plugin install sentinel || echo "Sentinel hiba"
          sigma plugin install insightidr --force-install || echo "Netwitness/IDR hiba"
          sigma plugin install windows --force-install
          sigma plugin install sysmon --force-install

      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek."

      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar rules/netwitness rules/sentinel
          rm -f rules/splunk/*.spl rules/qradar/*.aql rules/netwitness/*.txt rules/sentinel/*.kql
          
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk
            sigma convert -t splunk -p splunk_windows "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba"
            
            # QRadar
            sigma convert -t qradar -p qradar_windows "$file" -o "rules/qradar/${filename}.aql" || \
            sigma convert -t qradar "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba"
            
            # NetWitness (InsightIDR-rel helyettesítve a kompatibilitás miatt)
            sigma convert -t insightidr "$file" -o "rules/netwitness/${filename}.txt" || echo "⚠️ NetWitness hiba"

            # Microsoft Sentinel
            sigma convert -t microsoft_sentinel "$file" -o "rules/sentinel/${filename}.kql" || \
            sigma convert -t sentinel "$file" -o "rules/sentinel/${filename}.kql" || echo "⚠️ Sentinel hiba"
          done

      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard and SIEM rules"
            git pull --rebase origin test
            git push origin test
          fi

          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált."
            exit 1
          fi
