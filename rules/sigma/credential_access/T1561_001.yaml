title: Disk Content Wipe
id: c2592f79-8f9e-478d-83c9-3c5d9ac0a786
status: stable
description: |
    Detects high-confidence destructive disk wiping activity via
    raw device access or destructive overwrite operations.

    Coverage includes:

      - Direct raw disk access (\\.\PhysicalDrive, \\.\Harddisk)
      - Overwrite using zero/random data streams
      - SDelete secure wipe with multiple passes
      - PowerShell destructive disk clearing
      - Suspicious execution context (macro, webshell, temp execution)

    Focused on ransomware-style impact activity (T1561.001).

author: hota05
date: 2026-02-12
tags:
    - attack.impact
    - attack.t1561
    - attack.t1561.001

logsource:
    product: windows
    category: process_creation

detection:
    selection_raw_device_access:
        CommandLine|contains:
            - '\\.\PhysicalDrive'
            - '\\.\Harddisk'
            - '\\.\Volume{'

    selection_dd_overwrite:
        Image|endswith: '\dd.exe'
        CommandLine|contains|any:
            - 'if=/dev/zero'
            - 'if=/dev/urandom'
            - 'of=\\.\PhysicalDrive'
            - 'of=\\.\Harddisk'

    selection_sdelete_destructive:
        Image|endswith: '\sdelete.exe'
        CommandLine|contains|any:
            - ' -z'
            - ' -p '
            - ' -c '

    selection_ps_clear_disk:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Clear-Disk'
            - '-RemoveData'

    selection_ps_format_raw:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Format-Volume'
            - '-Force'
            - '-Confirm:$false'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\w3wp.exe'
            - '\httpd.exe'
            - '\rundll32.exe'
            - '\mshta.exe'

    selection_suspicious_path:
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Windows\Temp\'

    filter_system_context:
        User|startswith: 'NT AUTHORITY'
        ParentImage|endswith:
            - '\services.exe'
            - '\svchost.exe'
            - '\vds.exe'

    filter_known_deployment_tools:
        ParentImage|endswith:
            - '\CcmExec.exe'
            - '\msiexec.exe'
            - '\setup.exe'
        ParentImage|contains:
            - '\ConfigurationManager\'
            - '\IntuneManagementExtension\'

    filter_legitimate_paths:
        Image|startswith:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'

    condition: (
                    (
                        selection_raw_device_access
                        and (
                                selection_dd_overwrite
                                or selection_sdelete_destructive
                                or selection_ps_clear_disk
                                or selection_ps_format_raw
                            )
                    )
               )
               and (selection_suspicious_parent or selection_suspicious_path)
               and not filter_system_context
               and not filter_known_deployment_tools
               and not filter_legitimate_paths

level: critical
