title: Ultra-Pro Stealthy Direct Volume Access (T1006)
id: d6477305-1e67-4f3c-a93f-2eed57f7fcb1
status: stable
description: |
    Detects high-fidelity direct volume access by monitoring for raw device paths 
    initiated by non-system processes or suspicious parents, often used to bypass 
    file system locks and EDR monitoring for credential dumping.
author: hota05
date: 2026-02-03
tags:
    - attack.defense_evasion
    - attack.t1006
logsource:
    product: windows
    category: process_creation
detection:
    selection_raw_paths:
        CommandLine|contains:
            - '\\.\'
            - '\\?\'
            - 'GlobalRoot'
            - '\Device\HarddiskVolume'

    selection_targets:
        CommandLine|contains:
            - 'ntds.dit'
            - 'sam'
            - 'system'
            - 'security'
            - 'software'

    selection_suspicious_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\mshta.exe'

    filter_trusted_processes:
        - Image|endswith:
            - '\defrag.exe'
            - '\dfrgui.exe'
            - '\chkdsk.exe'
            - '\format.com'
            - '\vssadmin.exe' 
        - Image|contains:
            - '\Windows\System32\'
            - '\Windows\SysWOW64\'
        - Company: 
            - 'Veeam Software Group'
            - 'Acronis'

    selection_suspicious_source:
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\Downloads\'

    condition: selection_raw_paths and (selection_targets or selection_suspicious_parent or selection_suspicious_source) and not filter_trusted_processes
level: critical
