title: High-Fidelity System Language and Keyboard Layout Discovery
id: 4ccadb50-cead-4296-b3c3-b737fd57b3b8
status: stable
description: >
  Detects targeted system language and keyboard layout discovery, focusing on malware
  "kill-switch" checks and environment keying. Combines registry queries, CLI/PowerShell
  cmdlets, and suspicious output redirection. Minimizes false positives via parent process,
  integrity level, and trusted path filtering.

author: hota05 
date: 2026-02-04
modified: 2026-02-11
tags:
  - attack.discovery
  - attack.t1614.001

logsource:
  category: process_creation
  product: windows

detection:

  selection_tools:
    Image|endswith:
      - '\reg.exe'
      - '\wmic.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Get-Culture'
      - 'Get-WinSystemLocale'
      - 'Get-KeyboardLayout'
      - 'os get MUILanguages'
      - 'Get-ItemProperty'

  selection_registry:
    CommandLine|contains:
      - 'Keyboard Layout\Preload'
      - 'Control Panel\International'
      - '00000409'  
      - '00000419'  
      - '00000422'  
      - '00000423'  

  selection_suspicious_lineage:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\wsmprovhost.exe'
      - '\httpd.exe'
      - '\powershell.exe'
    IntegrityLevel: 'Medium'

  selection_suspicious_paths:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Temp\'

  selection_extraction:
    CommandLine|contains:
      - 'findstr'
      - 'select-string'
      - ' > '
      - '| Out-File'
      - 'ConvertTo-Json'
      - 'Export-Csv'

  filter_legit_noise:
    - User: 'NT AUTHORITY\SYSTEM'
    - ParentImage|endswith:
        - '\msiexec.exe'
        - '\CcmExec.exe'
        - '\svchost.exe'
    - CommandLine|contains:
        - 'Program Files'
        - '\Windows\System32\'

  condition: 
    (selection_tools or selection_registry)
    and (selection_suspicious_lineage or selection_suspicious_paths or selection_extraction)
    and not filter_legit_noise

falsepositives:
  - System deployment scripts querying language or locale
  - SCCM / Intune inventory tasks
  - Standard Office macros querying locale/keyboard layout
  - Trusted administrative scripts on SYSTEM account

level: high
