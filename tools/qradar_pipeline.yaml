name: QRadar Grandmaster Pipeline
priority: 10

# 1. LOGSOURCE MAPPING
# Ez oldja meg, hogy a 'process_creation' ne üres mezőlistát kapjon
logsource_merging: true
transformations:
  - type: logsource_filter
    mapping:
      process_creation:
        logsource: 'microsoft_windows_security_event_log'
      registry_event:
        logsource: 'microsoft_windows_security_event_log'
      sysmon_process_creation:
        logsource: 'sysmon'
      network_connection:
        logsource: 'sysmon'
      service_control:
        logsource: 'microsoft_windows_security_event_log'

  # 2. FIELD MAPPING
  # Itt fordítjuk le a Sigma neveket QRadar belső nevekre
  - type: field_name_mapping
    mapping:
      Image: Filename
      CommandLine: Process CommandLine
      ParentImage: Parent Filename
      ParentCommandLine: Parent Process CommandLine
      User: UserName
      TargetObject: Registry Value Name
      Details: Registry Value Data
      DestinationIp: Destination IP
      DestinationPort: Destination Port
      SourceIp: Source IP
      SourcePort: Source Port
      Hashes: File Hash
