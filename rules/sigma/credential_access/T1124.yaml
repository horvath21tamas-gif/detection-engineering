title: System Time Discovery (T1124)
id: f62aaee9-91e5-4315-9eaf-dda7a14dbeb8
status: stable
description: |
    Detects targeted system time and time zone discovery techniques.
    Focuses on:
      - Suspicious process lineages (Office apps, Web servers, scripting hosts)
      - Automation patterns commonly used for sandbox evasion or geofencing
      - CLI tools and PowerShell/.NET APIs used for time enumeration
    Excludes known system, management, and benign automation to reduce false positives.

author: hota05
date: 2026-02-04
tags:
    - attack.discovery
    - attack.t1124

logsource:
    category: process_creation
    product: windows

detection:
    selection_tools:
        Image|re|i: '(w32tm\.exe|tzutil\.exe|net\.exe|net1\.exe)$'
        CommandLine|re|i: '(Get-Date|Get-TimeZone|\[System\.DateTime\]::Now)'

    selection_patterns:
        CommandLine|re|i: '( /query| /g|time \\)'

    selection_suspicious_lineage:
        ParentImage|re|i: '(winword\.exe|excel\.exe|outlook\.exe|httpd\.exe|wsmprovhost\.exe)$'
        IntegrityLevel: 'Medium'

    selection_automation:
        CommandLine|re|i: '(findstr|select-string| > |\$time\s?=)'

    filter_legit_noise:
        User: 'NT AUTHORITY\SYSTEM'
        ParentImage|re|i: '(svchost\.exe|CcmExec\.exe|msiexec\.exe|explorer\.exe)$'
        CommandLine|re|i: '(Program Files|\\AppData\\Local\\Google\\Chrome)'

    condition: selection_tools and (selection_patterns or selection_suspicious_lineage or selection_automation) and not filter_legit_noise

level: high
