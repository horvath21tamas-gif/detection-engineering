title: APC Injection Detection (ATT&CK T1055.004)
id: 2e6b8b74-ebfa-4fb1-85ba-6e2d368e047e
status: stable
description: >
  Detects high-fidelity APC (Asynchronous Procedure Call) injection attempts,
  including Early Bird injection, by monitoring thread access masks (THREAD_SET_CONTEXT)
  where the calling code originates from unbacked or untrusted memory regions.
author: hota05
date: 2026-02-23
references:
  - https://attack.mitre.org/techniques/T1055/004/
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055.004
  - attack.host

logsource:
  product: windows
  category: process_access

detection:
  selection_access_mask:
    GrantedAccess|contains:
      - '0x20'       
      - '0x22'       
      - '0x1438'     
      - '0x1F1FFF'   

  selection_unbacked_memory:
    CallTrace|contains: 'unknown'

  selection_suspicious_targets:
    TargetImage|endswith:
      - '\svchost.exe'
      - '\explorer.exe'
      - '\werfault.exe'
      - '\searchindexer.exe'

  filter_trusted:
    - SourceImage|endswith:
        - '\MsMpEng.exe'
        - '\CcmExec.exe'
        - '\csrss.exe'
    - CallTrace|contains:
        - 'ntdll.dll+LdrpWorkItem'
        - 'kernel32.dll+BaseThreadInitThunk'
    - condition: selection_source_equals_target

  condition: selection_access_mask 
             and selection_unbacked_memory 
             and selection_suspicious_targets 
             and not filter_trusted

falsepositives:
  - Legitimate AV or system processes performing thread operations
  - Debugging or management tools accessing threads in high-value processes

level: critical
