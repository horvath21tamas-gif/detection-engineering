name: CI/CD for Detection Rules

on:
  push:
    branches:
      - test
  pull_request: 
    branches:
      - test

permissions:
  contents: write

jobs:
  detection_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 1. Először a kritikus pyparsing-et tesszük rendbe (3.2.0 stabilabb a régebbi Sigmához)
          python -m pip install "pyparsing<3.3.0"
          
          # 2. Telepítjük a CLI-t és a backendeket kényszerített verziókkal
          # A sigma-cli-t felvisszük 2.0.1-re, ami már kezeli az újabb pySigma-t
          python -m pip install "sigma-cli>=2.0.1" "pysigma>=1.1.0"
          python -m pip install pysigma-backend-splunk pysigma-backend-qradar
          
          # 3. Alap kiegészítők
          python -m pip install pytest pyyaml
          
          # 4. Pluginok (ezek most már a PIP-es telepítés után csak beregisztrálják magukat)
          sigma plugin install sysmon
          sigma plugin install windows

      # 1. LÉPÉS: Okos ellenőrzés és Automatikus javítás
      - name: Smart Validation and Auto-fix
        id: validate_step
        run: |
          python tools/validate_rules.py || echo "VALIDATION_FAILED=true" >> $GITHUB_ENV

      # 2. LÉPÉS: Meglévő Unit Tesztek (Pytest)
      - name: Run unit test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tools
          python -m pytest test/ --maxfail=5 --disable-warnings -q || echo "Nincsenek tesztek vagy hiba történt."

      # 3. LÉPÉS: Konvertálás Splunk ÉS QRadar formátumba
      - name: Convert Sigma rules to SIEM queries
        run: |
          mkdir -p rules/splunk rules/qradar
          rm -f rules/splunk/*.spl
          rm -f rules/qradar/*.aql
          for file in $(find rules/sigma -name "*.yaml"); do
            filename=$(basename "$file" .yaml)
            
            # Splunk konverzió
            sigma convert -t splunk -p sysmon "$file" -o "rules/splunk/${filename}.spl" || echo "⚠️ Splunk hiba: $file"
            
            # QRadar konverzió (AQL)
            sigma convert -t qradar -p sysmon "$file" -o "rules/qradar/${filename}.aql" || echo "⚠️ QRadar hiba: $file"
          done

      # 4. LÉPÉS: Dashboard és MITRE Mátrix (SVG) frissítése
      - name: Update Dashboard and SVG Map
        if: github.event_name == 'push'
        run: |
          python tools/update_all.py
          
      # 5. LÉPÉS: Mentés és Visszatöltés
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Hozzáadjuk a Splunk mellett a QRadar (.aql) fájlokat is a Git-hez
          git add README.md COVERAGE.md attack_navigator_layer.json mitre_matrix.svg \
                  rules/splunk/*.spl \
                  rules/qradar/*.aql \
                  rules/sigma/*.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Dashboard, Splunk & QRadar rules, and Sigma auto-fixes"
            git pull --rebase origin test
            git push origin test
          else
            echo "Nincs változás a fájlokban."
          fi

          # VÉGSŐ ELLENŐRZÉS: Ha a validáció hibás volt, piros marad a pipeline
          if [ "${{ env.VALIDATION_FAILED }}" == "true" ]; then
            echo "❌ A validáció kritikus hibákat talált, de a javításokat és a konverziókat elmentettem."
            exit 1
          fi
