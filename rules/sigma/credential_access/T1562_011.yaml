title: Virtualization and Sandbox Evasion (T1564.011)
id: 1b14b775-b527-4763-8aff-7399bda480ef
status: stable
description: |
  Detects targeted environment fingerprinting used to identify virtualization,
  sandbox, or malware analysis environments. Correlates WMI hardware queries,
  VM vendor string checks, MAC OUI reconnaissance, and VM-specific driver
  discovery initiated from suspicious process chains or user-writable paths.
author: hota05
date: 2026-02-11
tags:
  - attack.defense_evasion
  - attack.t1564.011
  - attack.discovery

logsource:
  product: windows
  category: process_creation

detection:

  selection_wmi_queries:
    Image|endswith:
      - '\wmic.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Win32_BaseBoard'
      - 'Win32_BIOS'
      - 'Win32_ComputerSystem'
      - 'Win32_ComputerSystemProduct'
      - 'csproduct get uuid'
      - 'bios get serialnumber'

  selection_vm_keywords:
    CommandLine|contains:
      - 'VMware'
      - 'VirtualBox'
      - 'VBOX'
      - 'QEMU'
      - 'Xen'
      - 'KVM'
      - 'Hyper-V'

  selection_network_enum:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
    CommandLine|contains:
      - 'getmac'
      - 'ipconfig /all'
      - 'arp -a'
      - 'get-netadapter'
      - 'netsh interface show interface'

  selection_mac_vm_ouis:
    CommandLine|contains:
      - '00-05-69'
      - '00-0C-29'
      - '00-50-56'
      - '08-00-27'   

  selection_vm_artifacts:
    CommandLine|contains:
      - 'VBoxGuest'
      - 'vboxservice'
      - 'vmtoolsd'
      - 'vmmouse'
      - 'vmhgfs'
      - 'vboxguest.sys'
      - 'vmsrvc'
      - '\System32\drivers\'

  selection_suspicious_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\acrord32.exe'
      - '\w3wp.exe'

  selection_user_writable_path:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
      - '\Downloads\'

  selection_medium_integrity:
    IntegrityLevel:
      - Medium
      - High

  filter_inventory_tools:
    Image|contains:
      - '\Program Files\Lansweeper\'
      - '\Program Files\SCCM\'
      - '\Program Files\Tanium\'
      - '\Program Files\Qualys\'
      - '\Program Files\Microsoft Monitoring Agent\'

  filter_system_context:
    User:
      - 'NT AUTHORITY\SYSTEM'
      - 'NT AUTHORITY\NETWORK SERVICE'
    ParentImage|contains:
      - '\Windows\System32\services.exe'
      - '\svchost.exe'

  condition:
    (
      (selection_wmi_queries and selection_vm_keywords) or
      (selection_network_enum and selection_mac_vm_ouis) or selection_vm_artifacts)
    and
    (selection_suspicious_parent
      or selection_user_writable_path)
    and
    selection_medium_integrity
    and
    not (
      filter_inventory_tools
      or filter_system_context)

fields:
  - Image
  - ParentImage
  - CommandLine
  - IntegrityLevel
  - User
  - Hashes

falsepositives:
  - Enterprise asset inventory systems
  - IT troubleshooting sessions
  - Legitimate virtualization management scripts
  - Developer diagnostic scripts

level: high
