title: wmic.exe segitsegevel perzisztens esemenyt hoznak letre a tamadok
id: 1
status: experimental
description: wmic.exe segitsegevel perzisztens esemenyt hoznak letre
author: hota05
date: 2026/01/13
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: 
      - "\wmic.exe"
      - "\powershell.exe"
  selection_wmi_object:
    CommandLine|contains:
      - "__EventFilter"
      - "CommandLineEventConsumer"
      - "FilterToConsumerBinding"
  filter_system:
    User: "SYSTEM"
  condition: selection and selection_wmi_object and not filter_system
level: medium
tags:
  - attack.t1546.003
falsepositives:
  - enterprise monitoring agent
